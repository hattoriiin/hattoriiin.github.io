/* ==================================================
   基本
================================================== */

    box-sizing:border-box;
}

    scroll-behavior:smooth;
}

body{

/* ==================================================

================================================== */

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/*
 * グラデーション本体。
 *
 * 白を透明にして「穴」にするのではなく、
 * 白も完全な色として存在させる。
 */

.band-base{

    stroke:none;

}


/*
 * 両端の袋とじ。
 *
 * グラデーションの両端を
 * 青・緑の面で閉じる。
 */

.band-cap{

    stroke:none;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

   スマートフォン縦
================================================== */

and
(orientation:portrait){

<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;


/*
 * 外周半径。
 *
 * 時計の外周位置を固定する。
 */

const OUTER_RADIUS = 180;


/*
 * 内周半径。
 *
 * 帯幅は
 *
 * 180 - 100 = 80px
 *
 * で固定する。
 */

const INNER_RADIUS = 100;


/*
 * 時間帯の角を丸める半径。
 */

const CORNER_RADIUS = 10;


/*
 * 袋とじの幅。
 *
 * 時間方向に何度分を
 * 青・緑で閉じるか。
 *
 * 白部分を抜くのではなく、
 * この部分を色付きの面で覆う。
 */

const CAP_ANGLE = 3;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計上の角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度
 * @throws {TypeError} 数値でない場合
 * @throws {RangeError} 分が0〜59以外の場合
 *
 * @example
 * timeToClockAngle(9, 0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30) +
        minute * .5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * SVGの0°は3時方向なので、
 * -90°して12時を上にする。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   角度正規化
================================================== */

/**
 * 角度を0〜360°に正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化角度
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 円周上の座標をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} 座標
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   完全な円環帯
================================================== */

/**
 * 指定角度の円環を作る。
 *
 * 外周R180、内周R100を使用する。
 * これにより時間帯の幅は常に80pxになる。
 *
 * @param {number} startAngle 開始角度
 * @param {number} endAngle 終了角度
 * @param {number} outerRadius 外周
 * @param {number} innerRadius 内周
 * @returns {string} SVG path
 * @throws {RangeError} 範囲不正の場合
 *
 * @example
 * createRingPath(270,360,180,100);
 */

function createRingPath(
    startAngle,
    endAngle,
    outerRadius,
    innerRadius
){

    const sweep =
        normalizeAngle(
            endAngle -
            startAngle
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '円環角度が不正です'
        );

    }


    const outerStart =
        polarToPoint(
            outerRadius,
            clockToSvgAngle(
                startAngle
            )
        );


    const outerEnd =
        polarToPoint(
            outerRadius,
            clockToSvgAngle(
                endAngle
            )
        );


    const innerEnd =
        polarToPoint(
            innerRadius,
            clockToSvgAngle(
                endAngle
            )
        );


    const innerStart =
        polarToPoint(
            innerRadius,
            clockToSvgAngle(
                startAngle
            )
        );


    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    return [

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        `A
        ${outerRadius}
        ${outerRadius}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        `L
        ${innerEnd.x}
        ${innerEnd.y}`,

        `A
        ${innerRadius}
        ${innerRadius}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================
   時間帯本体
================================================== */

/**
 * 時間帯の本体を生成する。
 *
 * 本体には半径方向のグラデーションを適用する。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    return createRingPath(
        start,
        end,
        OUTER_RADIUS,
        INNER_RADIUS
    );

}


/* ==================================================
   袋とじ
================================================== */

/**
 * 時間帯の片側を色で閉じる。
 *
 * 白い部分を抜くのではなく、
 * 円環の端面全体を青または緑で覆う。
 *
 * これにより
 *
 *     〔      〕
 *
 * の形を作る。
 *
 * @param {number} angle 基準角度
 * @param {number} direction 1=終点側,-1=始点側
 * @returns {string} SVG path
 */

function createCapPath(
    angle,
    direction
){

    const start =
        angle;

    const end =
        angle +
        direction *
        CAP_ANGLE;


    /*
     * 袋とじの角度範囲。
     *
     * 円環そのものなので、
     * 外側から内側まで完全に閉じる。
     */

    return createRingPath(
        Math.min(
            start,
            end
        ),
        Math.max(
            start,
            end
        ),
        OUTER_RADIUS,
        INNER_RADIUS
    );

}


/* ==================================================
   時間帯設定
================================================== */

/**
 * 時間帯本体と両端の袋とじを設定する。
 *
 * @param {string} bandId 本体ID
 * @param {string} startCapId 始点キャップID
 * @param {string} endCapId 終点キャップID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} gradient グラデーションID
 * @param {string} capColor 袋とじ色
 * @returns {void}
 *
 * @example
 * setBand(
 *     'morningBand',
 *     'morningStartCap',
 *     'morningEndCap',
 *     9,0,12,0,
 *     'blueGradient',
 *     '#3d8bdc'
 * );
 */

function setBand(
    bandId,
    startCapId,
    endCapId,
    startHour,
    startMinute,
    endHour,
    endMinute,
    gradient,
    capColor
){

    const band =
        document.getElementById(
            bandId
        );


    const startCap =
        document.getElementById(
            startCapId
        );


    const endCap =
        document.getElementById(
            endCapId
        );


    if(
        !band ||
        !startCap ||
        !endCap
    ){

        console.error(
            '時間帯SVG要素が見つかりません'
        );

        return;

    }


    try{

        const start =
            timeToClockAngle(
                startHour,
                startMinute
            );


        const end =
            timeToClockAngle(
                endHour,
                endMinute
            );


        /*
         * ------------------------------------------------
         * 本体
         *
         * ここはR180〜R100の
         * 完全な円環。
         *
         * グラデーションは半径方向。
         * ------------------------------------------------
         */

        band.setAttribute(
            'd',
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        band.style.fill =
            `url(#${gradient})`;


        /*
         * ------------------------------------------------
         * 始点の袋とじ
         * ------------------------------------------------
         */

        startCap.setAttribute(
            'd',
            createCapPath(
                start,
                1
            )
        );


        startCap.style.fill =
            capColor;


        /*
         * ------------------------------------------------
         * 終点の袋とじ
         * ------------------------------------------------
         */

        endCap.setAttribute(
            'd',
            createCapPath(
                end,
                -1
            )
        );


        endCap.style.fill =
            capColor;

    }

    catch(error){

        console.error(
            `${bandId} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningBand',
    'morningStartCap',
    'morningEndCap',
    9,
    0,
    12,
    0,
    'blueGradient',

/* ==================================================

================================================== */

setBand(

    'visitEndCap',
    13,

/* ==================================================

================================================== */

setBand(

    'eveningStartCap',
    'eveningEndCap',

    'blueGradient',

/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 時刻取得結果が不正の場合
 *
 * @example
 * getJapanTime();
 */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',

                hour12:false,

                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    parts.forEach(
        part => {

            if(
                part.type === 'hour' ||
                part.type === 'minute' ||
                part.type === 'second'
            ){

                result[part.type] =
                    Number(part.value);

            }

        }
    );


    /*
     * 一部環境では深夜0時が24として
     * 返されることがあるため補正する。
     */

    if(
        result.hour === 24
    ){

        result.hour = 0;

    }


    if(
        !Number.isInteger(result.hour) ||
        !Number.isInteger(result.minute) ||
        !Number.isInteger(result.second)
    ){

        throw new Error(
            '日本時間の取得結果が不正です'
        );

    }


    return result;

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * @returns {void}
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新に失敗しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針。
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針。
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針。
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * 元の針は12時を向いている。
     *
     * そのため時計角度をそのまま
     * SVGのrotate角度として使用する。
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>
