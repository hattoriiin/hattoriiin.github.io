<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/*
 * --------------------------------------------------
 * 色付きベース帯
 * --------------------------------------------------
 *
 * 時間帯全体の色を担当する。
 *
 * 白抜けはここでは作らず、
 * 別の白レイヤーを重ねることで、
 * 外周・内周・始点・終点に色を残す。
 */

.band-base.blue{

    fill:
        url(#blueBaseGradient);

}


.band-base.green{

    fill:
        url(#greenBaseGradient);

}


/*
 * --------------------------------------------------
 * 白抜け
 * --------------------------------------------------
 *
 * ベース帯の上に白い帯を重ねる。
 *
 * ベースより少し小さいため、
 * 外周・内周・始点・終点に
 * 色が残る構造になっている。
 */

.band-inner{

    fill:#fff;

    opacity:.78;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


/*
 * ==================================================
 * 12時間表示
 * ==================================================
 *
 * 1〜24すべて同じBodoni系フォントを使用する。
 *
 * フォントを統一することで、
 * 内側と外側の数字を同じ時計の数字として
 * 一体感を持たせる。
 */

.clock-face .hour12,
.clock-face .hour24{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


/*
 * --------------------------------------------------
 * 1〜12 基本サイズ
 * --------------------------------------------------
 */

.clock-face .hour12{

    font-size:31px;

}


/*
 * --------------------------------------------------
 * 1〜7
 *
 * 帯の中で他の数字より控えめにする。
 * --------------------------------------------------
 */

.clock-face .hour12.small{

    font-size:15px;

}


/*
 * --------------------------------------------------
 * 12
 * --------------------------------------------------
 */

.clock-face .hour12.twelve{

    font-size:33px;

}


/*
 * ==================================================
 * 24時間表示
 * ==================================================
 *
 * 外側の13〜24は、
 * 内側の1〜12と同じフォントを使用する。
 *
 * opacityを下げることで、
 * 12時間表示を主表示として残しながら
 * 24時間表示も読み取れるようにする。
 */

.clock-face .hour24{

    font-size:15px;

    opacity:.55;

}


/*
 * --------------------------------------------------
 * 13〜19
 *
 * 24時間表示の中でも目立たせる。
 * --------------------------------------------------
 */

.clock-face .hour24.large{

    font-size:31px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face .hour12{

        font-size:29px;

    }


    .clock-face .hour12.small{

        font-size:14px;

    }


    .clock-face .hour12.twelve{

        font-size:31px;

    }


    .clock-face .hour24{

        font-size:14px;

    }


    .clock-face .hour24.large{

        font-size:29px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face .hour12{

        font-size:27px;

    }


    .clock-face .hour12.small{

        font-size:13px;

    }


    .clock-face .hour12.twelve{

        font-size:29px;

    }


    .clock-face .hour24{

        font-size:13px;

    }


    .clock-face .hour24.large{

        font-size:27px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face .hour12{

        font-size:25px;

    }


    .clock-face .hour12.small{

        font-size:12px;

    }


    .clock-face .hour12.twelve{

        font-size:27px;

    }


    .clock-face .hour24{

        font-size:12px;

    }


    .clock-face .hour24.large{

        font-size:25px;

    }

}

</style>

</head>


<body>


<main class="page-main">


<section class="clock-area">


<h1 class="clock-title">

</h1>


<div class="time-ring">


<svg
    viewBox="0 0 400 400"
    role="img"
    aria-label="服部医院 外来診療時間"
>


<defs>


<!-- ==================================================
     青：ベース帯グラデーション
================================================== -->

<radialGradient

    />

    <stop
        offset="82%"
        stop-color="#72afe8"

    />

    <stop
        offset="100%"
        stop-color="#3d8bdc"
        stop-opacity=".72"
    />

</radialGradient>


<!-- ==================================================

================================================== -->

<radialGradient
    id="greenBaseGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="55%"
        stop-color="#70ad47"

    />

    <stop
        offset="64%"

    />

    <stop
        offset="72%"

    />

    <stop
        offset="82%"
        stop-color="#95c66f"
        stop-opacity=".62"
    />

    <stop
        offset="100%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

</radialGradient>


</defs>


<!-- ==================================================
     時計盤
================================================== -->

<circle
    class="clock-disc"
    cx="200"
    cy="200"
    r="174"
/>


<!-- ==================================================
     外周
================================================== -->

<circle
    class="outer-ring"
    cx="200"
    cy="200"
    r="180"
/>


<!-- ==================================================
     時間帯
================================================== -->

<path
    id="morningBand"
    class="time-band band-base blue"
/>


<path
    id="morningWhite"

/>


<path
    id="visitBand"

/>


<path

/>

    id="eveningBand"

/>


<!-- ==================================================
     時計数字
================================================== -->

<g class="clock-face">

    <g id="clock12"></g>

    <g id="clock24"></g>

</g>


<!-- ==================================================
     時計の針
================================================== -->

<line
    class="clock-hand hour"
    x1="200"
    y1="200"
    x2="200"
    y2="125"
/>


<line
    class="clock-hand minute"
    x1="200"
    y1="200"
    x2="200"

/>


<line
    class="clock-hand second"
    x1="200"
    y1="200"

/>


<!-- ==================================================
     中央
================================================== -->

<circle
    class="clock-center"

/>

/>


</svg>

</div>

</section>

</main>


<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;


/*
 * ==================================================
 * 帯の半径
 * ==================================================
 *
 * 外周180、内周100。
 *
 * この2つは時計の基本形状なので、
 * 数字位置や白抜けの調整では変更しない。
 */

const OUTER_RADIUS = 180;

const INNER_RADIUS = 100;


/*
 * ==================================================
 * 帯の角丸
 * ==================================================
 *
 * 角丸を大きくしすぎると、
 * バームクーヘン型ではなく
 * カプセル型に近づくため、小さく保つ。
 */

const CORNER_RADIUS = 5;


/*
 * ==================================================
 * 白抜け
 * ==================================================
 *
 * 白レイヤーをベース帯より内側に置く。
 *
 * 現在値は3。
 *
 * 外周側：
 * 180 - 3 = 177
 *
 * 内周側：
 * 100 + 3 = 103
 *
 * したがって白抜けは
 * 103〜177となる。
 *
 * 帯の中心：
 * (180 + 100) / 2 = 140
 *
 * 白抜けの中心：
 * (177 + 103) / 2 = 140
 *
 * つまり白抜けの中心は
 * 帯の中心と一致する。
 *
 * 値を小さくすると白抜けが広くなり、
 * 値を大きくすると白抜けが狭くなる。
 */

const WHITE_RADIAL_INSET = 3;


/*
 * ==================================================
 * 白抜けの時間方向
 * ==================================================
 *
 * 白レイヤーの始点・終点を
 * ベース帯より少し内側にする。
 *
 * これにより、
 * 始点・終点には色が残る。
 */

const WHITE_ANGLE_INSET = 1.5;


/*
 * ==================================================
 * 数字の配置半径
 * ==================================================
 *
 * 12時間表示：
 * 帯の内側寄り
 *
 * 24時間表示：
 * 帯の外側寄り
 *
 * 24時間表示は以前の位置から
 * 4px中心方向へ移動している。
 */

const INNER_NUMBER_RADIUS = 126;

const OUTER_NUMBER_RADIUS = 150;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度
 * @throws {TypeError} 時または分が数値でない場合
 * @throws {RangeError} 分が0〜59でない場合
 *
 * @example
 * timeToClockAngle(9, 0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30) +
        minute * .5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * SVGでは0°が右方向になるため、
 * 12時方向を0°として扱えるよう90°補正する。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 *
 * @example
 * clockToSvgAngle(0); // -90
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   角度正規化
================================================== */

/**
 * 角度を0〜360°の範囲へ正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化された角度
 *
 * @example
 * normalizeAngle(-30); // 330
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 中心からの半径と角度をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} SVG座標
 *
 * @example
 * polarToPoint(180,-90);
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   時計座標
================================================== */

/**
 * 時計角度を直接SVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} clockAngle 時計角度
 * @returns {{x:number,y:number}} SVG座標
 *
 * @example
 * clockPoint(126,0);
 */

function clockPoint(
    radius,
    clockAngle
){

    return polarToPoint(
        radius,
        clockToSvgAngle(
            clockAngle
        )
    );

}


/* ==================================================
   閉じた円環帯
================================================== */

/**
 * 完全に閉じた円環状の時間帯パスを生成する。
 *
 * 外周と内周を円弧で結び、
 * 始点と終点を直線で閉じる。
 *
 * 白レイヤーにも同じ関数を使用することで、
 * ベース帯と同じ形状を保ったまま
 * 放射方向・時間方向だけ縮小できる。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {number} radialInset 放射方向の縮小量
 * @param {number} angleInset 時間方向の縮小量
 * @returns {string} SVG path
 * @throws {RangeError} 時間範囲または帯幅が不正な場合
 *
 * @example
 * createBandPath(9,0,12,0);
 */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute,
    radialInset = 0,
    angleInset = 0
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '開始時刻と終了時刻の範囲が不正です'
        );

    }


    /*
     * 放射方向の縮小。
     *
     * 白レイヤーの場合、
     * 外側から内側へ同じ量だけ縮める。
     *
     * これにより白抜けの中心が
     * 常に帯の中心に一致する。
     */

    const outerRadius =
        OUTER_RADIUS -
        radialInset;


    const innerRadius =
        INNER_RADIUS +
        radialInset;


    if(
        innerRadius >= outerRadius
    ){

        throw new RangeError(
            '帯の幅が確保できません'
        );

    }


    /*
     * 白レイヤーだけ時間方向にも縮小する。
     *
     * ベース帯では0なので、
     * 実際の時間位置は変わらない。
     */

    const localStart =
        start +
        angleInset;


    const localEnd =
        end -
        angleInset;


    const localSweep =
        normalizeAngle(
            localEnd -
            localStart
        );


    if(
        localSweep <= 0
    ){

        throw new RangeError(
            '帯の時間方向の幅が確保できません'
        );

    }


    /*
     * 角丸半径。
     *
     * 帯幅より大きくならないよう制限する。
     */

    const r =
        Math.min(
            CORNER_RADIUS,
            (outerRadius - innerRadius) / 2 - .5
        );


    const outerFilletRadius =
        outerRadius - r;


    const outerDelta =
        Math.asin(
            r /
            outerFilletRadius
        ) *
        180 /
        Math.PI;


    const innerFilletRadius =
        innerRadius + r;


    const innerDelta =
        Math.asin(
            r /
            innerFilletRadius
        ) *
        180 /
        Math.PI;


    /*
     * 外周の接点。
     */

    const outerStart =
        clockPoint(
            outerRadius,
            localStart +
            outerDelta
        );


    const outerEnd =
        clockPoint(
            outerRadius,
            localEnd -
            outerDelta
        );


    /*
     * 内周の接点。
     */

    const innerEnd =
        clockPoint(
            innerRadius,
            localEnd -
            innerDelta
        );


    const innerStart =
        clockPoint(
            innerRadius,
            localStart +
            innerDelta
        );


    /*
     * 始点・終点の角丸接点。
     */

    const outerStartTangent =
        clockPoint(
            outerFilletRadius *
            Math.cos(
                outerDelta *
                Math.PI /
                180
            ),
            localStart
        );


    const innerStartTangent =
        clockPoint(
            innerFilletRadius *
            Math.cos(
                innerDelta *
                Math.PI /
                180
            ),
            localStart
        );


    const outerEndTangent =
        clockPoint(
            outerFilletRadius *
            Math.cos(
                outerDelta *
                Math.PI /
                180
            ),
            localEnd
        );


    const innerEndTangent =
        clockPoint(
            innerFilletRadius *
            Math.cos(
                innerDelta *
                Math.PI /
                180
            ),
            localEnd
        );


    /*
     * 180°を超える帯だけ
     * 大円弧フラグを1にする。
     */

    const largeArcFlag =
        localSweep > 180
            ? 1
            : 0;


    /*
     * 外周
     * ↓
     * 終点外側角丸
     * ↓
     * 終点端面
     * ↓
     * 終点内側角丸
     * ↓
     * 内周
     * ↓
     * 始点内側角丸
     * ↓
     * 始点端面
     * ↓
     * 始点外側角丸
     * ↓
     * 閉じる
     *
     * この構造により、
     * 帯の両端を完全に閉じる。
     */

    return [

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        `A
        ${outerRadius}
        ${outerRadius}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        `A
        ${r}
        ${r}
        0
        0
        1
        ${outerEndTangent.x}
        ${outerEndTangent.y}`,

        `L
        ${innerEndTangent.x}
        ${innerEndTangent.y}`,

        `A
        ${r}
        ${r}
        0
        0
        1
        ${innerEnd.x}
        ${innerEnd.y}`,

        `A
        ${innerRadius}
        ${innerRadius}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        `A
        ${r}
        ${r}
        0
        0
        1
        ${innerStartTangent.x}
        ${innerStartTangent.y}`,

        `L
        ${outerStartTangent.x}
        ${outerStartTangent.y}`,

        `A
        ${r}
        ${r}
        0
        0
        1
        ${outerStart.x}
        ${outerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================

================================================== */

/**
 * 指定した時間帯の色付きベースパスを設定する。
 *
 * @param {string} id SVG要素ID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {void}
 *
 * @example
 * setBaseBand('morningBand',9,0,12,0);
 */

function setBaseBand(
    id,
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const element =
        document.getElementById(id);


    if(!element){

        console.error(
            `ベース帯 ${id} が見つかりません`
        );

        return;

    }


    try{

        element.setAttribute(
            'd',
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );

    }

    catch(error){

        console.error(
            `${id} の生成に失敗しました`,
            error
        );

    }

}

/* ==================================================
   時計数字生成
================================================== */

/**
 * 12時間表示と24時間表示を生成する。
 *
 * 内側と外側で同じフォントを使用し、
 * サイズ・位置・透明度だけで役割を分ける。
 *
 * @returns {void}
 *
 * @example
 * createClockNumbers();
 */

function createClockNumbers(){

    const clock12 =
        document.getElementById(
            'clock12'
        );


    const clock24 =
        document.getElementById(
            'clock24'
        );


    /*
     * HTML側に数字配置用の要素がない場合は、
     * その場で明確なエラーにする。
     *
     * 外側でtry/catchは行わない。
     * この関数はページ初期化時に一度だけ実行するため、
     * エラーを握りつぶさない方が原因を追いやすい。
     */

    if(
        !clock12 ||
        !clock24
    ){

        throw new Error(
            '時計数字の配置先が見つかりません'
        );

    }


    /*
     * --------------------------------------------------
     * 12時間表示
     * --------------------------------------------------
     *
     * 12時方向を12として、
     * 時計回りに1〜12を配置する。
     */

    for(
        let hour = 1;
        hour <= 12;
        hour++
    ){

        const clockAngle =
            hour === 12
                ? 0
                : hour * 30;


        const point =
            clockPoint(
                INNER_NUMBER_RADIUS,
                clockAngle
            );


        const text =
            document.createElementNS(
                'http://www.w3.org/2000/svg',
                'text'
            );


        let className =
            'hour12';


        /*
         * 1〜7は小さくして、
         * 帯の中で控えめに表示する。
         */

        if(
            hour >= 1 &&
            hour <= 7
        ){

            className +=
                ' small';

        }


        /*
         * 12だけ少し大きくする。
         */

        if(
            hour === 12
        ){

            className +=
                ' twelve';

        }


        text.setAttribute(
            'class',
            className
        );


        text.setAttribute(
            'x',
            point.x
        );


        text.setAttribute(
            'y',
            point.y
        );


        text.textContent =
            String(hour);


        clock12.appendChild(
            text
        );

    }


    /*
     * --------------------------------------------------
     * 24時間表示
     * --------------------------------------------------
     *
     * 12時方向 → 24
     * 1時方向  → 13
     * 2時方向  → 14
     *
     * …
     *
     * 11時方向 → 23
     */

    for(
        let hour = 0;
        hour < 12;
        hour++
    ){

        const clockAngle =
            hour * 30;


        const point =
            clockPoint(
                OUTER_NUMBER_RADIUS,
                clockAngle
            );


        const text =
            document.createElementNS(
                'http://www.w3.org/2000/svg',
                'text'
            );


        const displayHour =
            hour === 0
                ? 24
                : hour + 12;


        /*
         * 13〜19だけ大きくする。
         *
         * 20〜24は控えめに表示する。
         */

        const className =
            displayHour >= 13 &&
            displayHour <= 19
                ? 'hour24 large'
                : 'hour24';


        text.setAttribute(
            'class',
            className
        );


        text.setAttribute(
            'x',
            point.x
        );


        text.setAttribute(
            'y',
            point.y
        );


        text.textContent =
            String(displayHour);


        clock24.appendChild(
            text
        );

    }

}

/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * ブラウザの現在時刻を日本標準時へ変換する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 日本時間の取得結果が不正な場合
 *
 * @example
 * getJapanTime();
 */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',

                hour12:false,

                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    for(
        const part
        of parts
    ){

        if(
            part.type === 'hour' ||
            part.type === 'minute' ||
            part.type === 'second'
        ){

            result[part.type] =
                Number(part.value);

        }

    }


    /*
     * 一部環境では深夜0時が24として返るため、
     * 時計上の0時へ正規化する。
     */

    if(
        result.hour === 24
    ){

        result.hour = 0;

    }


    if(
        !Number.isInteger(result.hour) ||
        !Number.isInteger(result.minute) ||
        !Number.isInteger(result.second)
    ){

        throw new Error(
            '日本時間の取得結果が不正です'
        );

    }


    return result;

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * 秒・分・時を連続的に反映することで、
 * 針の動きを滑らかにする。
 *
 * @returns {void}
 *
 * @example
 * updateClock();
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新に失敗しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針：
     * 1秒 = 6°
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針：
     * 秒まで反映する。
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針：
     * 分・秒まで反映する。
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    /*
     * 必要な針が存在しない場合は、
     * requestAnimationFrameを継続しない。
     */

    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();
