<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>診療時間｜服部医院</title>


<style>

/* ========================================
   全体
======================================== */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px 15px;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(220,240,230,.7),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #f8fbf8,
            #edf5f0
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;

    color:#40504a;

}


/* ========================================
   ページ
======================================== */

.clock-page{

    width:min(94vw,600px);

    text-align:center;

}


/* ========================================
   タイトル
======================================== */

.title{

    font-size:1.15rem;

    letter-spacing:.18em;

    margin-bottom:6px;

}

.subtitle{

    font-size:.78rem;

    letter-spacing:.12em;

    color:#81908a;

    margin-bottom:25px;

}


/* ========================================
   時計本体
======================================== */

.clock{

    position:relative;

    width:min(88vw,500px);

    aspect-ratio:1;

    margin:auto;

    border-radius:50%;

    background:#ffffff;

    box-shadow:

        0 20px 60px
        rgba(70,100,85,.12),

        inset 0 0 0 1px
        rgba(120,150,135,.14);

}


/* ========================================
   診療時間リング
======================================== */

/*
   12時間時計として計算

   12:00 = 0°
   1:30  = 45°
   5:00  = 150°
   5:30  = 165°
   7:30  = 225°
   9:00  = 270°

   午前診
   9:00 → 12:00
   270° → 360°

   訪問診療
   1:30 → 5:00
   45° → 150°

   午後診
   5:30 → 7:30
   165° → 225°
*/

.time-ring{

    position:absolute;

    inset:4.5%;

    border-radius:50%;

    background:

        conic-gradient(

            from 90deg,

            /* 12:00 → 1:30 */

            transparent 0deg 45deg,

            /* 訪問診療 */

            #b7d6c4 45deg 150deg,

            /* 5:00 → 5:30 */

            transparent 150deg 165deg,

            /* 午後診 */

            #9bc8b0 165deg 225deg,

            /* 7:30 → 9:00 */

            transparent 225deg 270deg,

            /* 午前診 */

            #9bc8b0 270deg 360deg

        );


    /* 円周部分だけ表示 */

    -webkit-mask:

        radial-gradient(
            farthest-side,
            transparent calc(100% - 18px),
            #000 calc(100% - 17px)
        );

    mask:

        radial-gradient(
            farthest-side,
            transparent calc(100% - 18px),
            #000 calc(100% - 17px)
        );

}


/* ========================================
   時計の数字
======================================== */

.number{

    position:absolute;

    left:50%;
    top:50%;

    font-size:1.35rem;

    font-weight:400;

    color:#303a36;

    z-index:5;

    transform:
        translate(-50%,-50%);

}


/* 数字の位置 */

.n12{
    left:50%;
    top:8%;
}

.n1{
    left:71%;
    top:11%;
}

.n2{
    left:87%;
    top:26%;
}

.n3{
    left:92%;
    top:50%;
}

.n4{
    left:87%;
    top:74%;
}

.n5{
    left:71%;
    top:89%;
}

.n6{
    left:50%;
    top:92%;
}

.n7{
    left:29%;
    top:89%;
}

.n8{
    left:13%;
    top:74%;
}

.n9{
    left:8%;
    top:50%;
}

.n10{
    left:13%;
    top:26%;
}

.n11{
    left:29%;
    top:11%;
}


/* ========================================
   診療区分の文字
======================================== */

.service-label{

    position:absolute;

    z-index:6;

    font-size:.72rem;

    letter-spacing:.08em;

    color:#62736b;

    background:
        rgba(255,255,255,.88);

    padding:5px 9px;

    border-radius:20px;

    white-space:nowrap;

    box-shadow:
        0 3px 12px
        rgba(70,100,85,.08);

}


/*
   午前診
   9時〜12時の帯の内側
*/

.morning{

    left:16%;

    top:38%;

}


/*
   訪問診療
   1:30〜5:00の帯の内側
*/

.visit{

    right:13%;

    top:30%;

}


/*
   午後診
   5:30〜7:30の帯の内側
*/

.afternoon{

    right:18%;

    bottom:30%;

}


/* ========================================
   時計の針
======================================== */

.hand{

    position:absolute;

    left:50%;
    top:50%;

    transform-origin:
        50% 100%;

    border-radius:10px;

    z-index:10;

}


/* 時針 */

.hour{

    width:7px;

    height:25%;

    margin-left:-3.5px;

    margin-top:-25%;

    background:#53645d;

}


/* 分針 */

.minute{

    width:4px;

    height:34%;

    margin-left:-2px;

    margin-top:-34%;

    background:#53645d;

}


/* 秒針 */

.second{

    width:2px;

    height:39%;

    margin-left:-1px;

    margin-top:-39%;

    background:#87b69d;

}


/* ========================================
   中央
======================================== */

.center{

    position:absolute;

    left:50%;
    top:50%;

    width:13px;
    height:13px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#53645d;

    z-index:20;

    box-shadow:
        0 0 0 4px
        rgba(255,255,255,.85);

}


/* ========================================
   スマートフォン
======================================== */

@media(max-width:600px){

    .clock{

        width:88vw;

    }


    .number{

        font-size:1.35rem;

    }


    .service-label{

        font-size:.62rem;

        padding:4px 7px;

    }


    .morning{

        left:10%;

        top:38%;

    }


    .visit{

        right:7%;

        top:30%;

    }


    .afternoon{

        right:10%;

        bottom:29%;

    }


    .time-ring{

        inset:5%;

        -webkit-mask:

            radial-gradient(
                farthest-side,
                transparent calc(100% - 14px),
                #000 calc(100% - 13px)
            );

        mask:

            radial-gradient(
                farthest-side,
                transparent calc(100% - 14px),
                #000 calc(100% - 13px)
            );

    }

}

</style>

</head>


<body>


<div class="clock-page">


    <div class="title">
        診療時間
    </div>


    <div class="subtitle">
        服部医院
    </div>


    <div class="clock">


        <!-- =================================
             診療時間の円周
        ================================= -->

        <div class="time-ring"></div>


        <!-- =================================
             時計の数字
        ================================= -->

        <div class="number n12">12</div>
        <div class="number n1">1</div>
        <div class="number n2">2</div>
        <div class="number n3">3</div>
        <div class="number n4">4</div>
        <div class="number n5">5</div>
        <div class="number n6">6</div>
        <div class="number n7">7</div>
        <div class="number n8">8</div>
        <div class="number n9">9</div>
        <div class="number n10">10</div>
        <div class="number n11">11</div>


        <!-- =================================
             診療区分
        ================================= -->

        <div class="service-label morning">
            午前診
        </div>


        <div class="service-label visit">
            訪問診療
        </div>


        <div class="service-label afternoon">
            午後診
        </div>


        <!-- =================================
             時計の針
        ================================= -->

        <div
            class="hand hour"
            id="hourHand">
        </div>


        <div
            class="hand minute"
            id="minuteHand">
        </div>


        <div
            class="hand second"
            id="secondHand">
        </div>


        <div class="center"></div>


    </div>


</div>


<script>


/* ========================================
   現在時刻に合わせて針を動かす
======================================== */

function updateClock(){

    const now = new Date();


    const hours =
        now.getHours();

    const minutes =
        now.getMinutes();

    const seconds =
        now.getSeconds();

    const milliseconds =
        now.getMilliseconds();


    /* =========================
       時針
    ========================= */

    const hourAngle =

        (hours % 12) * 30

        +

        minutes * 0.5

        +

        seconds / 120;


    /* =========================
       分針
    ========================= */

    const minuteAngle =

        minutes * 6

        +

        seconds * 0.1;


    /* =========================
       秒針
    ========================= */

    const secondAngle =

        seconds * 6

        +

        milliseconds * 0.006;


    document
        .getElementById("hourHand")
        .style.transform =
        `rotate(${hourAngle}deg)`;


    document
        .getElementById("minuteHand")
        .style.transform =
        `rotate(${minuteAngle}deg)`;


    document
        .getElementById("secondHand")
        .style.transform =
        `rotate(${secondAngle}deg)`;

}


function animate(){

    updateClock();

    requestAnimationFrame(animate);

}


animate();


</script>


</body>

</html>
