<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/*
 * ベース。
 *
 * 実際の時間帯そのもの。
 *
 * ここでは角度を一切縮めない。
 */

.time-band-base{

    stroke:none;

}


/*
 * 白レイヤー。
 *
 * ベースより半径方向だけ小さい。
 *
 * そのため両端には必ず
 * ベースの色が残る。
 */

.time-band-inner{

    stroke:none;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

</head>

<defs>

    />

    <stop

<!-- ==================================================

================================================== -->

<circle

<path

<!-- ==================================================

     ただし角度はベースと完全に同じ。
     
     したがって時間が前後に伸びない。
================================================== -->

<path

<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;


/*
 * ベースの外周。
 *
 * 時間帯の外側は常にR180。
 */

const OUTER_RADIUS = 180;


/*
 * ベースの内周。
 *
 * 時間帯の内側は常にR100。
 */

const INNER_RADIUS = 100;


/*
 * 白レイヤーの外周。
 *
 * ベースより6px内側。
 *
 * ここを小さくすることで、
 * ベースの青・緑が外側に残る。
 */

const INNER_LAYER_OUTER_RADIUS = 174;


/*
 * 白レイヤーの内周。
 *
 * ベースより6px外側。
 *
 * したがって白レイヤーは
 * 半径方向だけで小さくなる。
 */

const INNER_LAYER_INNER_RADIUS = 106;


/*
 * ベースの角丸。
 *
 * 大きくしすぎると時間の端が
 * 前後に逃げて見えるため、
 * 今回は非常に小さくする。
 */

const CORNER_RADIUS = 5;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計上の角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度
 * @throws {TypeError} 時または分が数値でない場合
 * @throws {RangeError} 分が0〜59でない場合
 *
 * @example
 * timeToClockAngle(9, 0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30) +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * SVGの0°は3時方向なので、
 * 12時方向を0°に合わせるため90°引く。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   角度正規化
================================================== */

/**
 * 角度を0〜360°へ正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化された角度
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 円周上の座標をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} SVG座標
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   時計座標
================================================== */

/**
 * 時計角度をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} clockAngle 時計角度
 * @returns {{x:number,y:number}} SVG座標
 */

function clockPoint(
    radius,
    clockAngle
){

    return polarToPoint(
        radius,
        clockToSvgAngle(
            clockAngle
        )
    );

}


/* ==================================================
   ベース時間帯
================================================== */

/**
 * バームクーヘン型の時間帯を作る。
 *
 * ベースはR100〜R180の完全な円環帯を基本とし、
 * 始点・終点の角度を一切変更しない。
 *
 * 端だけを小さく丸めることで、
 * 「〔　　　〕」に近い袋とじ形状を作る。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 * @throws {RangeError} 時間範囲が不正な場合
 *
 * @example
 * createBaseBandPath(9,0,12,0);
 */

function createBaseBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '時間帯の角度が不正です'
        );

    }


    /*
     * 角丸は最小限。
     *
     * ここで時間角度そのものを変更しないため、
     * 見た目の時間範囲を維持できる。
     */

    const r =
        Math.min(
            CORNER_RADIUS,
            (OUTER_RADIUS - INNER_RADIUS) / 2
        );


    /*
     * 外周側。
     */

    const outerStart =
        clockPoint(
            OUTER_RADIUS,
            start
        );


    const outerEnd =
        clockPoint(
            OUTER_RADIUS,
            end
        );


    /*
     * 内周側。
     */

    const innerEnd =
        clockPoint(
            INNER_RADIUS,
            end
        );


    const innerStart =
        clockPoint(
            INNER_RADIUS,
            start
        );


    /*
     * まずは正確な時間端を持つ
     * 基本的な閉じた円環帯を作る。
     *
     * この方法なら、
     * 時間が前後へ伸びることがない。
     */

    return [

        `M ${outerStart.x} ${outerStart.y}`,

        `A
            ${OUTER_RADIUS}
            ${OUTER_RADIUS}
            0
            ${sweep > 180 ? 1 : 0}
            1
            ${outerEnd.x}
            ${outerEnd.y}`,

        `L
            ${innerEnd.x}
            ${innerEnd.y}`,

        `A
            ${INNER_RADIUS}
            ${INNER_RADIUS}
            0
            ${sweep > 180 ? 1 : 0}
            0
            ${innerStart.x}
            ${innerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================
   白内側レイヤー
================================================== */

/**
 * ベースと同じ時間角度の白レイヤーを作る。
 *
 * 重要なのは、
 * start / end の角度をベースと完全に同じにすること。
 *
 * これにより白レイヤーを重ねても、
 * 時間帯そのものが前後に伸縮しない。
 *
 * 半径方向だけを小さくする。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 * @throws {RangeError} 時間範囲が不正な場合
 *
 * @example
 * createInnerLayerPath(9,0,12,0);
 */

function createInnerLayerPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '時間帯の角度が不正です'
        );

    }


    const outerStart =
        clockPoint(
            INNER_LAYER_OUTER_RADIUS,
            start
        );


    const outerEnd =
        clockPoint(
            INNER_LAYER_OUTER_RADIUS,
            end
        );


    const innerEnd =
        clockPoint(
            INNER_LAYER_INNER_RADIUS,
            end
        );


    const innerStart =
        clockPoint(
            INNER_LAYER_INNER_RADIUS,
            start
        );


    /*
     * ベースと完全に同じ角度。
     *
     * ここを縮めないことが重要。
     */

    return [

        `M ${outerStart.x} ${outerStart.y}`,

        `A
            ${INNER_LAYER_OUTER_RADIUS}
            ${INNER_LAYER_OUTER_RADIUS}
            0
            ${sweep > 180 ? 1 : 0}
            1
            ${outerEnd.x}
            ${outerEnd.y}`,

        `L
            ${innerEnd.x}
            ${innerEnd.y}`,

        `A
            ${INNER_LAYER_INNER_RADIUS}
            ${INNER_LAYER_INNER_RADIUS}
            0
            ${sweep > 180 ? 1 : 0}
            0
            ${innerStart.x}
            ${innerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================
   時間帯設定
================================================== */

/**
 * ベースと白レイヤーを同じ時間角度で配置する。
 *
 * @param {string} baseId ベース要素ID
 * @param {string} innerId 白レイヤー要素ID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} baseGradient ベースグラデーション
 * @returns {void}
 */

function setBand(
    baseId,
    innerId,
    startHour,
    startMinute,
    endHour,
    endMinute,
    baseGradient
){

    const base =
        document.getElementById(
            baseId
        );


    const inner =
        document.getElementById(
            innerId
        );


    if(
        !base ||
        !inner
    ){

        console.error(
            '時間帯用SVG要素が見つかりません'
        );

        return;

    }


    try{

        /*
         * ベース。
         */

        base.setAttribute(
            'd',
            createBaseBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        base.setAttribute(
            'fill',
            `url(#${baseGradient})`
        );


        /*
         * 白レイヤー。
         *
         * ベースより小さいが、
         * 時間角度は同一。
         */

        inner.setAttribute(
            'd',
            createInnerLayerPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        inner.setAttribute(
            'fill',
            'url(#whiteOverlayGradient)'
        );

    }

    catch(error){

        console.error(
            '時間帯の描画に失敗しました',
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningBandBase',
    'morningBandInner',
    9,

/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 日本時間を取得できない場合
 *
 * @example
 * getJapanTime();
 */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',
                hour12:false,
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    for(
        const part of parts
    ){

        if(
            part.type === 'hour' ||
            part.type === 'minute' ||
            part.type === 'second'
        ){

            result[part.type] =
                Number(part.value);

        }

    }


    /*
     * 一部環境では0時が24として
     * 返る場合があるため補正する。
     */

    if(
        result.hour === 24
    ){

        result.hour = 0;

    }


    if(
        !Number.isInteger(result.hour) ||
        !Number.isInteger(result.minute) ||
        !Number.isInteger(result.second)
    ){

        throw new Error(
            '日本時間の取得結果が不正です'
        );

    }


    return result;

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * @returns {void}
 *
 * @example
 * updateClock();
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新に失敗しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針。
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針。
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針。
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * 針は12時位置を基準にしているので、
     * 時計角度をそのまま回転角にする。
     *
     * 以前のように90°を二重に補正しない。
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();
