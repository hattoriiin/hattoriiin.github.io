<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜診療時間</title>

<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    line-height:1.7;

}


/* ==================================================
   ページ
================================================== */

.clock-page{

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:
        2rem
        1.2rem
        4rem;

}


/* ==================================================
   タイトル
================================================== */

.clock-title{

    margin:0;

    text-align:center;

    font-size:1.45rem;

    font-weight:400;

    letter-spacing:.16em;

    color:#31556e;

}

.clock-subtitle{

    margin:.35rem 0 1.8rem;

    text-align:center;

    font-size:.78rem;

    color:#777;

    letter-spacing:.08em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        92vw,
        520px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


/*
--------------------------------------------------
   SVGを使っているので、

   ・時計の中心
   ・数字
   ・帯
   ・円周

   をすべて同じ座標系で管理する。
--------------------------------------------------
*/

.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計の背景
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周の薄い円
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   帯そのもの

   SVGを使っているので、
   位置がズレにくい。
================================================== */

.time-band{

    stroke:none;

}


/* --------------------------------------------------
   外来

   午前診・午後診
   → 以前の診療時間表と同じ「青」を
      透明度約35%で使用
-------------------------------------------------- */

.outpatient-band{

    fill:
        url(#outpatientGradient);

    opacity:.35;

}


/* --------------------------------------------------
   訪問診療

   → 以前の診療時間表と同じ「緑」を
      透明度約35%で使用
-------------------------------------------------- */

.visit-band{

    fill:
        url(#visitGradient);

    opacity:.35;

}


/* ==================================================
   帯の縁

   ごく薄い艶
================================================== */

.band-highlight{

    fill:none;

    stroke:
        rgba(255,255,255,.28);

    stroke-width:2;

}


/* ==================================================
   時計の数字
================================================== */

.clock-face{

    pointer-events:none;

}


/*
   Frank Müller / 高級時計の文字盤を
   少し意識した細身のセリフ系
*/

.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

    letter-spacing:0;

}


/*
   12だけ少し存在感を持たせる
*/

.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


/* ==================================================
   時計の針

   装飾として非常に薄く
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}

.clock-hand.hour{

    stroke-width:4;

}

.clock-hand.minute{

    stroke-width:2.5;

}


/* ==================================================
   中央点
================================================== */

.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   帯の説明
================================================== */

.schedule-note{

    max-width:520px;

    margin:1.8rem auto 0;

    padding:1rem 1.2rem;

    background:
        rgba(245,250,250,.72);

    border-radius:14px;

    box-shadow:
        0 4px 14px
        rgba(40,80,80,.06);

}


/* --------------------------------------------------
   凡例
-------------------------------------------------- */

.legend{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:1.5rem;

    flex-wrap:wrap;

    font-size:.82rem;

    color:#555;

}

.legend-item{

    display:flex;

    align-items:center;

    gap:.45rem;

}


/* 色の丸 */

.legend-blue{

    width:12px;

    height:12px;

    border-radius:50%;

    background:
        #3d8bdc;

    opacity:.35;

}


.legend-green{

    width:12px;

    height:12px;

    border-radius:50%;

    background:
        #70ad47;

    opacity:.35;

}


/* ==================================================
   診療時間文字
================================================== */

.schedule-times{

    margin-top:1rem;

    text-align:center;

    font-size:.82rem;

    line-height:1.9;

    color:#555;

}

.schedule-times strong{

    font-weight:500;

    color:#31556e;

}


/* ==================================================
   戻る
================================================== */

.back-link{

    display:block;

    width:max-content;

    margin:2rem auto 0;

    padding:.55rem 1.3rem;

    border-radius:20px;

    background:#31556e;

    color:#fff;

    text-decoration:none;

    font-size:.8rem;

}


/* ==================================================
   スマートフォン
================================================== */

@media(max-width:600px){

    .clock-page{

        padding:
            1.4rem
            .7rem
            3rem;

    }

    .clock-title{

        font-size:1.25rem;

    }

    .clock-subtitle{

        margin-bottom:1rem;

    }

    .clock-face text{

        font-size:29px;

    }

    .clock-face .twelve{

        font-size:31px;

    }

    .schedule-note{

        margin-left:.3rem;

        margin-right:.3rem;

    }

}


/* ==================================================
   小さいスマートフォン
================================================== */

@media(max-width:380px){

    .clock-face text{

        font-size:27px;

    }

    .clock-face .twelve{

        font-size:29px;

    }

}

</style>

</head>


<body>


<main class="clock-page">


<h1 class="clock-title">
    診療時間
</h1>

<p class="clock-subtitle">
    服部医院
</p>


<!-- ==================================================
     時計本体
================================================== -->

<div class="time-ring">

<svg
    viewBox="0 0 400 400"
    role="img"
    aria-label="服部医院 診療時間"
>


<defs>


<!-- ==================================================
     外来グラデーション

     外側が白っぽく、
     中央に向かって診療時間表の青。
================================================== -->

<linearGradient
    id="outpatientGradient"
    x1="0"
    y1="0"
    x2="0"
    y2="1"
>

    <stop
        offset="0%"
        stop-color="#ffffff"
        stop-opacity=".95"
    />

    <stop
        offset="18%"
        stop-color="#8fc7ff"
        stop-opacity=".72"
    />

    <stop
        offset="50%"
        stop-color="#3d8bdc"
        stop-opacity=".82"
    />

    <stop
        offset="82%"
        stop-color="#3d8bdc"
        stop-opacity=".68"
    />

    <stop
        offset="100%"
        stop-color="#ffffff"
        stop-opacity=".28"
    />

</linearGradient>


<!-- ==================================================
     訪問診療グラデーション

     内側が白っぽく、
     外側に向かって緑。
================================================== -->

<linearGradient
    id="visitGradient"
    x1="0"
    y1="1"
    x2="0"
    y2="0"
>

    <stop
        offset="0%"
        stop-color="#ffffff"
        stop-opacity=".95"
    />

    <stop
        offset="18%"
        stop-color="#b7e88a"
        stop-opacity=".72"
    />

    <stop
        offset="50%"
        stop-color="#70ad47"
        stop-opacity=".82"
    />

    <stop
        offset="82%"
        stop-color="#70ad47"
        stop-opacity=".68"
    />

    <stop
        offset="100%"
        stop-color="#ffffff"
        stop-opacity=".28"
    />

</linearGradient>


</defs>


<!-- ==================================================
     時計盤
================================================== -->

<circle
    class="clock-disc"
    cx="200"
    cy="200"
    r="174"
/>


<!-- ==================================================
     外周
================================================== -->

<circle
    class="outer-ring"
    cx="200"
    cy="200"
    r="174"
/>


<!-- ==================================================
     午前診

     9:00 → 12:00

     文字盤でいう
     9時 → 12時
================================================== -->

<path
    class="time-band outpatient-band"

    d="
        M 34 200

        A 166 166 0 0 1 200 34

        A 5 5 0 0 1 205 39

        L 205 67

        A 5 5 0 0 1 200 72

        A 128 128 0 0 0 72 200

        A 5 5 0 0 1 67 205

        L 39 205

        A 5 5 0 0 1 34 200

        Z
    "
/>


<!-- ==================================================
     訪問診療

     13:30 → 17:00

     時計では
     約1:30 → 5:00

     右上から右下へ
================================================== -->

<path
    class="time-band visit-band"

    d="
        M 317.5 82.5

        A 166 166 0 0 1 317.5 317.5

        A 5 5 0 0 1 310.5 317.5

        L 290.5 297.5

        A 5 5 0 0 1 290.5 290.5

        A 128 128 0 0 0 290.5 109.5

        A 5 5 0 0 1 290.5 102.5

        L 310.5 82.5

        A 5 5 0 0 1 317.5 82.5

        Z
    "
/>


<!-- ==================================================
     午後診

     17:30 → 19:30

     時計では
     約5:30 → 7:30

     左下方向
================================================== -->

<path
    class="time-band outpatient-band"

    d="
        M 317.5 317.5

        A 166 166 0 0 1 82.5 317.5

        A 5 5 0 0 1 82.5 310.5

        L 102.5 290.5

        A 5 5 0 0 1 109.5 290.5

        A 128 128 0 0 0 290.5 290.5

        A 5 5 0 0 1 297.5 290.5

        L 317.5 310.5

        A 5 5 0 0 1 317.5 317.5

        Z
    "
/>


<!-- ==================================================
     文字盤

     帯の上に数字を置くのではなく、
     「帯の中」に文字盤を配置。
================================================== -->

<g class="clock-face">


<!-- 12 -->

<text
    class="twelve"
    x="200"
    y="62"
>
    12
</text>


<!-- 1 -->

<text
    x="269"
    y="80"
>
    1
</text>


<!-- 2 -->

<text
    x="319"
    y="130"
>
    2
</text>


<!-- 3 -->

<text
    x="338"
    y="200"
>
    3
</text>


<!-- 4 -->

<text
    x="319"
    y="270"
>
    4
</text>


<!-- 5 -->

<text
    x="269"
    y="320"
>
    5
</text>


<!-- 6 -->

<text
    x="200"
    y="338"
>
    6
</text>


<!-- 7 -->

<text
    x="131"
    y="320"
>
    7
</text>


<!-- 8 -->

<text
    x="81"
    y="270"
>
    8
</text>


<!-- 9 -->

<text
    x="62"
    y="200"
>
    9
</text>


<!-- 10 -->

<text
    x="81"
    y="130"
>
    10
</text>


<!-- 11 -->

<text
    x="131"
    y="80"
>
    11
</text>


</g>


<!-- ==================================================
     中央の針

     装飾的な時計としてのレイヤー
================================================== -->

<line
    class="clock-hand hour"
    x1="200"
    y1="200"
    x2="200"
    y2="142"
/>


<line
    class="clock-hand minute"
    x1="200"
    y1="200"
    x2="250"
    y2="200"
/>


<!-- ==================================================
     中央
================================================== -->

<circle
    class="clock-center"
    cx="200"
    cy="200"
    r="7"
/>


<circle
    class="clock-dot"
    cx="200"
    cy="200"
    r="3"
/>


</svg>

</div>


<!-- ==================================================
     凡例
================================================== -->

<div class="schedule-note">


<div class="legend">


<div class="legend-item">

    <span class="legend-blue"></span>

    <span>
        外来診療
    </span>

</div>


<div class="legend-item">

    <span class="legend-green"></span>

    <span>
        訪問診療
    </span>

</div>


</div>


<div class="schedule-times">

    <strong>午前診</strong>
   　9:00〜12:00

    <br>

    <strong>訪問診療</strong>
   　13:30〜17:00

    <br>

    <strong>午後診</strong>
   　17:30〜19:30

</div>


</div>


<!-- ==================================================
     戻る
================================================== -->

<a
    href="index.html"
    class="back-link"
>
    服部医院トップへ
</a>


</main>


</body>

</html>
