<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/*
 * 白い部分。
 *
 * 袋とじを成立させるため、
 * 白い部分を時間帯の端まで延ばさない。
 */

.time-band-white{

    stroke:none;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;

const OUTER_RADIUS = 180;

const INNER_RADIUS = 100;


/*
 * 帯幅は80px。
 */

const BAND_WIDTH =
    OUTER_RADIUS -
    INNER_RADIUS;


/*
 * 角丸。
 *
 * 帯の外形そのものに使用する。
 */

const CORNER_RADIUS = 10;


/*
 * --------------------------------------------------
 * 袋とじ幅
 *
 * ここが今回の最重要値。
 *
 * 白い部分を始点・終点から
 * この角度だけ内側へ引っ込める。
 *
 * つまり、
 *
 * 青 → 白 → 青
 *
 * の「青」が両端に残る。
 * --------------------------------------------------
 */

const END_CAP_ANGLE = 3;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度
 * @throws {TypeError} 数値でない場合
 * @throws {RangeError} 分が0〜59以外の場合
 *
 * @example
 * timeToClockAngle(9,0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30) +
        minute * .5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 円周上の座標を求める。
 *
 * @param {number} radius 半径
 * @param {number} angle SVG角度
 * @returns {{x:number,y:number}} 座標
 */

function polarToPoint(
    radius,
    angle
){

    const radians =
        angle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   角度正規化
================================================== */

/**
 * 角度を0〜360°に正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化角度
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   円環帯
================================================== */

/**
 * 角丸円環帯を生成する。
 *
 * @param {number} start 開始角度
 * @param {number} end 終了角度
 * @returns {string} SVG path
 * @throws {RangeError} 範囲が不正な場合
 */

function createBandPath(
    start,
    end
){

    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '帯の角度範囲が不正です'
        );

    }


    /*
     * 角丸による接線角。
     *
     * 外側・内側を同じ考え方で処理し、
     * 外形の見え方を揃える。
     */

    const radius =
        Math.min(
            CORNER_RADIUS,
            BAND_WIDTH / 2 - .5
        );


    const outerCenterRadius =
        OUTER_RADIUS -
        radius;


    const innerCenterRadius =
        INNER_RADIUS +
        radius;


    const outerOffset =
        Math.asin(
            radius /
            outerCenterRadius
        ) *
        180 /
        Math.PI;


    const innerOffset =
        Math.asin(
            radius /
            innerCenterRadius
        ) *
        180 /
        Math.PI;


    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                start +
                outerOffset
            )
        );


    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                end -
                outerOffset
            )
        );


    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                start +
                innerOffset
            )
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                end -
                innerOffset
            )
        );


    const outerTangentRadius =
        outerCenterRadius *
        Math.cos(
            outerOffset *
            Math.PI /
            180
        );


    const innerTangentRadius =
        innerCenterRadius *
        Math.cos(
            innerOffset *
            Math.PI /
            180
        );


    const outerStartTangent =
        polarToPoint(
            outerTangentRadius,
            clockToSvgAngle(start)
        );


    const innerStartTangent =
        polarToPoint(
            innerTangentRadius,
            clockToSvgAngle(start)
        );


    const outerEndTangent =
        polarToPoint(
            outerTangentRadius,
            clockToSvgAngle(end)
        );


    const innerEndTangent =
        polarToPoint(
            innerTangentRadius,
            clockToSvgAngle(end)
        );


    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    /*
     * 完全に閉じた外形。
     */

    return [

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        `A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerEndTangent.x}
        ${outerEndTangent.y}`,

        `L
        ${innerEndTangent.x}
        ${innerEndTangent.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerEnd.x}
        ${innerEnd.y}`,

        `A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerStartTangent.x}
        ${innerStartTangent.y}`,

        `L
        ${outerStartTangent.x}
        ${outerStartTangent.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerStart.x}
        ${outerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================
   時間 → 帯
================================================== */

/**
 * 時刻範囲から帯pathを生成する。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 */

function createTimeBand(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    return createBandPath(

        timeToClockAngle(
            startHour,
            startMinute
        ),

        timeToClockAngle(
            endHour,
            endMinute
        )

    );

}


/* ==================================================
   袋とじ用の白帯
================================================== */

/**
 * 白い部分だけを少し短くした帯を作る。
 *
 * これが「袋とじ」の本体。
 *
 * 外側の青／緑帯を先に描き、
 * 白帯を始点・終点からEND_CAP_ANGLEだけ
 * 内側へ引っ込めることで、
 * 両端に青／緑が残る。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 */

function createWhiteBand(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    /*
     * 白帯を両端から引っ込める。
     *
     * これによって白が端面まで到達しない。
     */

    const whiteStart =
        start +
        END_CAP_ANGLE;


    const whiteEnd =
        end -
        END_CAP_ANGLE;


    /*
     * 白帯が消えるほど短い時間帯には
     * 適用しない。
     */

    if(
        sweep <=
        END_CAP_ANGLE * 2
    ){

        throw new RangeError(
            '白帯を配置できる時間幅がありません'
        );

    }


    return createBandPath(
        whiteStart,
        whiteEnd
    );

}


/* ==================================================
   帯を描画
================================================== */

/**
 * 色付きベースと白い中央帯を重ねる。
 *
 * @param {string} baseId ベースpath ID
 * @param {string} whiteId 白path ID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} baseGradient ベース色
 * @returns {void}
 */

function setBand(
    baseId,
    whiteId,
    startHour,
    startMinute,
    endHour,
    endMinute,
    baseGradient
){

    const base =
        document.getElementById(
            baseId
        );


    const white =
        document.getElementById(
            whiteId
        );


    if(
        !base ||
        !white
    ){

        console.error(
            `帯要素が見つかりません: ${baseId}`
        );

        return;

    }


    try{

        /*
         * まず青／緑を帯全体に描く。
         *
         * この時点で端まで色が存在する。
         */

        base.setAttribute(
            'd',
            createTimeBand(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        base.style.fill =
            `url(#${baseGradient})`;


        /*
         * 次に白を中央部分だけに描く。
         *
         * 端には白を描かない。
         */

        white.setAttribute(
            'd',
            createWhiteBand(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        white.style.fill =
            'url(#whiteGradient)';

    }

    catch(error){

        console.error(
            `${baseId} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningBand',
    'morningWhite',
    9,
    0,
    12,
    0,
    'blueBaseGradient'
);


/* ==================================================
   訪問診療
   13:30 → 16:30
================================================== */

setBand(
    'visitBand',
    'visitWhite',
    13,
    30,
    16,
    30,
    'greenBaseGradient'
);


/* ==================================================
   午後診
   17:30 → 19:30
================================================== */

setBand(
    'eveningBand',
    'eveningWhite',
    17,
    30,
    19,
    30,
    'blueBaseGradient'
);


/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 日本時間取得に失敗した場合
 *
 * @example
 * getJapanTime();
 */

function getJapanTime(){

    try{

        const parts =
            new Intl.DateTimeFormat(
                'en-US',
                {
                    timeZone:'Asia/Tokyo',

                    hour12:false,

                    hour:'2-digit',
                    minute:'2-digit',
                    second:'2-digit'
                }
            ).formatToParts(
                new Date()
            );


        const result = {};


        parts.forEach(
            part => {

                if(
                    part.type === 'hour' ||
                    part.type === 'minute' ||
                    part.type === 'second'
                ){

                    result[part.type] =
                        Number(part.value);

                }

            }
        );


        if(
            result.hour === 24
        ){

            result.hour = 0;

        }


        if(
            !Number.isInteger(
                result.hour
            ) ||
            !Number.isInteger(
                result.minute
            ) ||
            !Number.isInteger(
                result.second
            )
        ){

            throw new Error(
                '日本時間の取得結果が不正です'
            );

        }


        return result;

    }

    catch(error){

        console.error(
            '日本時間の取得に失敗しました',
            error
        );

        throw error;

    }

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * @returns {void}
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新を停止しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    const secondAngle =
        seconds * 6;


    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * SVGの初期位置は12時方向なので、
     * 時計角度をそのままrotateへ渡す。
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>
