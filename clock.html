<title>服部医院｜担当医・外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    line-height:1.7;

    padding-bottom:
        calc(76px + env(safe-area-inset-bottom));

}


/* ==================================================
   上部タイトル
   index.html と同系統のグラデーション
================================================== */

.page-header{

    position:relative;

    overflow:hidden;

    padding:
        1.15rem
        1rem
        1.35rem;

    text-align:center;

    color:#fff;

    background:

        radial-gradient(
            circle at 90% 15%,
            rgba(255,255,255,.08),
            transparent 30%
        ),

        radial-gradient(
            circle at 15% 85%,
            rgba(120,200,220,.08),
            transparent 45%
        ),

        linear-gradient(
            135deg,
            #20384d 0%,
            #31556e 35%,
            #4d7d98 70%,
            #78b8c4 100%
        );

    box-shadow:
        inset 0 1px rgba(255,255,255,.20),
        inset 0 -25px 40px rgba(0,0,0,.08);

}


/* 上部の淡い光 */

.page-header::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        radial-gradient(
            circle at 85% 12%,
            rgba(255,255,255,.18) 0%,
            rgba(255,255,255,.08) 18%,
            transparent 55%
        );

    pointer-events:none;

}


/* ==================================================
   タイトル
================================================== */

.page-title{

    position:relative;

    z-index:1;

    margin:0;

    font-family:
        "M PLUS Rounded 1c",
        "Noto Sans JP",
        sans-serif;

    font-size:1.35rem;

    font-weight:400;

    letter-spacing:.16em;

    text-shadow:
        0 2px 6px rgba(0,0,0,.22);

}

.page-subtitle{

    position:relative;

    z-index:1;

    margin:.2rem 0 0;

    font-size:.72rem;

    letter-spacing:.1em;

    opacity:.9;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:
        1.35rem
        1.2rem
        2rem;

}


/* ==================================================
   セクション見出し
================================================== */

.section-title{

    width:72%;

    margin:
        .5rem auto
        1.15rem;

    padding:
        .45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.45);

    border-bottom:
        1px solid
        rgba(49,85,110,.45);

    font-size:1.08rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   担当医表
================================================== */

.doctor-table-wrap{

    width:100%;

    overflow:hidden;

    border-radius:10px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);

}


/* ==================================================
   表本体

   index.html の .schedule と同じ思想
================================================== */

.doctor-table{

    width:100%;

    table-layout:fixed;

    border-collapse:separate;

    border-spacing:0;

}


/* --------------------------------------------------
   全セル
-------------------------------------------------- */

.doctor-table th,
.doctor-table td{

    border-bottom:
        1px solid #ddd;

    padding:
        .45rem
        .25rem;

    text-align:center;

    font-size:.92rem;

    line-height:1.3;

}


/* --------------------------------------------------
   曜日
-------------------------------------------------- */

.doctor-table thead th{

    background:#31556e;

    color:#fff;

    font-weight:400;

    padding:
        .42rem
        .2rem;

}


/* 左上セル */

.doctor-table thead th:first-child{

    width:120px;

}


/* --------------------------------------------------
   左側の診療時間
-------------------------------------------------- */

.doctor-table tbody th{

    background:#f2f7f9;

    font-weight:400;

    white-space:nowrap;

    letter-spacing:.03em;

}


/* --------------------------------------------------
   担当医名
-------------------------------------------------- */

.doctor-name{

    display:block;

    min-height:1.35em;

    color:#31556e;

    font-size:.9rem;

    font-weight:500;

}


/* 空欄 */

.doctor-name.empty{

    color:#aaa;

}


/* --------------------------------------------------
   訪問診療
-------------------------------------------------- */

.doctor-table .visit-row th{

    background:#f3f8ef;

}


/* --------------------------------------------------
   最終行
-------------------------------------------------- */

.doctor-table tbody tr:last-child th,
.doctor-table tbody tr:last-child td{

    border-bottom:none;

}


/* ==================================================
   訪問診療の注記
================================================== */

.visit-note{

    margin:
        .7rem 0
        2rem;

    text-align:center;

    font-size:.72rem;

    color:#777;

}


/* ==================================================
   時計＋担当医表レイアウト
================================================== */

.schedule-clock-area{

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        minmax(360px,440px);

    gap:2rem;

    align-items:start;

}


/* ==================================================
   時計
================================================== */

.clock-area{

    width:100%;

}


/* 時計見出し */

.clock-title{

    width:82%;

    margin:
        0 auto
        .8rem;

    padding:
        .4rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1rem;

    font-weight:400;

    letter-spacing:.12em;

}


/* 時計本体 */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


/* SVG */

.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}

.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


/* 12 */

.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}

.clock-hand.hour{

    stroke-width:4;

}

.clock-hand.minute{

    stroke-width:2.5;

}

.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* 中央 */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}

.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   固定ナビ
================================================== */

.bottom-nav{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:1000;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    padding:
        7px
        8px
        calc(7px + env(safe-area-inset-bottom));

    background:
        rgba(255,255,255,.88);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    border-top:
        1px solid
        rgba(49,85,110,.12);

    box-shadow:
        0 -3px 14px
        rgba(40,70,90,.07);

}


/* ナビボタン */

.bottom-nav a{

    display:flex;

    align-items:center;
    justify-content:center;

    min-height:38px;

    color:#31556e;

    text-decoration:none;

    font-size:.7rem;

    border-right:
        1px solid
        rgba(49,85,110,.12);

}


/* 最後 */

.bottom-nav a:last-child{

    border-right:none;

}

   横向きスマートフォン
================================================== */

<script>

/* ==================================================
   担当医データ
   doctors.json を読み込む
================================================== */

fetch('doctors.json', {
    cache: 'no-store'
})

.then(response => {

    if(!response.ok){

        throw new Error(
            'doctors.json を読み込めませんでした'
        );

    }

    return response.json();

})

.then(doctors => {

    document
        .querySelectorAll('.doctor-name[data-day]')
        .forEach(cell => {

            const day =
                cell.dataset.day;

            const time =
                cell.dataset.time;


            let name = '';


            if(time === '訪問診療'){

                name =
                    doctors['訪問診療'] || '';

            }else{

                name =
                    doctors[day]?.[time] || '';

            }


            if(name){

                cell.textContent = name;

            }else{

                cell.textContent = '―';

                cell.classList.add('empty');

            }

        });

})

.catch(error => {

    console.error(error);

    document
        .querySelectorAll('.doctor-name[data-day]')
        .forEach(cell => {

            cell.textContent = '―';

        });

});


/* ==================================================
   時計設定
================================================== */

const SVG_CENTER = 200;

const OUTER_RADIUS = 180;

const INNER_RADIUS = 100;


/* ==================================================
   時刻 → 時計角度

   12時 = 0°

   時計回り
================================================== */

function timeToClockAngle(
    hour,
    minute
){

    return (
        ((hour % 12) * 30)
        +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle * Math.PI / 180;

    return {

        x:
            SVG_CENTER
            +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER
            +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   診療時間帯パス
================================================== */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const startClockAngle =
        timeToClockAngle(
            startHour,
            startMinute
        );

    const endClockAngle =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const startSvgAngle =
        clockToSvgAngle(
            startClockAngle
        );

    const endSvgAngle =
        clockToSvgAngle(
            endClockAngle
        );


    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            startSvgAngle
        );

    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            endSvgAngle
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            endSvgAngle
        );

    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            startSvgAngle
        );


    const angleDifference =
        (
            endClockAngle
            -
            startClockAngle
            +
            360
        ) % 360;


    const largeArcFlag =
        angleDifference > 180
            ? 1
            : 0;


    return `

        M
        ${outerStart.x}
        ${outerStart.y}

        A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}

        L
        ${innerEnd.x}
        ${innerEnd.y}

        A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}

        Z

    `;

}

/* ==================================================
   帯の端を丸くするための
   視覚的な端面処理

   元の帯の角をそのまま残さず、
   円弧の端に小さな円を重ねる。
================================================== */

function addRoundedCap(
    group,
    hour,
    minute,
    radius,
    color
){

    const clockAngle =
        timeToClockAngle(
            hour,
            minute
        );

    const svgAngle =
        clockToSvgAngle(
            clockAngle
        );

    const point =
        polarToPoint(
            radius,
            svgAngle
        );

    const cap =
        document.createElementNS(
            'http://www.w3.org/2000/svg',
            'circle'
        );

    cap.setAttribute(
        'cx',
        point.x
    );

    cap.setAttribute(
        'cy',
        point.y
    );

    cap.setAttribute(
        'r',
        40
    );

    cap.setAttribute(
        'fill',
        color
    );

    cap.setAttribute(
        'opacity',
        '.32'
    );

    group.appendChild(cap);

}


/* ==================================================
   現在時刻

   ★日本時間固定

   Intl.DateTimeFormat の
   Asia/Tokyo を使用する。

   海外のiPhoneでも
   端末の現地時間ではなく
   日本時間を取得する。
================================================== */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',

                hour12:false,

                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    parts.forEach(
        part => {

            if(
                part.type === 'hour' ||
                part.type === 'minute' ||
                part.type === 'second'
            ){

                result[part.type] =
                    Number(part.value);

            }

        }
    );


    return result;

}


/* ==================================================
   時計を更新
================================================== */

function updateClock(){

    const now =
        getJapanTime();


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /* 秒針 */

    const secondAngle =
        seconds * 6;


    /* 分針 */

    const minuteAngle =
        (
            minutes
            +
            seconds / 60
        ) * 6;


    /* 時針 */

    const hourAngle =
        (
            (hours % 12)
            +
            minutes / 60
            +
            seconds / 3600
        ) * 30;


    /* SVG角度 */

    const secondSvgAngle =
        clockToSvgAngle(
            secondAngle
        );

    const minuteSvgAngle =
        clockToSvgAngle(
            minuteAngle
        );

    const hourSvgAngle =
        clockToSvgAngle(
            hourAngle
        );


    /* 秒針 */

    document
        .querySelector(
            '.clock-hand.second'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${secondSvgAngle},
                200,
                200
            )`
        );


    /* 分針 */

    document
        .querySelector(
            '.clock-hand.minute'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${minuteSvgAngle},
                200,
                200
            )`
        );


    /* 時針 */

    document
        .querySelector(
            '.clock-hand.hour'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${hourSvgAngle},
                200,
                200
            )`
        );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();
