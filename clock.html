<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン

   時計だけを中央に配置する。
   ページ全体に不要な余白や他コンテンツを
   持たせないため、単純な構造にしている。
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:
        1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   時計見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:
        .45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


/* ==================================================
   SVG
================================================== */

.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}

.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


/* 12 */

.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}

.clock-hand.hour{

    stroke-width:4;

}

.clock-hand.minute{

    stroke-width:2.5;

}

.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}

.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:
            .7rem;

    }


    .clock-area{

        max-width:520px;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向きスマートフォン
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:
            .5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

</head>


<body>


<main class="page-main">


<!-- ==================================================
     時計
================================================== -->

<section class="clock-area">

<h1 class="clock-title">
    外来診療時間
</h1>


<div class="time-ring">

<svg
    viewBox="0 0 400 400"
    role="img"
    aria-label="服部医院 外来診療時間"
>

<defs>


<!-- ==================================================
     外来診療グラデーション

     午前診・午後診で使用。
================================================== -->

<radialGradient
    id="outpatientGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="52%"
        stop-color="#8fc7ff"
        stop-opacity=".30"
    />

    <stop
        offset="59%"
        stop-color="#3d8bdc"
        stop-opacity=".62"
    />

    <stop
        offset="64%"
        stop-color="#3d8bdc"
        stop-opacity=".72"
    />

    <stop
        offset="68%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="72%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="76%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="80%"
        stop-color="#3d8bdc"
        stop-opacity=".68"
    />

    <stop
        offset="88%"
        stop-color="#3d8bdc"
        stop-opacity=".76"
    />

    <stop
        offset="100%"
        stop-color="#3d8bdc"
        stop-opacity=".80"
    />

</radialGradient>


<!-- ==================================================
     訪問診療グラデーション
================================================== -->

<radialGradient
    id="visitGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="68%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="73%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="77%"
        stop-color="#b7e88a"
        stop-opacity=".52"
    />

    <stop
        offset="82%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

    <stop
        offset="87%"
        stop-color="#70ad47"
        stop-opacity=".80"
    />

    <stop
        offset="91%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="95%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="100%"
        stop-color="#70ad47"
        stop-opacity=".82"
    />

</radialGradient>


</defs>


<!-- ==================================================
     時計盤
================================================== -->

<circle
    class="clock-disc"
    cx="200"
    cy="200"
    r="174"
/>


<!-- ==================================================
     外周
================================================== -->

<circle
    class="outer-ring"
    cx="200"
    cy="200"
    r="180"
/>


<!-- ==================================================
     午前診
     
     9:00 → 12:00
================================================== -->

<path
    id="morningBand"
    class="time-band"
/>


<!-- ==================================================
     訪問診療
     
     13:30 → 16:30
================================================== -->

<path
    id="visitBand"
    class="time-band"
/>


<!-- ==================================================
     午後診
     
     17:30 → 19:30
================================================== -->

<path
    id="eveningBand"
    class="time-band"
/>


<!-- ==================================================
     文字盤
================================================== -->

<g class="clock-face">

<text
    class="twelve"
    x="200"
    y="62"
>
    12
</text>

<text x="269" y="80">1</text>

<text x="319" y="130">2</text>

<text x="338" y="200">3</text>

<text x="319" y="270">4</text>

<text x="269" y="320">5</text>

<text x="200" y="338">6</text>

<text x="131" y="320">7</text>

<text x="81" y="270">8</text>

<text x="62" y="200">9</text>

<text x="81" y="130">10</text>

<text x="131" y="80">11</text>

</g>


<!-- ==================================================
     時計の針
================================================== -->

<line
    class="clock-hand hour"
    x1="200"
    y1="200"
    x2="200"
    y2="125"
/>


<line
    class="clock-hand minute"
    x1="200"
    y1="200"
    x2="200"
    y2="108"
/>


<line
    class="clock-hand second"
    x1="200"
    y1="200"
    x2="200"
    y2="92"
/>


<!-- ==================================================
     中央
================================================== -->

<circle
    class="clock-center"
    cx="200"
    cy="200"
    r="7"
/>


<circle
    class="clock-dot"
    cx="200"
    cy="200"
    r="3"
/>


</svg>

</div>

</section>


</main>


<script>

/* ==================================================
   時計設定

   SVGの中心を200,200に統一する。
   帯の内外周も同じ中心を使うことで、
   円弧の軸がずれないようにする。
================================================== */

const SVG_CENTER = 200;

const OUTER_RADIUS = 180;

const INNER_RADIUS = 100;


/* ==================================================
   時刻 → 時計角度

   12時 = 0°
   時計回りに増加する。

   例：
   3時  = 90°
   6時  = 180°
   9時  = 270°
================================================== */

function timeToClockAngle(
    hour,
    minute
){

    return (
        ((hour % 12) * 30)
        +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度

   SVGでは0°が3時方向になるため、
   90°ずらして12時を上にする。
================================================== */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   極座標 → SVG座標

   円周上の位置をSVG座標へ変換する。
================================================== */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle * Math.PI / 180;

    return {

        x:
            SVG_CENTER
            +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER
            +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   診療時間帯パスを作成

   外周 → 終点 → 内周 → 始点
   の順に閉じた扇形リングを作る。

   180°を超える場合は
   SVGのlarge-arc-flagを1にする。
================================================== */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const startClockAngle =
        timeToClockAngle(
            startHour,
            startMinute
        );

    const endClockAngle =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const startSvgAngle =
        clockToSvgAngle(
            startClockAngle
        );

    const endSvgAngle =
        clockToSvgAngle(
            endClockAngle
        );


    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            startSvgAngle
        );

    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            endSvgAngle
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            endSvgAngle
        );

    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            startSvgAngle
        );


    const angleDifference =
        (
            endClockAngle
            -
            startClockAngle
            +
            360
        ) % 360;


    const largeArcFlag =
        angleDifference > 180
            ? 1
            : 0;


    return `

        M
        ${outerStart.x}
        ${outerStart.y}

        A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}

        L
        ${innerEnd.x}
        ${innerEnd.y}

        A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}

        Z

    `;

}


/* ==================================================
   診療時間帯を設定

   午前診：
   9:00 → 12:00

   訪問診療：
   13:30 → 16:30

   午後診：
   17:30 → 19:30
================================================== */

document
    .getElementById('morningBand')
    .setAttribute(
        'd',
        createBandPath(
            9,
            0,
            12,
            0
        )
    );


document
    .getElementById('visitBand')
    .setAttribute(
        'd',
        createBandPath(
            13,
            30,
            16,
            30
        )
    );


document
    .getElementById('eveningBand')
    .setAttribute(
        'd',
        createBandPath(
            17,
            30,
            19,
            30
        )
    );


/* ==================================================
   帯の色
================================================== */

document
    .getElementById('morningBand')
    .style.fill =
        'url(#outpatientGradient)';


document
    .getElementById('eveningBand')
    .style.fill =
        'url(#outpatientGradient)';


document
    .getElementById('visitBand')
    .style.fill =
        'url(#visitGradient)';


/* ==================================================
   現在時刻を日本時間で取得

   海外からアクセスしても
   Asia/Tokyoを基準にする。
================================================== */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',

                hour12:false,

                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    parts.forEach(
        part => {

            if(
                part.type === 'hour' ||
                part.type === 'minute' ||
                part.type === 'second'
            ){

                result[part.type] =
                    Number(part.value);

            }

        }
    );


    return result;

}


/* ==================================================
   時計更新

   秒・分・時針を現在時刻に合わせて
   滑らかに動かす。
================================================== */

function updateClock(){

    const now =
        getJapanTime();


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /* 秒針 */

    const secondAngle =
        seconds * 6;


    /* 分針 */

    const minuteAngle =
        (
            minutes
            +
            seconds / 60
        ) * 6;


    /* 時針 */

    const hourAngle =
        (
            (hours % 12)
            +
            minutes / 60
            +
            seconds / 3600
        ) * 30;


    /* SVG角度 */

    const secondSvgAngle =
        clockToSvgAngle(
            secondAngle
        );

    const minuteSvgAngle =
        clockToSvgAngle(
            minuteAngle
        );

    const hourSvgAngle =
        clockToSvgAngle(
            hourAngle
        );


    /* 秒針 */

    document
        .querySelector(
            '.clock-hand.second'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${secondSvgAngle},
                200,
                200
            )`
        );


    /* 分針 */

    document
        .querySelector(
            '.clock-hand.minute'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${minuteSvgAngle},
                200,
                200
            )`
        );


    /* 時針 */

    document
        .querySelector(
            '.clock-hand.hour'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${hourSvgAngle},
                200,
                200
            )`
        );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>


</body>

</html>
