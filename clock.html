<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/*
 * 色の土台。
 *
 * 白い部分を抜くのではなく、
 * まず青・緑で完全な帯を作る。
 */

.band-base{

    stroke:none;

}


/*
 * 中央の白い面。
 *
 * この面は「穴」ではない。
 * 白で塗られた完全な面なので、
 * 中が抜けることがない。
 */

.band-inner{

    fill:#fff;

    stroke:none;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

</head>

<defs>


<!-- ==================================================

================================================== -->

<!-- ==================================================

<g class="clock-face">

<text

    12

<!-- ==================================================

================================================== -->

<line

</svg>

</div>

</section>

</main>


<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;


/*
 * 外周。
 */

const OUTER_RADIUS = 180;


/*
 * 内周。
 *
 * これまでと同じ100。
 */

const INNER_RADIUS = 100;


/*
 * 帯の角丸。
 */

const CORNER_RADIUS = 10;


/*
 * --------------------------------------------------
 * 白い中央部分
 * --------------------------------------------------
 *
 * 外側・内側の青/緑を残すため、
 * 白い面は元の帯より内側にする。
 *
 * これが「袋とじ」の色を残すポイント。
 */

const INNER_OUTER_RADIUS = 164;

const INNER_INNER_RADIUS = 116;


/*
 * --------------------------------------------------
 * 両端の青/緑を残す角度
 * --------------------------------------------------
 *
 * 白い面を時間帯の端まで伸ばさない。
 *
 * これによって
 *
 *     〔 白 〕
 *
 * の「〔」と「〕」を
 * 青/緑の面そのもので作る。
 */

const END_CAP_ANGLE = 2.5;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度
 * @throws {TypeError} 数値以外の場合
 * @throws {RangeError} 分が不正な場合
 *
 * @example
 * timeToClockAngle(9, 0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30) +
        minute * .5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   角度正規化
================================================== */

/**
 * 角度を0〜360°へ正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化された角度
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 極座標をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} SVG座標
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   円環パス
================================================== */

/**
 * 指定した時間範囲の円環を作る。
 *
 * @param {number} startAngle 開始角度
 * @param {number} endAngle 終了角度
 * @param {number} outerRadius 外周半径
 * @param {number} innerRadius 内周半径
 * @returns {string} SVG path
 * @throws {RangeError} 角度範囲が不正な場合
 */

function createRingPath(
    startAngle,
    endAngle,
    outerRadius,
    innerRadius
){

    const sweep =
        normalizeAngle(
            endAngle -
            startAngle
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '円環の角度範囲が不正です'
        );

    }


    const outerStart =
        polarToPoint(
            outerRadius,
            clockToSvgAngle(
                startAngle
            )
        );


    const outerEnd =
        polarToPoint(
            outerRadius,
            clockToSvgAngle(
                endAngle
            )
        );


    const innerEnd =
        polarToPoint(
            innerRadius,
            clockToSvgAngle(
                endAngle
            )
        );


    const innerStart =
        polarToPoint(
            innerRadius,
            clockToSvgAngle(
                startAngle
            )
        );


    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    return [

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        `A
        ${outerRadius}
        ${outerRadius}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        `L
        ${innerEnd.x}
        ${innerEnd.y}`,

        `A
        ${innerRadius}
        ${innerRadius}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================
   角丸付き時間帯
================================================== */

/**
 * 時間帯の外形を作る。
 *
 * ここでは帯全体を青/緑で完全に閉じる。
 * 白部分は後から内側へ重ねるため、
 * 外形の色が両端に残る。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '時間帯の範囲が不正です'
        );

    }


    /*
     * 角丸は外形そのものに適用。
     */

    const radius =
        Math.min(
            CORNER_RADIUS,
            (
                OUTER_RADIUS -
                INNER_RADIUS
            ) / 2 -
            .5
        );


    const outerCenterRadius =
        OUTER_RADIUS -
        radius;


    const innerCenterRadius =
        INNER_RADIUS +
        radius;


    const outerOffset =
        Math.asin(
            radius /
            outerCenterRadius
        ) *
        180 /
        Math.PI;


    const innerOffset =
        Math.asin(
            radius /
            innerCenterRadius
        ) *
        180 /
        Math.PI;


    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                start +
                outerOffset
            )
        );


    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                end -
                outerOffset
            )
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                end -
                innerOffset
            )
        );


    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                start +
                innerOffset
            )
        );


    const outerStartTangentRadius =
        outerCenterRadius *
        Math.cos(
            outerOffset *
            Math.PI /
            180
        );


    const innerStartTangentRadius =
        innerCenterRadius *
        Math.cos(
            innerOffset *
            Math.PI /
            180
        );


    const outerStartTangent =
        polarToPoint(
            outerStartTangentRadius,
            clockToSvgAngle(start)
        );


    const innerStartTangent =
        polarToPoint(
            innerStartTangentRadius,
            clockToSvgAngle(start)
        );


    const outerEndTangent =
        polarToPoint(
            outerStartTangentRadius,
            clockToSvgAngle(end)
        );


    const innerEndTangent =
        polarToPoint(
            innerStartTangentRadius,
            clockToSvgAngle(end)
        );


    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    return [

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        `A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerEndTangent.x}
        ${outerEndTangent.y}`,

        `L
        ${innerEndTangent.x}
        ${innerEndTangent.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerEnd.x}
        ${innerEnd.y}`,

        `A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerStartTangent.x}
        ${innerStartTangent.y}`,

        `L
        ${outerStartTangent.x}
        ${outerStartTangent.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerStart.x}
        ${outerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================
   時間帯を描画
================================================== */

/**
 * 色付きの完全な帯と、
 * その内側の白い面を描画する。
 *
 * 白い面は帯を貫通しないため、
 * 両端に色が残る。
 *
 * @param {string} baseId 外側パスID
 * @param {string} innerId 白い面ID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} gradient グラデーションID
 * @returns {void}
 */

function setBand(
    baseId,
    innerId,
    startHour,
    startMinute,
    endHour,
    endMinute,
    gradient
){

    const base =
        document.getElementById(
            baseId
        );


    const inner =
        document.getElementById(
            innerId
        );


    if(
        !base ||
        !inner
    ){

        console.error(
            '時間帯用SVG要素が見つかりません'
        );

        return;

    }


    try{

        const start =
            timeToClockAngle(
                startHour,
                startMinute
            );


        const end =
            timeToClockAngle(
                endHour,
                endMinute
            );


        /*
         * ------------------------------------------------
         * ① 外側
         *
         * 青/緑の完全な帯。
         *
         * これが「袋」の本体。
         * ------------------------------------------------
         */

        base.setAttribute(
            'd',
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        base.style.fill =
            `url(#${gradient})`;


        /*
         * ------------------------------------------------
         * ② 内側
         *
         * 白い面。
         *
         * 外周にも内周にも届かせない。
         *
         * さらに始点・終点にも届かせない。
         *
         * したがって色が四方に残る。
         * ------------------------------------------------
         */

        const innerStart =
            start +
            END_CAP_ANGLE;


        const innerEnd =
            end -
            END_CAP_ANGLE;


        inner.setAttribute(
            'd',
            createRingPath(
                innerStart,
                innerEnd,
                INNER_OUTER_RADIUS,
                INNER_INNER_RADIUS
            )
        );


        /*
         * 白は「穴」ではなく、
         * 実際に塗りつぶされた面。
         */

        inner.style.fill =
            '#fff';

    }

    catch(error){

        console.error(
            `${baseId} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningBase',
    'morningInner',
    9,
    0,
    12,
    0,
    'blueGradient'
);


/* ==================================================
   訪問診療
   13:30 → 16:30
================================================== */

setBand(
    'visitBase',
    'visitInner',
    13,
    30,
    16,
    30,
    'greenGradient'
);


/* ==================================================
   午後診
   17:30 → 19:30
================================================== */

setBand(
    'eveningBase',
    'eveningInner',
    17,
    30,
    19,
    30,
    'blueGradient'
);


/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 日本時間取得結果が不正な場合
 *
 * @example
 * getJapanTime();
 */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',

                hour12:false,

                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    parts.forEach(
        part => {

            if(
                part.type === 'hour' ||
                part.type === 'minute' ||
                part.type === 'second'
            ){

                result[part.type] =
                    Number(part.value);

            }

        }
    );


    /*
     * 午前0時が24になる環境への対策。
     */

    if(
        result.hour === 24
    ){

        result.hour = 0;

    }


    if(
        !Number.isInteger(result.hour) ||
        !Number.isInteger(result.minute) ||
        !Number.isInteger(result.second)
    ){

        throw new Error(
            '日本時間の取得結果が不正です'
        );

    }


    return result;

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * @returns {void}
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新エラー',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針。
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針。
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針。
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * 針はSVG上で12時位置を基準に
     * 時計回りへ回転させる。
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>
