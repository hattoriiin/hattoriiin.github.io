/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

/* ==================================================
   メイン
================================================== */

.page-main{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}

   スマートフォン縦

<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;


/*
 * 外周半径。
 *
 * 時間帯の外側を固定する。
 */

const OUTER_RADIUS = 180;


/*
 * 内周半径。
 *
 * 時間帯の内側を固定する。
 */

const INNER_RADIUS = 100;


/*
 * 端の丸み。
 *
 * 端面を完全に閉じながら、
 * 4隅だけを丸くする。
 */

const CORNER_RADIUS = 10;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度
 * @throws {TypeError} 数値でない場合
 * @throws {RangeError} 分が不正な場合
 *
 * @example
 * timeToClockAngle(9,0);
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30) +
        minute * .5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   正規化
================================================== */

/**
 * 角度を0〜360°へ正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化された角度
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標
================================================== */

/**
 * 極座標をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} 座標
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   時計座標
================================================== */

/**
 * 時計角度から座標を取得する。
 *
 * @param {number} radius 半径
 * @param {number} clockAngle 時計角度
 * @returns {{x:number,y:number}} 座標
 */

function clockPoint(
    radius,
    clockAngle
){

    return polarToPoint(
        radius,
        clockToSvgAngle(
            clockAngle
        )
    );

}


/* ==================================================
   完全な袋とじ時間帯
================================================== */

/**
 * 外周・内周・始点端面・終点端面を
 * すべて一つの閉じたパスとして生成する。
 *
 * 端面は放射方向の直線として存在し、
 * 外周と内周への接続部分だけを
 * 円弧フィレットで丸める。
 *
 * これにより「端がない」問題を防ぐ。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 * @throws {RangeError} 時間範囲が不正な場合
 *
 * @example
 * createBandPath(9,0,12,0);
 */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '開始時刻と終了時刻の角度が不正です'
        );

    }


    /*
     * 帯幅80pxに対して
     * 角丸は最大10px。
     */

    const r =
        Math.min(
            CORNER_RADIUS,
            (OUTER_RADIUS - INNER_RADIUS) / 2 - 1
        );


    /*
     * ==================================================
     * 端面の「丸み」を作るための
     * フィレット中心半径
     * ==================================================
     */

    const outerFilletRadius =
        OUTER_RADIUS - r;


    const innerFilletRadius =
        INNER_RADIUS + r;


    /*
     * ==================================================
     * 外周側フィレットの接線角
     * ==================================================
     */

    const outerDelta =
        Math.asin(
            r /
            outerFilletRadius
        ) *
        180 /
        Math.PI;


    /*
     * ==================================================
     * 内周側フィレットの接線角
     * ==================================================
     */

    const innerDelta =
        Math.asin(
            r /
            innerFilletRadius
        ) *
        180 /
        Math.PI;


    /*
     * ==================================================
     * 外周の接点
     * ==================================================
     */

    const outerStart =
        clockPoint(
            OUTER_RADIUS,
            start + outerDelta
        );


    const outerEnd =
        clockPoint(
            OUTER_RADIUS,
            end - outerDelta
        );


    /*
     * ==================================================
     * 内周の接点
     * ==================================================
     */

    const innerEnd =
        clockPoint(
            INNER_RADIUS,
            end - innerDelta
        );


    const innerStart =
        clockPoint(
            INNER_RADIUS,
            start + innerDelta
        );


    /*
     * ==================================================
     * 端面上の接点
     *
     * ここで「端」を明確に作る。
     * ==================================================
     */

    const outerStartEnd =
        clockPoint(
            outerFilletRadius *
            Math.cos(
                outerDelta *
                Math.PI /
                180
            ),
            start
        );


    const innerStartEnd =
        clockPoint(
            innerFilletRadius *
            Math.cos(
                innerDelta *
                Math.PI /
                180
            ),
            start
        );


    const outerEndEnd =
        clockPoint(
            outerFilletRadius *
            Math.cos(
                outerDelta *
                Math.PI /
                180
            ),
            end
        );


    const innerEndEnd =
        clockPoint(
            innerFilletRadius *
            Math.cos(
                innerDelta *
                Math.PI /
                180
            ),
            end
        );


    /*
     * ==================================================
     * 大円弧フラグ
     * ==================================================
     */

    const largeArc =
        sweep > 180
            ? 1
            : 0;


    /*
     * ==================================================
     * パス
     *
     * 重要なのは
     *
     * outerEnd
     * ↓
     * outerEndEnd
     * ↓
     * innerEndEnd
     * ↓
     * innerEnd
     *
     * という「終点端面」が
     * 実際に存在していること。
     *
     * 始点側も同様。
     * ==================================================
     */

    const path = [

        /*
         * 外周開始
         */

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        /*
         * 外周円弧
         */

        `A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArc}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        /*
         * 終点外側フィレット
         */

        `A
        ${r}
        ${r}
        0
        0
        1
        ${outerEndEnd.x}
        ${outerEndEnd.y}`,

        /*
         * 終点端面
         *
         * ここが袋とじ本体。
         */

        `L
        ${innerEndEnd.x}
        ${innerEndEnd.y}`,

        /*
         * 終点内側フィレット
         */

        `A
        ${r}
        ${r}
        0
        0
        1
        ${innerEnd.x}
        ${innerEnd.y}`,

        /*
         * 内周円弧
         */

        `A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArc}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        /*
         * 始点内側フィレット
         */

        `A
        ${r}
        ${r}
        0
        0
        1
        ${innerStartEnd.x}
        ${innerStartEnd.y}`,

        /*
         * 始点端面
         *
         * ここも完全に閉じる。
         */

        `L
        ${outerStartEnd.x}
        ${outerStartEnd.y}`,

        /*
         * 始点外側フィレット
         */

        `A
        ${r}
        ${r}
        0
        0
        1
        ${outerStart.x}
        ${outerStart.y}`,

        /*
         * 完全に閉じる。
         */

        'Z'

    ].join(' ');


    return path;

}


/* ==================================================
   帯設定
================================================== */

/**
 * SVG時間帯へパスとグラデーションを設定する。
 *
 * @param {string} id SVG要素ID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} gradient グラデーションID
 * @returns {void}
 *
 * @example
 * setBand(
 *     'morningBand',
 *     9,0,
 *     12,0,
 *     'outpatientGradient'
 * );
 */

function setBand(
    id,
    startHour,
    startMinute,
    endHour,
    endMinute,
    gradient
){

    const element =
        document.getElementById(id);


    if(!element){

        console.error(
            `SVG要素 ${id} が見つかりません`
        );

        return;

    }


    try{

        const path =
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            );


        element.setAttribute(
            'd',
            path
        );


        /*
         * 袋とじ部分を別要素にせず、
         * 同じパスに同じグラデーションを
         * 適用する。
         *
         * これにより端だけ濃くならない。
         */

        element.setAttribute(
            'fill',
            `url(#${gradient})`
        );

    }

    catch(error){

        console.error(
            `${id} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningBand',
    9,
    0,
    12,
    0,
    'outpatientGradient'
);


/* ==================================================
   訪問診療
   13:30 → 16:30
================================================== */

setBand(
    'visitBand',
    13,
    30,
    16,
    30,
    'visitGradient'
);


/* ==================================================
   午後診
   17:30 → 19:30
================================================== */

setBand(
    'eveningBand',
    17,
    30,
    19,
    30,
    'outpatientGradient'
);


/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 時刻取得に失敗した場合
 *
 * @example
 * getJapanTime();
 */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',

                hour12:false,

                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    for(
        const part
        of parts
    ){

        if(
            part.type === 'hour' ||
            part.type === 'minute' ||
            part.type === 'second'
        ){

            result[part.type] =
                Number(part.value);

        }

    }


    if(
        result.hour === 24
    ){

        result.hour = 0;

    }


    if(
        !Number.isInteger(result.hour) ||
        !Number.isInteger(result.minute) ||
        !Number.isInteger(result.second)
    ){

        throw new Error(
            '日本時間の取得結果が不正です'
        );

    }


    return result;

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * @returns {void}
 *
 * @example
 * updateClock();
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新に失敗しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * 元の針は12時方向を向いているため、
     * 時計角度をそのまま回転角として使う。
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>
