<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Clock</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#f5f5f5;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
}


/* =========================
   時計
========================= */

.clock{

    position:relative;

    width:min(82vw,420px);

    aspect-ratio:1;

    border-radius:50%;

    background:#fff;

    border:1px solid #ddd;

    box-shadow:
        0 12px 35px rgba(0,0,0,.08);

}


/* =========================
   数字
========================= */

.number{

    position:absolute;

    left:50%;
    top:50%;

    font-size:1.1rem;

    color:#222;

    transform:
        translate(-50%,-50%);

}


/* 数字の位置 */

.n12{
    transform:
        translate(-50%,-50%)
        translateY(-170px);
}

.n1{
    transform:
        translate(-50%,-50%)
        translate(85px,-147px);
}

.n2{
    transform:
        translate(-50%,-50%)
        translate(147px,-85px);
}

.n3{
    transform:
        translate(-50%,-50%)
        translateX(170px);
}

.n4{
    transform:
        translate(-50%,-50%)
        translate(147px,85px);
}

.n5{
    transform:
        translate(-50%,-50%)
        translate(85px,147px);
}

.n6{
    transform:
        translate(-50%,-50%)
        translateY(170px);
}

.n7{
    transform:
        translate(-50%,-50%)
        translate(-85px,147px);
}

.n8{
    transform:
        translate(-50%,-50%)
        translate(-147px,85px);
}

.n9{
    transform:
        translate(-50%,-50%)
        translateX(-170px);
}

.n10{
    transform:
        translate(-50%,-50%)
        translate(-147px,-85px);
}

.n11{
    transform:
        translate(-50%,-50%)
        translate(-85px,-147px);
}


/* =========================
   針
========================= */

.hand{

    position:absolute;

    left:50%;
    top:50%;

    transform-origin:
        50% 100%;

    border-radius:10px;

}


/* 時針 */

.hour{

    width:7px;

    height:25%;

    margin-left:-3.5px;

    margin-top:-25%;

    background:#222;

}


/* 分針 */

.minute{

    width:4px;

    height:34%;

    margin-left:-2px;

    margin-top:-34%;

    background:#222;

}


/* 秒針 */

.second{

    width:2px;

    height:40%;

    margin-left:-1px;

    margin-top:-40%;

    background:#777;

}


/* =========================
   中央
========================= */

.center{

    position:absolute;

    left:50%;
    top:50%;

    width:12px;
    height:12px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#222;

    z-index:10;

}

</style>

</head>


<body>


<div class="clock">


    <div class="number n12">12</div>
    <div class="number n1">1</div>
    <div class="number n2">2</div>
    <div class="number n3">3</div>
    <div class="number n4">4</div>
    <div class="number n5">5</div>
    <div class="number n6">6</div>
    <div class="number n7">7</div>
    <div class="number n8">8</div>
    <div class="number n9">9</div>
    <div class="number n10">10</div>
    <div class="number n11">11</div>


    <div
        class="hand hour"
        id="hourHand">
    </div>


    <div
        class="hand minute"
        id="minuteHand">
    </div>


    <div
        class="hand second"
        id="secondHand">
    </div>


    <div class="center"></div>


</div>


<script>

function updateClock(){

    const now = new Date();

    const hours =
        now.getHours();

    const minutes =
        now.getMinutes();

    const seconds =
        now.getSeconds();

    const milliseconds =
        now.getMilliseconds();


    /* =========================
       時針
    ========================= */

    const hourAngle =
        (hours % 12) * 30
        +
        minutes * 0.5
        +
        seconds / 120;


    /* =========================
       分針
    ========================= */

    const minuteAngle =
        minutes * 6
        +
        seconds * 0.1;


    /* =========================
       秒針
    ========================= */

    const secondAngle =
        seconds * 6
        +
        milliseconds * 0.006;


    document
        .getElementById("hourHand")
        .style.transform =
        `rotate(${hourAngle}deg)`;


    document
        .getElementById("minuteHand")
        .style.transform =
        `rotate(${minuteAngle}deg)`;


    document
        .getElementById("secondHand")
        .style.transform =
        `rotate(${secondAngle}deg)`;

}


/* 連続更新 */

function animate(){

    updateClock();

    requestAnimationFrame(animate);

}

animate();

</script>


</body>

</html>
