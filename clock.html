<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

<title>服部医院｜診療時間</title>

<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    line-height:1.7;

}


/* ==================================================
   ページ
================================================== */

.clock-page{

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:
        2rem
        1.2rem
        4rem;

}


/* ==================================================
   タイトル
================================================== */

.clock-title{

    margin:0;

    text-align:center;

    font-size:1.45rem;

    font-weight:400;

    letter-spacing:.16em;

    color:#31556e;

}

.clock-subtitle{

    margin:.35rem 0 1.8rem;

    text-align:center;

    font-size:.78rem;

    color:#777;

    letter-spacing:.08em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        92vw,
        520px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


/* ==================================================
   SVG

   時計の中心はすべて

       cx = 200
       cy = 200

   に統一。
================================================== */

.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   診療時間帯
================================================== */

.time-band{

    /*
       外周半径：
       180

       内周半径：
       100

       帯幅：
       80

       中心：
       200,200
    */

    stroke-width:3;

    stroke-linejoin:round;

}


/* ==================================================
   外来診療
================================================== */

.outpatient-band{

    fill:url(#outpatientGradient);

    opacity:.35;

    stroke:
        rgba(255,255,255,.35);

}


/* ==================================================
   訪問診療
================================================== */

.visit-band{

    fill:url(#visitGradient);

    opacity:.35;

    stroke:
        rgba(255,255,255,.35);

}


/* ==================================================
   時計の数字
================================================== */

.clock-face{

    pointer-events:none;

}

.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

    letter-spacing:0;

}


/* 12だけ少し存在感 */

.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}

.clock-hand.hour{

    stroke-width:4;

}

.clock-hand.minute{

    stroke-width:2.5;

}

.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    stroke-linecap:round;

    opacity:.16;

}


/* ==================================================
   中央点
================================================== */

.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   説明カード
================================================== */

.schedule-note{

    max-width:520px;

    margin:1.8rem auto 0;

    padding:1rem 1.2rem;

    background:
        rgba(245,250,250,.72);

    border-radius:14px;

    box-shadow:
        0 4px 14px
        rgba(40,80,80,.06);

}


/* ==================================================
   凡例
================================================== */

.legend{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:1.5rem;

    flex-wrap:wrap;

    font-size:.82rem;

    color:#555;

}

.legend-item{

    display:flex;

    align-items:center;

    gap:.45rem;

}


/* ==================================================
   凡例：外来
================================================== */

.legend-blue{

    width:12px;

    height:12px;

    border-radius:50%;

    background:#3d8bdc;

    opacity:.35;

/* ==================================================
   凡例：訪問
================================================== */

/* ==================================================
   診療時間文字
================================================== */

.schedule-times{

    text-align:center;

    font-size:.82rem;

    line-height:1.9;

    color:#555;

}

.schedule-times strong{

    font-weight:500;

    color:#31556e;

}


/* ==================================================
   戻る
================================================== */

.back-link{

    display:block;

    width:max-content;

    margin:2rem auto 0;

    padding:.55rem 1.3rem;

    border-radius:20px;

    background:#31556e;

    text-decoration:none;

/* ==================================================
   スマートフォン
================================================== */

/* ==================================================
   小さいスマートフォン
================================================== */

@media(max-width:380px){

    .clock-face text{

        font-size:27px;

    }

    .clock-face .twelve{

    }

}

</style>

<script>

/* ==================================================
   ⭐ 時計設定

   ここを基準にする。

   12:00 = 0°

   時計回りに

   1時  = 30°
   3時  = 90°
   6時  = 180°
   9時  = 270°

   SVGでは

   3時方向 = 0°

   なので

   SVG角度 =
       時計角度 - 90°
================================================== */

const SVG_CENTER = 200;

const OUTER_RADIUS = 180;

const INNER_RADIUS = 100;


/* ==================================================
   ⭐ 時刻 → 時計角度

   12:00を0°とする。

   例：

   09:00 → 270°
   12:00 → 0°
   13:30 → 45°
   17:00 → 150°
   17:30 → 165°
   19:30 → 225°
================================================== */

function timeToClockAngle(hour, minute){

    return (
        ((hour % 12) * 30)
        + (minute * 0.5)
    ) % 360;

}


/* ==================================================
   ⭐ 時計角度 → SVG角度

   SVGは3時方向が0°。

   時計の12時方向を
   SVGの-90°へ移動する。
================================================== */

function clockToSvgAngle(clockAngle){

    return clockAngle - 90;

}


/* ==================================================
   ⭐ 極座標 → SVG座標

   中心：
   200,200
================================================== */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle * Math.PI / 180;

    return {

        x:
            SVG_CENTER
            + radius * Math.cos(radians),

        y:
            SVG_CENTER
            + radius * Math.sin(radians)

    };

}


/* ==================================================
   ⭐ 診療時間帯のパスを自動生成

   start：
   診療開始時刻

   end：
   診療終了時刻

   これにより、
   座標を手計算する必要がなくなる。
================================================== */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const startClockAngle =
        timeToClockAngle(
            startHour,
            startMinute
        );

    const endClockAngle =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const startSvgAngle =
        clockToSvgAngle(
            startClockAngle
        );

    const endSvgAngle =
        clockToSvgAngle(
            endClockAngle
        );


    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            startSvgAngle
        );

    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            endSvgAngle
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            endSvgAngle
        );

    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            startSvgAngle
        );


    /*
       時計回りの角度差。

       0〜360°に正規化。
    */

    const angleDifference =
        (
            endClockAngle
            - startClockAngle
            + 360
        ) % 360;


    /*
       180°を超える場合だけ
       SVGのlarge-arc-flagを1にする。

       今回は

       午前診：90°
       訪問診療：105°
       午後診：60°

       なので全て0。
    */

    const largeArcFlag =
        angleDifference > 180
            ? 1
            : 0;


    return `

        M
        ${outerStart.x}
        ${outerStart.y}

        A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}

        L
        ${innerEnd.x}
        ${innerEnd.y}

        A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}

        Z

    `;

}


/* ==================================================
   ⭐ 診療時間帯を生成
================================================== */


/* --------------------------------------------------
   午前診

   9:00 → 12:00
-------------------------------------------------- */

document
    .getElementById('morningBand')
    .setAttribute(
        'd',
        createBandPath(
            9,
            0,
            12,
            0
        )
    );


/* --------------------------------------------------
   訪問診療

   13:30 → 16:30
-------------------------------------------------- */

document
    .getElementById('visitBand')
    .setAttribute(
        'd',
        createBandPath(
            13,
            30,
            16,
            30
        )
    );


/* --------------------------------------------------
   午後診

   17:30 → 19:30

   ⭐ ここが修正箇所。

   17:30から時計回りに
   19:30まで進む。
-------------------------------------------------- */

document
    .getElementById('eveningBand')
    .setAttribute(
        'd',
        createBandPath(
            17,
            30,
            19,
            30
        )
    );


/* ==================================================
   ⭐ 現在時刻に合わせて時計の針を滑らかに動かす
================================================== */

function updateClock(){

    const now = new Date();

    const hours =
        now.getHours();

    const minutes =
        now.getMinutes();

    const seconds =
        now.getSeconds();

    const milliseconds =
        now.getMilliseconds();


    /* ----------------------------------------------
       秒針
    ---------------------------------------------- */

    const secondAngle =
        (
            seconds
            + milliseconds / 1000
        ) * 6;


    /* ----------------------------------------------
       分針
    ---------------------------------------------- */

    const minuteAngle =
        (
            minutes
            + seconds / 60
            + milliseconds / 60000
        ) * 6;


    /* ----------------------------------------------
       時針

       12:00を0°として
       時計回りに進む。
    ---------------------------------------------- */

    const hourAngle =
        (
            (hours % 12)
            + minutes / 60
            + seconds / 3600
        ) * 30;


    /* ----------------------------------------------
       SVGへ反映

       時計角度をSVG角度へ変換。
    ---------------------------------------------- */

    const secondSvgAngle =
        clockToSvgAngle(
            secondAngle
        );

    const minuteSvgAngle =
        clockToSvgAngle(
            minuteAngle
        );

    const hourSvgAngle =
        clockToSvgAngle(
            hourAngle
        );


    /* ----------------------------------------------
       秒針
    ---------------------------------------------- */

    document
        .querySelector('.clock-hand.second')
        .setAttribute(
            'transform',
            `rotate(${secondSvgAngle},200,200)`
        );


    /* ----------------------------------------------
       分針
    ---------------------------------------------- */

    document
        .querySelector('.clock-hand.minute')
        .setAttribute(
            'transform',
            `rotate(${minuteSvgAngle},200,200)`
        );


    /* ----------------------------------------------
       時針
    ---------------------------------------------- */

    document
        .querySelector('.clock-hand.hour')
        .setAttribute(
            'transform',
            `rotate(${hourSvgAngle},200,200)`
        );


    /* ----------------------------------------------
       約60fpsで更新
    ---------------------------------------------- */

    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   ⭐ 時計開始
================================================== */

updateClock();

</script>
