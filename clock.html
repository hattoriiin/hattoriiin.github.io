<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>診療時間｜服部医院</title>


<style>

/* ========================================
   全体
======================================== */

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px 15px;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(220,240,230,.7),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #f8fbf8,
            #edf5f0
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;

    color:#40504a;

}


/* ========================================
   ページ
======================================== */

.clock-page{

    width:min(94vw,600px);

    text-align:center;

}


/* ========================================
   タイトル
======================================== */

.title{

    font-size:1.2rem;

    letter-spacing:.18em;

    margin-bottom:6px;

}


.subtitle{

    font-size:.78rem;

    letter-spacing:.12em;

    color:#81908a;

    margin-bottom:25px;

}


/* ========================================
   時計
======================================== */

.clock{

    position:relative;

    width:min(88vw,500px);

    aspect-ratio:1;

    margin:auto;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #ffffff 0%,
            #ffffff 72%,
            #f5f9f6 100%
        );

    box-shadow:

        0 20px 60px
        rgba(70,100,85,.12),

        inset 0 0 0 1px
        rgba(120,150,135,.14);

}


/* ========================================
   診療時間の円周
======================================== */

.time-ring{

    position:absolute;

    inset:5%;

    border-radius:50%;

    background:

        conic-gradient(

            from -90deg,

            /* 0:00〜9:00 */

            transparent 0deg 270deg,

            /* 9:00〜12:00 外来 */

            #9bc8b0 270deg 360deg,

            /* 12:00〜13:30 */

            transparent 0deg 22.5deg,

            /* 13:30〜17:00 訪問 */

            #b7d6c4 22.5deg 127.5deg,

            /* 17:00〜17:30 */

            transparent 127.5deg 135deg,

            /* 17:30〜19:30 外来 */

            #9bc8b0 135deg 195deg,

            /* 19:30〜24:00 */

            transparent 195deg 360deg

        );


    /*
       円周だけを表示
    */

    -webkit-mask:

        radial-gradient(
            farthest-side,
            transparent calc(100% - 18px),
            #000 calc(100% - 17px)
        );

    mask:

        radial-gradient(
            farthest-side,
            transparent calc(100% - 18px),
            #000 calc(100% - 17px)
        );

}


/* ========================================
   時計の数字
======================================== */

.number{

    position:absolute;

    left:50%;
    top:50%;

    font-size:1.35rem;

    font-weight:400;

    color:#303a36;

    z-index:4;

    transform:
        translate(-50%,-50%);

}


/*
   時計の中心から
   数字までの距離を
   時計サイズに合わせる
*/

.n12{

    transform:
        translate(-50%,-50%)
        translateY(-33%);

}


.n1{

    transform:
        translate(-50%,-50%)
        translate(
            16.5vw,
            -28.5vw
        );

}


.n2{

    transform:
        translate(-50%,-50%)
        translate(
            28.5vw,
            -16.5vw
        );

}


.n3{

    transform:
        translate(-50%,-50%)
        translateX(33vw);

}


.n4{

    transform:
        translate(-50%,-50%)
        translate(
            28.5vw,
            16.5vw
        );

}


.n5{

    transform:
        translate(-50%,-50%)
        translate(
            16.5vw,
            28.5vw
        );

}


.n6{

    transform:
        translate(-50%,-50%)
        translateY(33vw);

}


.n7{

    transform:
        translate(-50%,-50%)
        translate(
            -16.5vw,
            28.5vw
        );

}


.n8{

    transform:
        translate(-50%,-50%)
        translate(
            -28.5vw,
            16.5vw
        );

}


.n9{

    transform:
        translate(-50%,-50%)
        translateX(-33vw);

}


.n10{

    transform:
        translate(-50%,-50%)
        translate(
            -28.5vw,
            -16.5vw
        );

}


.n11{

    transform:
        translate(-50%,-50%)
        translate(
            -16.5vw,
            -28.5vw
        );

}


/* ========================================
   針
======================================== */

.hand{

    position:absolute;

    left:50%;
    top:50%;

    transform-origin:
        50% 100%;

    border-radius:10px;

    z-index:10;

}


/* 時針 */

.hour{

    width:7px;

    height:25%;

    margin-left:-3.5px;

    margin-top:-25%;

    background:#53645d;

}


/* 分針 */

.minute{

    width:4px;

    height:34%;

    margin-left:-2px;

    margin-top:-34%;

    background:#53645d;

}


/* 秒針 */

.second{

    width:2px;

    height:39%;

    margin-left:-1px;

    margin-top:-39%;

    background:#87b69d;

}


/* ========================================
   中央
======================================== */

.center{

    position:absolute;

    left:50%;
    top:50%;

    width:13px;
    height:13px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#53645d;

    z-index:20;

    box-shadow:

        0 0 0 4px
        rgba(255,255,255,.85);

}


/* ========================================
   診療時間ラベル
======================================== */

.label{

    position:absolute;

    z-index:6;

    font-size:.72rem;

    letter-spacing:.04em;

    color:#62736b;

    background:
        rgba(255,255,255,.86);

    padding:6px 10px;

    border-radius:20px;

    white-space:nowrap;

    box-shadow:

        0 3px 12px
        rgba(70,100,85,.08);

}


/* 午前外来 */

.outpatient1{

    left:7%;

    top:28%;

}


/* 訪問診療 */

.visit{

    right:4%;

    top:22%;

}


/* 午後外来 */

.outpatient2{

    right:7%;

    bottom:27%;

}


/* ========================================
   現在時刻
======================================== */

.status{

    margin-top:28px;

}


.current-time{

    font-size:1.5rem;

    letter-spacing:.08em;

    color:#465750;

}


.current-status{

    margin-top:7px;

    font-size:.82rem;

    letter-spacing:.12em;

    color:#789086;

}


/* ========================================
   凡例
======================================== */

.legend{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-top:20px;

    font-size:.72rem;

    color:#718078;

}


.legend-item{

    display:flex;

    align-items:center;

    gap:6px;

}


.dot{

    width:9px;
    height:9px;

    border-radius:50%;

}


.outpatient-dot{

    background:#9bc8b0;

}


.visit-dot{

    background:#b7d6c4;

}


/* ========================================
   スマートフォン
======================================== */

@media(max-width:600px){

    .clock{

        width:88vw;

    }


    .number{

        font-size:1.35rem;

    }


    /*
       スマートフォンでは
       数字の距離を少し縮める
    */

    .n12{

        transform:
            translate(-50%,-50%)
            translateY(-34vw);

    }


    .n1{

        transform:
            translate(-50%,-50%)
            translate(
                17vw,
                -29vw
            );

    }


    .n2{

        transform:
            translate(-50%,-50%)
            translate(
                29vw,
                -17vw
            );

    }


    .n3{

        transform:
            translate(-50%,-50%)
            translateX(34vw);

    }


    .n4{

        transform:
            translate(-50%,-50%)
            translate(
                29vw,
                17vw
            );

    }


    .n5{

        transform:
            translate(-50%,-50%)
            translate(
                17vw,
                29vw
            );

    }


    .n6{

        transform:
            translate(-50%,-50%)
            translateY(34vw);

    }


    .n7{

        transform:
            translate(-50%,-50%)
            translate(
                -17vw,
                29vw
            );

    }


    .n8{

        transform:
            translate(-50%,-50%)
            translate(
                -29vw,
                17vw
            );

    }


    .n9{

        transform:
            translate(-50%,-50%)
            translateX(-34vw);

    }


    .n10{

        transform:
            translate(-50%,-50%)
            translate(
                -29vw,
                -17vw
            );

    }


    .n11{

        transform:
            translate(-50%,-50%)
            translate(
                -17vw,
                -29vw
            );

    }


    .time-ring{

        inset:6%;

        -webkit-mask:

            radial-gradient(
                farthest-side,
                transparent calc(100% - 14px),
                #000 calc(100% - 13px)
            );

        mask:

            radial-gradient(
                farthest-side,
                transparent calc(100% - 14px),
                #000 calc(100% - 13px)
            );

    }


    .label{

        font-size:.61rem;

        padding:4px 7px;

    }


    .outpatient1{

        left:2%;

        top:27%;

    }


    .visit{

        right:1%;

        top:22%;

    }


    .outpatient2{

        right:2%;

        bottom:26%;

    }


    .current-time{

        font-size:1.4rem;

    }

}

</style>

</head>


<body>


<div class="clock-page">


    <div class="title">
        診療時間
    </div>


    <div class="subtitle">
        服部医院
    </div>


    <div class="clock">


        <!-- =================================
             診療時間の円周
        ================================= -->

        <div class="time-ring"></div>


        <!-- =================================
             時計の数字
        ================================= -->

        <div class="number n12">12</div>

        <div class="number n1">1</div>

        <div class="number n2">2</div>

        <div class="number n3">3</div>

        <div class="number n4">4</div>

        <div class="number n5">5</div>

        <div class="number n6">6</div>

        <div class="number n7">7</div>

        <div class="number n8">8</div>

        <div class="number n9">9</div>

        <div class="number n10">10</div>

        <div class="number n11">11</div>


        <!-- =================================
             診療時間ラベル
        ================================= -->

        <div class="label outpatient1">

            外来　9:00〜12:00

        </div>


        <div class="label visit">

            訪問診療　13:30〜17:00

        </div>


        <div class="label outpatient2">

            外来　17:30〜19:30

        </div>


        <!-- =================================
             時計の針
        ================================= -->

        <div
            class="hand hour"
            id="hourHand">
        </div>


        <div
            class="hand minute"
            id="minuteHand">
        </div>


        <div
            class="hand second"
            id="secondHand">
        </div>


        <div class="center"></div>


    </div>


    <!-- =================================
         現在時刻
    ================================= -->

    <div class="status">


        <div
            class="current-time"
            id="currentTime">
            --:--:--
        </div>


        <div
            class="current-status"
            id="currentStatus">
            --
        </div>


    </div>


    <!-- =================================
         凡例
    ================================= -->

    <div class="legend">


        <div class="legend-item">

            <span class="dot outpatient-dot"></span>

            外来診療

        </div>


        <div class="legend-item">

            <span class="dot visit-dot"></span>

            訪問診療

        </div>


    </div>


</div>


<script>


/* ========================================
   時計
======================================== */

function updateClock(){


    const now =
        new Date();


    const hours =
        now.getHours();


    const minutes =
        now.getMinutes();


    const seconds =
        now.getSeconds();


    const milliseconds =
        now.getMilliseconds();



    /* =================================
       時針
    ================================= */

    const hourAngle =

        (hours % 12) * 30

        +

        minutes * 0.5

        +

        seconds / 120;



    /* =================================
       分針
    ================================= */

    const minuteAngle =

        minutes * 6

        +

        seconds * 0.1;



    /* =================================
       秒針
    ================================= */

    const secondAngle =

        seconds * 6

        +

        milliseconds * 0.006;



    document
        .getElementById("hourHand")
        .style.transform =
        `rotate(${hourAngle}deg)`;


    document
        .getElementById("minuteHand")
        .style.transform =
        `rotate(${minuteAngle}deg)`;


    document
        .getElementById("secondHand")
        .style.transform =
        `rotate(${secondAngle}deg)`;



    /* =================================
       デジタル時刻
    ================================= */

    const hh =
        String(hours)
        .padStart(2,"0");


    const mm =
        String(minutes)
        .padStart(2,"0");


    const ss =
        String(seconds)
        .padStart(2,"0");


    document
        .getElementById("currentTime")
        .textContent =
        `${hh}:${mm}:${ss}`;



    /* =================================
       現在の診療状態
    ================================= */

    const time =
        hours * 60 + minutes;


    let status;


    if(

        time >= 9 * 60

        &&

        time < 12 * 60

    ){

        status =
            "外来診療中";

    }


    else if(

        time >= 13 * 60 + 30

        &&

        time < 17 * 60

    ){

        status =
            "訪問診療";

    }


    else if(

        time >= 17 * 60 + 30

        &&

        time < 19 * 60 + 30

    ){

        status =
            "外来診療中";

    }


    else{

        status =
            "診療時間外";

    }


    document
        .getElementById("currentStatus")
        .textContent =
        status;


}


/* ========================================
   滑らかに更新
======================================== */

function animate(){

    updateClock();

    requestAnimationFrame(animate);

}


animate();


</script>


</body>

</html>
