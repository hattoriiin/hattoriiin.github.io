<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>診療時間｜服部医院</title>

<style>

/* ==================================================
   全体
================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(220,240,230,.72),
            transparent 48%
        ),
        linear-gradient(
            180deg,
            #f8fbf8,
            #edf5f0
        );

    font-family:
        "Noto Sans JP",
        sans-serif;

    color:#40504a;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px 15px;
}


/* ==================================================
   ページ
================================================== */

.clock-page{

    width:min(94vw,650px);

    text-align:center;

}


/* ==================================================
   タイトル
================================================== */

.title{

    font-size:1.25rem;

    letter-spacing:.18em;

    margin-bottom:8px;

}

.subtitle{

    font-size:.78rem;

    letter-spacing:.12em;

    color:#81908a;

    margin-bottom:22px;

}


/* ==================================================
   時計本体
================================================== */

.clock{

    position:relative;

    width:min(90vw,520px);

    aspect-ratio:1;

    margin:auto;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.98) 0%,
            rgba(252,254,253,.97) 58%,
            rgba(237,245,240,.96) 100%
        );

    box-shadow:

        0 22px 60px
        rgba(70,100,85,.14),

        inset 0 0 0 1px
        rgba(120,150,135,.14);

}


/* ==================================================
   診療時間帯

   SVGそのものを時計盤の上に置く
================================================== */

.time-ring{

    position:absolute;

    inset:4%;

    z-index:2;

    pointer-events:none;

}

.time-ring svg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    overflow:visible;

}


/* ==================================================
   SVGの帯

   端は直線
   角だけ丸くする
================================================== */

.time-band{

    stroke-linejoin:round;

}


/* ==================================================
   外来診療
   インデックスHTMLの青を薄くした色
================================================== */

.outpatient-band{

    fill:url(#outpatientGradient);

}


/* ==================================================
   訪問診療
   インデックスHTMLの緑を薄くした色
================================================== */

.visit-band{

    fill:url(#visitGradient);

}


/* ==================================================
   帯の光沢
================================================== */

.band-highlight{

    fill:none;

    pointer-events:none;

    opacity:.55;

}


/* ==================================================
   文字盤

   1〜12は「帯の中」に配置
================================================== */

.dial{

    position:absolute;

    inset:4%;

    border-radius:50%;

    z-index:5;

    pointer-events:none;

}


/* ==================================================
   数字
================================================== */

.number{

    position:absolute;

    left:50%;
    top:50%;

    width:2.2em;
    height:2.2em;

    display:flex;

    align-items:center;
    justify-content:center;

    transform:
        translate(-50%,-50%);

    font-family:

        "Bodoni 72",
        "Didot",
        "Times New Roman",
        serif;

    font-size:1.45rem;

    font-weight:500;

    color:#53645d;

    line-height:1;

    text-shadow:
        0 1px 2px rgba(255,255,255,.8);

}


/* ==================================================
   数字位置

   帯の中央付近
================================================== */

.n12{

    left:50%;
    top:13%;

}

.n1{

    left:68.5%;
    top:18%;

}

.n2{

    left:82%;
    top:31.5%;

}

.n3{

    left:87%;
    top:50%;

}

.n4{

    left:82%;
    top:68.5%;

}

.n5{

    left:68.5%;
    top:82%;

}

.n6{

    left:50%;
    top:87%;

}

.n7{

    left:31.5%;
    top:82%;

}

.n8{

    left:18%;
    top:68.5%;

}

.n9{

    left:13%;
    top:50%;

}

.n10{

    left:18%;
    top:31.5%;

}

.n11{

    left:31.5%;
    top:18%;

}


/* ==================================================
   針
================================================== */

.hand{

    position:absolute;

    left:50%;
    top:50%;

    transform-origin:50% 100%;

    border-radius:10px;

    z-index:10;

}


/* 時針 */

.hour{

    width:8px;

    height:25%;

    margin-left:-4px;
    margin-top:-25%;

    background:#53645d;

}


/* 分針 */

.minute{

    width:4px;

    height:34%;

    margin-left:-2px;
    margin-top:-34%;

    background:#53645d;

}


/* 秒針 */

.second{

    width:2px;

    height:39%;

    margin-left:-1px;
    margin-top:-39%;

    background:#78ad94;

}


/* ==================================================
   中央
================================================== */

.center{

    position:absolute;

    left:50%;
    top:50%;

    width:14px;
    height:14px;

    transform:
        translate(-50%,-50%);

    background:#53645d;

    border-radius:50%;

    z-index:20;

    box-shadow:

        0 0 0 4px
        rgba(255,255,255,.82),

        0 2px 5px
        rgba(0,0,0,.12);

}


/* ==================================================
   現在時刻
================================================== */

.status{

    margin-top:25px;

    min-height:70px;

}

.current-time{

    font-size:1.55rem;

    letter-spacing:.08em;

    color:#465750;

}

.current-status{

    margin-top:6px;

    font-size:.82rem;

    letter-spacing:.12em;

    color:#789086;

}


/* ==================================================
   凡例
================================================== */

.legend{

    display:flex;

    justify-content:center;

    gap:22px;

    margin-top:15px;

    font-size:.72rem;

    color:#718078;

}

.legend-item{

    display:flex;

    align-items:center;

    gap:6px;

}

.dot{

    width:9px;
    height:9px;

    border-radius:50%;

}

.outpatient-dot{

    background:#3d8bdc;

    opacity:.35;

}

.visit-dot{

    background:#70ad47;

    opacity:.35;

}


/* ==================================================
   スマートフォン
================================================== */

@media(max-width:600px){

    body{

        padding:
            18px 8px;

    }

    .clock{

        width:94vw;

    }

    .number{

        font-size:1.25rem;

    }

    .current-time{

        font-size:1.4rem;

    }

}

</style>

</head>


<body>


<div class="clock-page">


    <div class="title">
        診療時間
    </div>


    <div class="subtitle">
        服部医院
    </div>


    <!-- ==================================================
         時計
    ================================================== -->

    <div class="clock">


        <!-- ==================================================
             診療時間帯

             12時間時計なので、

             9:00  → 9
             12:00 → 12

             13:30 → 1:30
             17:00 → 5

             17:30 → 5:30
             19:30 → 7:30

             として配置
        ================================================== -->

        <div class="time-ring">

            <svg
                viewBox="0 0 100 100"
                preserveAspectRatio="xMidYMid meet"
                aria-hidden="true">


                <defs>


                    <!-- ==============================
                         外来診療グラデーション
                    =============================== -->

                    <linearGradient
                        id="outpatientGradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="0">

                        <stop
                            offset="0%"
                            stop-color="#ffffff"
                            stop-opacity=".72"/>

                        <stop
                            offset="22%"
                            stop-color="#8fc7ff"
                            stop-opacity=".35"/>

                        <stop
                            offset="70%"
                            stop-color="#3d8bdc"
                            stop-opacity=".35"/>

                        <stop
                            offset="100%"
                            stop-color="#ffffff"
                            stop-opacity=".68"/>

                    </linearGradient>


                    <!-- ==============================
                         訪問診療グラデーション
                    =============================== -->

                    <linearGradient
                        id="visitGradient"
                        x1="0"
                        y1="0"
                        x2="1"
                        y2="0">

                        <stop
                            offset="0%"
                            stop-color="#70ad47"
                            stop-opacity=".35"/>

                        <stop
                            offset="55%"
                            stop-color="#8fcf72"
                            stop-opacity=".35"/>

                        <stop
                            offset="100%"
                            stop-color="#ffffff"
                            stop-opacity=".75"/>

                    </linearGradient>


                    <!-- ==============================
                         帯の柔らかな艶
                    =============================== -->

                    <filter
                        id="softShadow"
                        x="-30%"
                        y="-30%"
                        width="160%"
                        height="160%">

                        <feGaussianBlur
                            stdDeviation=".7"/>

                    </filter>


                </defs>


                <!-- ==================================================
                     午前診

                     9:00 → 12:00
                     12時間時計上で
                     270deg → 360deg
                ================================================== -->

                <path
                    class="time-band outpatient-band"
                    d="

                    M 19,50

                    A 31,31 0 0 1 50,19

                    L 50,26

                    A 24,24 0 0 0 26,50

                    Z

                    ">


                </path>


                <!-- ==================================================
                     訪問診療

                     13:30 → 17:00

                     1:30 → 5:00
                ================================================== -->

                <path
                    class="time-band visit-band"
                    d="

                    M 72.0,28.0

                    A 31,31 0 0 1 81,71

                    L 74,67

                    A 24,24 0 0 0 66.5,33

                    Z

                    ">

                </path>


                <!-- ==================================================
                     午後診

                     17:30 → 19:30

                     5:30 → 7:30
                ================================================== -->

                <path
                    class="time-band outpatient-band"
                    d="

                    M 76.8,73.2

                    A 31,31 0 0 1 26.8,76.8

                    L 32,72

                    A 24,24 0 0 0 72,68

                    Z

                    ">

                </path>


                <!-- ==================================================
                     柔らかなハイライト
                ================================================== -->

                <path
                    class="band-highlight"
                    d="
                    M 19,50
                    A 31,31 0 0 1 50,19
                    "
                    stroke="white"
                    stroke-width="2"
                    opacity=".28"
                    filter="url(#softShadow)"/>


            </svg>

        </div>


        <!-- ==================================================
             1〜12

             ⭐ 帯の中に配置
        ================================================== -->

        <div class="dial">

            <div class="number n12">12</div>
            <div class="number n1">1</div>
            <div class="number n2">2</div>
            <div class="number n3">3</div>
            <div class="number n4">4</div>
            <div class="number n5">5</div>
            <div class="number n6">6</div>
            <div class="number n7">7</div>
            <div class="number n8">8</div>
            <div class="number n9">9</div>
            <div class="number n10">10</div>
            <div class="number n11">11</div>

        </div>


        <!-- ==================================================
             針
        ================================================== -->

        <div
            class="hand hour"
            id="hourHand">
        </div>


        <div
            class="hand minute"
            id="minuteHand">
        </div>


        <div
            class="hand second"
            id="secondHand">
        </div>


        <div class="center"></div>


    </div>


    <!-- ==================================================
         現在時刻
    ================================================== -->

    <div class="status">

        <div
            class="current-time"
            id="currentTime">

            --:--:--

        </div>


        <div
            class="current-status"
            id="currentStatus">

            --

        </div>

    </div>


    <!-- ==================================================
         凡例
    ================================================== -->

    <div class="legend">

        <div class="legend-item">

            <span class="dot outpatient-dot"></span>

            外来診療

        </div>


        <div class="legend-item">

            <span class="dot visit-dot"></span>

            訪問診療

        </div>

    </div>


</div>


<script>

/* ==================================================
   時計
================================================== */

function updateClock(){

    const now = new Date();


    const hours =
        now.getHours();

    const minutes =
        now.getMinutes();

    const seconds =
        now.getSeconds();

    const milliseconds =
        now.getMilliseconds();


    /* -----------------------------------------------
       12時間時計
    ------------------------------------------------ */

    const hourAngle =

        ((hours % 12) * 30)

        +

        (minutes * 0.5)

        +

        (seconds / 120);


    const minuteAngle =

        (minutes * 6)

        +

        (seconds * 0.1);


    const secondAngle =

        (seconds * 6)

        +

        (milliseconds * 0.006);


    /* -----------------------------------------------
       針を動かす
    ------------------------------------------------ */

    document
        .getElementById("hourHand")
        .style.transform =
        `rotate(${hourAngle}deg)`;


    document
        .getElementById("minuteHand")
        .style.transform =
        `rotate(${minuteAngle}deg)`;


    document
        .getElementById("secondHand")
        .style.transform =
        `rotate(${secondAngle}deg)`;


    /* -----------------------------------------------
       デジタル時刻
    ------------------------------------------------ */

    const hh =
        String(hours)
        .padStart(2,"0");


    const mm =
        String(minutes)
        .padStart(2,"0");


    const ss =
        String(seconds)
        .padStart(2,"0");


    document
        .getElementById("currentTime")
        .textContent =
        `${hh}:${mm}:${ss}`;


    /* -----------------------------------------------
       診療状態
    ------------------------------------------------ */

    const time =
        hours * 60 + minutes;


    let status;


    if(
        time >= 9 * 60 &&
        time < 12 * 60
    ){

        status =
            "外来診療中";

    }

    else if(
        time >= 13 * 60 + 30 &&
        time < 17 * 60
    ){

        status =
            "訪問診療";

    }

    else if(
        time >= 17 * 60 + 30 &&
        time < 19 * 60 + 30
    ){

        status =
            "外来診療中";

    }

    else{

        status =
            "診療時間外";

    }


    document
        .getElementById("currentStatus")
        .textContent =
        status;

}


/* ==================================================
   滑らかな秒針
================================================== */

function animate(){

    updateClock();

    requestAnimationFrame(animate);

}


animate();

</script>


</body>

</html>
