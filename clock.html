<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/* ==================================================
   袋とじ
================================================== */

/*
 * ここは「線」ではない。
 *
 * 時間帯の始点・終点を横切る
 * 放射方向の面として使用する。
 *
 * そのため帯幅80px全体を閉じる。
 */

.time-cap{

    stroke:none;

    pointer-events:none;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;

const OUTER_RADIUS = 180;

const INNER_RADIUS = 100;


/*
 * 帯幅は80px。
 *
 * ここは変更しない。
 */

const BAND_WIDTH =
    OUTER_RADIUS -
    INNER_RADIUS;


/*
 * 角丸半径。
 */

const CORNER_RADIUS = 10;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を12時間時計の角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度
 * @throws {TypeError} 数値でない場合
 * @throws {RangeError} 分が0〜59以外の場合
 *
 * @example
 * timeToClockAngle(9, 0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30)
        +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * SVGの0°は3時方向なので、
 * 12時を上に合わせる。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 *
 * @example
 * clockToSvgAngle(0); // -90
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   角度正規化
================================================== */

/**
 * 角度を0〜360°へ正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化角度
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 円周上の座標を求める。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} SVG座標
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   時間帯Path
================================================== */

/**
 * 角丸の円環状時間帯を生成する。
 *
 * R180とR100を維持する。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG Path
 * @throws {RangeError} 時間範囲が不正な場合
 *
 * @example
 * createBandPath(9,0,12,0);
 */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '時間帯の範囲が不正です'
        );

    }


    /*
     * 角丸半径が帯幅を超えないよう制限。
     */

    const radius =
        Math.min(
            CORNER_RADIUS,
            BAND_WIDTH / 2 - 0.5
        );


    const outerCenterRadius =
        OUTER_RADIUS -
        radius;


    const innerCenterRadius =
        INNER_RADIUS +
        radius;


    const outerOffset =
        Math.asin(
            radius /
            outerCenterRadius
        );


    const innerOffset =
        Math.asin(
            radius /
            innerCenterRadius
        );


    const outerOffsetDeg =
        outerOffset *
        180 /
        Math.PI;


    const innerOffsetDeg =
        innerOffset *
        180 /
        Math.PI;


    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                start +
                outerOffsetDeg
            )
        );


    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                end -
                outerOffsetDeg
            )
        );


    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                start +
                innerOffsetDeg
            )
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                end -
                innerOffsetDeg
            )
        );


    const tangentOuterRadius =
        outerCenterRadius *
        Math.cos(
            outerOffset
        );


    const tangentInnerRadius =
        innerCenterRadius *
        Math.cos(
            innerOffset
        );


    const outerStartTangent =
        polarToPoint(
            tangentOuterRadius,
            clockToSvgAngle(start)
        );


    const innerStartTangent =
        polarToPoint(
            tangentInnerRadius,
            clockToSvgAngle(start)
        );


    const outerEndTangent =
        polarToPoint(
            tangentOuterRadius,
            clockToSvgAngle(end)
        );


    const innerEndTangent =
        polarToPoint(
            tangentInnerRadius,
            clockToSvgAngle(end)
        );


    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    return [

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        `A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerEndTangent.x}
        ${outerEndTangent.y}`,

        `L
        ${innerEndTangent.x}
        ${innerEndTangent.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerEnd.x}
        ${innerEnd.y}`,

        `A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerStartTangent.x}
        ${innerStartTangent.y}`,

        `L
        ${outerStartTangent.x}
        ${outerStartTangent.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerStart.x}
        ${outerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================
   袋とじ用の端面
================================================== */

/**
 * 時間帯の始点または終点を、
 * 帯幅全体の色で閉じる面を生成する。
 *
 * 「線」ではなく四辺形として作る。
 *
 * これによりR100〜R180の80px全体が
 * 同色で閉じられる。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {string} SVG Path
 * @throws {TypeError} 時刻が数値でない場合
 *
 * @example
 * createCapPath(9,0);
 */

function createCapPath(
    hour,
    minute
){

    const angle =
        timeToClockAngle(
            hour,
            minute
        );


    /*
     * 端面を完全に閉じるため、
     * 内周R100から外周R180まで
     * そのまま線を引く。
     *
     * これが「袋とじ」の本体。
     */

    const outer =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(angle)
        );


    const inner =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(angle)
        );


    /*
     * 極細の角丸の影響で隙間が見えないよう、
     * 半径方向にわずかに余裕を持たせる。
     *
     * 外周リングそのものは覆わない。
     */

    const outerCap =
        polarToPoint(
            OUTER_RADIUS - 0.3,
            clockToSvgAngle(angle)
        );


    const innerCap =
        polarToPoint(
            INNER_RADIUS + 0.3,
            clockToSvgAngle(angle)
        );


    return [

        `M
        ${outerCap.x}
        ${outerCap.y}`,

        `L
        ${innerCap.x}
        ${innerCap.y}`,

        /*
         * SVGの閉じた面として処理。
         */

        'Z'

    ].join(' ');

}


/* ==================================================
   帯を設定
================================================== */

/**
 * 時間帯本体と両端の袋とじを設定する。
 *
 * @param {string} bandId 本体ID
 * @param {string} startCapId 始点キャップID
 * @param {string} endCapId 終点キャップID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} gradient グラデーションID
 * @param {string} capColor 袋とじ色
 * @returns {void}
 */

function setBand(
    bandId,
    startCapId,
    endCapId,
    startHour,
    startMinute,
    endHour,
    endMinute,
    gradient,
    capColor
){

    const band =
        document.getElementById(
            bandId
        );


    const startCap =
        document.getElementById(
            startCapId
        );


    const endCap =
        document.getElementById(
            endCapId
        );


    if(
        !band ||
        !startCap ||
        !endCap
    ){

        console.error(
            `時間帯のSVG要素が見つかりません: ${bandId}`
        );

        return;

    }


    /*
     * グラデーションIDを固定リストで検証。
     *
     * 外部入力をCSSへ直接渡さない。
     */

    const allowedGradients =
        new Set([
            'outpatientGradient',
            'visitGradient'
        ]);


    if(
        !allowedGradients.has(gradient)
    ){

        console.error(
            `不正なグラデーションID: ${gradient}`
        );

        return;

    }


    try{

        /*
         * 本体。
         */

        band.setAttribute(
            'd',
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        band.style.fill =
            `url(#${gradient})`;


        /*
         * 始点を色で閉じる。
         */

        startCap.setAttribute(
            'd',
            createCapPath(
                startHour,
                startMinute
            )
        );


        startCap.setAttribute(
            'fill',
            capColor
        );


        /*
         * 終点を色で閉じる。
         */

        endCap.setAttribute(
            'd',
            createCapPath(
                endHour,
                endMinute
            )
        );


        endCap.setAttribute(
            'fill',
            capColor
        );

    }

    catch(error){

        console.error(
            `${bandId} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningBand',

    'morningStartCap',
    'morningEndCap',

    9,
    0,

    12,
    0,

    'outpatientGradient',

    '#3d8bdc'
);


/* ==================================================
   訪問診療
   13:30 → 16:30
================================================== */

setBand(
    'visitBand',

    'visitStartCap',
    'visitEndCap',

    13,
    30,

    16,
    30,

    'visitGradient',

    '#70ad47'
);


/* ==================================================
   午後診
   17:30 → 19:30
================================================== */

setBand(
    'eveningBand',

    'eveningStartCap',
    'eveningEndCap',

    17,
    30,

    19,
    30,

    'outpatientGradient',

    '#3d8bdc'
);


/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 時刻取得に失敗した場合
 *
 * @example
 * getJapanTime();
 */

function getJapanTime(){

    try{

        const parts =
            new Intl.DateTimeFormat(
                'en-US',
                {
                    timeZone:'Asia/Tokyo',

                    hour12:false,

                    hour:'2-digit',
                    minute:'2-digit',
                    second:'2-digit'
                }
            ).formatToParts(
                new Date()
            );


        const result = {};


        parts.forEach(
            part => {

                if(
                    part.type === 'hour' ||
                    part.type === 'minute' ||
                    part.type === 'second'
                ){

                    result[part.type] =
                        Number(part.value);

                }

            }
        );


        /*
         * 一部環境で24時になる問題を防ぐ。
         */

        if(
            result.hour === 24
        ){

            result.hour = 0;

        }


        if(
            !Number.isInteger(result.hour) ||
            !Number.isInteger(result.minute) ||
            !Number.isInteger(result.second)
        ){

            throw new Error(
                '日本時間の取得結果が不正です'
            );

        }


        return result;

    }

    catch(error){

        console.error(
            '日本時間の取得に失敗しました',
            error
        );

        throw error;

    }

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * @returns {void}
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新を停止しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針。
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針。
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針。
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * 12時を0°として時計回りに回転。
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>
