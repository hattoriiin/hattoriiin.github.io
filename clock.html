<!-- HTML -->
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="服部医院の外来診療時間。午前診9:00〜12:00、訪問診療13:30〜16:30、午後診17:30〜19:30。"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   アクセシビリティ
================================================== */

.sr-only{

    position:absolute;

    width:1px;

    height:1px;

    padding:0;

    margin:-1px;

    overflow:hidden;

    clip:rect(0,0,0,0);

    white-space:nowrap;

    border:0;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    min-width:280px;

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   分目盛り
================================================== */

.minute-tick{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.16;

    vector-effect:non-scaling-stroke;

}


.minute-tick.five{

    opacity:.28;

    stroke-width:1.1;

}


.minute-tick.quarter{

    opacity:.38;

    stroke-width:1.3;

}


.minute-tick.half{

    opacity:.55;

    stroke-width:1.7;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


.band-base.blue{

    fill:
        url(#blueBaseGradient);

}


.band-base.green{

    fill:
        url(#greenBaseGradient);

}


.band-inner{

    fill:#fff;

    opacity:.78;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face .hour12{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .hour12.small{

    font-size:15px;

}


.clock-face .hour12.twelve{

    font-size:33px;

}


.clock-face .hour24{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:15px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

    opacity:.55;

}


.clock-face .hour24.large{

    font-size:31px;

}


/* ==================================================
   時計の針
================================================== */

/*
 * 重要：
 *
 * ここではCSSによる transform-box / transform-originを
 * 一切指定しない。
 *
 * 針の回転はJavaScript側の
 *
 *     rotate(angle 200 200)
 *
 * だけで行う。
 *
 * これにより、3本すべてがSVG座標上の
 * (200,200)を正確な回転中心として動く。
 *
 * 以前の
 *
 *     transform-box:fill-box;
 *     transform-origin:center;
 *
 * とSVGのrotate()を併用すると、
 * 針自身を基準としたCSS変換が重なって
 * 位置が吹っ飛ぶ原因になる。
 */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    /*
     * SVGのtransform属性だけで位置・角度を制御するため、
     * CSS transformはここでは使用しない。
     */

    vector-effect:non-scaling-stroke;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

        min-width:280px;

    }


    .clock-face .hour12{

        font-size:29px;

    }


    .clock-face .hour12.small{

        font-size:14px;

    }


    .clock-face .hour12.twelve{

        font-size:31px;

    }


    .clock-face .hour24{

        font-size:14px;

    }


    .clock-face .hour24.large{

        font-size:29px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .page-main{

        padding:.5rem;

    }


    .clock-title{

        font-size:.92rem;

    }


    .time-ring{

        min-width:260px;

    }


    .clock-face .hour12{

        font-size:27px;

    }


    .clock-face .hour12.small{

        font-size:13px;

    }


    .clock-face .hour12.twelve{

        font-size:29px;

    }


    .clock-face .hour24{

        font-size:13px;

    }


    .clock-face .hour24.large{

        font-size:27px;

    }

}


/* ==================================================
   極小画面
================================================== */

@media(max-width:300px){

    .time-ring{

        min-width:240px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

        min-width:240px;

    }


    .clock-face .hour12{

        font-size:25px;

    }


    .clock-face .hour12.small{

        font-size:12px;

    }


    .clock-face .hour12.twelve{

        font-size:27px;

    }


    .clock-face .hour24{

        font-size:12px;

    }


    .clock-face .hour24.large{

        font-size:25px;

    }

}


/* ==================================================
   動きを抑える設定への対応
================================================== */

@media(prefers-reduced-motion:reduce){

    .clock-hand{

        transition:none;

    }

}

</style>

</head>


<body>


<main class="page-main">


<section
    class="clock-area"
    aria-labelledby="clockHeading"
>


<h1
    id="clockHeading"
    class="clock-title"
>
    外来診療時間
</h1>


<div class="sr-only">

    <p>服部医院の外来診療時間です。</p>

    <ul>

        <li>
            午前診：9:00〜12:00
        </li>

        <li>
            訪問診療：13:30〜16:30
        </li>

        <li>
            午後診：17:30〜19:30
        </li>

    </ul>

</div>


<div class="time-ring">


<svg
    viewBox="0 0 400 400"
    aria-hidden="true"
    focusable="false"
>


<defs>


<!-- ==================================================
     青：外側のベースグラデーション
================================================== -->

<radialGradient
    id="blueBaseGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="55%"
        stop-color="#3d8bdc"
        stop-opacity=".72"
    />

    <stop
        offset="64%"
        stop-color="#72afe8"
        stop-opacity=".62"
    />

    <stop
        offset="72%"
        stop-color="#a9d2f2"
        stop-opacity=".48"
    />

    <stop
        offset="82%"
        stop-color="#72afe8"
        stop-opacity=".62"
    />

    <stop
        offset="100%"
        stop-color="#3d8bdc"
        stop-opacity=".72"
    />

</radialGradient>


<!-- ==================================================
     緑：外側のベースグラデーション
================================================== -->

<radialGradient
    id="greenBaseGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="55%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

    <stop
        offset="64%"
        stop-color="#95c66f"
        stop-opacity=".62"
    />

    <stop
        offset="72%"
        stop-color="#c5dfa9"
        stop-opacity=".48"
    />

    <stop
        offset="82%"
        stop-color="#95c66f"
        stop-opacity=".62"
    />

    <stop
        offset="100%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

</radialGradient>


</defs>


<!-- ==================================================
     時計盤
================================================== -->

<circle
    class="clock-disc"
    cx="200"
    cy="200"
    r="174"
/>


<!-- ==================================================
     分目盛り
================================================== -->

<g
    id="clockTicks"
    aria-hidden="true"
></g>


<!-- ==================================================
     外周
================================================== -->

<circle
    class="outer-ring"
    cx="200"
    cy="200"
    r="180"
/>


<!-- ==================================================
     時間帯
================================================== -->

<path
    id="morningBand"
    class="time-band band-base blue"
/>


<path
    id="morningWhite"
    class="band-inner"
/>


<path
    id="visitBand"
    class="time-band band-base green"
/>


<path
    id="visitWhite"
    class="band-inner"
/>


<path
    id="eveningBand"
    class="time-band band-base blue"
/>


<path
    id="eveningWhite"
    class="band-inner"
/>


<!-- ==================================================
     時計数字
================================================== -->

<g
    class="clock-face"
    aria-hidden="true"
>

    <g id="clock12"></g>

    <g id="clock24"></g>

</g>


<!-- ==================================================
     時計の針
     
     ★ここは絶対にCSS transformを併用しない。
     
     3本とも根元を200,200に固定。
================================================== -->

<line
    class="clock-hand hour"
    x1="200"
    y1="200"
    x2="200"
    y2="125"
/>


<line
    class="clock-hand minute"
    x1="200"
    y1="200"
    x2="200"
    y2="108"
/>


<line
    class="clock-hand second"
    x1="200"
    y1="200"
    x2="200"
    y2="100"
/>


<!-- ==================================================
     中央
================================================== -->

<circle
    class="clock-center"
    cx="200"
    cy="200"
    r="7"
/>


<circle
    class="clock-dot"
    cx="200"
    cy="200"
    r="3"
/>


</svg>

</div>

</section>

</main>


<script>

/* ==================================================
   時計初期設定
================================================== */

document.addEventListener(
    'DOMContentLoaded',
    function(){

        const SVG_CENTER = 200;

        const OUTER_RADIUS = 180;

        const INNER_RADIUS = 100;

        const CORNER_RADIUS = 5;

        const WHITE_RADIAL_INSET = 3;

        const WHITE_ANGLE_INSET = 1.5;

        const INNER_NUMBER_RADIUS = 126;

        const OUTER_NUMBER_RADIUS = 150;

        const TICK_OUTER_RADIUS = 176;

        const TICK_INNER_RADIUS = 171;

        const TICK_INNER_RADIUS_FIVE = 169;

        const TICK_INNER_RADIUS_QUARTER = 167;

        const TICK_INNER_RADIUS_HALF = 164;


        /* ==================================================
           DOM
        ================================================== */

        const morningBand =
            document.getElementById(
                'morningBand'
            );

        const morningWhite =
            document.getElementById(
                'morningWhite'
            );

        const visitBand =
            document.getElementById(
                'visitBand'
            );

        const visitWhite =
            document.getElementById(
                'visitWhite'
            );

        const eveningBand =
            document.getElementById(
                'eveningBand'
            );

        const eveningWhite =
            document.getElementById(
                'eveningWhite'
            );

        const clock12 =
            document.getElementById(
                'clock12'
            );

        const clock24 =
            document.getElementById(
                'clock24'
            );

        const clockTicks =
            document.getElementById(
                'clockTicks'
            );

        const hourHand =
            document.querySelector(
                '.clock-hand.hour'
            );

        const minuteHand =
            document.querySelector(
                '.clock-hand.minute'
            );

        const secondHand =
            document.querySelector(
                '.clock-hand.second'
            );


        if(
            !morningBand ||
            !morningWhite ||
            !visitBand ||
            !visitWhite ||
            !eveningBand ||
            !eveningWhite ||
            !clock12 ||
            !clock24 ||
            !clockTicks ||
            !hourHand ||
            !minuteHand ||
            !secondHand
        ){

            console.error(
                '時計の初期化に必要な要素が見つかりません。'
            );

            return;

        }


        /* ==================================================
           時刻 → 時計角度
        ================================================== */

        /**
         * 時刻を12時間時計上の角度へ変換する。
         *
         * @param {number} hour 0〜23
         * @param {number} minute 0〜59
         * @returns {number} 12時を0°とした角度
         * @throws {TypeError} 数値以外の場合
         * @throws {RangeError} 範囲外の場合
         *
         * @example
         * timeToClockAngle(9, 0); // 270
         */

        function timeToClockAngle(
            hour,
            minute
        ){

            if(
                !Number.isFinite(hour) ||
                !Number.isFinite(minute)
            ){

                throw new TypeError(
                    '時刻は数値で指定してください。'
                );

            }


            if(
                !Number.isInteger(hour) ||
                hour < 0 ||
                hour > 23
            ){

                throw new RangeError(
                    '時は0〜23の整数で指定してください。'
                );

            }


            if(
                !Number.isInteger(minute) ||
                minute < 0 ||
                minute > 59
            ){

                throw new RangeError(
                    '分は0〜59の整数で指定してください。'
                );

            }


            return (
                (
                    (hour % 12) * 30
                ) +
                minute * .5
            ) % 360;

        }


        /* ==================================================
           時計角度 → SVG角度
        ================================================== */

        /**
         * 時計角度をSVG角度へ変換する。
         *
         * @param {number} clockAngle 時計角度
         * @returns {number} SVG角度
         * @throws {TypeError} 数値以外の場合
         *
         * @example
         * clockToSvgAngle(0); // -90
         */

        function clockToSvgAngle(
            clockAngle
        ){

            if(
                !Number.isFinite(clockAngle)
            ){

                throw new TypeError(
                    '角度は数値で指定してください。'
                );

            }


            return clockAngle - 90;

        }


        /* ==================================================
           極座標 → SVG座標
        ================================================== */

        /**
         * 極座標をSVG座標へ変換する。
         *
         * @param {number} radius 半径
         * @param {number} svgAngle SVG角度
         * @returns {{x:number,y:number}} SVG座標
         * @throws {TypeError} 不正な値の場合
         *
         * @example
         * polarToPoint(180, -90);
         */

        function polarToPoint(
            radius,
            svgAngle
        ){

            if(
                !Number.isFinite(radius) ||
                !Number.isFinite(svgAngle)
            ){

                throw new TypeError(
                    '半径と角度は数値で指定してください。'
                );

            }


            const radians =
                svgAngle *
                Math.PI /
                180;


            return {

                x:
                    SVG_CENTER +
                    radius *
                    Math.cos(radians),

                y:
                    SVG_CENTER +
                    radius *
                    Math.sin(radians)

            };

        }


        /* ==================================================
           時計座標
        ================================================== */

        /**
         * 時計角度からSVG座標を取得する。
         *
         * @param {number} radius 半径
         * @param {number} clockAngle 時計角度
         * @returns {{x:number,y:number}} SVG座標
         * @throws {TypeError} 不正な値の場合
         *
         * @example
         * clockPoint(150, 90);
         */

        function clockPoint(
            radius,
            clockAngle
        ){

            return polarToPoint(
                radius,
                clockToSvgAngle(
                    clockAngle
                )
            );

        }


        /* ==================================================
           円環帯生成
        ================================================== */

        /**
         * 閉じた円環状の時間帯を生成する。
         *
         * @param {number} startHour 開始時
         * @param {number} startMinute 開始分
         * @param {number} endHour 終了時
         * @param {number} endMinute 終了分
         * @param {number} radialInset 放射方向縮小量
         * @param {number} angleInset 角度方向縮小量
         * @returns {string} SVG path
         * @throws {RangeError} 時間帯が不正な場合
         *
         * @example
         * createBandPath(9,0,12,0);
         */

        function createBandPath(
            startHour,
            startMinute,
            endHour,
            endMinute,
            radialInset = 0,
            angleInset = 0
        ){

            const start =
                timeToClockAngle(
                    startHour,
                    startMinute
                );


            const end =
                timeToClockAngle(
                    endHour,
                    endMinute
                );


            let sweep =
                end - start;


            if(
                sweep < 0
            ){

                sweep += 360;

            }


            if(
                sweep === 0
            ){

                throw new RangeError(
                    '開始時刻と終了時刻を同じにはできません。'
                );

            }


            if(
                sweep > 360
            ){

                throw new RangeError(
                    '時間帯は12時間以内で指定してください。'
                );

            }


            const outerRadius =
                OUTER_RADIUS -
                radialInset;


            const innerRadius =
                INNER_RADIUS +
                radialInset;


            if(
                innerRadius >= outerRadius
            ){

                throw new RangeError(
                    '帯の内外半径が逆転しています。'
                );

            }


            const localStart =
                start +
                angleInset;


            const localEnd =
                start +
                sweep -
                angleInset;


            const localSweep =
                localEnd -
                localStart;


            if(
                localSweep <= 0
            ){

                throw new RangeError(
                    '白抜けによって帯の角度範囲がなくなりました。'
                );

            }


            const r =
                Math.min(
                    CORNER_RADIUS,
                    (outerRadius - innerRadius) / 2 - .5
                );


            if(
                r <= 0
            ){

                throw new RangeError(
                    '帯幅が狭すぎます。'
                );

            }


            const outerFilletRadius =
                outerRadius - r;


            const outerDelta =
                Math.asin(
                    r /
                    outerFilletRadius
                ) *
                180 /
                Math.PI;


            const innerFilletRadius =
                innerRadius + r;


            const innerDelta =
                Math.asin(
                    r /
                    innerFilletRadius
                ) *
                180 /
                Math.PI;


            const outerStart =
                clockPoint(
                    outerRadius,
                    localStart +
                    outerDelta
                );


            const outerEnd =
                clockPoint(
                    outerRadius,
                    localEnd -
                    outerDelta
                );


            const innerEnd =
                clockPoint(
                    innerRadius,
                    localEnd -
                    innerDelta
                );


            const innerStart =
                clockPoint(
                    innerRadius,
                    localStart +
                    innerDelta
                );


            const outerStartTangent =
                clockPoint(
                    outerFilletRadius *
                    Math.cos(
                        outerDelta *
                        Math.PI /
                        180
                    ),
                    localStart
                );


            const innerStartTangent =
                clockPoint(
                    innerFilletRadius *
                    Math.cos(
                        innerDelta *
                        Math.PI /
                        180
                    ),
                    localStart
                );


            const outerEndTangent =
                clockPoint(
                    outerFilletRadius *
                    Math.cos(
                        outerDelta *
                        Math.PI /
                        180
                    ),
                    localEnd
                );


            const innerEndTangent =
                clockPoint(
                    innerFilletRadius *
                    Math.cos(
                        innerDelta *
                        Math.PI /
                        180
                    ),
                    localEnd
                );


            const largeArcFlag =
                localSweep > 180
                    ? 1
                    : 0;


            return [

                `M ${outerStart.x} ${outerStart.y}`,

                `A ${outerRadius} ${outerRadius} 0 ${largeArcFlag} 1 ${outerEnd.x} ${outerEnd.y}`,

                `A ${r} ${r} 0 0 1 ${outerEndTangent.x} ${outerEndTangent.y}`,

                `L ${innerEndTangent.x} ${innerEndTangent.y}`,

                `A ${r} ${r} 0 0 1 ${innerEnd.x} ${innerEnd.y}`,

                `A ${innerRadius} ${innerRadius} 0 ${largeArcFlag} 0 ${innerStart.x} ${innerStart.y}`,

                `A ${r} ${r} 0 0 1 ${innerStartTangent.x} ${innerStartTangent.y}`,

                `L ${outerStartTangent.x} ${outerStartTangent.y}`,

                `A ${r} ${r} 0 0 1 ${outerStart.x} ${outerStart.y}`,

                'Z'

            ].join(' ');

        }


        /* ==================================================
           時間帯設定
        ================================================== */

        /**
         * 時間帯pathを設定する。
         *
         * @param {SVGPathElement} element 対象要素
         * @param {number} startHour 開始時
         * @param {number} startMinute 開始分
         * @param {number} endHour 終了時
         * @param {number} endMinute 終了分
         * @returns {boolean} 成功時true
         *
         * @example
         * setBand(morningBand,9,0,12,0);
         */

        function setBand(
            element,
            startHour,
            startMinute,
            endHour,
            endMinute
        ){

            try{

                element.setAttribute(
                    'd',
                    createBandPath(
                        startHour,
                        startMinute,
                        endHour,
                        endMinute
                    )
                );


                return true;

            }

            catch(error){

                console.error(
                    '時間帯の描画に失敗しました。',
                    error
                );


                return false;

            }

        }


        /* ==================================================
           白レイヤー
        ================================================== */

        /**
         * 時間帯内部の白レイヤーを設定する。
         *
         * @param {SVGPathElement} element 対象要素
         * @param {number} startHour 開始時
         * @param {number} startMinute 開始分
         * @param {number} endHour 終了時
         * @param {number} endMinute 終了分
         * @returns {boolean} 成功時true
         *
         * @example
         * setWhiteBand(morningWhite,9,0,12,0);
         */

        function setWhiteBand(
            element,
            startHour,
            startMinute,
            endHour,
            endMinute
        ){

            try{

                element.setAttribute(
                    'd',
                    createBandPath(
                        startHour,
                        startMinute,
                        endHour,
                        endMinute,
                        WHITE_RADIAL_INSET,
                        WHITE_ANGLE_INSET
                    )
                );


                return true;

            }

            catch(error){

                console.error(
                    '白レイヤーの描画に失敗しました。',
                    error
                );


                return false;

            }

        }


        /* ==================================================
           分目盛り
        ================================================== */

        /**
         * 60個の分目盛りを生成する。
         *
         * @returns {void}
         *
         * @example
         * createMinuteTicks();
         */

        function createMinuteTicks(){

            const fragment =
                document.createDocumentFragment();


            for(
                let minute = 0;
                minute < 60;
                minute++
            ){

                const angle =
                    minute * 6;


                let innerRadius =
                    TICK_INNER_RADIUS;


                let className =
                    'minute-tick';


                if(
                    minute % 30 === 0
                ){

                    innerRadius =
                        TICK_INNER_RADIUS_HALF;

                    className +=
                        ' half';

                }

                else if(
                    minute % 15 === 0
                ){

                    innerRadius =
                        TICK_INNER_RADIUS_QUARTER;

                    className +=
                        ' quarter';

                }

                else if(
                    minute % 5 === 0
                ){

                    innerRadius =
                        TICK_INNER_RADIUS_FIVE;

                    className +=
                        ' five';

                }


                const outerPoint =
                    clockPoint(
                        TICK_OUTER_RADIUS,
                        angle
                    );


                const innerPoint =
                    clockPoint(
                        innerRadius,
                        angle
                    );


                const line =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'line'
                    );


                line.setAttribute(
                    'class',
                    className
                );


                line.setAttribute(
                    'x1',
                    outerPoint.x
                );


                line.setAttribute(
                    'y1',
                    outerPoint.y
                );


                line.setAttribute(
                    'x2',
                    innerPoint.x
                );


                line.setAttribute(
                    'y2',
                    innerPoint.y
                );


                line.setAttribute(
                    'aria-hidden',
                    'true'
                );


                fragment.appendChild(
                    line
                );

            }


            clockTicks.appendChild(
                fragment
            );

        }


        /* ==================================================
           時計数字
        ================================================== */

        /**
         * 12時間表示と24時間表示を生成する。
         *
         * @returns {void}
         *
         * @example
         * createClockNumbers();
         */

        function createClockNumbers(){

            clock12.replaceChildren();

            clock24.replaceChildren();


            /* ---------- 1〜12 ---------- */

            for(
                let hour = 1;
                hour <= 12;
                hour++
            ){

                const clockAngle =
                    hour === 12
                        ? 0
                        : hour * 30;


                const point =
                    clockPoint(
                        INNER_NUMBER_RADIUS,
                        clockAngle
                    );


                const text =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'text'
                    );


                let className =
                    'hour12';


                if(
                    hour >= 1 &&
                    hour <= 7
                ){

                    className +=
                        ' small';

                }


                if(
                    hour === 12
                ){

                    className +=
                        ' twelve';

                }


                text.setAttribute(
                    'class',
                    className
                );


                text.setAttribute(
                    'x',
                    point.x
                );


                text.setAttribute(
                    'y',
                    point.y
                );


                text.textContent =
                    String(hour);


                clock12.appendChild(
                    text
                );

            }


            /* ---------- 13〜24 ---------- */

            for(
                let hour = 0;
                hour < 12;
                hour++
            ){

                const clockAngle =
                    hour * 30;


                const displayHour =
                    hour === 0
                        ? 24
                        : hour + 12;


                const point =
                    clockPoint(
                        OUTER_NUMBER_RADIUS,
                        clockAngle
                    );


                const text =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'text'
                    );


                const className =
                    displayHour >= 13 &&
                    displayHour <= 19
                        ? 'hour24 large'
                        : 'hour24';


                text.setAttribute(
                    'class',
                    className
                );


                text.setAttribute(
                    'x',
                    point.x
                );


                text.setAttribute(
                    'y',
                    point.y
                );


                text.textContent =
                    String(displayHour);


                clock24.appendChild(
                    text
                );

            }

        }


        /* ==================================================
           診療時間
        ================================================== */

        setBand(
            morningBand,
            9,
            0,
            12,
            0
        );


        setWhiteBand(
            morningWhite,
            9,
            0,
            12,
            0
        );


        setBand(
            visitBand,
            13,
            30,
            16,
            30
        );


        setWhiteBand(
            visitWhite,
            13,
            30,
            16,
            30
        );


        setBand(
            eveningBand,
            17,
            30,
            19,
            30
        );


        setWhiteBand(
            eveningWhite,
            17,
            30,
            19,
            30
        );


        /* ==================================================
           静的部分
        ================================================== */

        createMinuteTicks();

        createClockNumbers();


        /* ==================================================
           日本時間
        ================================================== */

        /**
         * 現在の日本標準時を取得する。
         *
         * @returns {number} JST基準のタイムスタンプ
         *
         * @example
         * getJapanTimestamp();
         */

        function getJapanTimestamp(){

            return (
                Date.now() +
                9 * 60 * 60 * 1000
            );

        }


        /* ==================================================
           時計針更新
        ================================================== */

        /**
         * 3本の針を現在時刻に合わせる。
         *
         * 針はすべてSVG座標上の
         * (200,200)
         * を中心として回転する。
         *
         * CSSのtransformは使用せず、
         * SVGのtransform属性だけを使用する。
         *
         * @param {number} timestamp JST換算タイムスタンプ
         * @returns {void}
         *
         * @example
         * updateClock(getJapanTimestamp());
         */

        function updateClock(
            timestamp
        ){

            if(
                !Number.isFinite(timestamp)
            ){

                console.error(
                    '時計の時刻データが不正です。'
                );

                return;

            }


            const millisecondsInHour =
                60 *
                60 *
                1000;


            const millisecondsInMinute =
                60 *
                1000;


            const hour =
                Math.floor(
                    timestamp /
                    millisecondsInHour
                ) % 24;


            const minute =
                Math.floor(
                    (
                        timestamp %
                        millisecondsInHour
                    ) /
                    millisecondsInMinute
                );


            const secondFraction =
                (
                    timestamp %
                    millisecondsInMinute
                ) /
                millisecondsInMinute;


            /*
             * 秒針
             *
             * 1分 = 360°
             */

            const secondAngle =
                secondFraction *
                360;


            /*
             * 分針
             *
             * 秒の進行まで含める。
             */

            const minuteAngle =
                (
                    minute +
                    secondFraction
                ) *
                6;


            /*
             * 時針
             *
             * 分・秒まで含めて滑らかに進む。
             */

            const hourAngle =
                (
                    (
                        hour % 12
                    ) +
                    (
                        minute +
                        secondFraction
                    ) / 60
                ) *
                30;


            /*
             * ==================================================
             * ここが今回の核心
             *
             * 3本とも必ず
             *
             * rotate(角度 200 200)
             *
             * とする。
             *
             * CSS transform-box / transform-originは使わない。
             *
             * したがって針の根元は常に
             * (200,200)
             * に固定される。
             * ==================================================
             */

            hourHand.setAttribute(
                'transform',
                `rotate(${hourAngle} 200 200)`
            );


            minuteHand.setAttribute(
                'transform',
                `rotate(${minuteAngle} 200 200)`
            );


            secondHand.setAttribute(
                'transform',
                `rotate(${secondAngle} 200 200)`
            );

        }


        /* ==================================================
           アニメーション
        ================================================== */

        /**
         * 秒針を滑らかに更新する。
         *
         * requestAnimationFrameを使うことで、
         * ブラウザの描画タイミングに同期する。
         *
         * @returns {void}
         */

        function animateClock(){

            updateClock(
                getJapanTimestamp()
            );


            requestAnimationFrame(
                animateClock
            );

        }


        /* ==================================================
           初期表示
        ================================================== */

        updateClock(
            getJapanTimestamp()
        );


        requestAnimationFrame(
            animateClock
        );

    }
);

</script>
