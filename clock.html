<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>診療時間｜服部医院</title>


<style>

/* ==================================================
   全体
================================================== */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(220,240,230,.72),
            transparent 48%
        ),
        linear-gradient(
            180deg,
            #f8fbf8,
            #edf5f0
        );

    font-family:
        "Noto Sans JP",
        sans-serif;

    color:#40504a;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:25px 15px;

}


/* ==================================================
   ページ
================================================== */

.clock-page{

    width:min(94vw,650px);

    text-align:center;

}


/* ==================================================
   タイトル
================================================== */

.title{

    font-size:1.25rem;

    letter-spacing:.18em;

    margin-bottom:7px;

}

.subtitle{

    font-size:.75rem;

    letter-spacing:.14em;

    color:#81908a;

    margin-bottom:22px;

}


/* ==================================================
   時計
================================================== */

.clock{

    position:relative;

    width:min(88vw,520px);

    aspect-ratio:1;

    margin:auto;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.98) 0%,
            rgba(252,254,253,.97) 62%,
            rgba(236,244,239,.96) 100%
        );

    box-shadow:

        0 22px 65px
        rgba(70,100,85,.14),

        inset 0 0 0 1px
        rgba(100,130,115,.12);

}


/* ==================================================
   診療時間の円周
================================================== */

/*

12時間時計

12時 =   0°
 3時 =  90°
 6時 = 180°
 9時 = 270°


🔵 外来

 9:00  → 12:00
270°    → 360°


🟢 訪問

13:30  → 17:00
 45°    → 150°


🔵 外来

17:30  → 19:30
165°    → 225°

*/

.time-ring{

    position:absolute;

    inset:5.5%;

    border-radius:50%;

    background:

        conic-gradient(
            from 0deg,

            /* 12:00 → 13:30 */

            transparent
            0deg 45deg,


            /* 🟢 訪問診療 */

            rgba(
                112,
                173,
                71,
                .35
            )
            45deg 150deg,


            /* 17:00 → 17:30 */

            transparent
            150deg 165deg,


            /* 🔵 午後診 */

            rgba(
                61,
                139,
                220,
                .35
            )
            165deg 225deg,


            /* 19:30 → 9:00 */

            transparent
            225deg 270deg,


            /* 🔵 午前診 */

            rgba(
                61,
                139,
                220,
                .35
            )
            270deg 360deg
        );


    /*
       円周だけを残す
    */

    -webkit-mask:

        radial-gradient(
            farthest-side,
            transparent calc(100% - 18px),
            #000 calc(100% - 17px)
        );

    mask:

        radial-gradient(
            farthest-side,
            transparent calc(100% - 18px),
            #000 calc(100% - 17px)
        );


    pointer-events:none;

}


/* ==================================================
   文字盤
================================================== */

.dial{

    position:absolute;

    inset:13%;

    border-radius:50%;

}


/* ==================================================
   数字
================================================== */

.number{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    color:#4e5d56;

    font-family:

        "Bodoni 72",
        "Bodoni MT",
        "Didot",
        "Times New Roman",
        serif;

    font-size:1.9rem;

    font-weight:400;

    line-height:1;

}


/* ==================================================
   数字位置
================================================== */

.n12{
    left:50%;
    top:4%;
}

.n1{
    left:70%;
    top:9%;
}

.n2{
    left:87%;
    top:25%;
}

.n3{
    left:96%;
    top:50%;
}

.n4{
    left:87%;
    top:75%;
}

.n5{
    left:70%;
    top:91%;
}

.n6{
    left:50%;
    top:96%;
}

.n7{
    left:30%;
    top:91%;
}

.n8{
    left:13%;
    top:75%;
}

.n9{
    left:4%;
    top:50%;
}

.n10{
    left:13%;
    top:25%;
}

.n11{
    left:30%;
    top:9%;
}


/* ==================================================
   針
================================================== */

.hand{

    position:absolute;

    left:50%;
    top:50%;

    transform-origin:
        50% 100%;

    border-radius:10px;

    z-index:10;

}


/* ==================================================
   時針
================================================== */

.hour{

    width:8px;

    height:23%;

    margin-left:-4px;

    margin-top:-23%;

    background:#53645d;

}


/* ==================================================
   分針
================================================== */

.minute{

    width:5px;

    height:32%;

    margin-left:-2.5px;

    margin-top:-32%;

    background:#53645d;

}


/* ==================================================
   秒針
================================================== */

.second{

    width:2px;

    height:38%;

    margin-left:-1px;

    margin-top:-38%;

    background:#78a991;

}


/* ==================================================
   中央
================================================== */

.center{

    position:absolute;

    left:50%;
    top:50%;

    width:14px;
    height:14px;

    transform:
        translate(-50%,-50%);

    background:#53645d;

    border-radius:50%;

    z-index:20;

    box-shadow:

        0 0 0 4px
        rgba(255,255,255,.85);

}


/* ==================================================
   診療時間ラベル
================================================== */

.label{

    position:absolute;

    z-index:5;

    font-size:.72rem;

    letter-spacing:.04em;

    color:#5d6d66;

    background:
        rgba(255,255,255,.82);

    padding:5px 10px;

    border-radius:20px;

    box-shadow:
        0 3px 12px
        rgba(70,100,85,.08);

    white-space:nowrap;

}


/* ==================================================
   ラベル位置
================================================== */

.outpatient1{

    left:7%;

    top:32%;

}


.visit{

    right:2%;

    top:24%;

}


.outpatient2{

    right:7%;

    bottom:27%;

}


/* ==================================================
   現在時刻
================================================== */

.status{

    margin-top:25px;

    min-height:68px;

}


.current-time{

    font-size:1.65rem;

    letter-spacing:.08em;

    color:#465750;

}


.current-status{

    margin-top:6px;

    font-size:.82rem;

    letter-spacing:.12em;

    color:#789086;

}


/* ==================================================
   凡例
================================================== */

.legend{

    display:flex;

    justify-content:center;

    gap:22px;

    margin-top:17px;

    font-size:.72rem;

    color:#718078;

}


.legend-item{

    display:flex;

    align-items:center;

    gap:6px;

}


.dot{

    width:9px;

    height:9px;

    border-radius:50%;

}


.outpatient-dot{

    background:
        rgba(
            61,
            139,
            220,
            .35
        );

}


.visit-dot{

    background:
        rgba(
            112,
            173,
            71,
            .35
        );

}


/* ==================================================
   スマートフォン
================================================== */

@media(max-width:600px){

    .clock{

        width:90vw;

    }


    .time-ring{

        inset:5.5%;

    }


    .number{

        font-size:1.65rem;

    }


    .label{

        font-size:.61rem;

        padding:4px 7px;

    }


    .outpatient1{

        left:2%;

        top:32%;

    }


    .visit{

        right:1%;

        top:23%;

    }


    .outpatient2{

        right:2%;

        bottom:26%;

    }


    .current-time{

        font-size:1.45rem;

    }

}


/* ==================================================
   小さいスマートフォン
================================================== */

@media(max-width:380px){

    .number{

        font-size:1.45rem;

    }


    .label{

        font-size:.55rem;

        padding:3px 6px;

    }

}

</style>

</head>


<body>


<div class="clock-page">


    <!-- ==========================================
         タイトル
    =========================================== -->

    <div class="title">
        診療時間
    </div>


    <div class="subtitle">
        服部医院
    </div>


    <!-- ==========================================
         時計
    =========================================== -->

    <div class="clock">


        <!-- 診療時間の円周 -->

        <div class="time-ring"></div>


        <!-- ======================================
             文字盤
        ======================================= -->

        <div class="dial">

            <div class="number n12">12</div>

            <div class="number n1">1</div>

            <div class="number n2">2</div>

            <div class="number n3">3</div>

            <div class="number n4">4</div>

            <div class="number n5">5</div>

            <div class="number n6">6</div>

            <div class="number n7">7</div>

            <div class="number n8">8</div>

            <div class="number n9">9</div>

            <div class="number n10">10</div>

            <div class="number n11">11</div>

        </div>


        <!-- ======================================
             診療時間表示
        ======================================= -->

        <div class="label outpatient1">

            外来　9:00〜12:00

        </div>


        <div class="label visit">

            訪問診療　13:30〜17:00

        </div>


        <div class="label outpatient2">

            外来　17:30〜19:30

        </div>


        <!-- ======================================
             時計の針
        ======================================= -->

        <div
            class="hand hour"
            id="hourHand"
        ></div>


        <div
            class="hand minute"
            id="minuteHand"
        ></div>


        <div
            class="hand second"
            id="secondHand"
        ></div>


        <div class="center"></div>


    </div>


    <!-- ==========================================
         現在時刻
    =========================================== -->

    <div class="status">

        <div
            class="current-time"
            id="currentTime"
        >
            --:--:--
        </div>


        <div
            class="current-status"
            id="currentStatus"
        >
            --
        </div>

    </div>


    <!-- ==========================================
         凡例
    =========================================== -->

    <div class="legend">

        <div class="legend-item">

            <span class="dot outpatient-dot"></span>

            外来診療

        </div>


        <div class="legend-item">

            <span class="dot visit-dot"></span>

            訪問診療

        </div>

    </div>


</div>


<script>

/* ==================================================
   時計を更新
================================================== */

function updateClock(){

    const now = new Date();


    const hours =
        now.getHours();

    const minutes =
        now.getMinutes();

    const seconds =
        now.getSeconds();

    const milliseconds =
        now.getMilliseconds();


    /* ==============================================
       時針
    ============================================== */

    const hourAngle =

        (hours % 12) * 30

        +

        minutes * 0.5

        +

        seconds / 120;


    /* ==============================================
       分針
    ============================================== */

    const minuteAngle =

        minutes * 6

        +

        seconds * 0.1

        +

        milliseconds * 0.0001;


    /* ==============================================
       秒針
    ============================================== */

    const secondAngle =

        seconds * 6

        +

        milliseconds * 0.006;


    document
        .getElementById("hourHand")
        .style.transform =
        `rotate(${hourAngle}deg)`;


    document
        .getElementById("minuteHand")
        .style.transform =
        `rotate(${minuteAngle}deg)`;


    document
        .getElementById("secondHand")
        .style.transform =
        `rotate(${secondAngle}deg)`;


    /* ==============================================
       デジタル時刻
    ============================================== */

    const hh =
        String(hours)
        .padStart(2,"0");


    const mm =
        String(minutes)
        .padStart(2,"0");


    const ss =
        String(seconds)
        .padStart(2,"0");


    document
        .getElementById("currentTime")
        .textContent =
        `${hh}:${mm}:${ss}`;


    /* ==============================================
       診療状態
    ============================================== */

    const time =
        hours * 60 + minutes;


    let status;


    if(
        time >= 9 * 60 &&
        time < 12 * 60
    ){

        status =
            "外来診療中";

    }

    else if(
        time >= 13 * 60 + 30 &&
        time < 17 * 60
    ){

        status =
            "訪問診療時間";

    }

    else if(
        time >= 17 * 60 + 30 &&
        time < 19 * 60 + 30
    ){

        status =
            "外来診療中";

    }

    else{

        status =
            "診療時間外";

    }


    document
        .getElementById("currentStatus")
        .textContent =
        status;

}


/* ==================================================
   秒針を滑らかに動かす
================================================== */

function animate(){

    updateClock();

    requestAnimationFrame(animate);

}


animate();

</script>


</body>

</html>
