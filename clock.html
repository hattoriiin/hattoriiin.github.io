<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>診療時間｜服部医院</title>

<style>

/* =================================
   全体
================================= */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px 15px;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(220,240,230,.7),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #f8fbf8,
            #edf5f0
        );

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Noto Sans JP",
        sans-serif;

    color:#40504a;
}


/* =================================
   ページ
================================= */

.clock-page{

    width:min(94vw,600px);

    text-align:center;

}


/* =================================
   タイトル
================================= */

.title{

    font-size:1.15rem;

    letter-spacing:.18em;

    margin-bottom:6px;

}

.subtitle{

    font-size:.78rem;

    letter-spacing:.12em;

    color:#81908a;

    margin-bottom:25px;

}


/* =================================
   時計
================================= */

.clock{

    position:relative;

    width:min(88vw,500px);

    aspect-ratio:1;

    margin:auto;

    border-radius:50%;

    background:#ffffff;

    box-shadow:

        0 20px 60px
        rgba(70,100,85,.12),

        inset 0 0 0 1px
        rgba(120,150,135,.14);

}


/* =================================
   診療時間リング
================================= */

.time-ring{

    position:absolute;

    left:4%;

    top:4%;

    width:92%;

    height:92%;

    z-index:2;

}


/*
   帯

   円周方向の端は直線。

   stroke-linecap:butt
*/

.time-arc{

    fill:none;

    stroke-width:7;

    stroke-linecap:butt;

}


/* 外来 */

.morning-arc,
.afternoon-arc{

    stroke:#9bc8b0;

}


/* 訪問 */

.visit-arc{

    stroke:#b7d6c4;

}


/* =================================
   数字
================================= */

.number{

    position:absolute;

    left:50%;

    top:50%;

    z-index:5;

    transform:
        translate(-50%,-50%);

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size:1.7rem;

    font-weight:500;

    color:#303a36;

}


/* =================================
   数字位置
================================= */

.n12{
    left:50%;
    top:8%;
}

.n1{
    left:71%;
    top:11%;
}

.n2{
    left:87%;
    top:26%;
}

.n3{
    left:92%;
    top:50%;
}

.n4{
    left:87%;
    top:74%;
}

.n5{
    left:71%;
    top:89%;
}

.n6{
    left:50%;
    top:92%;
}

.n7{
    left:29%;
    top:89%;
}

.n8{
    left:13%;
    top:74%;
}

.n9{
    left:8%;
    top:50%;
}

.n10{
    left:13%;
    top:26%;
}

.n11{
    left:29%;
    top:11%;
}


/* =================================
   診療区分
================================= */

.service-label{

    position:absolute;

    z-index:6;

    font-size:.72rem;

    letter-spacing:.08em;

    color:#62736b;

    background:
        rgba(255,255,255,.92);

    padding:5px 9px;

    border-radius:20px;

    white-space:nowrap;

    box-shadow:
        0 3px 12px
        rgba(70,100,85,.08);

}


/* 午前 */

.morning{

    left:12%;

    top:38%;

}


/* 訪問 */

.visit{

    right:9%;

    top:30%;

}


/* 午後 */

.afternoon{

    right:13%;

    bottom:30%;

}
