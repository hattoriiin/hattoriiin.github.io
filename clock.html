<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="服部医院の外来診療時間。午前診9:00〜12:00、訪問診療13:30〜16:30、午後診17:30〜19:30。"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   アクセシビリティ
================================================== */

/*
 * 時計そのものは aria-hidden="true" なので、
 * スクリーンリーダーには静的な診療時間だけを読ませる。
 *
 * display:none ではなく視覚的にだけ隠すことで、
 * 支援技術からは情報として認識できるようにする。
 */

.sr-only{

    position:absolute;

    width:1px;

    height:1px;

    padding:0;

    margin:-1px;

    overflow:hidden;

    clip:rect(0,0,0,0);

    white-space:nowrap;

    border:0;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    min-width:280px;

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   分目盛り
================================================== */

/*
 * 1分＝6°。
 *
 * すべてを同じ強さにすると目盛りがうるさくなるため、
 *
 * ・1分　→ ごく薄い短い目盛り
 * ・5分　→ 少し長くする
 * ・15分 → さらに明確
 * ・30分 → 最も明確
 *
 * という階層を作る。
 *
 * これにより13:30や17:30など、
 * 「30分」の位置を視覚的に読み取りやすくする。
 */

.minute-tick{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.16;

    vector-effect:non-scaling-stroke;

}


.minute-tick.five{

    opacity:.28;

    stroke-width:1.1;

}


.minute-tick.quarter{

    opacity:.38;

    stroke-width:1.3;

}


.minute-tick.half{

    opacity:.55;

    stroke-width:1.7;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/*
 * ベース帯。
 *
 * 色の土台として使用する。
 * 白抜けは別レイヤーで処理する。
 */

.band-base.blue{

    fill:
        url(#blueBaseGradient);

}


.band-base.green{

    fill:
        url(#greenBaseGradient);

}


/*
 * 白レイヤー。
 *
 * ベース帯より少し内側に配置することで、
 * 外周・内周・始点・終点に色が残る。
 */

.band-inner{

    fill:#fff;

    opacity:.78;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


/*
 * ==================================================
 * 内側 1〜12
 *
 * ここを基準フォントとする。
 * ==================================================
 */

.clock-face .hour12{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


/*
 * 1〜7。
 *
 * 既存のデザイン上、小さめに設定。
 */

.clock-face .hour12.small{

    font-size:15px;

}


/*
 * 12。
 */

.clock-face .hour12.twelve{

    font-size:33px;

}


/*
 * ==================================================
 * 外側 13〜24
 *
 * 内側と同じフォントを使用する。
 * ==================================================
 */

.clock-face .hour24{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:15px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

    opacity:.55;

}


/*
 * 13〜19。
 *
 * 1〜7との視覚的な対応を維持する。
 */

.clock-face .hour24.large{

    font-size:31px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

    transform-box:fill-box;

    transform-origin:center;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

        min-width:280px;

    }


    .clock-face .hour12{

        font-size:29px;

    }


    .clock-face .hour12.small{

        font-size:14px;

    }


    .clock-face .hour12.twelve{

        font-size:31px;

    }


    .clock-face .hour24{

        font-size:14px;

    }


    .clock-face .hour24.large{

        font-size:29px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .page-main{

        padding:.5rem;

    }


    .clock-title{

        font-size:.92rem;

    }


    .time-ring{

        min-width:260px;

    }


    .clock-face .hour12{

        font-size:27px;

    }


    .clock-face .hour12.small{

        font-size:13px;

    }


    .clock-face .hour12.twelve{

        font-size:29px;

    }


    .clock-face .hour24{

        font-size:13px;

    }


    .clock-face .hour24.large{

        font-size:27px;

    }

}


/* ==================================================
   極小画面
================================================== */

/*
 * 画面幅が極端に小さい場合だけ、
 * min-widthによる横溢れを防ぐ。
 */

@media(max-width:300px){

    .time-ring{

        min-width:240px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

        min-width:240px;

    }


    .clock-face .hour12{

        font-size:25px;

    }


    .clock-face .hour12.small{

        font-size:12px;

    }


    .clock-face .hour12.twelve{

        font-size:27px;

    }


    .clock-face .hour24{

        font-size:12px;

    }


    .clock-face .hour24.large{

        font-size:25px;

    }

}


/* ==================================================
   動きを抑える設定への対応
================================================== */

/*
 * OS側で「視差効果を減らす」等が指定されている場合、
 * 秒針を連続運針させず、静かな表示にする。
 *
 * 医療機関サイトとして不要な動きを強制しないための処理。
 */

@media(prefers-reduced-motion:reduce){

    .clock-hand{

        transition:none;

    }

}

</style>

</head>


<body>


<main class="page-main">


<section
    class="clock-area"
    aria-labelledby="clockHeading"
>


<h1
    id="clockHeading"
    class="clock-title"
>
    外来診療時間
</h1>


<!-- ==================================================
     スクリーンリーダー用静的情報
================================================== -->

<div class="sr-only">

    <p>服部医院の外来診療時間です。</p>

    <ul>

        <li>
            午前診：9:00〜12:00
        </li>

        <li>
            訪問診療：13:30〜16:30
        </li>

        <li>
            午後診：17:30〜19:30
        </li>

    </ul>

</div>


<div class="time-ring">


<!-- ==================================================
     時計本体
================================================== -->

<svg
    viewBox="0 0 400 400"
    aria-hidden="true"
    focusable="false"
>


<defs>


<!-- ==================================================
     青：外側のベースグラデーション
================================================== -->

<radialGradient
    id="blueBaseGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="55%"
        stop-color="#3d8bdc"
        stop-opacity=".72"
    />

    <stop
        offset="64%"
        stop-color="#72afe8"
        stop-opacity=".62"
    />

    <stop
        offset="72%"
        stop-color="#a9d2f2"
        stop-opacity=".48"
    />

    <stop
        offset="82%"
        stop-color="#72afe8"
        stop-opacity=".62"
    />

    <stop
        offset="100%"
        stop-color="#3d8bdc"
        stop-opacity=".72"
    />

</radialGradient>


<!-- ==================================================
     緑：外側のベースグラデーション
================================================== -->

<radialGradient
    id="greenBaseGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="55%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

    <stop
        offset="64%"
        stop-color="#95c66f"
        stop-opacity=".62"
    />

    <stop
        offset="72%"
        stop-color="#c5dfa9"
        stop-opacity=".48"
    />

    <stop
        offset="82%"
        stop-color="#95c66f"
        stop-opacity=".62"
    />

    <stop
        offset="100%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

</radialGradient>


</defs>


<!-- ==================================================
     時計盤
================================================== -->

<circle
    class="clock-disc"
    cx="200"
    cy="200"
    r="174"
/>


<!-- ==================================================
     分目盛り
================================================== -->

<g
    id="clockTicks"
    aria-hidden="true"
></g>


<!-- ==================================================
     外周
================================================== -->

<circle
    class="outer-ring"
    cx="200"
    cy="200"
    r="180"
/>


<!-- ==================================================
     時間帯
================================================== -->

<path
    id="morningBand"
    class="time-band band-base blue"
/>


<path
    id="morningWhite"
    class="band-inner"
/>


<path
    id="visitBand"
    class="time-band band-base green"
/>


<path
    id="visitWhite"
    class="band-inner"
/>


<path
    id="eveningBand"
    class="time-band band-base blue"
/>


<path
    id="eveningWhite"
    class="band-inner"
/>


<!-- ==================================================
     時計数字
================================================== -->

<g
    class="clock-face"
    aria-hidden="true"
>

    <g id="clock12"></g>

    <g id="clock24"></g>

</g>


<!-- ==================================================
     時計の針
================================================== -->

<line
    class="clock-hand hour"
    x1="200"
    y1="200"
    x2="200"
    y2="125"
/>


<line
    class="clock-hand minute"
    x1="200"
    y1="200"
    x2="200"
    y2="108"
/>


<line
    class="clock-hand second"
    x1="200"
    y1="200"
    x2="200"
    y2="100"
/>


<!-- ==================================================
     中央
================================================== -->

<circle
    class="clock-center"
    cx="200"
    cy="200"
    r="7"
/>


<circle
    class="clock-dot"
    cx="200"
    cy="200"
    r="3"
/>


</svg>

</div>

</section>

</main>


<script>

/* ==================================================
   時計初期設定
================================================== */

document.addEventListener(
    'DOMContentLoaded',
    function(){

        /*
         * SVGの中心。
         *
         * viewBox 400×400 の中央を共通座標として使用する。
         */

        const SVG_CENTER = 200;


        /*
         * 外周半径。
         *
         * 既存の帯の外側位置を維持する。
         */

        const OUTER_RADIUS = 180;


        /*
         * 内周半径。
         *
         * 既存の帯幅を維持する。
         */

        const INNER_RADIUS = 100;


        /*
         * 帯の角丸。
         *
         * 小さすぎる時間帯でも破綻しないよう、
         * createBandPath() 内で実際の幅に合わせて制限する。
         */

        const CORNER_RADIUS = 5;


        /*
         * 白抜けの放射方向縮小量。
         *
         * 帯の外周・内周に青または緑を残す。
         */

        const WHITE_RADIAL_INSET = 3;


        /*
         * 白抜けの時間方向縮小量。
         *
         * 帯の始点・終点にも色を残す。
         */

        const WHITE_ANGLE_INSET = 1.5;


        /*
         * 内側の12時間数字。
         */

        const INNER_NUMBER_RADIUS = 126;


        /*
         * 外側の24時間数字。
         *
         * 以前より中心方向へ寄せた現在値を維持する。
         */

        const OUTER_NUMBER_RADIUS = 150;


        /*
         * 分目盛りの配置半径。
         *
         * 外側24時間数字より外に置き、
         * 数字と重ならないようにする。
         */

        const TICK_OUTER_RADIUS = 176;


        /*
         * 分目盛りの内側位置。
         *
         * 種類ごとに長さを変える。
         */

        const TICK_INNER_RADIUS = 171;

        const TICK_INNER_RADIUS_FIVE = 169;

        const TICK_INNER_RADIUS_QUARTER = 167;

        const TICK_INNER_RADIUS_HALF = 164;


        /* ==================================================
           DOM要素を一度だけ取得
        ================================================== */

        const morningBand =
            document.getElementById(
                'morningBand'
            );

        const morningWhite =
            document.getElementById(
                'morningWhite'
            );

        const visitBand =
            document.getElementById(
                'visitBand'
            );

        const visitWhite =
            document.getElementById(
                'visitWhite'
            );

        const eveningBand =
            document.getElementById(
                'eveningBand'
            );

        const eveningWhite =
            document.getElementById(
                'eveningWhite'
            );

        const clock12 =
            document.getElementById(
                'clock12'
            );

        const clock24 =
            document.getElementById(
                'clock24'
            );

        const clockTicks =
            document.getElementById(
                'clockTicks'
            );

        const hourHand =
            document.querySelector(
                '.clock-hand.hour'
            );

        const minuteHand =
            document.querySelector(
                '.clock-hand.minute'
            );

        const secondHand =
            document.querySelector(
                '.clock-hand.second'
            );


        /*
         * 必須DOMが欠けている場合は、
         * JavaScriptだけがエラーを連発しないよう初期化を中止する。
         *
         * HTML構造のミスをコンソールへ1回だけ通知する。
         */

        if(
            !morningBand ||
            !morningWhite ||
            !visitBand ||
            !visitWhite ||
            !eveningBand ||
            !eveningWhite ||
            !clock12 ||
            !clock24 ||
            !clockTicks ||
            !hourHand ||
            !minuteHand ||
            !secondHand
        ){

            console.error(
                '時計の初期化に必要な要素が見つかりません。'
            );

            return;

        }


        /* ==================================================
           時刻 → 時計角度
        ================================================== */

        /**
         * 時刻を12時間時計上の角度へ変換する。
         *
         * 12時を0°とし、時計回りを正方向とする。
         *
         * @param {number} hour 時刻の時
         * @param {number} minute 時刻の分
         * @returns {number} 0〜360°の時計角度
         * @throws {TypeError} 数値でない場合
         * @throws {RangeError} 時・分の範囲が不正な場合
         *
         * @example
         * timeToClockAngle(9, 0); // 270
         */

        function timeToClockAngle(
            hour,
            minute
        ){

            if(
                !Number.isFinite(hour) ||
                !Number.isFinite(minute)
            ){

                throw new TypeError(
                    '時刻は数値で指定してください。'
                );

            }


            if(
                !Number.isInteger(hour) ||
                hour < 0 ||
                hour > 23
            ){

                throw new RangeError(
                    '時は0〜23の整数で指定してください。'
                );

            }


            if(
                !Number.isInteger(minute) ||
                minute < 0 ||
                minute > 59
            ){

                throw new RangeError(
                    '分は0〜59の整数で指定してください。'
                );

            }


            return (
                (
                    (hour % 12) * 30
                ) +
                minute * .5
            ) % 360;

        }


        /* ==================================================
           角度正規化
        ================================================== */

        /**
         * 角度を0〜360°へ正規化する。
         *
         * @param {number} angle 角度
         * @returns {number} 正規化された角度
         * @throws {TypeError} 数値でない場合
         *
         * @example
         * normalizeAngle(-30); // 330
         */

        function normalizeAngle(
            angle
        ){

            if(
                !Number.isFinite(angle)
            ){

                throw new TypeError(
                    '角度は数値で指定してください。'
                );

            }


            return (
                angle % 360 +
                360
            ) % 360;

        }


        /* ==================================================
           時計角度 → SVG角度
        ================================================== */

        /**
         * 時計角度をSVG角度へ変換する。
         *
         * @param {number} clockAngle 時計角度
         * @returns {number} SVG角度
         *
         * @example
         * clockToSvgAngle(0); // -90
         */

        function clockToSvgAngle(
            clockAngle
        ){

            return clockAngle - 90;

        }


        /* ==================================================
           極座標 → SVG座標
        ================================================== */

        /**
         * 極座標をSVG座標へ変換する。
         *
         * @param {number} radius 半径
         * @param {number} svgAngle SVG角度
         * @returns {{x:number,y:number}} SVG座標
         *
         * @example
         * polarToPoint(180, -90);
         */

        function polarToPoint(
            radius,
            svgAngle
        ){

            if(
                !Number.isFinite(radius) ||
                !Number.isFinite(svgAngle)
            ){

                throw new TypeError(
                    '半径と角度は数値で指定してください。'
                );

            }


            const radians =
                svgAngle *
                Math.PI /
                180;


            return {

                x:
                    SVG_CENTER +
                    radius *
                    Math.cos(radians),

                y:
                    SVG_CENTER +
                    radius *
                    Math.sin(radians)

            };

        }


        /* ==================================================
           時計座標
        ================================================== */

        /**
         * 時計角度からSVG座標を取得する。
         *
         * @param {number} radius 半径
         * @param {number} clockAngle 時計角度
         * @returns {{x:number,y:number}} SVG座標
         *
         * @example
         * clockPoint(150, 90);
         */

        function clockPoint(
            radius,
            clockAngle
        ){

            return polarToPoint(
                radius,
                clockToSvgAngle(
                    clockAngle
                )
            );

        }


        /* ==================================================
           円環帯生成
        ================================================== */

        /**
         * 閉じた円環状の時間帯を生成する。
         *
         * 終了時刻が開始時刻より前の場合も、
         * 時計を1周して終了する日跨ぎとして扱う。
         *
         * 例：
         * 21:00 → 2:00
         *
         * @param {number} startHour 開始時
         * @param {number} startMinute 開始分
         * @param {number} endHour 終了時
         * @param {number} endMinute 終了分
         * @param {number} radialInset 放射方向の縮小量
         * @param {number} angleInset 角度方向の縮小量
         * @returns {string} SVG path
         * @throws {RangeError} 時間帯が不正な場合
         *
         * @example
         * createBandPath(9,0,12,0);
         */

        function createBandPath(
            startHour,
            startMinute,
            endHour,
            endMinute,
            radialInset = 0,
            angleInset = 0
        ){

            const start =
                timeToClockAngle(
                    startHour,
                    startMinute
                );


            const end =
                timeToClockAngle(
                    endHour,
                    endMinute
                );


            /*
             * まず通常の差分を求める。
             *
             * 終了側が小さい場合は、
             * 360°を足して日跨ぎを表現する。
             */

            let sweep =
                end - start;


            if(
                sweep < 0
            ){

                sweep += 360;

            }


            /*
             * 同じ時刻は「12時間帯」と解釈すると
             * 意図しない巨大な帯になる可能性があるため拒否する。
             */

            if(
                sweep === 0
            ){

                throw new RangeError(
                    '開始時刻と終了時刻を同じにはできません。'
                );

            }


            /*
             * 12時間を超える診療帯は、
             * この時計の1周構造では表現しない。
             */

            if(
                sweep > 360
            ){

                throw new RangeError(
                    '時間帯は12時間以内で指定してください。'
                );

            }


            const outerRadius =
                OUTER_RADIUS -
                radialInset;


            const innerRadius =
                INNER_RADIUS +
                radialInset;


            if(
                innerRadius >= outerRadius
            ){

                throw new RangeError(
                    '帯の内外半径が逆転しています。'
                );

            }


            const localStart =
                start +
                angleInset;


            const localEnd =
                start +
                sweep -
                angleInset;


            const localSweep =
                localEnd -
                localStart;


            if(
                localSweep <= 0
            ){

                throw new RangeError(
                    '白抜けによって帯の角度範囲がなくなりました。'
                );

            }


            /*
             * 角丸半径は帯幅を超えないよう制限する。
             */

            const r =
                Math.min(
                    CORNER_RADIUS,
                    (outerRadius - innerRadius) / 2 - .5
                );


            if(
                r <= 0
            ){

                throw new RangeError(
                    '帯幅が狭すぎて角丸を作れません。'
                );

            }


            const outerFilletRadius =
                outerRadius - r;


            const outerDelta =
                Math.asin(
                    r /
                    outerFilletRadius
                ) *
                180 /
                Math.PI;


            const innerFilletRadius =
                innerRadius + r;


            const innerDelta =
                Math.asin(
                    r /
                    innerFilletRadius
                ) *
                180 /
                Math.PI;


            const outerStart =
                clockPoint(
                    outerRadius,
                    localStart +
                    outerDelta
                );


            const outerEnd =
                clockPoint(
                    outerRadius,
                    localEnd -
                    outerDelta
                );


            const innerEnd =
                clockPoint(
                    innerRadius,
                    localEnd -
                    innerDelta
                );


            const innerStart =
                clockPoint(
                    innerRadius,
                    localStart +
                    innerDelta
                );


            const outerStartTangent =
                clockPoint(
                    outerFilletRadius *
                    Math.cos(
                        outerDelta *
                        Math.PI /
                        180
                    ),
                    localStart
                );


            const innerStartTangent =
                clockPoint(
                    innerFilletRadius *
                    Math.cos(
                        innerDelta *
                        Math.PI /
                        180
                    ),
                    localStart
                );


            const outerEndTangent =
                clockPoint(
                    outerFilletRadius *
                    Math.cos(
                        outerDelta *
                        Math.PI /
                        180
                    ),
                    localEnd
                );


            const innerEndTangent =
                clockPoint(
                    innerFilletRadius *
                    Math.cos(
                        innerDelta *
                        Math.PI /
                        180
                    ),
                    localEnd
                );


            const largeArcFlag =
                localSweep > 180
                    ? 1
                    : 0;


            return [

                `M ${outerStart.x} ${outerStart.y}`,

                `A ${outerRadius} ${outerRadius} 0 ${largeArcFlag} 1 ${outerEnd.x} ${outerEnd.y}`,

                `A ${r} ${r} 0 0 1 ${outerEndTangent.x} ${outerEndTangent.y}`,

                `L ${innerEndTangent.x} ${innerEndTangent.y}`,

                `A ${r} ${r} 0 0 1 ${innerEnd.x} ${innerEnd.y}`,

                `A ${innerRadius} ${innerRadius} 0 ${largeArcFlag} 0 ${innerStart.x} ${innerStart.y}`,

                `A ${r} ${r} 0 0 1 ${innerStartTangent.x} ${innerStartTangent.y}`,

                `L ${outerStartTangent.x} ${outerStartTangent.y}`,

                `A ${r} ${r} 0 0 1 ${outerStart.x} ${outerStart.y}`,

                'Z'

            ].join(' ');

        }


        /* ==================================================
           帯設定
        ================================================== */

        /**
         * 指定したSVG要素へ時間帯パスを設定する。
         *
         * @param {SVGPathElement} element 対象path
         * @param {number} startHour 開始時
         * @param {number} startMinute 開始分
         * @param {number} endHour 終了時
         * @param {number} endMinute 終了分
         * @returns {boolean} 成功した場合true
         *
         * @example
         * setBand(morningBand, 9, 0, 12, 0);
         */

        function setBand(
            element,
            startHour,
            startMinute,
            endHour,
            endMinute
        ){

            try{

                element.setAttribute(
                    'd',
                    createBandPath(
                        startHour,
                        startMinute,
                        endHour,
                        endMinute
                    )
                );


                return true;

            }

            catch(error){

                console.error(
                    '時間帯の描画に失敗しました。',
                    error
                );


                return false;

            }

        }


        /* ==================================================
           白レイヤー設定
        ================================================== */

        /**
         * ベース帯より小さい白レイヤーを設定する。
         *
         * @param {SVGPathElement} element 対象path
         * @param {number} startHour 開始時
         * @param {number} startMinute 開始分
         * @param {number} endHour 終了時
         * @param {number} endMinute 終了分
         * @returns {boolean} 成功した場合true
         *
         * @example
         * setWhiteBand(morningWhite, 9, 0, 12, 0);
         */

        function setWhiteBand(
            element,
            startHour,
            startMinute,
            endHour,
            endMinute
        ){

            try{

                element.setAttribute(
                    'd',
                    createBandPath(
                        startHour,
                        startMinute,
                        endHour,
                        endMinute,
                        WHITE_RADIAL_INSET,
                        WHITE_ANGLE_INSET
                    )
                );


                return true;

            }

            catch(error){

                console.error(
                    '白レイヤーの描画に失敗しました。',
                    error
                );


                return false;

            }

        }


        /* ==================================================
           分目盛り生成
        ================================================== */

        /**
         * 1分ごとの目盛りを生成する。
         *
         * 1分＝6°として60個の目盛りを配置する。
         *
         * 5分、15分、30分で長さと濃さを変えることで、
         * 30分単位の診療時間を読み取りやすくする。
         *
         * @returns {void}
         *
         * @example
         * createMinuteTicks();
         */

        function createMinuteTicks(){

            const fragment =
                document.createDocumentFragment();


            for(
                let minute = 0;
                minute < 60;
                minute++
            ){

                const angle =
                    minute * 6;


                let innerRadius =
                    TICK_INNER_RADIUS;

                let className =
                    'minute-tick';


                if(
                    minute % 30 === 0
                ){

                    innerRadius =
                        TICK_INNER_RADIUS_HALF;

                    className +=
                        ' half';

                }

                else if(
                    minute % 15 === 0
                ){

                    innerRadius =
                        TICK_INNER_RADIUS_QUARTER;

                    className +=
                        ' quarter';

                }

                else if(
                    minute % 5 === 0
                ){

                    innerRadius =
                        TICK_INNER_RADIUS_FIVE;

                    className +=
                        ' five';

                }


                const outerPoint =
                    clockPoint(
                        TICK_OUTER_RADIUS,
                        angle
                    );


                const innerPoint =
                    clockPoint(
                        innerRadius,
                        angle
                    );


                const line =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'line'
                    );


                line.setAttribute(
                    'class',
                    className
                );


                line.setAttribute(
                    'x1',
                    outerPoint.x
                );


                line.setAttribute(
                    'y1',
                    outerPoint.y
                );


                line.setAttribute(
                    'x2',
                    innerPoint.x
                );


                line.setAttribute(
                    'y2',
                    innerPoint.y
                );


                /*
                 * aria-hiddenは親グループでも指定しているが、
                 * 生成要素単体でも装飾要素であることを明確にする。
                 */

                line.setAttribute(
                    'aria-hidden',
                    'true'
                );


                fragment.appendChild(
                    line
                );

            }


            clockTicks.appendChild(
                fragment
            );

        }


        /* ==================================================
           時計数字生成
        ================================================== */

        /**
         * 12時間表示と24時間表示を生成する。
         *
         * @returns {void}
         *
         * @example
         * createClockNumbers();
         */

        function createClockNumbers(){

            /*
             * 再実行時に数字が二重にならないよう、
             * 既存内容を先に消去する。
             */

            clock12.replaceChildren();

            clock24.replaceChildren();


            /*
             * ------------------------------
             * 1〜12
             * ------------------------------
             */

            for(
                let hour = 1;
                hour <= 12;
                hour++
            ){

                const clockAngle =
                    hour === 12
                        ? 0
                        : hour * 30;


                const point =
                    clockPoint(
                        INNER_NUMBER_RADIUS,
                        clockAngle
                    );


                const text =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'text'
                    );


                let className =
                    'hour12';


                /*
                 * 1〜7だけ小さくする。
                 *
                 * 8〜11は基準サイズ、
                 * 12は専用サイズとする。
                 */

                if(
                    hour >= 1 &&
                    hour <= 7
                ){

                    className +=
                        ' small';

                }


                if(
                    hour === 12
                ){

                    className +=
                        ' twelve';

                }


                text.setAttribute(
                    'class',
                    className
                );


                text.setAttribute(
                    'x',
                    point.x
                );


                text.setAttribute(
                    'y',
                    point.y
                );


                text.textContent =
                    String(hour);


                clock12.appendChild(
                    text
                );

            }


            /*
             * ------------------------------
             * 13〜24
             * ------------------------------
             *
             * 12時方向 → 24
             * 1時方向  → 13
             * 2時方向  → 14
             * …
             * 11時方向 → 23
             */

            for(
                let hour = 0;
                hour < 12;
                hour++
            ){

                const clockAngle =
                    hour * 30;


                const displayHour =
                    hour === 0
                        ? 24
                        : hour + 12;


                const point =
                    clockPoint(
                        OUTER_NUMBER_RADIUS,
                        clockAngle
                    );


                const text =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'text'
                    );


                const className =
                    displayHour >= 13 &&
                    displayHour <= 19
                        ? 'hour24 large'
                        : 'hour24';


                text.setAttribute(
                    'class',
                    className
                );


                text.setAttribute(
                    'x',
                    point.x
                );


                text.setAttribute(
                    'y',
                    point.y
                );


                text.textContent =
                    String(displayHour);


                clock24.appendChild(
                    text
                );

            }

        }


        /* ==================================================
           診療時間の描画
        ================================================== */

        /*
         * 午前診
         * 9:00 → 12:00
         */

        setBand(
            morningBand,
            9,
            0,
            12,
            0
        );


        setWhiteBand(
            morningWhite,
            9,
            0,
            12,
            0
        );


        /*
         * 訪問診療
         * 13:30 → 16:30
         */

        setBand(
            visitBand,
            13,
            30,
            16,
            30
        );


        setWhiteBand(
            visitWhite,
            13,
            30,
            16,
            30
        );


        /*
         * 午後診
         * 17:30 → 19:30
         */

        setBand(
            eveningBand,
            17,
            30,
            19,
            30
        );


        setWhiteBand(
            eveningWhite,
            17,
            30,
            19,
            30
        );


        /* ==================================================
           静的グラフィック生成
        ================================================== */

        createMinuteTicks();

        createClockNumbers();


        /* ==================================================
           日本時間の取得
        ================================================== */

        /**
         * 現在の日本時間をUnixミリ秒から算出する。
         *
         * 日本はUTC+9で、現在DSTを採用していないため、
         * 毎フレームIntl.DateTimeFormatを呼び出す必要がない。
         *
         * @returns {number} 日本時間として扱うUTC基準ミリ秒
         *
         * @example
         * const ms = getJapanTimestamp();
         */

        function getJapanTimestamp(){

            return (
                Date.now() +
                9 * 60 * 60 * 1000
            );

        }


        /* ==================================================
           時計針更新
        ================================================== */

        /**
         * 現在時刻に合わせて3本の針を連続的に更新する。
         *
         * 秒未満まで計算することで、
         * 1秒ごとの「カチッ」という動きではなく、
         * 滑らかな連続運針を実現する。
         *
         * @param {number} timestamp 日本時間のUnixミリ秒
         * @returns {void}
         *
         * @example
         * updateClock(Date.now() + 9 * 3600000);
         */

        function updateClock(
            timestamp
        ){

            /*
             * 1時間 = 3,600,000ms
             * 1分   = 60,000ms
             */

            const millisecondsInHour =
                60 * 60 * 1000;

            const millisecondsInMinute =
                60 * 1000;


            const hour =
                Math.floor(
                    timestamp /
                    millisecondsInHour
                ) % 24;


            const minute =
                Math.floor(
                    (
                        timestamp %
                        millisecondsInHour
                    ) /
                    millisecondsInMinute
                );


            const secondFraction =
                (
                    timestamp %
                    millisecondsInMinute
                ) /
                millisecondsInMinute;


            /*
             * 秒針。
             *
             * 1分で360°回転する。
             */

            const secondAngle =
                secondFraction * 360;


            /*
             * 分針。
             *
             * 秒の進行も含めるため、
             * 分の途中でも滑らかに移動する。
             */

            const minuteAngle =
                (
                    minute +
                    secondFraction
                ) *
                6;


            /*
             * 時針。
             *
             * 分・秒まで含めて滑らかに進む。
             */

            const hourAngle =
                (
                    (
                        hour % 12
                    ) +
                    (
                        minute +
                        secondFraction
                    ) / 60
                ) *
                30;


            /*
             * SVGのrotate()は1行の文字列として生成する。
             *
             * 不要な改行を入れず、
             * SVGパーサーによる解釈の曖昧さを避ける。
             */

            hourHand.setAttribute(
                'transform',
                `rotate(${hourAngle} 200 200)`
            );


            minuteHand.setAttribute(
                'transform',
                `rotate(${minuteAngle} 200 200)`
            );


            secondHand.setAttribute(
                'transform',
                `rotate(${secondAngle} 200 200)`
            );

        }


        /* ==================================================
           アニメーション
        ================================================== */

        let animationFrameId =
            null;


        /**
         * requestAnimationFrameによる連続運針を開始する。
         *
         * 毎フレームDOM検索やIntl処理を行わず、
         * 数値計算と3本の針の更新だけを行う。
         *
         * @returns {void}
         */

        function animateClock(){

            updateClock(
                getJapanTimestamp()
            );


            animationFrameId =
                requestAnimationFrame(
                    animateClock
                );

        }


        /* ==================================================
           初期表示
        ================================================== */

        updateClock(
            getJapanTimestamp()
        );


        /* ==================================================
           時計開始
        ================================================== */

        animationFrameId =
            requestAnimationFrame(
                animateClock
            );


        /*
         * animationFrameIdは、将来このページに
         * ページ離脱時の停止処理などを追加する際にも
         * 利用できるよう保持している。
         *
         * 現時点ではブラウザがページ終了時に自動的に破棄する。
         */

        void animationFrameId;

    }
);

</script>


</body>
