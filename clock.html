<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

</head>


<body>


<main class="page-main">


<section class="clock-area">


<h1 class="clock-title">
    外来診療時間
</h1>


<div class="time-ring">


<svg
    viewBox="0 0 400 400"
    role="img"
    aria-label="服部医院 外来診療時間"
>


<defs>


<!-- ==================================================
     外来診療グラデーション
     
     青と緑で「見かけ上の帯幅」が同じになるよう、
     stop位置を訪問診療側と完全に統一する。
     
     重要：
     - 帯そのもののR180/R100は変更しない
     - 時間位置には影響しない
     - 色だけを内側→外側へ同じ構造で変化させる
================================================== -->

<radialGradient
    id="outpatientGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <!-- 内側：白 -->
    <stop
        offset="68%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="73%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <!-- 色が徐々に現れる -->
    <stop
        offset="77%"
        stop-color="#8fc7ff"
        stop-opacity=".52"
    />

    <!-- 青の中心部 -->
    <stop
        offset="82%"
        stop-color="#3d8bdc"
        stop-opacity=".72"
    />

    <stop
        offset="87%"
        stop-color="#3d8bdc"
        stop-opacity=".80"
    />

    <!-- 外側へ向かって白へ戻す -->
    <stop
        offset="91%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="95%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <!-- 最外周に青を残す -->
    <stop
        offset="100%"
        stop-color="#3d8bdc"
        stop-opacity=".82"
    />

</radialGradient>


<!-- ==================================================
     訪問診療グラデーション
     
     青とまったく同じstop位置を使用。
     そのため、色の「見かけ上の幅」が一致する。
================================================== -->

<radialGradient
    id="visitGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <!-- 内側：白 -->
    <stop
        offset="68%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="73%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <!-- 色が徐々に現れる -->
    <stop
        offset="77%"
        stop-color="#b7e88a"
        stop-opacity=".52"
    />

    <!-- 緑の中心部 -->
    <stop
        offset="82%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

    <stop
        offset="87%"
        stop-color="#70ad47"
        stop-opacity=".80"
    />

    <!-- 外側へ向かって白へ戻す -->
    <stop
        offset="91%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="95%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <!-- 最外周に緑を残す -->
    <stop
        offset="100%"
        stop-color="#70ad47"
        stop-opacity=".82"
    />

</radialGradient>


</defs>


<!-- ==================================================
     時計盤
================================================== -->

<circle
    class="clock-disc"
    cx="200"
    cy="200"
    r="174"
/>


<!-- ==================================================
     外周
================================================== -->

<circle
    class="outer-ring"
    cx="200"
    cy="200"
    r="180"
/>


<!-- ==================================================
     時間帯
================================================== -->

<path
    id="morningBand"
    class="time-band"
/>


<path
    id="visitBand"
    class="time-band"
/>


<path
    id="eveningBand"
    class="time-band"
/>


<!-- ==================================================
     時計数字
================================================== -->

<g class="clock-face">

<text
    class="twelve"
    x="200"
    y="62"
>
    12
</text>

<text x="269" y="80">1</text>

<text x="319" y="130">2</text>

<text x="338" y="200">3</text>

<text x="319" y="270">4</text>

<text x="269" y="320">5</text>

<text x="200" y="338">6</text>

<text x="131" y="320">7</text>

<text x="81" y="270">8</text>

<text x="62" y="200">9</text>

<text x="81" y="130">10</text>

<text x="131" y="80">11</text>

</g>


<!-- ==================================================
     時計の針

     初期位置は12時。
     rotate()では時計角度をそのまま使用する。
================================================== -->

<line
    class="clock-hand hour"
    x1="200"
    y1="200"
    x2="200"
    y2="125"
/>


<line
    class="clock-hand minute"
    x1="200"
    y1="200"
    x2="200"
    y2="108"
/>


<line
    class="clock-hand second"
    x1="200"
    y1="200"
    x2="200"

/>


<!-- ==================================================
     中央
================================================== -->

<circle
    class="clock-center"
    cx="200"
    cy="200"
    r="7"
/>


<circle
    class="clock-dot"
    cx="200"
    cy="200"
    r="3"
/>


</svg>

</div>

</section>

</main>


<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;


/*
 * 外周半径。
 *
 * 既存デザインを維持するため180px固定。
 */

const OUTER_RADIUS = 180;


/*
 * 内周半径。
 *
 * 既存デザインを維持するため100px固定。
 */

const INNER_RADIUS = 100;


/*
 * 角丸半径。
 *
 * 帯幅80pxの範囲内に収める。
 */

const CORNER_RADIUS = 10;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計上の角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度（0〜360°）
 * @throws {TypeError} 時刻が数値でない場合
 * @throws {RangeError} 分が0〜59でない場合
 *
 * @example
 * timeToClockAngle(9, 0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30)
        +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * 時間帯の円弧を正しく時計方向へ配置するため、
 * SVGの0°（3時方向）から90°戻して12時を基準にする。
 *
 * 注意：
 * 時計の針には使用しない。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 *
 * @example
 * clockToSvgAngle(0); // -90
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   角度正規化
================================================== */

/**
 * 角度を0〜360°へ正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化された角度
 *
 * @example
 * normalizeAngle(-30); // 330
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 円周上の点をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} SVG座標
 *
 * @example
 * polarToPoint(180, -90);
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   角丸円環帯を生成
================================================== */

/**
 * 円環状の時間帯を生成する。
 *
 * 外周R180、内周R100を維持し、
 * 時間帯の4隅だけを角丸にする。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 * @throws {RangeError} 不正な時間範囲の場合
 *
 * @example
 * createBandPath(9,0,12,0);
 */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '開始時刻と終了時刻の角度が不正です'
        );

    }


    /*
     * 帯幅。
     *
     * 180 - 100 = 80px。
     *
     * この値は変更しない。
     */

    const bandWidth =
        OUTER_RADIUS -
        INNER_RADIUS;


    /*
     * 角丸半径が帯幅を超えないよう制限。
     */

    const radius =
        Math.min(
            CORNER_RADIUS,
            bandWidth / 2 - 0.5
        );


    /*
     * 外周側フィレット中心。
     */

    const outerCenterRadius =
        OUTER_RADIUS -
        radius;


    const outerOffset =
        Math.asin(
            radius /
            outerCenterRadius
        );


    /*
     * 内周側フィレット中心。
     */

    const innerCenterRadius =
        INNER_RADIUS +
        radius;


    const innerOffset =
        Math.asin(
            radius /
            innerCenterRadius
        );


    /*
     * ラジアン → 度。
     */

    const outerOffsetDeg =
        outerOffset *
        180 /
        Math.PI;


    const innerOffsetDeg =
        innerOffset *
        180 /
        Math.PI;


    /*
     * 外周円との接点。
     */

    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                start +
                outerOffsetDeg
            )
        );


    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                end -
                outerOffsetDeg
            )
        );


    /*
     * 内周円との接点。
     */

    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                start +
                innerOffsetDeg
            )
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                end -
                innerOffsetDeg
            )
        );


    /*
     * 端面接点の半径。
     */

    const outerStartTangentRadius =
        outerCenterRadius *
        Math.cos(
            outerOffset
        );


    const innerStartTangentRadius =
        innerCenterRadius *
        Math.cos(
            innerOffset
        );


    const outerEndTangentRadius =
        outerStartTangentRadius;


    const innerEndTangentRadius =
        innerStartTangentRadius;


    /*
     * 始点側端面。
     */

    const outerStartTangent =
        polarToPoint(
            outerStartTangentRadius,
            clockToSvgAngle(start)
        );


    const innerStartTangent =
        polarToPoint(
            innerStartTangentRadius,
            clockToSvgAngle(start)
        );


    /*
     * 終点側端面。
     */

    const outerEndTangent =
        polarToPoint(
            outerEndTangentRadius,
            clockToSvgAngle(end)
        );


    const innerEndTangent =
        polarToPoint(
            innerEndTangentRadius,
            clockToSvgAngle(end)
        );


    /*
     * 180°を超える場合だけ
     * large-arc-flagを1にする。
     */

    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    /*
     * SVGパスを構築。
     */

    return [

        /*
         * 外周開始点
         */

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        /*
         * 外周円弧
         */

        `A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        /*
         * 終点外側の角丸
         */

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerEndTangent.x}
        ${outerEndTangent.y}`,

        /*
         * 終点直線
         */

        `L
        ${innerEndTangent.x}
        ${innerEndTangent.y}`,

        /*
         * 終点内側の角丸
         */

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerEnd.x}
        ${innerEnd.y}`,

        /*
         * 内周円弧
         */

        `A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        /*
         * 始点内側の角丸
         */

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerStartTangent.x}
        ${innerStartTangent.y}`,

        /*
         * 始点直線
         */

        `L
        ${outerStartTangent.x}
        ${outerStartTangent.y}`,

        /*
         * 始点外側の角丸
         */

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerStart.x}
        ${outerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================
   帯を設定
================================================== */

/**
 * 指定したSVG要素へ時間帯を設定する。
 *
 * @param {string} id SVG pathのID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} gradient グラデーションID
 * @returns {void}
 *
 * @example
 * setBand(
 *     'morningBand',
 *     9,
 *     0,
 *     12,
 *     0,
 *     'outpatientGradient'
 * );
 */

function setBand(
    id,
    startHour,
    startMinute,
    endHour,
    endMinute,
    gradient
){

    const element =
        document.getElementById(id);


    if(!element){

        console.error(
            `SVG要素 ${id} が見つかりません`
        );

        return;

    }


    /*
     * 使用可能なグラデーションを限定。
     *
     * 外部入力をそのままCSSへ渡さないため、
     * CSSインジェクションのリスクを避ける。
     */

    const allowedGradients = new Set([
        'outpatientGradient',
        'visitGradient'
    ]);


    if(
        !allowedGradients.has(gradient)
    ){

        console.error(
            `許可されていないグラデーションです: ${gradient}`
        );

        return;

    }


    try{

        element.setAttribute(
            'd',
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        element.style.fill =
            `url(#${gradient})`;

    }

    catch(error){

        console.error(
            `${id} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningBand',
    9,
    0,
    12,
    0,
    'outpatientGradient'
);


/* ==================================================
   訪問診療
   13:30 → 16:30
================================================== */

setBand(
    'visitBand',
    13,
    30,
    16,
    30,
    'visitGradient'
);


/* ==================================================
   午後診
   17:30 → 19:30
================================================== */

setBand(
    'eveningBand',
    17,
    30,
    19,
    30,
    'outpatientGradient'
);


/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 *
 * @throws {Error} 日本時間を取得できない場合
 *
 * @example
 * const now = getJapanTime();
 */

function getJapanTime(){

    try{

        const parts =
            new Intl.DateTimeFormat(
                'en-US',
                {
                    timeZone:'Asia/Tokyo',

                    hour12:false,

                    hour:'2-digit',
                    minute:'2-digit',
                    second:'2-digit'
                }
            ).formatToParts(
                new Date()
            );


        const result = {};


        parts.forEach(
            part => {

                if(
                    part.type === 'hour' ||
                    part.type === 'minute' ||
                    part.type === 'second'
                ){

                    result[part.type] =
                        Number(part.value);

                }

            }
        );


        /*
         * 一部環境で深夜0時が24として返る場合に
         * 0へ正規化する。
         */

        if(
            result.hour === 24
        ){

            result.hour = 0;

        }


        if(
            !Number.isInteger(result.hour) ||
            !Number.isInteger(result.minute) ||
            !Number.isInteger(result.second)
        ){

            throw new Error(
                '日本時間の取得結果が不正です'
            );

        }


        return result;

    }

    catch(error){

        console.error(
            '日本時間の取得に失敗しました',
            error
        );

        throw error;

    }

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * 針はHTML上で12時方向を向いているため、
 * rotate()へ時計角度を直接渡す。
 *
 * @returns {void}
 *
 * @example
 * updateClock();
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新を停止しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針。
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針。
     *
     * 秒も反映して滑らかに動かす。
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針。
     *
     * 分・秒まで反映する。
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    /*
     * 必要なSVG要素がない場合は停止。
     */

    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * 針の角度。
     *
     * clockToSvgAngle()は使わない。
     *
     * 0°  = 12時
     * 90° = 3時
     * 180° = 6時
     * 270° = 9時
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    /*
     * 次のフレームで更新。
     */

    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>
