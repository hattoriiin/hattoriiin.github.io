<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

</head>

<defs>

<!-- ==================================================

<circle

<!-- ==================================================
     時間帯
     
     「袋とじ専用の別パス」は作らない。
     
     各pathそのものが、
     
     外周
       ↓
     終点側の角丸
       ↓

       ↓
     内周
       ↓

================================================== -->

<path

<path

</section>

<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;


/*
 * 外周。
 *
 * これを変えないことで、
 * 時計の外側位置が変わらない。
 */

const OUTER_RADIUS = 180;


/*
 * 内周。
 *
 * 外周180 - 内周100 = 帯幅80。
 */

const INNER_RADIUS = 100;


/*
 * 帯幅。
 */

const BAND_WIDTH =
    OUTER_RADIUS -
    INNER_RADIUS;


/*
 * 角丸半径。
 *
 * 端面そのものを外側へ膨らませず、
 * R180の内側、R100の外側だけで処理する。
 */

const CORNER_RADIUS = 10;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度
 * @throws {TypeError} 数値でない場合
 * @throws {RangeError} 分が0〜59以外の場合
 *
 * @example
 * timeToClockAngle(9,0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30) +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   角度正規化
================================================== */

/**
 * 角度を0〜360°に正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化角度
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 極座標をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} SVG座標
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   角丸円環帯
================================================== */

/**
 * 完全に閉じた角丸円環帯を生成する。
 *
 * 今回の重要部分。
 *
 * 「袋とじ」を別オブジェクトとして重ねない。
 *
 * 1本のpathの中で、
 *
 *   外周円弧
 *   ↓
 *   終点外側角丸
 *   ↓
 *   終点の端面
 *   ↓
 *   終点内側角丸
 *   ↓
 *   内周円弧
 *   ↓
 *   始点内側角丸
 *   ↓
 *   始点の端面
 *   ↓
 *   始点外側角丸
 *   ↓
 *   Z
 *
 * として完全に閉じる。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 * @throws {RangeError} 時間範囲が不正な場合
 *
 * @example
 * createBandPath(9,0,12,0);
 */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '開始時刻と終了時刻の範囲が不正です'
        );

    }


    /*
     * 角丸半径を帯幅の半分未満に制限。
     *
     * これにより自己交差を防ぐ。
     */

    const radius =
        Math.min(
            CORNER_RADIUS,
            BAND_WIDTH / 2 - 0.5
        );


    /*
     * ----------------------------------------------
     * 外側角丸の中心半径
     * ----------------------------------------------
     */

    const outerCenterRadius =
        OUTER_RADIUS -
        radius;


    /*
     * ----------------------------------------------
     * 内側角丸の中心半径
     * ----------------------------------------------
     */

    const innerCenterRadius =
        INNER_RADIUS +
        radius;


    /*
     * ----------------------------------------------
     * 接線角
     *
     * 外周・内周それぞれに
     * 真円フィレットを接続する。
     * ----------------------------------------------
     */

    const outerOffset =
        Math.asin(
            radius /
            outerCenterRadius
        );


    const innerOffset =
        Math.asin(
            radius /
            innerCenterRadius
        );


    const outerOffsetDeg =
        outerOffset *
        180 /
        Math.PI;


    const innerOffsetDeg =
        innerOffset *
        180 /
        Math.PI;


    /*
     * ----------------------------------------------
     * 外周側接点
     * ----------------------------------------------
     */

    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                start +
                outerOffsetDeg
            )
        );


    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                end -
                outerOffsetDeg
            )
        );


    /*
     * ----------------------------------------------
     * 内周側接点
     * ----------------------------------------------
     */

    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                start +
                innerOffsetDeg
            )
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                end -
                innerOffsetDeg
            )
        );


    /*
     * ----------------------------------------------
     * 端面側の接点
     *
     * ここが重要。
     *
     * R180とR100を同じ時間角度上で
     * 直接つなぐのではなく、
     * 角丸の接点までを正確につなぐ。
     *
     * この直線部分が「閉じた端面」になる。
     * ----------------------------------------------
     */

    const outerTangentRadius =
        outerCenterRadius *
        Math.cos(
            outerOffset
        );


    const innerTangentRadius =
        innerCenterRadius *
        Math.cos(
            innerOffset
        );


    const outerStartTangent =
        polarToPoint(
            outerTangentRadius,
            clockToSvgAngle(start)
        );


    const innerStartTangent =
        polarToPoint(
            innerTangentRadius,
            clockToSvgAngle(start)
        );


    const outerEndTangent =
        polarToPoint(
            outerTangentRadius,
            clockToSvgAngle(end)
        );


    const innerEndTangent =
        polarToPoint(
            innerTangentRadius,
            clockToSvgAngle(end)
        );


    /*
     * ----------------------------------------------
     * 大円弧フラグ
     * ----------------------------------------------
     */

    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    /*
     * ----------------------------------------------
     * 完全閉鎖パス
     *
     * ここでは「袋とじ」を別に作らない。
     *
     * L命令による端面が、
     * 本体の一部として存在する。
     *
     * そのため、同じfillを一度指定するだけで
     * 端面にも同じradialGradientが適用される。
     * ----------------------------------------------
     */

    return [

        /*
         * 始点外周側。
         */

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        /*
         * 外周円弧。
         */

        `A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        /*
         * 終点外側角丸。
         */

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerEndTangent.x}
        ${outerEndTangent.y}`,

        /*
         * ★ 終点端面
         *
         * R180側からR100側へ完全に閉じる。
         *
         * ここは「線」ではなく、
         * pathの境界として面を形成する。
         */

        `L
        ${innerEndTangent.x}
        ${innerEndTangent.y}`,

        /*
         * 終点内側角丸。
         */

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerEnd.x}
        ${innerEnd.y}`,

        /*
         * 内周円弧。
         */

        `A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        /*
         * 始点内側角丸。
         */

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerStartTangent.x}
        ${innerStartTangent.y}`,

        /*
         * ★ 始点端面
         *
         * こちらもR100からR180まで
         * 完全に閉じる。
         */

        `L
        ${outerStartTangent.x}
        ${outerStartTangent.y}`,

        /*
         * 始点外側角丸。
         */

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerStart.x}
        ${outerStart.y}`,

        /*
         * 完全に閉じる。
         */

        'Z'

    ].join(' ');

}


/* ==================================================
   帯設定
================================================== */

/**
 * SVGへ時間帯を描画する。
 *
 * @param {string} id SVG path ID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} gradient 使用するグラデーションID
 * @returns {void}
 * @throws {Error} SVG要素が存在しない場合
 *
 * @example
 * setBand(
 *   'morningBand',
 *   9,0,
 *   12,0,
 *   'outpatientGradient'
 * );
 */

function setBand(
    id,
    startHour,
    startMinute,
    endHour,
    endMinute,
    gradient
){

    const element =
        document.getElementById(
            id
        );


    if(!element){

        console.error(
            `SVG要素が見つかりません: ${id}`
        );

        return;

    }


    /*
     * 外部入力ではなく、このページ内部で
     * 許可したグラデーションだけを使用する。
     */

    const allowedGradients =
        new Set([
            'outpatientGradient',
            'visitGradient'
        ]);


    if(
        !allowedGradients.has(
            gradient
        )
    ){

        console.error(
            `不正なグラデーションID: ${gradient}`
        );

        return;

    }


    try{

        element.setAttribute(
            'd',
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        /*
         * 本体と端面は同じ1枚のpath。
         *
         * したがって、このfillだけで
         * 端面にも同じグラデーションが入る。
         */

        element.style.fill =
            `url(#${gradient})`;

    }

    catch(error){

        console.error(
            `${id} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningBand',
    9,
    0,
    12,
    0,
    'outpatientGradient'
);


/* ==================================================
   訪問診療
   13:30 → 16:30
================================================== */

setBand(
    'visitBand',
    13,
    30,
    16,
    30,
    'visitGradient'
);


/* ==================================================
   午後診
   17:30 → 19:30
================================================== */

setBand(
    'eveningBand',
    17,
    30,
    19,
    30,
    'outpatientGradient'
);


/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 時刻取得に失敗した場合
 *
 * @example
 * getJapanTime();
 */

function getJapanTime(){

    try{

        const parts =
            new Intl.DateTimeFormat(
                'en-US',
                {
                    timeZone:'Asia/Tokyo',

                    hour12:false,

                    hour:'2-digit',
                    minute:'2-digit',
                    second:'2-digit'
                }
            ).formatToParts(
                new Date()
            );


        const result = {};


        parts.forEach(
            part => {

                if(
                    part.type === 'hour' ||
                    part.type === 'minute' ||
                    part.type === 'second'
                ){

                    result[part.type] =
                        Number(part.value);

                }

            }
        );


        /*
         * 一部環境で0時が24として返るため、
         * 0時へ正規化する。
         */

        if(
            result.hour === 24
        ){

            result.hour = 0;

        }


        if(
            !Number.isInteger(
                result.hour
            ) ||
            !Number.isInteger(
                result.minute
            ) ||
            !Number.isInteger(
                result.second
            )
        ){

            throw new Error(
                '日本時間の取得結果が不正です'
            );

        }


        return result;

    }

    catch(error){

        console.error(
            '日本時間の取得に失敗しました',
            error
        );

        throw error;

    }

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * @returns {void}
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新を停止しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針。
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針。
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針。
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * SVGのrotateは、
     * 初期状態の針が12時を向いているため、
     * そのまま時計角度を使う。
     *
     * 12時 = 0°
     * 3時  = 90°
     * 6時  = 180°
     * 9時  = 270°
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>
