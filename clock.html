<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン

   時計だけを中央に配置する。
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   時計見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


/* ==================================================
   SVG
================================================== */

.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯

   fillで描画するため、
   時間設定そのものを正確に維持する。

   角丸処理はJavaScriptで
   pathの4つの角だけに行う。
================================================== */

.time-band{

    stroke:none;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}

.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}

.clock-hand.hour{

    stroke-width:4;

}

.clock-hand.minute{

    stroke-width:2.5;

}

.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}

.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向きスマートフォン
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

</head>

<script>

/* ==================================================
   時計設定

   ここは元の設計を維持する。

   内周 = 100
   外周 = 180

   中心 = 200,200

   この3つを固定することで、
   帯の軸がずれないようにする。
================================================== */

const SVG_CENTER = 200;

const OUTER_RADIUS = 180;

const INNER_RADIUS = 100;


/* ==================================================
   角丸量

   「時間の端を丸くする」のではなく、
   帯を構成する4つの角を
   ごく小さく丸める。

   数値を大きくすると角丸が強くなる。

   まずは6px程度に抑える。
   時間帯の位置そのものには影響しない。
================================================== */

const CORNER_RADIUS = 20;


/* ==================================================
   時刻 → 時計角度

   12時 = 0°

   時計回り。
================================================== */

function timeToClockAngle(
    hour,
    minute
){

    return (
        ((hour % 12) * 30)
        +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度

   SVGの0°は3時方向なので、
   12時を上にするため90°戻す。
================================================== */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   極座標 → SVG座標

   円の中心を常に200,200に固定する。
================================================== */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle * Math.PI / 180;

    return {

        x:
            SVG_CENTER
            +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER
            +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   ベクトル
================================================== */

function vectorLength(
    x,
    y
){

    return Math.sqrt(
        x * x +
        y * y
    );

}


/* ==================================================
   単位ベクトル
================================================== */

function normalizeVector(
    x,
    y
){

    const length =
        vectorLength(
            x,
            y
        );


    if(length === 0){

        throw new Error(
            '長さ0のベクトルは正規化できません'
        );

    }


    return {

        x:x / length,

        y:y / length

    };

}


/* ==================================================
   時間帯パス

   基本形は従来と同じ、

       外周円弧
          ↓
       終点
          ↓
       内周
          ↓
       内周円弧
          ↓
       始点

   ただし、各角を小さく削って
   Q（quadratic curve）で接続する。

   重要：
   時間の基準となる始点・終点角度は
   createBandPath() の引数から変更しない。
================================================== */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    /* ----------------------------------------------
       入力検証

       不正な時刻でSVGが壊れるのを防ぐ。
    ---------------------------------------------- */

    if(
        !Number.isFinite(startHour) ||
        !Number.isFinite(startMinute) ||
        !Number.isFinite(endHour) ||
        !Number.isFinite(endMinute)
    ){

        throw new TypeError(
            '診療時間には数値を指定してください'
        );

    }


    if(
        startMinute < 0 ||
        startMinute > 59 ||
        endMinute < 0 ||
        endMinute > 59
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    /* ----------------------------------------------
       時刻を角度へ変換
    ---------------------------------------------- */

    const startClockAngle =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const endClockAngle =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const startSvgAngle =
        clockToSvgAngle(
            startClockAngle
        );


    const endSvgAngle =
        clockToSvgAngle(
            endClockAngle
        );


    /* ----------------------------------------------
       時間帯の角度差
    ---------------------------------------------- */

    const angleDifference =
        (
            endClockAngle
            -
            startClockAngle
            +
            360
        ) % 360;


    if(angleDifference === 0){

        throw new RangeError(
            '開始時刻と終了時刻が同じです'
        );

    }


    /* ----------------------------------------------
       元の4つの角

       外周開始
       外周終了
       内周終了
       内周開始

       の位置を求める。
    ---------------------------------------------- */

    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            startSvgAngle
        );


    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            endSvgAngle
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            endSvgAngle
        );


    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            startSvgAngle
        );


    /* ----------------------------------------------
       角丸量の制限

       短い帯でも角丸が大きくなりすぎないように
       CORNER_RADIUSを安全な範囲へ制限する。
    ---------------------------------------------- */

    const corner =
        Math.min(
            CORNER_RADIUS,
            (OUTER_RADIUS - INNER_RADIUS) / 4
        );


    /* ----------------------------------------------
       円弧の角度を少しだけ内側へずらす。

       これは「時間設定を変える」のではなく、
       元の角を丸めるための接続点を作るため。

       実際の診療時間の基準角は
       startSvgAngle / endSvgAngle のまま。
    ---------------------------------------------- */

    const startOffset =
        corner /
        OUTER_RADIUS *
        180 /
        Math.PI;


    const endOffset =
        corner /
        OUTER_RADIUS *
        180 /
        Math.PI;


    /* ----------------------------------------------
       外周側の丸め開始・終了点
    ---------------------------------------------- */

    const outerStartRounded =
        polarToPoint(
            OUTER_RADIUS,
            startSvgAngle + startOffset
        );


    const outerEndRounded =
        polarToPoint(
            OUTER_RADIUS,
            endSvgAngle - endOffset
        );


    /* ----------------------------------------------
       内周側の丸め開始・終了点

       内周は半径が小さいため、
       同じ物理距離で角度を計算する。
    ---------------------------------------------- */

    const innerStartOffset =
        corner /
        INNER_RADIUS *
        180 /
        Math.PI;


    const innerEndOffset =
        corner /
        INNER_RADIUS *
        180 /
        Math.PI;


    const innerStartRounded =
        polarToPoint(
            INNER_RADIUS,
            startSvgAngle + innerStartOffset
        );


    const innerEndRounded =
        polarToPoint(
            INNER_RADIUS,
            endSvgAngle - innerEndOffset
        );


    /* ----------------------------------------------
       大きな円弧かどうか
    ---------------------------------------------- */

    const largeArcFlag =
        angleDifference > 180
            ? 1
            : 0;


    /* ----------------------------------------------
       SVGパス

       4つの角をQで軽く丸める。

       円やキャップを追加していない。

       そのため、帯そのものの形状だけが
       変わる。
    ---------------------------------------------- */

    return `

        M
        ${outerStartRounded.x}
        ${outerStartRounded.y}

        A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEndRounded.x}
        ${outerEndRounded.y}

        Q
        ${outerEnd.x}
        ${outerEnd.y}
        ${innerEndRounded.x}
        ${innerEndRounded.y}

        A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStartRounded.x}
        ${innerStartRounded.y}

        Q
        ${innerStart.x}
        ${innerStart.y}
        ${outerStartRounded.x}
        ${outerStartRounded.y}

        Z

    `;

}


/* ==================================================
   帯を設定

   エラー時はコンソールへ出力する。
   ページ全体を止めないため、該当帯だけを
   描画できない状態にする。
================================================== */

function setBand(
    elementId,
    startHour,
    startMinute,
    endHour,
    endMinute,
    gradientId
){

    const element =
        document.getElementById(
            elementId
        );


    if(!element){

        console.error(
            `${elementId} が見つかりません`
        );

        return;

    }


    try{

        element.setAttribute(
            'd',
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        element.style.fill =
            `url(#${gradientId})`;

    }

    catch(error){

        console.error(
            `${elementId} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診

   9:00 → 12:00
================================================== */

setBand(
    'morningBand',
    9,
    0,
    12,
    0,
    'outpatientGradient'
);


/* ==================================================
   訪問診療

   13:30 → 16:30
================================================== */

setBand(
    'visitBand',
    13,
    30,
    16,
    30,
    'visitGradient'
);


/* ==================================================
   午後診

   17:30 → 19:30
================================================== */

setBand(
    'eveningBand',
    17,
    30,
    19,
    30,
    'outpatientGradient'
);


/* ==================================================
   日本時間

   端末のタイムゾーンではなく
   Asia/Tokyoを明示する。

   そのため海外から閲覧しても
   日本時間の時計になる。
================================================== */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',

                hour12:false,

                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    parts.forEach(
        part => {

            if(
                part.type === 'hour' ||
                part.type === 'minute' ||
                part.type === 'second'
            ){

                result[part.type] =
                    Number(part.value);

            }

        }
    );


    return result;

}


/* ==================================================
   時計更新
================================================== */

function updateClock(){

    const now =
        getJapanTime();


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /* 秒針 */

    const secondAngle =
        seconds * 6;


    /* 分針 */

    const minuteAngle =
        (
            minutes
            +
            seconds / 60
        ) * 6;


    /* 時針 */

    const hourAngle =
        (
            (hours % 12)
            +
            minutes / 60
            +
            seconds / 3600
        ) * 30;


    /* SVG角度 */

    const secondSvgAngle =
        clockToSvgAngle(
            secondAngle
        );


    const minuteSvgAngle =
        clockToSvgAngle(
            minuteAngle
        );


    const hourSvgAngle =
        clockToSvgAngle(
            hourAngle
        );


    /* 秒針 */

    document
        .querySelector(
            '.clock-hand.second'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${secondSvgAngle},
                200,
                200
            )`
        );


    /* 分針 */

    document
        .querySelector(
            '.clock-hand.minute'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${minuteSvgAngle},
                200,
                200
            )`
        );


    /* 時針 */

    document
        .querySelector(
            '.clock-hand.hour'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${hourSvgAngle},
                200,
                200
            )`
        );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>
