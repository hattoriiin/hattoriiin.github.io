/* ==================================================
   ヘッダー上の浅い帯
================================================== */

header::after{

    content:"";

    position:absolute;

    left:0;
    right:0;
    bottom:0;

        linear-gradient(

            rgba(255,255,255,.03),

    pointer-events:none;

}


/* ==================================================
   光
================================================== */

header::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        radial-gradient(
            circle at 85% 12%,
            rgba(255,255,255,.18) 0%,
            rgba(255,255,255,.08) 18%,

/* ==================================================
   ページタイトル
================================================== */

    letter-spacing:.12em;

/* ==================================================
   担当医表

   index.html の診療時間表と同じ設計
================================================== */

.doctor-section{

    width:100%;

    margin:0 auto;

}

.doctor-table{

    width:100%;

    table-layout:auto;

    border-collapse:separate;

    border-spacing:0;

    margin-top:1.2rem;

    overflow:hidden;

    border-radius:10px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);

.doctor-table th,
.doctor-table td{

    border-bottom:1px solid #ddd;

    padding:

        .35rem;

    text-align:center;

    font-size:1rem;

    line-height:1.15;

}


/* 曜日 */

.doctor-table tr:first-child th{

    background:#31556e;

    color:#fff;

    font-weight:400;

}


/* 左側 */

.doctor-table tr:not(:first-child) th{

    background:#f2f7f9;

    font-weight:400;

    white-space:nowrap;

    line-height:1.35;

    padding-top:.55rem;

    padding-bottom:.55rem;

    letter-spacing:.05em;

}


/* 本文 */

.doctor-table td{

    background:#fff;

    color:#31556e;

    white-space:nowrap;

}


/* 最後の線 */

.doctor-table tr:last-child th,
.doctor-table tr:last-child td{

    border-bottom:none;

}


/* 左端 */

.doctor-table th:first-child{

    width:120px;

}

================================================== */

    color:#666;

    font-size:.76rem;

================================================== */

    border-top:

    color:#31556e;

    font-size:1rem;

    font-weight:400;

    letter-spacing:.12em;

/* ==================================================
   時計本体
================================================== */

    position:relative;

    width:min(

    aspect-ratio:1 / 1;

    margin:0 auto;

.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   診療帯
================================================== */

.time-band{

    stroke-width:2;

    stroke-linejoin:round;

}


/* ==================================================
   外来
================================================== */

.outpatient-band{

    fill:url(#outpatientGradient);

    opacity:.34;

    stroke:

/* ==================================================
   訪問
================================================== */

.visit-band{

    fill:url(#visitGradient);

    opacity:.34;

    stroke:

   数字
================================================== */

   時計の針
================================================== */

<script>

/* ==================================================
   時計設定
================================================== */

const SVG_CENTER = 200;

const OUTER_RADIUS = 180;

const INNER_RADIUS = 100;


/* ==================================================
   時刻 → 時計角度

   12時 = 0°

   時計回り
================================================== */

function timeToClockAngle(
    hour,
    minute
){

    return (

        (
            (hour % 12) * 30
        )
        +
        (minute * 0.5)

    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度

   SVGの3時方向 = 0°

================================================== */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle * Math.PI / 180;

    return {

        x:
            SVG_CENTER
            +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER
            +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   診療時間帯生成
================================================== */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const startClockAngle =
        timeToClockAngle(
            startHour,
            startMinute
        );

    const endClockAngle =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const startSvgAngle =
        clockToSvgAngle(
            startClockAngle
        );

    const endSvgAngle =
        clockToSvgAngle(
            endClockAngle
        );


    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            startSvgAngle
        );


    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            endSvgAngle
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            endSvgAngle
        );


    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            startSvgAngle
        );


    const angleDifference =
        (
            endClockAngle
            -
            startClockAngle
            +
            360
        ) % 360;


    const largeArcFlag =
        angleDifference > 180
            ? 1
            : 0;


    return `

        M
        ${outerStart.x}
        ${outerStart.y}

        A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}

        L
        ${innerEnd.x}
        ${innerEnd.y}

        A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}

        Z

    `;

}

/* ==================================================
   ⭐ 日本時間を取得

   ブラウザを海外で開いても
   Asia/Tokyo を使用する。

   iPhoneの設定時刻には依存しない。
================================================== */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:
                    'Asia/Tokyo',

                hour:
                    'numeric',

                minute:
                    'numeric',

                second:
                    'numeric',

                hour12:
                    false

            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    parts.forEach(
        part => {

            if(
                part.type === 'hour' ||
                part.type === 'minute' ||
                part.type === 'second'
            ){

                result[part.type] =
                    Number(part.value);

            }

        }
    );


    return result;

}


/* ==================================================
   時計を更新
================================================== */

function updateClock(){

    const now =
        getJapanTime();


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /* ==================================================
       秒針
    ================================================== */

    const secondAngle =
        seconds * 6;


    /* ==================================================
       分針
    ================================================== */

    const minuteAngle =
        (
            minutes
            +
            seconds / 60
        ) * 6;


    /* ==================================================
       時針

       14:53なら

       2時53分

       なので

       2 + 53/60

       ×30°

       となる。
    ================================================== */

    const hourAngle =
        (
            (hours % 12)
            +
            minutes / 60
            +
            seconds / 3600
        ) * 30;


    /* ==================================================
       SVG角度へ変換
    ================================================== */

    const secondSvgAngle =
        clockToSvgAngle(
            secondAngle
        );


    const minuteSvgAngle =
        clockToSvgAngle(
            minuteAngle
        );


    const hourSvgAngle =
        clockToSvgAngle(
            hourAngle
        );


    /* ==================================================
       秒針
    ================================================== */

    document
        .querySelector(
            '.clock-hand.second'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${secondSvgAngle},
                200,
                200
            )`
        );


    /* ==================================================
       分針
    ================================================== */

    document
        .querySelector(
            '.clock-hand.minute'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${minuteSvgAngle},
                200,
                200
            )`
        );


    /* ==================================================
       時針
    ================================================== */

    document
        .querySelector(
            '.clock-hand.hour'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${hourSvgAngle},
                200,
                200
            )`
        );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();
