<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

.time-band{

    stroke:none;

}


/*
 * 袋とじ部分。
 *
 * 時間帯の始点・終点だけに置く。
 * 帯全体を塗りつぶすものではない。
 */

.time-seal{

    fill:none;

    stroke-linecap:round;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

</head>

</defs>


<!-- ==================================================

<circle

<!-- ==================================================

================================================== -->

<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;


/*
 * 外周。
 *
 * 帯の位置を変えないためR180を固定。
 */

const OUTER_RADIUS = 180;


/*
 * 内周。
 *
 * R100を固定。
 *
 * したがって帯幅は80px。
 */

const INNER_RADIUS = 100;


/*
 * 角丸。
 */

const CORNER_RADIUS = 10;


/*
 * 袋とじの太さ。
 *
 * 帯幅そのものを変更せず、
 * 始点・終点だけを閉じるための細い線。
 */

const SEAL_WIDTH = 7;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計上の角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度
 * @throws {TypeError} 時または分が数値でない場合
 * @throws {RangeError} 分が0〜59以外の場合
 *
 * @example
 * timeToClockAngle(9, 0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30)
        +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * SVGの0°は3時方向なので、
 * 12時方向を0°として扱うため90°補正する。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   角度正規化
================================================== */

/**
 * 角度を0〜360°へ正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化された角度
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 極座標をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} SVG座標
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   時間帯Path
================================================== */

/**
 * 円環状の時間帯を生成する。
 *
 * 外周R180、内周R100を維持し、
 * 四隅のみ角丸にする。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 * @throws {RangeError} 時間範囲が不正な場合
 *
 * @example
 * createBandPath(9,0,12,0);
 */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '開始時刻と終了時刻の角度が不正です'
        );

    }


    /*
     * 帯幅80pxを維持。
     */

    const bandWidth =
        OUTER_RADIUS -
        INNER_RADIUS;


    /*
     * 角丸が帯幅を超えないようにする。
     */

    const radius =
        Math.min(
            CORNER_RADIUS,
            bandWidth / 2 - 0.5
        );


    const outerCenterRadius =
        OUTER_RADIUS -
        radius;


    const innerCenterRadius =
        INNER_RADIUS +
        radius;


    const outerOffset =
        Math.asin(
            radius /
            outerCenterRadius
        );


    const innerOffset =
        Math.asin(
            radius /
            innerCenterRadius
        );


    const outerOffsetDeg =
        outerOffset *
        180 /
        Math.PI;


    const innerOffsetDeg =
        innerOffset *
        180 /
        Math.PI;


    const outerStart =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                start +
                outerOffsetDeg
            )
        );


    const outerEnd =
        polarToPoint(
            OUTER_RADIUS,
            clockToSvgAngle(
                end -
                outerOffsetDeg
            )
        );


    const innerStart =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                start +
                innerOffsetDeg
            )
        );


    const innerEnd =
        polarToPoint(
            INNER_RADIUS,
            clockToSvgAngle(
                end -
                innerOffsetDeg
            )
        );


    const outerTangentRadius =
        outerCenterRadius *
        Math.cos(
            outerOffset
        );


    const innerTangentRadius =
        innerCenterRadius *
        Math.cos(
            innerOffset
        );


    const outerStartTangent =
        polarToPoint(
            outerTangentRadius,
            clockToSvgAngle(start)
        );


    const innerStartTangent =
        polarToPoint(
            innerTangentRadius,
            clockToSvgAngle(start)
        );


    const outerEndTangent =
        polarToPoint(
            outerTangentRadius,
            clockToSvgAngle(end)
        );


    const innerEndTangent =
        polarToPoint(
            innerTangentRadius,
            clockToSvgAngle(end)
        );


    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    return [

        `M
        ${outerStart.x}
        ${outerStart.y}`,

        `A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${outerEnd.x}
        ${outerEnd.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerEndTangent.x}
        ${outerEndTangent.y}`,

        `L
        ${innerEndTangent.x}
        ${innerEndTangent.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerEnd.x}
        ${innerEnd.y}`,

        `A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArcFlag}
        0
        ${innerStart.x}
        ${innerStart.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${innerStartTangent.x}
        ${innerStartTangent.y}`,

        `L
        ${outerStartTangent.x}
        ${outerStartTangent.y}`,

        `A
        ${radius}
        ${radius}
        0
        0
        1
        ${outerStart.x}
        ${outerStart.y}`,

        'Z'

    ].join(' ');

}


/* ==================================================
   袋とじ用Path
================================================== */

/**
 * 時間帯の始点と終点を色で閉じるための
 * 円弧Pathを生成する。
 *
 * 本体のグラデーションには触れず、
 * 両端だけを同色の細い線で閉じる。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG path
 * @throws {RangeError} 時間範囲が不正な場合
 *
 * @example
 * createSealPath(9,0,12,0);
 */

function createSealPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '袋とじ用の時間範囲が不正です'
        );

    }


    /*
     * 袋とじは帯の中央半径で作る。
     *
     * これにより内周・外周の位置は
     * 一切変わらない。
     */

    const sealRadius =
        (
            OUTER_RADIUS +
            INNER_RADIUS
        ) / 2;


    const startPoint =
        polarToPoint(
            sealRadius,
            clockToSvgAngle(start)
        );


    const endPoint =
        polarToPoint(
            sealRadius,
            clockToSvgAngle(end)
        );


    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    /*
     * 始点 → 終点の円弧。
     *
     * stroke-linecap:round により、
     * 始点・終点そのものが色で丸く閉じる。
     */

    return [

        `M
        ${startPoint.x}
        ${startPoint.y}`,

        `A
        ${sealRadius}
        ${sealRadius}
        0
        ${largeArcFlag}
        1
        ${endPoint.x}
        ${endPoint.y}`

    ].join(' ');

}


/* ==================================================
   帯設定
================================================== */

/**
 * 時間帯本体と袋とじを設定する。
 *
 * @param {string} bandId 本体Path ID
 * @param {string} sealId 袋とじPath ID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} gradient グラデーションID
 * @returns {void}
 */

function setBand(
    bandId,
    sealId,
    startHour,
    startMinute,
    endHour,
    endMinute,
    gradient
){

    const band =
        document.getElementById(
            bandId
        );


    const seal =
        document.getElementById(
            sealId
        );


    if(
        !band ||
        !seal
    ){

        console.error(
            `時間帯要素が見つかりません: ${bandId}`
        );

        return;

    }


    /*
     * 許可されたグラデーションだけを使用。
     *
     * 外部入力をそのままCSSへ渡さないため、
     * CSSインジェクションを防ぐ。
     */

    const allowedGradients =
        new Set([
            'outpatientGradient',
            'visitGradient'
        ]);


    if(
        !allowedGradients.has(gradient)
    ){

        console.error(
            `許可されていないグラデーションです: ${gradient}`
        );

        return;

    }


    try{

        /*
         * 本体。
         */

        band.setAttribute(
            'd',
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        band.style.fill =
            `url(#${gradient})`;


        /*
         * 袋とじ。
         */

        seal.setAttribute(
            'd',
            createSealPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            )
        );


        seal.style.strokeWidth =
            `${SEAL_WIDTH}px`;

    }

    catch(error){

        console.error(
            `${bandId} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningBand',
    'morningSeal',
    9,
    0,
    12,
    0,
    'outpatientGradient'
);


/* ==================================================
   訪問診療
   13:30 → 16:30
================================================== */

setBand(
    'visitBand',
    'visitSeal',
    13,
    30,
    16,
    30,
    'visitGradient'
);


/* ==================================================
   午後診
   17:30 → 19:30
================================================== */

setBand(
    'eveningBand',
    'eveningSeal',
    17,
    30,
    19,
    30,
    'outpatientGradient'
);


/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 日本時間の取得に失敗した場合
 *
 * @example
 * const now = getJapanTime();
 */

function getJapanTime(){

    try{

        const parts =
            new Intl.DateTimeFormat(
                'en-US',
                {
                    timeZone:'Asia/Tokyo',

                    hour12:false,

                    hour:'2-digit',
                    minute:'2-digit',
                    second:'2-digit'
                }
            ).formatToParts(
                new Date()
            );


        const result = {};


        parts.forEach(
            part => {

                if(
                    part.type === 'hour' ||
                    part.type === 'minute' ||
                    part.type === 'second'
                ){

                    result[part.type] =
                        Number(part.value);

                }

            }
        );


        /*
         * 一部ブラウザで0時が24になる場合を
         * 0時へ正規化する。
         */

        if(
            result.hour === 24
        ){

            result.hour = 0;

        }


        if(
            !Number.isInteger(result.hour) ||
            !Number.isInteger(result.minute) ||
            !Number.isInteger(result.second)
        ){

            throw new Error(
                '日本時間の取得結果が不正です'
            );

        }


        return result;

    }

    catch(error){

        console.error(
            '日本時間の取得に失敗しました',
            error
        );

        throw error;

    }

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * @returns {void}
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新を停止しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針。
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針。
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針。
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * 時計角度をそのまま回転角に使用する。
     *
     * 12時=0°
     * 3時=90°
     * 6時=180°
     * 9時=270°
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>
