<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="服部医院の外来診療時間および受付時間。午前診9:00〜12:00（受付8:45〜11:30）、訪問診療13:30〜16:30、午後診17:30〜19:30（受付17:15〜19:00）。"
>

<title>服部医院｜外来診療・受付時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   アクセシビリティ
================================================== */

.sr-only{

    position:absolute;

    width:1px;

    height:1px;

    padding:0;

    margin:-1px;

    overflow:hidden;

    clip:rect(0,0,0,0);

    white-space:nowrap;

    border:0;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    min-width:280px;

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周目盛り
================================================== */

.outer-tick{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.22;

    vector-effect:non-scaling-stroke;

}


.outer-tick.five{

    opacity:.38;

    stroke-width:1.2;

}


.outer-tick.quarter{

    opacity:.5;

    stroke-width:1.4;

}


.outer-tick.half{

    opacity:.7;

    stroke-width:1.8;

    stroke:#1d394e;

}


.outer-dot{

    fill:#31556e;

    opacity:.28;

}


/* ==================================================
   診療時間帯
================================================== */

.time-band{

    stroke:none;

}


.band-base.blue{

    fill:
        url(#blueBaseGradient);

}


.band-base.green{

    fill:
        url(#greenBaseGradient);

}


.band-inner{

    fill:#fff;

    opacity:.78;

}


/* ==================================================
   受付時間
================================================== */

/*
 * 受付時間は診療帯とは別の「もう一つの時間帯」として
 * 強く主張するのではなく、
 *
 * 「診療帯の外側に添う細い時間軸」
 *
 * として扱う。
 *
 * そのため、以前よりグローを弱くし、
 * 実線そのものを主役にする。
 */

.reception-arc{

    fill:none;

    stroke:#397db5;

    stroke-width:1.45px;

    stroke-linecap:round;

    opacity:.72;

    vector-effect:non-scaling-stroke;

}


/*
 * 受付線のごく薄い光。
 *
 * 装飾感が強くなりすぎないよう、
 * 主線よりかなり弱くする。
 */

.reception-glow{

    fill:none;

    stroke:#6fa8d8;

    stroke-width:3.5px;

    stroke-linecap:round;

    opacity:.16;

    filter:url(#softGlowFilter);

}


/*
 * 受付開始・受付終了。
 *
 * 小さな点にして、
 * 「ここから」「ここまで」を示す。
 */

.reception-dot{

    fill:#31556e;

    opacity:.92;

}


/*
 * 診療開始・診療終了の境界。
 *
 * 受付時間の線そのものではなく、
 * 診療帯の境界を示すための短い放射線。
 */

.reception-boundary{

    stroke:#31556e;

    stroke-width:1.15px;

    stroke-linecap:round;

    opacity:.62;

    vector-effect:non-scaling-stroke;

}


/*
 * 診療帯の始点・終点にある境界を、
 * 少しだけ強調する。
 */

.reception-boundary.strong{

    stroke-width:1.35px;

    opacity:.78;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face .hour12{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .hour12.small{

    font-size:15px;

}


.clock-face .hour12.twelve{

    font-size:33px;

}


.clock-face .hour24{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:15px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

    opacity:.55;

}


.clock-face .hour24.large{

    font-size:31px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    vector-effect:non-scaling-stroke;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   レスポンシブ
================================================== */

@media(max-width:600px) and (orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

        min-width:280px;

    }


    .clock-face .hour12{

        font-size:29px;

    }


    .clock-face .hour12.small{

        font-size:14px;

    }


    .clock-face .hour12.twelve{

        font-size:31px;

    }


    .clock-face .hour24{

        font-size:14px;

    }


    .clock-face .hour24.large{

        font-size:29px;

    }

}


@media(max-width:380px){

    .page-main{

        padding:.5rem;

    }


    .clock-title{

        font-size:.92rem;

    }


    .time-ring{

        min-width:260px;

    }


    .clock-face .hour12{

        font-size:27px;

    }


    .clock-face .hour12.small{

        font-size:13px;

    }


    .clock-face .hour12.twelve{

        font-size:29px;

    }


    .clock-face .hour24{

        font-size:13px;

    }


    .clock-face .hour24.large{

        font-size:27px;

    }

}


/* ==================================================
   動きを抑える設定
================================================== */

@media(prefers-reduced-motion:reduce){

    .clock-hand{

        transition:none;

    }

}

</style>

</head>


<body>


<main class="page-main">


<section
    class="clock-area"
    aria-labelledby="clockHeading"
>


<h1
    id="clockHeading"
    class="clock-title"
>
    外来診療・受付時間
</h1>


<div class="sr-only">

    <p>服部医院の外来診療および受付時間です。</p>

    <ul>

        <li>
            午前診：9:00〜12:00（受付 8:45〜11:30）
        </li>

        <li>
            訪問診療：13:30〜16:30
        </li>

        <li>
            午後診：17:30〜19:30（受付 17:15〜19:00）
        </li>

    </ul>

</div>


<div class="time-ring">


<svg
    viewBox="0 0 400 400"
    aria-hidden="true"
    focusable="false"
>


<defs>


<!-- ==================================================
     青グラデーション
================================================== -->

<radialGradient
    id="blueBaseGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="55%"
        stop-color="#3d8bdc"
        stop-opacity=".72"
    />

    <stop
        offset="64%"
        stop-color="#72afe8"
        stop-opacity=".62"
    />

    <stop
        offset="72%"
        stop-color="#a9d2f2"
        stop-opacity=".48"
    />

    <stop
        offset="82%"
        stop-color="#72afe8"
        stop-opacity=".62"
    />

    <stop
        offset="100%"
        stop-color="#3d8bdc"
        stop-opacity=".72"
    />

</radialGradient>


<!-- ==================================================
     緑グラデーション
================================================== -->

<radialGradient
    id="greenBaseGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="55%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

    <stop
        offset="64%"
        stop-color="#95c66f"
        stop-opacity=".62"
    />

    <stop
        offset="72%"
        stop-color="#c5dfa9"
        stop-opacity=".48"
    />

    <stop
        offset="82%"
        stop-color="#95c66f"
        stop-opacity=".62"
    />

    <stop
        offset="100%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

</radialGradient>


<!-- ==================================================
     受付用グロー
================================================== -->

<filter
    id="softGlowFilter"
    x="-20%"
    y="-20%"
    width="140%"
    height="140%"
>

    <feGaussianBlur
        stdDeviation="1.8"
    />

</filter>


</defs>


<!-- ==================================================
     時計盤
================================================== -->

<circle
    class="clock-disc"
    cx="200"
    cy="200"
    r="180"
/>


<!-- ==================================================
     外周目盛り
================================================== -->

<g
    id="outerClockTicks"
    aria-hidden="true"
></g>


<!-- ==================================================
     診療時間帯
================================================== -->

<path
    id="morningBand"
    class="time-band band-base blue"
/>

<path
    id="morningWhite"
    class="band-inner"
/>


<path
    id="visitBand"
    class="time-band band-base green"
/>

<path
    id="visitWhite"
    class="band-inner"
/>


<path
    id="eveningBand"
    class="time-band band-base blue"
/>

<path
    id="eveningWhite"
    class="band-inner"
/>


<!-- ==================================================
     受付時間
================================================== -->

<g
    class="reception-group"
    aria-hidden="true"
>


<!-- 午前 -->

<path
    id="morningReceptionGlow"
    class="reception-glow"
/>

<path
    id="morningReceptionArc"
    class="reception-arc"
/>


<circle
    id="morningReceptionStart"
    class="reception-dot"
    r="2.4"
/>

<circle
    id="morningReceptionEnd"
    class="reception-dot"
    r="2.4"
/>


<!-- 午後 -->

<path
    id="eveningReceptionGlow"
    class="reception-glow"
/>

<path
    id="eveningReceptionArc"
    class="reception-arc"
/>


<circle
    id="eveningReceptionStart"
    class="reception-dot"
    r="2.4"
/>

<circle
    id="eveningReceptionEnd"
    class="reception-dot"
    r="2.4"
/>


<!-- ==================================================
     診療開始・診療終了の境界線
================================================== -->

<line
    id="morningOpenBoundary"
    class="reception-boundary strong"
/>

<line
    id="morningCloseBoundary"
    class="reception-boundary"
/>


<line
    id="eveningOpenBoundary"
    class="reception-boundary strong"
/>

<line
    id="eveningCloseBoundary"
    class="reception-boundary"
/>


</g>


<!-- ==================================================
     時計数字
================================================== -->

<g
    class="clock-face"
    aria-hidden="true"
>

    <g id="clock12"></g>

    <g id="clock24"></g>

</g>


<!-- ==================================================
     時計の針
================================================== -->

<line
    class="clock-hand hour"
    x1="200"
    y1="200"
    x2="200"
    y2="125"
/>


<line
    class="clock-hand minute"
    x1="200"
    y1="200"
    x2="200"
    y2="108"
/>


<line
    class="clock-hand second"
    x1="200"
    y1="200"
    x2="200"
    y2="100"
/>


<!-- ==================================================
     中央
================================================== -->

<circle
    class="clock-center"
    cx="200"
    cy="200"
    r="7"
/>


<circle
    class="clock-dot"
    cx="200"
    cy="200"
    r="3"
/>


</svg>

</div>

</section>

</main>


<script>

document.addEventListener(
    'DOMContentLoaded',
    function(){

        /* ==================================================
           基本設定
        ================================================== */

        const SVG_CENTER = 200;

        const OUTER_RADIUS = 180;

        const INNER_RADIUS = 100;

        const CORNER_RADIUS = 4;

        const WHITE_RADIAL_INSET = 3;

        const WHITE_ANGLE_INSET = 0.5;

        const INNER_NUMBER_RADIUS = 126;

        const OUTER_NUMBER_RADIUS = 150;


        /* ==================================================
           外周目盛り
        ================================================== */

        const OUT_TICK_OUTER = 180;

        const OUT_TICK_INNER = 177;

        const OUT_TICK_INNER_FIVE = 175;

        const OUT_TICK_INNER_QUARTER = 174;

        const OUT_TICK_INNER_HALF = 173;

        const OUT_DOT_RADIUS = 178.5;


        /*
         * 受付線は診療帯の外側にわずかに離して配置する。
         *
         * 180pxの診療帯に対して182pxとすることで、
         * 診療帯そのものを隠さず、別の情報として読めるようにする。
         */

        const RECEPTION_RADIUS = 182;


        /*
         * 診療開始・終了境界線。
         *
         * 受付線と診療帯の関係を視覚的に示すため、
         * 受付線から診療帯外周まで短く接続する。
         */

        const RECEPTION_BOUNDARY_OUTER = 183;

        const RECEPTION_BOUNDARY_INNER = 176;


        /* ==================================================
           診療時間
        ================================================== */

        /*
         * ここは実際の24時間表記で統一する。
         *
         * timeToClockAngle()側で12時間時計へ変換するため、
         * 13:30や17:30をそのまま書ける。
         */

        const BANDS = [

            {
                startH:9,
                startM:0,
                endH:12,
                endM:0
            },

            {
                startH:13,
                startM:30,
                endH:16,
                endM:30
            },

            {
                startH:17,
                startM:30,
                endH:19,
                endM:30
            }

        ];


        /* ==================================================
           DOM取得
        ================================================== */

        const morningBand =
            document.getElementById(
                'morningBand'
            );

        const morningWhite =
            document.getElementById(
                'morningWhite'
            );

        const visitBand =
            document.getElementById(
                'visitBand'
            );

        const visitWhite =
            document.getElementById(
                'visitWhite'
            );

        const eveningBand =
            document.getElementById(
                'eveningBand'
            );

        const eveningWhite =
            document.getElementById(
                'eveningWhite'
            );


        const morningReceptionArc =
            document.getElementById(
                'morningReceptionArc'
            );

        const morningReceptionGlow =
            document.getElementById(
                'morningReceptionGlow'
            );

        const morningReceptionStart =
            document.getElementById(
                'morningReceptionStart'
            );

        const morningReceptionEnd =
            document.getElementById(
                'morningReceptionEnd'
            );


        const eveningReceptionArc =
            document.getElementById(
                'eveningReceptionArc'
            );

        const eveningReceptionGlow =
            document.getElementById(
                'eveningReceptionGlow'
            );

        const eveningReceptionStart =
            document.getElementById(
                'eveningReceptionStart'
            );

        const eveningReceptionEnd =
            document.getElementById(
                'eveningReceptionEnd'
            );


        const morningOpenBoundary =
            document.getElementById(
                'morningOpenBoundary'
            );

        const morningCloseBoundary =
            document.getElementById(
                'morningCloseBoundary'
            );

        const eveningOpenBoundary =
            document.getElementById(
                'eveningOpenBoundary'
            );

        const eveningCloseBoundary =
            document.getElementById(
                'eveningCloseBoundary'
            );


        const clock12 =
            document.getElementById(
                'clock12'
            );

        const clock24 =
            document.getElementById(
                'clock24'
            );

        const outerClockTicks =
            document.getElementById(
                'outerClockTicks'
            );


        const hourHand =
            document.querySelector(
                '.clock-hand.hour'
            );

        const minuteHand =
            document.querySelector(
                '.clock-hand.minute'
            );

        const secondHand =
            document.querySelector(
                '.clock-hand.second'
            );


        /*
         * 必須要素が不足している場合、
         * そのまま処理を続けると画面の一部だけが壊れるため、
         * 初期化を停止する。
         */

        if(

            !morningBand ||
            !morningWhite ||
            !visitBand ||
            !visitWhite ||
            !eveningBand ||
            !eveningWhite ||

            !morningReceptionArc ||
            !morningReceptionGlow ||
            !morningReceptionStart ||
            !morningReceptionEnd ||

            !eveningReceptionArc ||
            !eveningReceptionGlow ||
            !eveningReceptionStart ||
            !eveningReceptionEnd ||

            !morningOpenBoundary ||
            !morningCloseBoundary ||
            !eveningOpenBoundary ||
            !eveningCloseBoundary ||

            !clock12 ||
            !clock24 ||
            !outerClockTicks ||

            !hourHand ||
            !minuteHand ||
            !secondHand

        ){

            console.error(
                '時計の初期化に必要な要素が見つかりません。'
            );

            return;

        }


        /* ==================================================
           時刻 → 時計角度
        ================================================== */

        /**
         * 24時間表記の時刻を12時間時計の角度へ変換する。
         *
         * 12時を0°として時計回りに増加する。
         *
         * @param {number} hour 0〜23の時
         * @param {number} minute 0〜59の分
         * @returns {number} 時計角度
         * @throws {TypeError} 数値でない場合
         * @throws {RangeError} 時刻範囲が不正な場合
         */

        function timeToClockAngle(
            hour,
            minute
        ){

            if(
                !Number.isFinite(hour) ||
                !Number.isFinite(minute)
            ){

                throw new TypeError(
                    '時刻は数値で指定してください。'
                );

            }


            if(
                !Number.isInteger(hour) ||
                hour < 0 ||
                hour > 23
            ){

                throw new RangeError(
                    '時は0〜23で指定してください。'
                );

            }


            if(
                !Number.isInteger(minute) ||
                minute < 0 ||
                minute > 59
            ){

                throw new RangeError(
                    '分は0〜59で指定してください。'
                );

            }


            return (
                (
                    (hour % 12) * 30
                ) +
                minute * .5
            ) % 360;

        }


        /* ==================================================
           時計角度 → SVG角度
        ================================================== */

        function clockToSvgAngle(
            clockAngle
        ){

            return clockAngle - 90;

        }


        /* ==================================================
           極座標 → SVG座標
        ================================================== */

        function polarToPoint(
            radius,
            svgAngle
        ){

            if(
                !Number.isFinite(radius) ||
                !Number.isFinite(svgAngle)
            ){

                throw new TypeError(
                    '半径と角度は数値で指定してください。'
                );

            }


            const radians =
                svgAngle *
                Math.PI /
                180;


            return {

                x:
                    SVG_CENTER +
                    radius *
                    Math.cos(radians),

                y:
                    SVG_CENTER +
                    radius *
                    Math.sin(radians)

            };

        }


        /* ==================================================
           時計座標
        ================================================== */

        function clockPoint(
            radius,
            clockAngle
        ){

            return polarToPoint(
                radius,
                clockToSvgAngle(
                    clockAngle
                )
            );

        }


        /* ==================================================
           角度範囲判定
        ================================================== */

        function isAngleInBands(
            angle
        ){

            for(
                const band of BANDS
            ){

                const start =
                    timeToClockAngle(
                        band.startH,
                        band.startM
                    );

                const end =
                    timeToClockAngle(
                        band.endH,
                        band.endM
                    );


                if(
                    start < end
                ){

                    if(
                        angle >= start &&
                        angle <= end
                    ){

                        return true;

                    }

                }

                else{

                    if(
                        angle >= start ||
                        angle <= end
                    ){

                        return true;

                    }

                }

            }


            return false;

        }


        /* ==================================================
           受付円弧
        ================================================== */

        /**
         * 指定した受付時間を円弧として生成する。
         *
         * @param {number} startHour 開始時
         * @param {number} startMinute 開始分
         * @param {number} endHour 終了時
         * @param {number} endMinute 終了分
         * @param {number} radius 円弧半径
         * @returns {string} SVG path
         * @throws {RangeError} 時間範囲が不正な場合
         */

        function createArcPath(
            startHour,
            startMinute,
            endHour,
            endMinute,
            radius
        ){

            const start =
                timeToClockAngle(
                    startHour,
                    startMinute
                );

            const end =
                timeToClockAngle(
                    endHour,
                    endMinute
                );


            let sweep =
                end - start;


            if(
                sweep < 0
            ){

                sweep += 360;

            }


            if(
                sweep <= 0 ||
                sweep > 360
            ){

                throw new RangeError(
                    '受付時間の範囲が不正です。'
                );

            }


            const startPt =
                clockPoint(
                    radius,
                    start
                );

            const endPt =
                clockPoint(
                    radius,
                    end
                );


            const largeArcFlag =
                sweep > 180
                    ? 1
                    : 0;


            return [

                `M ${startPt.x} ${startPt.y}`,

                `A ${radius} ${radius} 0 ${largeArcFlag} 1 ${endPt.x} ${endPt.y}`

            ].join(' ');

        }


        /* ==================================================
           受付端点
        ================================================== */

        function setReceptionEndpoints(
            startElem,
            endElem,
            startHour,
            startMinute,
            endHour,
            endMinute,
            radius
        ){

            const startPt =
                clockPoint(
                    radius,
                    timeToClockAngle(
                        startHour,
                        startMinute
                    )
                );


            const endPt =
                clockPoint(
                    radius,
                    timeToClockAngle(
                        endHour,
                        endMinute
                    )
                );


            startElem.setAttribute(
                'cx',
                startPt.x
            );

            startElem.setAttribute(
                'cy',
                startPt.y
            );


            endElem.setAttribute(
                'cx',
                endPt.x
            );

            endElem.setAttribute(
                'cy',
                endPt.y
            );

        }


        /* ==================================================
           診療境界線
        ================================================== */

        /**
         * 診療開始・終了位置に短い放射線を置く。
         *
         * 受付線と診療帯の境界を視覚的につなげるための
         * 補助線であり、時刻そのものを示す目盛りではない。
         *
         * @param {SVGLineElement} element 対象line
         * @param {number} hour 時
         * @param {number} minute 分
         */

        function setBoundary(
            element,
            hour,
            minute
        ){

            const angle =
                timeToClockAngle(
                    hour,
                    minute
                );


            const outerPoint =
                clockPoint(
                    RECEPTION_BOUNDARY_OUTER,
                    angle
                );


            const innerPoint =
                clockPoint(
                    RECEPTION_BOUNDARY_INNER,
                    angle
                );


            element.setAttribute(
                'x1',
                outerPoint.x
            );

            element.setAttribute(
                'y1',
                outerPoint.y
            );

            element.setAttribute(
                'x2',
                innerPoint.x
            );

            element.setAttribute(
                'y2',
                innerPoint.y
            );

        }


        /* ==================================================
           診療帯生成
        ================================================== */

        function createBandPath(
            startHour,
            startMinute,
            endHour,
            endMinute,
            radialInset = 0,
            angleInset = 0
        ){

            const start =
                timeToClockAngle(
                    startHour,
                    startMinute
                );

            const end =
                timeToClockAngle(
                    endHour,
                    endMinute
                );


            let sweep =
                end - start;


            if(
                sweep < 0
            ){

                sweep += 360;

            }


            if(
                sweep <= 0 ||
                sweep > 360
            ){

                throw new RangeError(
                    '診療時間の範囲が不正です。'
                );

            }


            const outerRadius =
                OUTER_RADIUS -
                radialInset;

            const innerRadius =
                INNER_RADIUS +
                radialInset;


            if(
                innerRadius >= outerRadius
            ){

                throw new RangeError(
                    '診療帯の内外半径が逆転しています。'
                );

            }


            const localStart =
                start +
                angleInset;

            const localEnd =
                start +
                sweep -
                angleInset;


            const r =
                Math.min(
                    CORNER_RADIUS,
                    (
                        outerRadius -
                        innerRadius
                    ) / 2 - .5
                );


            if(
                r <= 0
            ){

                throw new RangeError(
                    '診療帯の幅が狭すぎます。'
                );

            }


            const midRadius =
                (
                    outerRadius +
                    innerRadius
                ) / 2;


            const angularCorrection =
                (
                    r /
                    midRadius
                ) *
                (
                    180 /
                    Math.PI
                );


            const adjustedStart =
                localStart +
                angularCorrection;

            const adjustedEnd =
                localEnd -
                angularCorrection;


            const outerFilletRadius =
                outerRadius -
                r;

            const innerFilletRadius =
                innerRadius +
                r;


            const outerDelta =
                Math.asin(
                    r /
                    outerFilletRadius
                ) *
                180 /
                Math.PI;


            const innerDelta =
                Math.asin(
                    r /
                    innerFilletRadius
                ) *
                180 /
                Math.PI;


            const outerStart =
                clockPoint(
                    outerRadius,
                    adjustedStart
                );

            const outerEnd =
                clockPoint(
                    outerRadius,
                    adjustedEnd
                );

            const innerEnd =
                clockPoint(
                    innerRadius,
                    adjustedEnd
                );

            const innerStart =
                clockPoint(
                    innerRadius,
                    adjustedStart
                );


            const outerStartTangent =
                clockPoint(
                    outerFilletRadius,
                    adjustedStart -
                    outerDelta
                );

            const innerStartTangent =
                clockPoint(
                    innerFilletRadius,
                    adjustedStart -
                    innerDelta
                );

            const outerEndTangent =
                clockPoint(
                    outerFilletRadius,
                    adjustedEnd +
                    outerDelta
                );

            const innerEndTangent =
                clockPoint(
                    innerFilletRadius,
                    adjustedEnd +
                    innerDelta
                );


            const largeArcFlag =
                (
                    adjustedEnd -
                    adjustedStart
                ) > 180
                    ? 1
                    : 0;


            return [

                `M ${outerStartTangent.x} ${outerStartTangent.y}`,

                `A ${r} ${r} 0 0 1 ${outerStart.x} ${outerStart.y}`,

                `A ${outerRadius} ${outerRadius} 0 ${largeArcFlag} 1 ${outerEnd.x} ${outerEnd.y}`,

                `A ${r} ${r} 0 0 1 ${outerEndTangent.x} ${outerEndTangent.y}`,

                `L ${innerEndTangent.x} ${innerEndTangent.y}`,

                `A ${r} ${r} 0 0 1 ${innerEnd.x} ${innerEnd.y}`,

                `A ${innerRadius} ${innerRadius} 0 ${largeArcFlag} 0 ${innerStart.x} ${innerStart.y}`,

                `A ${r} ${r} 0 0 1 ${innerStartTangent.x} ${innerStartTangent.y}`,

                'Z'

            ].join(' ');

        }


        /* ==================================================
           診療帯設定
        ================================================== */

        function setBand(
            element,
            startHour,
            startMinute,
            endHour,
            endMinute
        ){

            try{

                element.setAttribute(
                    'd',
                    createBandPath(
                        startHour,
                        startMinute,
                        endHour,
                        endMinute
                    )
                );

            }

            catch(error){

                console.error(
                    '診療帯の描画に失敗しました。',
                    error
                );

            }

        }


        function setWhiteBand(
            element,
            startHour,
            startMinute,
            endHour,
            endMinute
        ){

            try{

                element.setAttribute(
                    'd',
                    createBandPath(
                        startHour,
                        startMinute,
                        endHour,
                        endMinute,
                        WHITE_RADIAL_INSET,
                        WHITE_ANGLE_INSET
                    )
                );

            }

            catch(error){

                console.error(
                    '診療帯内部の描画に失敗しました。',
                    error
                );

            }

        }


        /* ==================================================
           外周目盛り
        ================================================== */

        function createOuterMinuteTicks(){

            const fragment =
                document.createDocumentFragment();


            for(
                let minute = 0;
                minute < 60;
                minute++
            ){

                const angle =
                    minute * 6;


                if(
                    !isAngleInBands(angle)
                ){

                    let innerRadius =
                        OUT_TICK_INNER;

                    let className =
                        'outer-tick';


                    if(
                        minute % 30 === 0 &&
                        minute !== 0
                    ){

                        innerRadius =
                            OUT_TICK_INNER_HALF;

                        className +=
                            ' half';

                    }

                    else if(
                        minute % 15 === 0
                    ){

                        innerRadius =
                            OUT_TICK_INNER_QUARTER;

                        className +=
                            ' quarter';

                    }

                    else if(
                        minute % 5 === 0
                    ){

                        innerRadius =
                            OUT_TICK_INNER_FIVE;

                        className +=
                            ' five';

                    }


                    const outerPoint =
                        clockPoint(
                            OUT_TICK_OUTER,
                            angle
                        );

                    const innerPoint =
                        clockPoint(
                            innerRadius,
                            angle
                        );


                    const line =
                        document.createElementNS(
                            'http://www.w3.org/2000/svg',
                            'line'
                        );


                    line.setAttribute(
                        'class',
                        className
                    );

                    line.setAttribute(
                        'x1',
                        outerPoint.x
                    );

                    line.setAttribute(
                        'y1',
                        outerPoint.y
                    );

                    line.setAttribute(
                        'x2',
                        innerPoint.x
                    );

                    line.setAttribute(
                        'y2',
                        innerPoint.y
                    );


                    fragment.appendChild(
                        line
                    );

                }


                /*
                 * 分目盛りの間に小さな点を置く。
                 *
                 * 診療帯上では表示しないことで、
                 * 帯の視認性を維持する。
                 */

                const halfAngle =
                    angle + 3;


                if(
                    !isAngleInBands(
                        halfAngle
                    )
                ){

                    const dotPoint =
                        clockPoint(
                            OUT_DOT_RADIUS,
                            halfAngle
                        );


                    const circle =
                        document.createElementNS(
                            'http://www.w3.org/2000/svg',
                            'circle'
                        );


                    circle.setAttribute(
                        'class',
                        'outer-dot'
                    );

                    circle.setAttribute(
                        'cx',
                        dotPoint.x
                    );

                    circle.setAttribute(
                        'cy',
                        dotPoint.y
                    );

                    circle.setAttribute(
                        'r',
                        '0.75'
                    );


                    fragment.appendChild(
                        circle
                    );

                }

            }


            outerClockTicks.appendChild(
                fragment
            );

        }


        /* ==================================================
           時計数字
        ================================================== */

        function createClockNumbers(){

            clock12.replaceChildren();

            clock24.replaceChildren();


            for(
                let hour = 1;
                hour <= 12;
                hour++
            ){

                const clockAngle =
                    hour === 12
                        ? 0
                        : hour * 30;


                const point =
                    clockPoint(
                        INNER_NUMBER_RADIUS,
                        clockAngle
                    );


                const text =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'text'
                    );


                let className =
                    'hour12';


                if(
                    hour >= 1 &&
                    hour <= 7
                ){

                    className +=
                        ' small';

                }


                if(
                    hour === 12
                ){

                    className +=
                        ' twelve';

                }


                text.setAttribute(
                    'class',
                    className
                );

                text.setAttribute(
                    'x',
                    point.x
                );

                text.setAttribute(
                    'y',
                    point.y
                );

                text.textContent =
                    String(hour);


                clock12.appendChild(
                    text
                );

            }


            for(
                let hour = 0;
                hour < 12;
                hour++
            ){

                const clockAngle =
                    hour * 30;


                const displayHour =
                    hour === 0
                        ? 24
                        : hour + 12;


                const point =
                    clockPoint(
                        OUTER_NUMBER_RADIUS,
                        clockAngle
                    );


                const text =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'text'
                    );


                const className =
                    displayHour >= 13 &&
                    displayHour <= 19
                        ? 'hour24 large'
                        : 'hour24';


                text.setAttribute(
                    'class',
                    className
                );

                text.setAttribute(
                    'x',
                    point.x
                );

                text.setAttribute(
                    'y',
                    point.y
                );

                text.textContent =
                    String(displayHour);


                clock24.appendChild(
                    text
                );

            }

        }


        /* ==================================================
           診療時間設定
        ================================================== */

        setBand(
            morningBand,
            9,
            0,
            12,
            0
        );

        setWhiteBand(
            morningWhite,
            9,
            0,
            12,
            0
        );


        setBand(
            visitBand,
            13,
            30,
            16,
            30
        );

        setWhiteBand(
            visitWhite,
            13,
            30,
            16,
            30
        );


        setBand(
            eveningBand,
            17,
            30,
            19,
            30
        );

        setWhiteBand(
            eveningWhite,
            17,
            30,
            19,
            30
        );


        /* ==================================================
           受付時間
        ================================================== */

        /*
         * 午前
         *
         * 診療：9:00〜12:00
         * 受付：8:45〜11:30
         */

        const morningReceptionPath =
            createArcPath(
                8,
                45,
                11,
                30,
                RECEPTION_RADIUS
            );


        morningReceptionArc.setAttribute(
            'd',
            morningReceptionPath
        );


        morningReceptionGlow.setAttribute(
            'd',
            morningReceptionPath
        );


        setReceptionEndpoints(
            morningReceptionStart,
            morningReceptionEnd,
            8,
            45,
            11,
            30,
            RECEPTION_RADIUS
        );


        /*
         * 午後
         *
         * 診療：17:30〜19:30
         * 受付：17:15〜19:00
         */

        const eveningReceptionPath =
            createArcPath(
                17,
                15,
                19,
                0,
                RECEPTION_RADIUS
            );


        eveningReceptionArc.setAttribute(
            'd',
            eveningReceptionPath
        );


        eveningReceptionGlow.setAttribute(
            'd',
            eveningReceptionPath
        );


        setReceptionEndpoints(
            eveningReceptionStart,
            eveningReceptionEnd,
            17,
            15,
            19,
            0,
            RECEPTION_RADIUS
        );


        /* ==================================================
           診療境界線
        ================================================== */

        /*
         * 午前：
         *
         * 9:00 ＝ 診療開始
         * 12:00 ＝ 診療終了
         *
         * 受付線との関係を示すため、
         * 外側から帯側へ短い境界線を入れる。
         */

        setBoundary(
            morningOpenBoundary,
            9,
            0
        );

        setBoundary(
            morningCloseBoundary,
            12,
            0
        );


        /*
         * 午後
         */

        setBoundary(
            eveningOpenBoundary,
            17,
            30
        );

        setBoundary(
            eveningCloseBoundary,
            19,
            30
        );


        /* ==================================================
           静的要素生成
        ================================================== */

        createOuterMinuteTicks();

        createClockNumbers();


        /* ==================================================
           日本時間
        ================================================== */

        /**
         * 現在の日本時間を取得する。
         *
         * 日本はUTC+9でDSTを採用していないため、
         * Date.now()へ9時間を加えて時計計算に使用する。
         *
         * @returns {number} 日本時間基準のミリ秒
         */

        function getJapanTimestamp(){

            return (
                Date.now() +
                9 * 60 * 60 * 1000
            );

        }


        /* ==================================================
           時計針
        ================================================== */

        /**
         * 現在時刻に合わせて時計針を滑らかに更新する。
         *
         * 秒未満まで計算することで、
         * 秒針・分針・時針を連続的に動かす。
         *
         * @param {number} timestamp 日本時間基準のミリ秒
         */

        function updateClock(
            timestamp
        ){

            const millisecondsInHour =
                60 *
                60 *
                1000;

            const millisecondsInMinute =
                60 *
                1000;


            const hour =
                Math.floor(
                    timestamp /
                    millisecondsInHour
                ) % 24;


            const minute =
                Math.floor(
                    (
                        timestamp %
                        millisecondsInHour
                    ) /
                    millisecondsInMinute
                );


            const secondFraction =
                (
                    timestamp %
                    millisecondsInMinute
                ) /
                millisecondsInMinute;


            const secondAngle =
                secondFraction *
                360;


            const minuteAngle =
                (
                    minute +
                    secondFraction
                ) *
                6;


            const hourAngle =
                (
                    (
                        hour % 12
                    ) +
                    (
                        minute +
                        secondFraction
                    ) / 60
                ) *
                30;


            hourHand.setAttribute(
                'transform',
                `rotate(${hourAngle} 200 200)`
            );


            minuteHand.setAttribute(
                'transform',
                `rotate(${minuteAngle} 200 200)`
            );


            secondHand.setAttribute(
                'transform',
                `rotate(${secondAngle} 200 200)`
            );

        }


        /* ==================================================
           アニメーション
        ================================================== */

        /**
         * requestAnimationFrameで時計を連続運針する。
         *
         * @returns {void}
         */

        function animateClock(){

            updateClock(
                getJapanTimestamp()
            );


            requestAnimationFrame(
                animateClock
            );

        }


        /* ==================================================
           初期表示
        ================================================== */

        updateClock(
            getJapanTimestamp()
        );


        requestAnimationFrame(
            animateClock
        );

    }

);

</script>
