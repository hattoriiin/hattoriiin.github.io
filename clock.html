<!-- HTML -->
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜診療時間</title>

<style>

/* ==================================================
   基本
================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #ffffff;
    color: #31566f;

    font-family:
        "Noto Sans JP",
        "Zen Kaku Gothic New",
        "M PLUS Rounded 1c",
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* ==================================================
   時計全体
================================================== */

.clock-page {
    width: min(100%, 720px);
    padding: 32px 20px 48px;
}

.clock-title {
    margin: 0 0 24px;

    text-align: center;

    font-size: clamp(22px, 4vw, 32px);
    font-weight: 500;
    letter-spacing: 0.08em;

    color: #31566f;
}

.clock-subtitle {
    margin: 0 0 28px;

    text-align: center;

    font-size: 13px;
    letter-spacing: 0.08em;

    color: #7890a0;
}


/* ==================================================
   時計SVG
================================================== */

.clock-wrap {
    width: min(100%, 560px);
    margin: 0 auto;
}

.clock-svg {
    display: block;

    width: 100%;
    height: auto;

    overflow: visible;
}


/* ==================================================
   時計の外周
================================================== */

.outer-ring {
    fill: #ffffff;

    stroke: #31566f;
    stroke-width: 3;
}


/* ==================================================
   内側の補助リング
================================================== */

.inner-ring {
    fill: none;

    stroke: #d9e4eb;
    stroke-width: 1;
}


/* ==================================================
   診療時間帯

   すべて同じ中心
   cx = 200
   cy = 200

   これを固定することで、
   内周・外周の中心がズレないようにする。
================================================== */

.time-band {
    fill: none;

    stroke-linecap: butt;
}


/* --------------------------------------------------
   午前診
-------------------------------------------------- */

.morning-band {
    stroke: #3d8bdc;
    stroke-width: 55;

    opacity: 0.35;
}


/* --------------------------------------------------
   訪問診療
-------------------------------------------------- */

.home-band {
    stroke: #70ad47;
    stroke-width: 55;

    opacity: 0.35;
}


/* --------------------------------------------------
   午後診
-------------------------------------------------- */

.evening-band {
    stroke: #3d8bdc;
    stroke-width: 55;

    opacity: 0.35;
}


/* ==================================================
   分目盛
================================================== */

.minute-mark {
    stroke: #9fb1bd;
    stroke-width: 1.2;
    stroke-linecap: round;
}

.hour-mark {
    stroke: #31566f;
    stroke-width: 2.5;
    stroke-linecap: round;
}


/* ==================================================
   数字
================================================== */

.clock-number {
    fill: #31566f;

    font-size: 22px;
    font-weight: 500;

    text-anchor: middle;
    dominant-baseline: central;
}


/* ==================================================
   診療時間ラベル
================================================== */

.band-label {
    text-anchor: middle;
    dominant-baseline: central;

    font-size: 13px;
    font-weight: 500;

    pointer-events: none;
}

.morning-label,
.evening-label {
    fill: #276fae;
}

.home-label {
    fill: #518735;
}


/* ==================================================
   時計の針

   重要：
   針は診療時間帯のパス計算とは完全に独立。

   すべて
       x1 = 200
       y1 = 200

   を回転中心とする。
================================================== */

#clock-hands {
    pointer-events: none;
}


/* --------------------------------------------------
   時針
-------------------------------------------------- */

#hour-hand {
    stroke: #31566f;

    stroke-width: 7;

    stroke-linecap: round;

    /*
     * SVGのtransform-originを明示。
     * ブラウザによる基準点の解釈差を避ける。
     */
    transform-box: view-box;
    transform-origin: 200px 200px;
}


/* --------------------------------------------------
   分針
-------------------------------------------------- */

#minute-hand {
    stroke: #31566f;

    stroke-width: 4.5;

    stroke-linecap: round;

    transform-box: view-box;
    transform-origin: 200px 200px;
}


/* --------------------------------------------------
   秒針
-------------------------------------------------- */

#second-hand {
    stroke: #31566f;

    stroke-width: 1.8;

    stroke-linecap: round;

    transform-box: view-box;
    transform-origin: 200px 200px;
}


/* ==================================================
   中央軸
================================================== */

.clock-center {
    fill: #31566f;
}

.clock-dot {
    fill: #ffffff;
}


/* ==================================================
   凡例
================================================== */

.legend {
    display: flex;

    justify-content: center;
    align-items: center;

    flex-wrap: wrap;

    gap: 16px 28px;

    margin-top: 28px;
}

.legend-item {
    display: flex;

    align-items: center;
    gap: 7px;

    font-size: 13px;

    color: #607b8c;
}

.legend-mark {
    width: 12px;
    height: 12px;

    border-radius: 50%;
}

.legend-outpatient {
    background: #3d8bdc;
    opacity: 0.55;
}

.legend-home {
    background: #70ad47;
    opacity: 0.65;
}


/* ==================================================
   診療時間テキスト
================================================== */

.time-list {
    margin: 28px auto 0;

    width: min(100%, 460px);

    display: grid;

    gap: 8px;
}

.time-row {
    display: grid;

    grid-template-columns: 110px 1fr;

    align-items: center;

    padding: 9px 14px;

    border-bottom: 1px solid #e7eef2;
}

.time-name {
    font-size: 13px;
    font-weight: 500;
}

.time-value {
    font-size: 13px;
    text-align: right;
    color: #607b8c;
}

.time-name.outpatient {
    color: #276fae;
}

.time-name.home {
    color: #518735;
}


/* ==================================================
   スマートフォン
================================================== */

@media (max-width: 480px) {

    .clock-page {
        padding: 24px 14px 40px;
    }

    .clock-title {
        margin-bottom: 18px;
    }

    .clock-subtitle {
        margin-bottom: 20px;
        font-size: 12px;
    }

    .clock-number {
        font-size: 20px;
    }

    .band-label {
        font-size: 11px;
    }

    .legend {
        gap: 12px 18px;
    }

    .time-row {
        grid-template-columns: 100px 1fr;
        padding: 8px 10px;
    }
}

</style>

</head>


<body>


<main class="clock-page">


    <h1 class="clock-title">
        診療時間
    </h1>


    <p class="clock-subtitle">
        服部医院
    </p>


    <div class="clock-wrap">


        <!-- ==================================================
             時計本体
        ================================================== -->

        <svg
            class="clock-svg"
            viewBox="0 0 400 400"
            role="img"
            aria-label="服部医院の診療時間"
        >


            <!-- ==================================================
                 定義
            ================================================== -->

            <defs>

                <!--
                    外周方向の時間帯を描くための円弧定義。
                    中心は必ず200,200。
                -->

                <path
                    id="clock-circle"
                    d="
                        M 200 20
                        A 180 180 0 1 1 199.999 20
                    "
                />

            </defs>


            <!-- ==================================================
                 外周
            ================================================== -->

            <circle
                class="outer-ring"
                cx="200"
                cy="200"
                r="180"
            />


            <!-- ==================================================
                 診療時間帯

                 半径は外周180に対して
                 stroke-width=55

                 したがって帯の中心半径は180。
                 すべて同一中心から描画する。
            ================================================== -->

            <g
                id="time-bands"
                aria-hidden="true"
            >

                <!-- 午前診 9:00 → 12:00 -->
                <path
                    id="morning-band"
                    class="time-band morning-band"
                />

                <!-- 訪問診療 13:30 → 16:30 -->
                <path
                    id="home-band"
                    class="time-band home-band"
                />

                <!-- 午後診 17:30 → 19:30 -->
                <path
                    id="evening-band"
                    class="time-band evening-band"
                />

            </g>


            <!-- ==================================================
                 内側リング
            ================================================== -->

            <circle
                class="inner-ring"
                cx="200"
                cy="200"
                r="100"
            />


            <!-- ==================================================
                 分目盛
            ================================================== -->

            <g
                id="minute-marks"
                aria-hidden="true"
            ></g>


            <!-- ==================================================
                 数字
            ================================================== -->

            <g
                id="clock-numbers"
                aria-hidden="true"
            ></g>


            <!-- ==================================================
                 診療時間ラベル
            ================================================== -->

            <g
                id="band-labels"
                aria-hidden="true"
            >

                <text
                    id="morning-label"
                    class="band-label morning-label"
                >
                    午前診
                </text>

                <text
                    id="home-label"
                    class="band-label home-label"
                >
                    訪問診療
                </text>

                <text
                    id="evening-label"
                    class="band-label evening-label"
                >
                    午後診
                </text>

            </g>


            <!-- ==================================================
                 時計の針

                 ★ここが重要

                 すべての針の根元を
                 (200,200)
                 に固定。

                 診療時間帯の角度計算とは完全に独立。
            ================================================== -->

            <g id="clock-hands">


                <!-- 時針 -->

                <line
                    id="hour-hand"
                    x1="200"
                    y1="200"
                    x2="200"
                    y2="130"
                />


                <!-- 分針 -->

                <line
                    id="minute-hand"
                    x1="200"
                    y1="200"
                    x2="200"
                    y2="105"
                />


                <!-- 秒針 -->

                <line
                    id="second-hand"
                    x1="200"
                    y1="200"
                    x2="200"
                    y2="92"
                />


            </g>


            <!-- ==================================================
                 中央軸

                 針の後ろに配置して、
                 すべての針が中央から出ているようにする。
            ================================================== -->

            <circle
                class="clock-center"
                cx="200"
                cy="200"
                r="7"
            />


            <circle
                class="clock-dot"
                cx="200"
                cy="200"
                r="3"
            />


        </svg>


    </div>


    <!-- ==================================================
         凡例
    ================================================== -->

    <div class="legend">

        <div class="legend-item">

            <span
                class="legend-mark legend-outpatient"
                aria-hidden="true"
            ></span>

            <span>外来診療</span>

        </div>


        <div class="legend-item">

            <span
                class="legend-mark legend-home"
                aria-hidden="true"
            ></span>

            <span>訪問診療</span>

        </div>

    </div>


    <!-- ==================================================
         診療時間
    ================================================== -->

    <div class="time-list">


        <div class="time-row">

            <span class="time-name outpatient">
                午前診
            </span>

            <span class="time-value">
                9:00〜12:00
            </span>

        </div>


        <div class="time-row">

            <span class="time-name home">
                訪問診療
            </span>

            <span class="time-value">
                13:30〜16:30
            </span>

        </div>


        <div class="time-row">

            <span class="time-name outpatient">
                午後診
            </span>

            <span class="time-value">
                17:30〜19:30
            </span>

        </div>


    </div>


</main>


<script>

/* =========================================================
   時計の基本設定
========================================================= */

const SVG_CENTER = 200;

const BAND_RADIUS = 180;

const OUTER_RADIUS = 180;

const INNER_RADIUS = 100;


/* =========================================================
   SVG要素取得
========================================================= */

const morningBand =
    document.getElementById("morning-band");

const homeBand =
    document.getElementById("home-band");

const eveningBand =
    document.getElementById("evening-band");

const minuteMarks =
    document.getElementById("minute-marks");

const clockNumbers =
    document.getElementById("clock-numbers");

const morningLabel =
    document.getElementById("morning-label");

const homeLabel =
    document.getElementById("home-label");

const eveningLabel =
    document.getElementById("evening-label");


/* =========================================================
   時計角度

   12時 = 0°
    3時 = 90°
    6時 = 180°
    9時 = 270°

   SVGでは通常、Y軸が下向きなので、
   sin / cosを使って座標化する際に
   時計の向きをここで統一する。
========================================================= */

/**
 * 時刻を時計上の角度へ変換する。
 *
 * @param {number} hour 0〜23の時刻。
 * @param {number} minute 0〜59の分。
 * @returns {number} 12時を0°とした時計角度。
 * @throws {TypeError} 数値でない場合。
 *
 * @example
 * timeToAngle(3, 0); // 90
 */
function timeToAngle(hour, minute) {

    if (
        typeof hour !== "number" ||
        typeof minute !== "number" ||
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ) {
        throw new TypeError(
            "hourとminuteには有限の数値が必要です。"
        );
    }

    const normalizedHour = hour % 12;

    return (
        normalizedHour * 30 +
        minute * 0.5
    );
}


/* =========================================================
   時計座標へ変換
========================================================= */

/**
 * 時計角度と半径からSVG座標を求める。
 *
 * @param {number} angle 時計角度。
 * @param {number} radius 中心からの距離。
 * @returns {{x:number,y:number}} SVG座標。
 * @throws {TypeError} 不正な引数の場合。
 *
 * @example
 * polarToPoint(0, 180);
 * // { x: 200, y: 20 }
 */
function polarToPoint(angle, radius) {

    if (
        typeof angle !== "number" ||
        typeof radius !== "number" ||
        !Number.isFinite(angle) ||
        !Number.isFinite(radius)
    ) {
        throw new TypeError(
            "angleとradiusには有限の数値が必要です。"
        );
    }

    const radians =
        (angle - 90) * Math.PI / 180;

    return {
        x:
            SVG_CENTER +
            radius * Math.cos(radians),

        y:
            SVG_CENTER +
            radius * Math.sin(radians)
    };
}


/* =========================================================
   円弧パス生成

   診療時間帯専用。
   針には絶対に使用しない。
========================================================= */

/**
 * 時計上の開始時刻から終了時刻までの円弧を作る。
 *
 * @param {number} startHour 開始時刻。
 * @param {number} startMinute 開始分。
 * @param {number} endHour 終了時刻。
 * @param {number} endMinute 終了分。
 * @param {number} radius 円弧半径。
 * @returns {string} SVG pathのd属性。
 * @throws {TypeError} 不正な値の場合。
 *
 * @example
 * createBandPath(9, 0, 12, 0, 180);
 */
function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute,
    radius
) {

    const values = [
        startHour,
        startMinute,
        endHour,
        endMinute,
        radius
    ];

    if (
        values.some(
            value =>
                typeof value !== "number" ||
                !Number.isFinite(value)
        )
    ) {
        throw new TypeError(
            "円弧の引数には有限の数値が必要です。"
        );
    }

    let startAngle =
        timeToAngle(
            startHour,
            startMinute
        );

    let endAngle =
        timeToAngle(
            endHour,
            endMinute
        );

    /*
     * 時計方向に進ませるため、
     * 終了角度が開始角度以下の場合は360°加算。
     */
    if (endAngle <= startAngle) {
        endAngle += 360;
    }

    const delta =
        endAngle - startAngle;

    const largeArcFlag =
        delta > 180 ? 1 : 0;

    const start =
        polarToPoint(
            startAngle,
            radius
        );

    const end =
        polarToPoint(
            endAngle,
            radius
        );

    return [
        `M ${start.x} ${start.y}`,

        `A ${radius} ${radius} 0 ${largeArcFlag} 1 ${end.x} ${end.y}`
    ].join(" ");
}


/* =========================================================
   診療時間帯を生成
========================================================= */

function renderTimeBands() {

    try {

        morningBand.setAttribute(
            "d",
            createBandPath(
                9,
                0,
                12,
                0,
                BAND_RADIUS
            )
        );


        homeBand.setAttribute(
            "d",
            createBandPath(
                13,
                30,
                16,
                30,
                BAND_RADIUS
            )
        );


        eveningBand.setAttribute(
            "d",
            createBandPath(
                17,
                30,
                19,
                30,
                BAND_RADIUS
            )
        );

    } catch (error) {

        console.error(
            "診療時間帯の描画に失敗しました。",
            error
        );

    }
}


/* =========================================================
   目盛
========================================================= */

/**
 * 時計の60分目盛を生成する。
 *
 * @returns {void}
 */
function renderMinuteMarks() {

    minuteMarks.replaceChildren();

    for (let i = 0; i < 60; i++) {

        const angle =
            i * 6;

        const isHour =
            i % 5 === 0;

        const outerRadius =
            OUTER_RADIUS - 9;

        const innerRadius =
            isHour
                ? OUTER_RADIUS - 24
                : OUTER_RADIUS - 17;

        const outer =
            polarToPoint(
                angle,
                outerRadius
            );

        const inner =
            polarToPoint(
                angle,
                innerRadius
            );

        const line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        line.setAttribute(
            "x1",
            inner.x
        );

        line.setAttribute(
            "y1",
            inner.y
        );

        line.setAttribute(
            "x2",
            outer.x
        );

        line.setAttribute(
            "y2",
            outer.y
        );

        line.setAttribute(
            "class",
            isHour
                ? "hour-mark"
                : "minute-mark"
        );

        minuteMarks.appendChild(line);
    }
}


/* =========================================================
   数字
========================================================= */

/**
 * 時計の1〜12の数字を生成する。
 *
 * @returns {void}
 */
function renderClockNumbers() {

    clockNumbers.replaceChildren();

    const radius = 145;

    for (let number = 1; number <= 12; number++) {

        const angle =
            number * 30;

        const point =
            polarToPoint(
                angle,
                radius
            );

        const text =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "text"
            );

        text.setAttribute(
            "x",
            point.x
        );

        text.setAttribute(
            "y",
            point.y
        );

        text.setAttribute(
            "class",
            "clock-number"
        );

        text.textContent =
            String(number);

        clockNumbers.appendChild(text);
    }
}


/* =========================================================
   診療時間ラベル位置
========================================================= */

function renderBandLabels() {

    /*
     * 帯の中央付近に配置。
     * 角度は時間帯の中間点から算出する。
     */

    const morning =
        polarToPoint(
            315,
            115
        );

    const home =
        polarToPoint(
            150,
            115
        );

    const evening =
        polarToPoint(
            202.5,
            115
        );


    morningLabel.setAttribute(
        "x",
        morning.x
    );

    morningLabel.setAttribute(
        "y",
        morning.y
    );


    homeLabel.setAttribute(
        "x",
        home.x
    );

    homeLabel.setAttribute(
        "y",
        home.y
    );


    eveningLabel.setAttribute(
        "x",
        evening.x
    );

    eveningLabel.setAttribute(
        "y",
        evening.y
    );
}


/* =========================================================
   時計の針
========================================================= */

/**
 * 現在時刻から3本の針を更新する。
 *
 * ここでは診療時間帯のSVG計算を一切使用しない。
 *
 * 時針・分針・秒針のすべてを
 * (200,200)
 * を中心に回転させる。
 *
 * 秒針はミリ秒まで使用するため、
 * 1秒ごとのカクカクした動きではなく
 * 連続的に動く。
 *
 * @returns {void}
 */
function updateClockHands() {

    const hourHand =
        document.getElementById(
            "hour-hand"
        );

    const minuteHand =
        document.getElementById(
            "minute-hand"
        );

    const secondHand =
        document.getElementById(
            "second-hand"
        );


    /*
     * 要素が存在しない場合は、
     * null参照でJavaScript全体を停止させない。
     */
    if (
        !hourHand ||
        !minuteHand ||
        !secondHand
    ) {

        console.error(
            "時計の針要素が見つかりません。"
        );

        return;
    }


    const now =
        new Date();


    const hours =
        now.getHours() % 12;

    const minutes =
        now.getMinutes();

    const seconds =
        now.getSeconds();

    const milliseconds =
        now.getMilliseconds();


    /*
     * --------------------------------------------------
     * 時針
     *
     * 1時間 = 30°
     * 1分 = 0.5°
     * 1秒 = 約0.008333°
     * --------------------------------------------------
     */

    const hourAngle =
        hours * 30 +
        minutes * 0.5 +
        seconds * (0.5 / 60) +
        milliseconds * (0.5 / 60000);


    /*
     * --------------------------------------------------
     * 分針
     *
     * 1分 = 6°
     * 1秒 = 0.1°
     * --------------------------------------------------
     */

    const minuteAngle =
        minutes * 6 +
        seconds * 0.1 +
        milliseconds * 0.0001;


    /*
     * --------------------------------------------------
     * 秒針
     *
     * 1秒 = 6°
     *
     * 1ms = 0.006°
     *
     * これにより秒針が連続運針する。
     * --------------------------------------------------
     */

    const secondAngle =
        seconds * 6 +
        milliseconds * 0.006;


    /*
     * --------------------------------------------------
     * 全て同じ中心
     *
     * rotate(angle 200 200)
     *
     * ここを絶対に変えない。
     * --------------------------------------------------
     */

    hourHand.setAttribute(
        "transform",
        `rotate(${hourAngle} 200 200)`
    );

    minuteHand.setAttribute(
        "transform",
        `rotate(${minuteAngle} 200 200)`
    );

    secondHand.setAttribute(
        "transform",
        `rotate(${secondAngle} 200 200)`
    );


    /*
     * requestAnimationFrameを使うことで、
     * ブラウザの描画タイミングに同期させる。
     *
     * setIntervalではなくこちらを使うことで、
     * 秒針の滑らかな表示を優先する。
     */
    requestAnimationFrame(
        updateClockHands
    );
}


/* =========================================================
   初期化
========================================================= */

function initializeClock() {

    try {

        renderTimeBands();

        renderMinuteMarks();

        renderClockNumbers();

        renderBandLabels();

        updateClockHands();

    } catch (error) {

        /*
         * 初期化失敗時に画面全体のJavaScriptを
         * 黙って停止させないため、明示的にログを残す。
         */
        console.error(
            "時計の初期化に失敗しました。",
            error
        );
    }
}


initializeClock();

</script>
