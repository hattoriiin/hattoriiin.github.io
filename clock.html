<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜診療時間</title>

<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

    line-height:1.7;

}


/* ==================================================
   ページ
================================================== */

.clock-page{

    width:100%;

    max-width:900px;

    margin:0 auto;

    padding:
        2rem
        1.2rem
        4rem;

}


/* ==================================================
   タイトル
================================================== */

.clock-title{

    margin:0;

    text-align:center;

    font-size:1.45rem;

    font-weight:400;

    letter-spacing:.16em;

    color:#31556e;

}

.clock-subtitle{

    margin:.35rem 0 1.8rem;

    text-align:center;

    font-size:.78rem;

    color:#777;

    letter-spacing:.08em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        92vw,
        520px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


/* --------------------------------------------------
   SVG

   時計の中心をすべて

       cx = 200
       cy = 200

   に統一。

   数字・帯・円周が同じ座標系。
-------------------------------------------------- */

.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計の背景
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   診療時間帯
================================================== */

.time-band{

    /*
       帯そのものには枠線を付けない。

       ただし角を丸めるため、
       個別のクラスで薄い白い縁を付ける。
    */

    stroke-width:3;

    stroke-linejoin:round;

}


/* ==================================================
   外来診療

   青

   外側：
   白っぽく、薄く、艶やか

   中央：
   青

   内側：
   青を少し残す

   opacity 約35%
================================================== */

.outpatient-band{

    fill:url(#outpatientGradient);

    opacity:.35;

    stroke:
        rgba(255,255,255,.35);

}


/* ==================================================
   訪問診療

   緑

   外側：
   緑

   内側：
   白っぽく、薄く、艶やか

   opacity 約35%
================================================== */

.visit-band{

    fill:url(#visitGradient);

    opacity:.35;

    stroke:
        rgba(255,255,255,.35);

}


/* ==================================================
   時計の数字
================================================== */

.clock-face{

    pointer-events:none;

}


/*
   高級時計の文字盤を意識した
   細身のセリフ系フォント
*/

.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

    letter-spacing:0;

}


/* 12だけ少し存在感 */

.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}

.clock-hand.hour{

    stroke-width:4;

}

.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    stroke-linecap:round;

    opacity:.16;

}


/* ==================================================
   中央点
================================================== */

.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   説明カード
================================================== */

.schedule-note{

    max-width:520px;

    margin:1.8rem auto 0;

    padding:1rem 1.2rem;

    background:
        rgba(245,250,250,.72);

    border-radius:14px;

    box-shadow:
        0 4px 14px
        rgba(40,80,80,.06);

}


/* ==================================================
   凡例
================================================== */

.legend{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:1.5rem;

    flex-wrap:wrap;

    font-size:.82rem;

    color:#555;

}

.legend-item{

    display:flex;

    align-items:center;

    gap:.45rem;

}


/* ==================================================
   凡例：外来
================================================== */

.legend-blue{

    width:12px;

    height:12px;

    border-radius:50%;

    background:#3d8bdc;

    opacity:.35;

}


/* ==================================================
   凡例：訪問
================================================== */

.legend-green{

    width:12px;

    height:12px;

    border-radius:50%;

    background:#70ad47;

    opacity:.35;

}


/* ==================================================
   診療時間文字
================================================== */

.schedule-times{

    margin-top:1rem;

    text-align:center;

    font-size:.82rem;

    line-height:1.9;

    color:#555;

}

.schedule-times strong{

    font-weight:500;

    color:#31556e;

}


/* ==================================================
   戻る
================================================== */

.back-link{

    display:block;

    width:max-content;

    margin:2rem auto 0;

    padding:.55rem 1.3rem;

    border-radius:20px;

    background:#31556e;

    color:#fff;

    text-decoration:none;

    font-size:.8rem;

}


/* ==================================================
   スマートフォン
================================================== */

@media(max-width:600px){

    .clock-page{

        padding:
            1.4rem
            .7rem
            3rem;

    }

    .clock-title{

        font-size:1.25rem;

    }

    .clock-subtitle{

        margin-bottom:1rem;

    }

    .clock-face text{

        font-size:29px;

    }

    .clock-face .twelve{

        font-size:31px;

    }

    .schedule-note{

        margin-left:.3rem;

        margin-right:.3rem;

    }

}


/* ==================================================
   小さいスマートフォン
================================================== */

@media(max-width:380px){

    .clock-face text{

        font-size:27px;

    }

    .clock-face .twelve{

        font-size:29px;

    }

}

</style>

</head>

    <!-- やや濃い -->

        stop-opacity=".80"

     ※ 帯の幅そのものは変えない。

    gradientUnits="userSpaceOnUse"

         ⭐ 白い抜け

        stop-color="#3d8bdc"

    <!-- 外周：濃い -->

    <stop
        offset="100%"

<!-- ==================================================

================================================== -->

<circle

    cy="200"

<!-- ==================================================
     ⭐ 午前診

     9:00 → 12:00

     時計の角度：
     9時  = 270°
     12時 = 360°

     SVGで使用する角度：
     9時  = 180°

     ※ SVGでは12時方向を -90° とする。
     ※ 時計角度 − 90° ＝ SVG角度。

     外周半径 = 166
     内周半径 = 128

     ※ 診療時間帯は円弧で構成。
     ※ 始点・終点の端面は直線。
     ※ stroke-linejoin:round により
        接続部を柔らかく見せる。
================================================== -->

<path

    d="

/>



<!-- ==================================================

     ※ 時計角度 − 90° ＝ SVG角度。

     ※ 診療時間帯は円弧で構成。
     ※ 始点・終点の端面は直線。
     ※ stroke-linejoin:round により

        82.62 317.38

<script>

/* ==================================================
   ⭐ 現在時刻に合わせて時計の針を滑らかに動かす
================================================== */

function updateClock(){

    const now = new Date();

    const hours = now.getHours();

    const minutes = now.getMinutes();

    const seconds = now.getSeconds();

    const milliseconds = now.getMilliseconds();


    /* ----------------------------------------------
       ⭐ 秒針
       1秒 = 6°

       ミリ秒まで計算することで
       1秒ごとにカクッと動かず、
       滑らかに回転する。
    ---------------------------------------------- */

    const secondAngle =
        (seconds + milliseconds / 1000) * 6;


    /* ----------------------------------------------
       ⭐ 分針
       秒の進みも反映
    ---------------------------------------------- */

    const minuteAngle =
        (minutes + seconds / 60) * 6;


    /* ----------------------------------------------
       ⭐ 時針
       分・秒の進みも反映
    ---------------------------------------------- */

    const hourAngle =
        (hours % 12) * 30
        + minutes * 0.5
        + seconds * (0.5 / 60);


    /* ----------------------------------------------
       ⭐ 秒針
    ---------------------------------------------- */

    document
        .querySelector('.clock-hand.second')
        .setAttribute(
            'transform',
            `rotate(${secondAngle},200,200)`
        );


    /* ----------------------------------------------
       ⭐ 分針
    ---------------------------------------------- */

    document
        .querySelector('.clock-hand.minute')
        .setAttribute(
            'transform',
            `rotate(${minuteAngle},200,200)`
        );


    /* ----------------------------------------------
       ⭐ 時針
    ---------------------------------------------- */

    document
        .querySelector('.clock-hand.hour')
        .setAttribute(
            'transform',
            `rotate(${hourAngle},200,200)`
        );


    /* ----------------------------------------------
       ⭐ 約60fpsで更新
    ---------------------------------------------- */

    requestAnimationFrame(updateClock);

}


/* ==================================================
   ⭐ 時計開始
================================================== */

updateClock();

</script>
