<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   時間帯
================================================== */

/*
 * 外側の色レイヤー。
 *
 * stroke-linecap:round にすることで、
 * 始点・終点を完全に閉じた
 * 「角の取れたバームクーヘン型」にする。
 */

.time-band{

    fill:none;

    stroke-linecap:round;

    stroke-linejoin:round;

}


/*
 * 外側の色レイヤー。
 *
 * 青・緑とも同じ幅にすることで、
 * 見た目の太さを完全に揃える。
 */

.time-band.outer{

    stroke-width:80;

}


/*
 * 内側の白レイヤー。
 *
 * 外側より十分細くする。
 *
 * これによって白が広がりすぎず、
 * 外側の青・緑のグラデーションが残る。
 */

.time-band.inner{

    stroke-width:40;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}


.clock-hand.hour{

    stroke-width:4;

}


.clock-hand.minute{

    stroke-width:2.5;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}


.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向き
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

<defs>

    <stop

    <stop

    <stop
        offset="86%"

<!-- ==================================================

    />

    <stop

    />

    <stop

</radialGradient>


</defs>


<!-- ==================================================
     時計盤
================================================== -->

<circle

================================================== -->

<path

================================================== -->

<script>

/* ==================================================
   基本設定
================================================== */

const SVG_CENTER = 200;


/*
 * 時間帯の中心線の半径。
 *
 * 外側レイヤー80px、
 * 内側レイヤー40pxなので、
 *
 * 外周：180
 * 中心：140
 * 内周：100
 *
 * となる。
 *
 * これにより時計全体の位置を変えずに
 * 「外側＋内側」の二層構造を作る。
 */

const BAND_CENTER_RADIUS = 140;


/* ==================================================
   時刻 → 時計角度
================================================== */

/**
 * 時刻を時計上の角度へ変換する。
 *
 * 12時を0°として時計回りに増加する。
 *
 * @param {number} hour 時
 * @param {number} minute 分
 * @returns {number} 時計角度（0〜360°）
 * @throws {TypeError} 時・分が数値でない場合
 * @throws {RangeError} 分が0〜59の範囲外の場合
 *
 * @example
 * timeToClockAngle(9, 0); // 270
 */

function timeToClockAngle(
    hour,
    minute
){

    if(
        !Number.isFinite(hour) ||
        !Number.isFinite(minute)
    ){

        throw new TypeError(
            '時刻は数値で指定してください'
        );

    }


    if(
        minute < 0 ||
        minute >= 60
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    return (
        ((hour % 12) * 30) +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

/**
 * 時計角度をSVG角度へ変換する。
 *
 * SVGの0°は3時方向なので、
 * 12時方向を0°として扱うため90°を引く。
 *
 * @param {number} clockAngle 時計角度
 * @returns {number} SVG角度
 *
 * @example
 * clockToSvgAngle(0); // -90
 */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   正規化
================================================== */

/**
 * 角度を0〜360°へ正規化する。
 *
 * @param {number} angle 角度
 * @returns {number} 正規化された角度
 *
 * @example
 * normalizeAngle(-30); // 330
 */

function normalizeAngle(
    angle
){

    return (
        angle % 360 +
        360
    ) % 360;

}


/* ==================================================
   極座標 → SVG座標
================================================== */

/**
 * 極座標をSVG座標へ変換する。
 *
 * @param {number} radius 半径
 * @param {number} svgAngle SVG角度
 * @returns {{x:number,y:number}} SVG座標
 *
 * @example
 * polarToPoint(140, -90);
 */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle *
        Math.PI /
        180;


    return {

        x:
            SVG_CENTER +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   円弧パス生成
================================================== */

/**
 * 指定した時間範囲を、
 * 角の取れた一本の円弧パスとして生成する。
 *
 * stroke-linecap:round と組み合わせることで、
 * 始点・終点が完全に閉じた
 * バームクーヘン型の時間帯になる。
 *
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @returns {string} SVG pathデータ
 * @throws {RangeError} 時間範囲が不正な場合
 *
 * @example
 * createBandPath(9,0,12,0);
 */

function createBandPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const start =
        timeToClockAngle(
            startHour,
            startMinute
        );


    const end =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const sweep =
        normalizeAngle(
            end - start
        );


    if(
        sweep <= 0 ||
        sweep >= 360
    ){

        throw new RangeError(
            '開始時刻と終了時刻の角度が不正です'
        );

    }


    const startPoint =
        polarToPoint(
            BAND_CENTER_RADIUS,
            clockToSvgAngle(start)
        );


    const endPoint =
        polarToPoint(
            BAND_CENTER_RADIUS,
            clockToSvgAngle(end)
        );


    /*
     * 180°を超える場合だけ
     * 大きな円弧フラグを1にする。
     */

    const largeArcFlag =
        sweep > 180
            ? 1
            : 0;


    /*
     * 時計回りに円弧を描く。
     *
     * このpath自体は一本の中心線。
     * 実際の太さはCSSのstroke-widthで決める。
     *
     * そのため外側と内側で同じpathを使え、
     * 始点・終点が完全に一致する。
     */

    return [

        `M
        ${startPoint.x}
        ${startPoint.y}`,

        `A
        ${BAND_CENTER_RADIUS}
        ${BAND_CENTER_RADIUS}
        0
        ${largeArcFlag}
        1
        ${endPoint.x}
        ${endPoint.y}`

    ].join(' ');

}


/* ==================================================
   時間帯設定
================================================== */

/**
 * 外側の色レイヤーと、
 * 内側の白透過レイヤーを同じ時間範囲に設定する。
 *
 * @param {string} outerId 外側パスID
 * @param {string} innerId 内側パスID
 * @param {number} startHour 開始時
 * @param {number} startMinute 開始分
 * @param {number} endHour 終了時
 * @param {number} endMinute 終了分
 * @param {string} outerGradient 外側グラデーションID
 * @returns {void}
 *
 * @example
 * setBand(
 *     'morningOuter',
 *     'morningInner',
 *     9,0,
 *     12,0,
 *     'outpatientOuterGradient'
 * );
 */

function setBand(
    outerId,
    innerId,
    startHour,
    startMinute,
    endHour,
    endMinute,
    outerGradient
){

    const outerElement =
        document.getElementById(
            outerId
        );


    const innerElement =
        document.getElementById(
            innerId
        );


    /*
     * どちらかが存在しない場合、
     * JavaScriptエラーを起こさず終了する。
     */

    if(
        !outerElement ||
        !innerElement
    ){

        console.error(
            `時間帯要素が見つかりません: ${outerId}, ${innerId}`
        );

        return;

    }


    try{

        const path =
            createBandPath(
                startHour,
                startMinute,
                endHour,
                endMinute
            );


        /*
         * 外側と内側に
         * 完全に同じpathを設定する。
         *
         * これが今回の重要部分。
         *
         * 始点も終点も完全に一致するため、
         * 白レイヤーだけ端から抜けることがない。
         */

        outerElement.setAttribute(
            'd',
            path
        );


        innerElement.setAttribute(
            'd',
            path
        );


        /*
         * 外側には青または緑。
         */

        outerElement.setAttribute(
            'stroke',
            `url(#${outerGradient})`
        );


        /*
         * 内側には白の透過グラデーション。
         */

        innerElement.setAttribute(
            'stroke',
            'url(#whiteOverlayGradient)'
        );

    }

    catch(error){

        console.error(
            `${outerId} / ${innerId} の描画に失敗しました`,
            error
        );

    }

}


/* ==================================================
   午前診
   9:00 → 12:00
================================================== */

setBand(
    'morningOuter',
    'morningInner',

    9,
    0,

    12,
    0,

    'outpatientOuterGradient'
);


/* ==================================================
   訪問診療
   13:30 → 16:30
================================================== */

setBand(
    'visitOuter',
    'visitInner',

    13,
    30,

    16,
    30,

    'visitOuterGradient'
);


/* ==================================================
   午後診
   17:30 → 19:30
================================================== */

setBand(
    'eveningOuter',
    'eveningInner',

    17,
    30,

    19,
    30,

    'outpatientOuterGradient'
);


/* ==================================================
   日本時間
================================================== */

/**
 * 日本時間を取得する。
 *
 * @returns {{
 *     hour:number,
 *     minute:number,
 *     second:number
 * }}
 * @throws {Error} 日本時間を正常に取得できない場合
 *
 * @example
 * getJapanTime();
 */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',

                hour12:false,

                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    for(
        const part
        of parts
    ){

        if(
            part.type === 'hour' ||
            part.type === 'minute' ||
            part.type === 'second'
        ){

            result[part.type] =
                Number(part.value);

        }

    }


    /*
     * 一部の環境では深夜0時を
     * 24として返すことがあるため、
     * 0時へ正規化する。
     */

    if(
        result.hour === 24
    ){

        result.hour = 0;

    }


    if(
        !Number.isInteger(result.hour) ||
        !Number.isInteger(result.minute) ||
        !Number.isInteger(result.second)
    ){

        throw new Error(
            '日本時間の取得結果が不正です'
        );

    }


    return result;

}


/* ==================================================
   時計更新
================================================== */

/**
 * 日本時間に合わせて時計の針を更新する。
 *
 * 時針・分針・秒針を連続的に動かす。
 *
 * @returns {void}
 *
 * @example
 * updateClock();
 */

function updateClock(){

    let now;


    try{

        now =
            getJapanTime();

    }

    catch(error){

        console.error(
            '時計更新に失敗しました',
            error
        );

        return;

    }


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    /*
     * 秒針。
     */

    const secondAngle =
        seconds * 6;


    /*
     * 分針。
     *
     * 秒も加味することで、
     * 分の途中でも少しずつ進む。
     */

    const minuteAngle =
        (
            minutes +
            seconds / 60
        ) * 6;


    /*
     * 時針。
     *
     * 分・秒を加味することで、
     * 時針も滑らかに進む。
     */

    const hourAngle =
        (
            (hours % 12) +
            minutes / 60 +
            seconds / 3600
        ) * 30;


    const secondHand =
        document.querySelector(
            '.clock-hand.second'
        );


    const minuteHand =
        document.querySelector(
            '.clock-hand.minute'
        );


    const hourHand =
        document.querySelector(
            '.clock-hand.hour'
        );


    /*
     * 必要なSVG要素がない場合は
     * requestAnimationFrameを継続しない。
     */

    if(
        !secondHand ||
        !minuteHand ||
        !hourHand
    ){

        console.error(
            '時計の針が見つかりません'
        );

        return;

    }


    /*
     * 針は12時方向を初期位置としている。
     *
     * そのため時計角度をそのまま
     * SVGのrotate角度として使用する。
     *
     * ここでclockToSvgAngle()を使うと
     * 3時間ずれるため使用しない。
     */

    secondHand.setAttribute(
        'transform',
        `rotate(
            ${secondAngle},
            200,
            200
        )`
    );


    minuteHand.setAttribute(
        'transform',
        `rotate(
            ${minuteAngle},
            200,
            200
        )`
    );


    hourHand.setAttribute(
        'transform',
        `rotate(
            ${hourAngle},
            200,
            200
        )`
    );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>


</body>

</html>
