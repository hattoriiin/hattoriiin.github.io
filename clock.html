<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜外来診療時間</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:#fff;

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   メイン

   時計だけを画面中央に配置する。
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   時計見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    aspect-ratio:1 / 1;

    margin:0 auto;

}


/* ==================================================
   SVG
================================================== */

.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤
================================================== */

.clock-disc{

    fill:#fff;

}


/* ==================================================
   外周
================================================== */

.outer-ring{

    fill:none;

    stroke:
        rgba(49,85,110,.12);

    stroke-width:1.2;

}


/* ==================================================
   診療時間帯

   ★重要

   帯を「塗りつぶした扇形」ではなく
   「太い円弧」として描く。

   中心半径 140
   帯幅       80

   したがって、

   140 - 40 = 100
   140 + 40 = 180

   となり、内周100・外周180が
   完全に一致する。

   stroke-linecap:round により、
   時間帯の両端が本物の角丸になる。
================================================== */

.time-band{

    fill:none;

    stroke-width:80;

    stroke-linecap:round;

    stroke-linejoin:round;

}


/* ==================================================
   午前・午後

   青系グラデーション
================================================== */

.outpatient-band{

    stroke:
        url(#outpatientGradient);

}


/* ==================================================
   訪問診療

   緑系グラデーション
================================================== */

.visit-band{

    stroke:
        url(#visitGradient);

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}

.clock-face text{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:31px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:#31556e;

}


.clock-face .twelve{

    font-size:33px;

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.25;

}

.clock-hand.hour{

    stroke-width:4;

}

.clock-hand.minute{

    stroke-width:2.5;

}

.clock-hand.second{

    stroke:#31556e;

    stroke-width:1.2;

    opacity:.16;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#fff;

    stroke:
        rgba(49,85,110,.18);

    stroke-width:1.2;

}

.clock-dot{

    fill:#31556e;

    opacity:.45;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media
(max-width:600px)
and
(orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

    }


    .clock-face text{

        font-size:29px;

    }


    .clock-face .twelve{

        font-size:31px;

    }

}


/* ==================================================
   小型スマートフォン
================================================== */

@media(max-width:380px){

    .clock-title{

        font-size:.92rem;

    }


    .clock-face text{

        font-size:27px;

    }


    .clock-face .twelve{

        font-size:29px;

    }

}


/* ==================================================
   横向きスマートフォン
================================================== */

@media
(max-width:900px)
and
(orientation:landscape){

    .page-main{

        padding:.5rem;

    }


    .clock-area{

        max-width:390px;

    }


    .clock-title{

        margin-bottom:.35rem;

        font-size:.9rem;

    }


    .time-ring{

        width:min(
            72vh,
            390px
        );

    }


    .clock-face text{

        font-size:25px;

    }


    .clock-face .twelve{

        font-size:27px;

    }

}

</style>

</head>


<body>


<main class="page-main">


<section class="clock-area">

<h1 class="clock-title">
    外来診療時間
</h1>


<div class="time-ring">

<svg
    viewBox="0 0 400 400"
    role="img"
    aria-label="服部医院 外来診療時間"

<defs>


<!-- ==================================================

     帯の中心は半径140。

     その両側へ40ずつ広がるため、

================================================== -->

<radialGradient

    <stop

    <stop

<!-- ==================================================

================================================== -->

<radialGradient
    id="visitGradient"
    cx="200"
    cy="200"
    r="180"
    gradientUnits="userSpaceOnUse"
>

    <stop
        offset="68%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="73%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="77%"
        stop-color="#b7e88a"
        stop-opacity=".52"
    />

    <stop
        offset="82%"
        stop-color="#70ad47"
        stop-opacity=".72"
    />

    <stop
        offset="87%"
        stop-color="#70ad47"
        stop-opacity=".80"
    />

    <stop
        offset="91%"
        stop-color="#ffffff"
        stop-opacity=".98"
    />

    <stop
        offset="95%"

    <stop

</defs>


<!-- ==================================================
     時計盤
================================================== -->

<circle
    class="clock-disc"
    cx="200"
    cy="200"
    r="174"
/>


<!-- ==================================================
     外周
================================================== -->

<circle
    class="outer-ring"
    cx="200"
    cy="200"
    r="180"
/>


<!-- ==================================================
     午前診

     9:00 → 12:00

     円弧の中心半径は140。
     stroke-width 80なので、

     内周 = 100
     外周 = 180

     となる。
================================================== -->

<path
    id="morningBand"
    class="time-band outpatient-band"
/>


<!-- ==================================================
     訪問診療

     13:30 → 16:30
================================================== -->

<path
    id="visitBand"
    class="time-band visit-band"
/>


<!-- ==================================================

     17:30 → 19:30
================================================== -->

<path
    id="eveningBand"
    class="time-band outpatient-band"
/>

================================================== -->

<g class="clock-face">

<text

>

<text x="269" y="80">1</text>

<text x="319" y="130">2</text>

<text x="338" y="200">3</text>

<text x="62" y="200">9</text>

<text x="81" y="130">10</text>

<text x="131" y="80">11</text>

</g>


<!-- ==================================================
     時計の針
================================================== -->

<line
    class="clock-hand hour"
    x1="200"
    y1="200"
    x2="200"
    y2="125"
/>


<line
    class="clock-hand minute"
    x1="200"

     中央
================================================== -->

    class="clock-center"

/>

    class="clock-dot"
    cx="200"
    cy="200"
    r="3"
/>


</svg>

</div>

</section>

</main>


<script>

/* ==================================================
   時計設定

   円弧の中心半径は140。

   stroke-width = 80なので、

   140 - 40 = 100
   140 + 40 = 180

   となり、既存の
   INNER_RADIUS = 100
   OUTER_RADIUS = 180
   と完全に一致する。
================================================== */

const SVG_CENTER = 200;

const BAND_RADIUS = 140;

const BAND_WIDTH = 80;


/* ==================================================
   時刻 → 時計角度

   12時 = 0°
   時計回り
================================================== */

function timeToClockAngle(
    hour,
    minute
){

    return (
        ((hour % 12) * 30)
        +
        minute * 0.5
    ) % 360;

}


/* ==================================================
   時計角度 → SVG角度
================================================== */

function clockToSvgAngle(
    clockAngle
){

    return clockAngle - 90;

}


/* ==================================================
   極座標 → SVG座標

   円弧の中心半径140上の座標を取得する。
================================================== */

function polarToPoint(
    radius,
    svgAngle
){

    const radians =
        svgAngle * Math.PI / 180;

    return {

        x:
            SVG_CENTER
            +
            radius *
            Math.cos(radians),

        y:
            SVG_CENTER
            +
            radius *
            Math.sin(radians)

    };

}


/* ==================================================
   診療時間帯の円弧を作成

   以前の「扇形を閉じる方式」ではなく、
   円弧そのものをstrokeする。

   そのため、

   stroke-linecap:round

   によって始点・終点が
   正確に丸くなる。

   エラー対策：
   - 不正な時刻は例外にする
   - 開始と終了が同じ場合は描画しない
   - 180°超の時間帯にも対応する
================================================== */

function createArcPath(
    startHour,
    startMinute,
    endHour,
    endMinute
){

    if(
        !Number.isFinite(startHour) ||
        !Number.isFinite(startMinute) ||
        !Number.isFinite(endHour) ||
        !Number.isFinite(endMinute)
    ){

        throw new TypeError(
            '診療時間に数値以外が指定されています'
        );

    }


    if(
        startMinute < 0 ||
        startMinute > 59 ||
        endMinute < 0 ||
        endMinute > 59
    ){

        throw new RangeError(
            '分は0〜59で指定してください'
        );

    }


    const startClockAngle =
        timeToClockAngle(
            startHour,
            startMinute
        );

    const endClockAngle =
        timeToClockAngle(
            endHour,
            endMinute
        );


    const difference =
        (
            endClockAngle
            -
            startClockAngle
            +
            360
        ) % 360;


    if(difference === 0){

        throw new RangeError(
            '開始時刻と終了時刻が同じです'
        );

    }


    const startSvgAngle =
        clockToSvgAngle(
            startClockAngle
        );

    const endSvgAngle =
        clockToSvgAngle(
            endClockAngle
        );


    const start =
        polarToPoint(
            BAND_RADIUS,
            startSvgAngle
        );


    const end =
        polarToPoint(
            BAND_RADIUS,
            endSvgAngle
        );


    const largeArcFlag =
        difference > 180
            ? 1
            : 0;


    /*
     * SVGのAコマンドで時計回りの円弧を作る。
     *
     * sweep-flag = 1
     * とすることで、9時→12時、
     * 13:30→16:30などを
     * 正しい時計回りに描画する。
     */

    return `
        M
        ${start.x}
        ${start.y}

        A
        ${BAND_RADIUS}
        ${BAND_RADIUS}
        0
        ${largeArcFlag}
        1
        ${end.x}
        ${end.y}
    `;

}


/* ==================================================
   診療時間帯を設定
================================================== */

function setBand(
    elementId,
    startHour,
    startMinute,
    endHour,
    endMinute
){

    const element =
        document.getElementById(
            elementId
        );


    if(!element){

        throw new Error(
            `${elementId} が見つかりません`
        );

    }


    element.setAttribute(
        'd',
        createArcPath(
            startHour,
            startMinute,
            endHour,
            endMinute
        )
    );

}


/* ==================================================
   午前診
================================================== */

setBand(
    'morningBand',
    9,
    0,
    12,
    0
);


/* ==================================================
   訪問診療
================================================== */

setBand(
    'visitBand',
    13,
    30,
    16,
    30
);


/* ==================================================
   午後診
================================================== */

setBand(
    'eveningBand',
    17,
    30,
    19,
    30
);


/* ==================================================
   日本時間取得

   海外からアクセスしても
   日本時間を使用する。
================================================== */

function getJapanTime(){

    const parts =
        new Intl.DateTimeFormat(
            'en-US',
            {
                timeZone:'Asia/Tokyo',

                hour12:false,

                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            }
        ).formatToParts(
            new Date()
        );


    const result = {};


    parts.forEach(
        part => {

            if(
                part.type === 'hour' ||
                part.type === 'minute' ||
                part.type === 'second'
            ){

                result[part.type] =
                    Number(part.value);

            }

        }
    );


    return result;

}


/* ==================================================
   時計更新

   現在時刻に合わせて
   時針・分針・秒針を更新する。
================================================== */

function updateClock(){

    const now =
        getJapanTime();


    const hours =
        now.hour;

    const minutes =
        now.minute;

    const seconds =
        now.second;


    const secondAngle =
        seconds * 6;


    const minuteAngle =
        (
            minutes
            +
            seconds / 60
        ) * 6;


    const hourAngle =
        (
            (hours % 12)
            +
            minutes / 60
            +
            seconds / 3600
        ) * 30;


    const secondSvgAngle =
        clockToSvgAngle(
            secondAngle
        );

    const minuteSvgAngle =
        clockToSvgAngle(
            minuteAngle
        );

    const hourSvgAngle =
        clockToSvgAngle(
            hourAngle
        );


    document
        .querySelector(
            '.clock-hand.second'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${secondSvgAngle},
                200,
                200
            )`
        );


    document
        .querySelector(
            '.clock-hand.minute'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${minuteSvgAngle},
                200,
                200
            )`
        );


    document
        .querySelector(
            '.clock-hand.hour'
        )
        .setAttribute(
            'transform',
            `rotate(
                ${hourSvgAngle},
                200,
                200
            )`
        );


    requestAnimationFrame(
        updateClock
    );

}


/* ==================================================
   時計開始
================================================== */

updateClock();

</script>


</body>

</html>
