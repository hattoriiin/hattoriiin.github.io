<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>服部医院｜診療時間</title>


<style>

/* =========================================================
   基本
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        radial-gradient(
            circle at 50% 38%,
            rgba(255,255,255,.98) 0%,
            rgba(247,251,248,.96) 45%,
            rgba(229,240,234,.92) 100%
        );

    color:#52615b;

    font-family:
        "Noto Sans JP",
        sans-serif;

}


/* =========================================================
   ページ
========================================================= */

.clock-page{

    width:min(96vw,680px);

    text-align:center;

}


/* =========================================================
   タイトル
========================================================= */

.title{

    margin:0 0 5px;

    font-size:1.3rem;

    font-weight:400;

    letter-spacing:.18em;

}

.subtitle{

    margin:0 0 20px;

    font-size:.75rem;

    letter-spacing:.12em;

    color:#82908a;

}


/* =========================================================
   時計
========================================================= */

.clock{

    position:relative;

    width:min(92vw,560px);

    aspect-ratio:1;

    margin:0 auto;

    border-radius:50%;

    overflow:visible;

    background:

        radial-gradient(
            circle at 50% 46%,
            #ffffff 0%,
            #ffffff 55%,
            #f7faf8 78%,
            #edf4ef 100%
        );

    box-shadow:

        0 25px 65px
        rgba(50,80,65,.14),

        inset 0 0 0 1px
        rgba(100,130,115,.12);

}


/* =========================================================
   時計盤内側のごく薄い輪郭
========================================================= */

.clock::before{

    content:"";

    position:absolute;

    inset:2.5%;

    border-radius:50%;

    border:1px solid
        rgba(100,130,115,.10);

    pointer-events:none;

    z-index:1;

}


/* =========================================================
   診療時間帯 SVG

   ⭐ すべて時計中心を基準に生成
========================================================= */

.time-ring{

    position:absolute;

    inset:4%;

    z-index:3;

    pointer-events:none;

}

.time-ring svg{

    width:100%;
    height:100%;

    display:block;

    overflow:visible;

}


/* =========================================================
   帯

   端面は直線
   角だけ丸める
========================================================= */

.time-band{

    stroke-linejoin:round;

}


/* =========================================================
   外来診療

   以前の青丸を透明度約35%にした色
========================================================= */

.outpatient-band{

    fill:url(#outpatientGradient);

    stroke:
        rgba(61,139,220,.18);

    stroke-width:.35;

}


/* =========================================================
   訪問診療

   以前の緑丸を透明度約35%にした色
========================================================= */

.visit-band{

    fill:url(#visitGradient);

    stroke:
        rgba(112,173,71,.18);

    stroke-width:.35;

}


/* =========================================================
   帯の艶
========================================================= */

.band-shine{

    fill:none;

    stroke:white;

    stroke-linecap:round;

    opacity:.32;

    pointer-events:none;

}


/* =========================================================
   文字盤

   ⭐ SVGと同じ円・同じ中心
========================================================= */

.dial{

    position:absolute;

    inset:4%;

    z-index:6;

    pointer-events:none;

}


/* =========================================================
   時計数字

   Frank Muller風の雰囲気を意識した
   大きめのクラシカルな数字
========================================================= */

.number{

    position:absolute;

    width:2.4em;
    height:2.4em;

    display:flex;

    justify-content:center;
    align-items:center;

    transform:
        translate(-50%,-50%);

    font-family:

        "Bodoni 72",
        "Didot",
        "Times New Roman",
        serif;

    font-size:clamp(
        1.35rem,
        4vw,
        2.05rem
    );

    font-weight:500;

    line-height:1;

    color:#53635c;

    text-shadow:
        0 1px 2px
        rgba(255,255,255,.9);

}


/* =========================================================
   数字位置

   角度から決めた位置
========================================================= */

.n12{

    left:50%;
    top:12%;

}

.n1{

    left:69%;
    top:17%;

}

.n2{

    left:83%;
    top:31%;

}

.n3{

    left:88%;
    top:50%;

}

.n4{

    left:83%;
    top:69%;

}

.n5{

    left:69%;
    top:83%;

}

.n6{

    left:50%;
    top:88%;

}

.n7{

    left:31%;
    top:83%;

}

.n8{

    left:17%;
    top:69%;

}

.n9{

    left:12%;
    top:50%;

}

.n10{

    left:17%;
    top:31%;

}

.n11{

    left:31%;
    top:17%;

}


/* =========================================================
   針
========================================================= */

.hand{

    position:absolute;

    left:50%;
    top:50%;

    z-index:10;

    transform-origin:
        50% 100%;

    border-radius:
        999px;

}


/* =========================================================
   時針
========================================================= */

.hour-hand{

    width:8px;

    height:25%;

    margin-left:-4px;
    margin-top:-25%;

    background:
        linear-gradient(
            to right,
            #42524b,
            #687970,
            #42524b
        );

    box-shadow:
        0 2px 4px
        rgba(0,0,0,.12);

}


/* =========================================================
   分針
========================================================= */

.minute-hand{

    width:5px;

    height:34%;

    margin-left:-2.5px;
    margin-top:-34%;

    background:
        linear-gradient(
            to right,
            #42524b,
            #687970,
            #42524b
        );

    box-shadow:
        0 2px 4px
        rgba(0,0,0,.12);

}


/* =========================================================
   秒針
========================================================= */

.second-hand{

    width:2px;

    height:39%;

    margin-left:-1px;
    margin-top:-39%;

    background:#72aa91;

}


/* =========================================================
   中央ピン
========================================================= */

.center-pin{

    position:absolute;

    left:50%;
    top:50%;

    width:16px;
    height:16px;

    transform:
        translate(-50%,-50%);

    z-index:20;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff 0%,
            #718078 35%,
            #46554e 100%
        );

    box-shadow:

        0 0 0 4px
        rgba(255,255,255,.88),

        0 2px 5px
        rgba(0,0,0,.18);

}


/* =========================================================
   デジタル時刻
========================================================= */

.status{

    margin-top:22px;

}

.current-time{

    font-family:
        "Bodoni 72",
        "Didot",
        "Times New Roman",
        serif;

    font-size:1.6rem;

    letter-spacing:.08em;

    color:#4c5c55;

}

.current-status{

    margin-top:4px;

    font-size:.78rem;

    letter-spacing:.12em;

    color:#788981;

}


/* =========================================================
   凡例
========================================================= */

.legend{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:25px;

    margin-top:13px;

    font-size:.72rem;

    color:#77857f;

}

.legend-item{

    display:flex;

    align-items:center;

    gap:6px;

}

.legend-dot{

    width:9px;
    height:9px;

    border-radius:50%;

}

.legend-out{

    background:#3d8bdc;

    opacity:.35;

}

.legend-visit{

    background:#70ad47;

    opacity:.35;

}


/* =========================================================
   スマートフォン
========================================================= */

@media(max-width:600px){

    body{

        padding:
            12px 6px;

    }

    .clock{

        width:95vw;

    }

    .title{

        font-size:1.15rem;

    }

    .number{

        font-size:
            clamp(
                1.25rem,
                5vw,
                1.7rem
            );

    }

    .hour-hand{

        width:7px;

        margin-left:-3.5px;

    }

}


/* =========================================================
   小さい横画面
========================================================= */

@media(
    max-height:600px
) and (
    orientation:landscape
){

    body{

        align-items:flex-start;

        padding-top:8px;

    }

    .title,
    .subtitle{

        margin-bottom:4px;

    }

    .clock{

        width:min(72vh,520px);

    }

    .status{

        margin-top:6px;

    }

    .legend{

        margin-top:4px;

    }

}

</style>

</head>


<body>


<div class="clock-page">


    <h1 class="title">
        診療時間
    </h1>


    <div class="subtitle">
        服部医院
    </div>


    <!-- =====================================================
         時計本体
    ====================================================== -->

    <div class="clock">


        <!-- =================================================
             診療時間帯

             ⭐ ここはCSSで位置を決めない

             JavaScriptが

             時刻
               ↓
             角度
               ↓
             SVG円弧

             として生成する
        ================================================== -->

        <div class="time-ring">

            <svg
                id="timeSvg"
                viewBox="0 0 100 100"
                preserveAspectRatio="xMidYMid meet"
                aria-hidden="true">


                <defs>


                    <!-- =====================================
                         外来診療

                         外側ほど白く
                         中央ほど青
                    ====================================== -->

                    <linearGradient
                        id="outpatientGradient"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">

                        <stop
                            offset="0%"
                            stop-color="#ffffff"
                            stop-opacity=".76"/>

                        <stop
                            offset="22%"
                            stop-color="#8fc7ff"
                            stop-opacity=".35"/>

                        <stop
                            offset="68%"
                            stop-color="#3d8bdc"
                            stop-opacity=".35"/>

                        <stop
                            offset="100%"
                            stop-color="#ffffff"
                            stop-opacity=".68"/>

                    </linearGradient>


                    <!-- =====================================
                         訪問診療

                         内側だけ白っぽくする
                    ====================================== -->

                    <linearGradient
                        id="visitGradient"
                        x1="0"
                        y1="0"
                        x2="0"
                        y2="1">

                        <stop
                            offset="0%"
                            stop-color="#70ad47"
                            stop-opacity=".35"/>

                        <stop
                            offset="55%"
                            stop-color="#8ac66b"
                            stop-opacity=".35"/>

                        <stop
                            offset="100%"
                            stop-color="#ffffff"
                            stop-opacity=".78"/>

                    </linearGradient>


                    <!-- =====================================
                         艶
                    ====================================== -->

                    <filter
                        id="softGlow"
                        x="-50%"
                        y="-50%"
                        width="200%"
                        height="200%">

                        <feGaussianBlur
                            stdDeviation=".55"/>

                    </filter>


                </defs>


                <!-- JavaScriptがここへ
                     3本の帯を生成する -->

                <g id="bands"></g>

                <g id="shines"></g>


            </svg>

        </div>


        <!-- =================================================
             1〜12

             ⭐ 帯と同じ中心を使う
        ================================================== -->

        <div class="dial">

            <div class="number n12">12</div>
            <div class="number n1">1</div>
            <div class="number n2">2</div>
            <div class="number n3">3</div>
            <div class="number n4">4</div>
            <div class="number n5">5</div>
            <div class="number n6">6</div>
            <div class="number n7">7</div>
            <div class="number n8">8</div>
            <div class="number n9">9</div>
            <div class="number n10">10</div>
            <div class="number n11">11</div>

        </div>


        <!-- =================================================
             3本の針
        ================================================== -->

        <div
            id="hourHand"
            class="hand hour-hand">
        </div>


        <div
            id="minuteHand"
            class="hand minute-hand">
        </div>


        <div
            id="secondHand"
            class="hand second-hand">
        </div>


        <div class="center-pin"></div>


    </div>


    <!-- =====================================================
         現在時刻
    ====================================================== -->

    <div class="status">

        <div
            id="currentTime"
            class="current-time">
            --:--:--
        </div>


        <div
            id="currentStatus"
            class="current-status">
            診療時間外
        </div>

    </div>


    <div class="legend">

        <div class="legend-item">

            <span
                class="legend-dot legend-out">
            </span>

            外来診療

        </div>


        <div class="legend-item">

            <span
                class="legend-dot legend-visit">
            </span>

            訪問診療

        </div>

    </div>


</div>



<script>

/* =========================================================
   時計の基本設定
========================================================= */

const CENTER = 50;


/*
   時計の帯

   外側半径
   内側半径

   この2つだけで
   帯の太さが決まる
*/

const OUTER_RADIUS = 43;

const INNER_RADIUS = 34;


/*
   時計の角度

   12時 = 0°

   時計回り

   3時 = 90°
   6時 = 180°
   9時 = 270°
*/


/* =========================================================
   時刻 → 時計角度
========================================================= */

function timeToAngle(hour, minute){

    /*
       12時間時計へ変換
    */

    const h =
        hour % 12;


    /*
       1時間 = 30°

       1分 = 0.5°
    */

    return (
        h * 30
        +
        minute * 0.5
    );

}


/* =========================================================
   座標を計算
========================================================= */

function polarToCartesian(
    cx,
    cy,
    radius,
    angle
){

    /*
       SVGは右方向が0°なので、

       時計の12時を0°にするため
       -90°する
    */

    const radians =
        (angle - 90)
        * Math.PI
        / 180;


    return {

        x:
            cx
            +
            radius
            * Math.cos(radians),

        y:
            cy
            +
            radius
            * Math.sin(radians)

    };

}


/* =========================================================
   円弧の帯を作る
========================================================= */

function createBand(
    startAngle,
    endAngle,
    className
){

    const outerStart =
        polarToCartesian(
            CENTER,
            CENTER,
            OUTER_RADIUS,
            startAngle
        );


    const outerEnd =
        polarToCartesian(
            CENTER,
            CENTER,
            OUTER_RADIUS,
            endAngle
        );


    const innerEnd =
        polarToCartesian(
            CENTER,
            CENTER,
            INNER_RADIUS,
            endAngle
        );


    const innerStart =
        polarToCartesian(
            CENTER,
            CENTER,
            INNER_RADIUS,
            startAngle
        );


    /*
       角度差

       360°を超えない範囲なので
       ここで正確に判定できる
    */

    const angleDifference =
        endAngle - startAngle;


    const largeArc =
        angleDifference > 180
            ? 1
            : 0;


    /*
       時計回りに外側を進み、

       終点で直線

       内側を逆方向に戻り、

       始点で直線

       という完全な閉じた帯
    */

    const d = `

        M ${outerStart.x} ${outerStart.y}

        A
        ${OUTER_RADIUS}
        ${OUTER_RADIUS}
        0
        ${largeArc}
        1
        ${outerEnd.x}
        ${outerEnd.y}

        L
        ${innerEnd.x}
        ${innerEnd.y}

        A
        ${INNER_RADIUS}
        ${INNER_RADIUS}
        0
        ${largeArc}
        0
        ${innerStart.x}
        ${innerStart.y}

        Z

    `;


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "d",
        d
    );


    path.setAttribute(
        "class",
        `time-band ${className}`
    );


    return path;

}


/* =========================================================
   診療時間帯を作る
========================================================= */

function createBands(){

    const bands =
        document.getElementById(
            "bands"
        );


    bands.innerHTML = "";


    /*
       -----------------------------------------------
       午前診

       9:00 → 12:00
       -----------------------------------------------
    */

    const morningStart =
        timeToAngle(9,0);

    const morningEnd =
        timeToAngle(12,0);


    bands.appendChild(

        createBand(
            morningStart,
            morningEnd,
            "outpatient-band"
        )

    );


    /*
       -----------------------------------------------
       訪問診療

       13:30 → 17:00
       -----------------------------------------------
    */

    const visitStart =
        timeToAngle(13,30);

    const visitEnd =
        timeToAngle(17,0);


    bands.appendChild(

        createBand(
            visitStart,
            visitEnd,
            "visit-band"
        )

    );


    /*
       -----------------------------------------------
       午後診

       17:30 → 19:30
       -----------------------------------------------
    */

    const eveningStart =
        timeToAngle(17,30);

    const eveningEnd =
        timeToAngle(19,30);


    bands.appendChild(

        createBand(
            eveningStart,
            eveningEnd,
            "outpatient-band"
        )

    );

}


/* =========================================================
   針を更新
========================================================= */

function updateHands(){

    const now =
        new Date();


    const hours =
        now.getHours();


    const minutes =
        now.getMinutes();


    const seconds =
        now.getSeconds();


    const milliseconds =
        now.getMilliseconds();


    /*
       -----------------------------------------------
       時針
       -----------------------------------------------

       1時間 = 30°
       1分 = 0.5°
       1秒 = 1/120°
    */

    const hourAngle =

        (hours % 12)
        * 30

        +

        minutes
        * .5

        +

        seconds
        / 120;


    /*
       -----------------------------------------------
       分針
    */

    const minuteAngle =

        minutes
        * 6

        +

        seconds
        * .1;


    /*
       -----------------------------------------------
       秒針

       ミリ秒まで滑らかに
    */

    const secondAngle =

        seconds
        * 6

        +

        milliseconds
        * .006;


    document
        .getElementById(
            "hourHand"
        )
        .style.transform =
        `rotate(${hourAngle}deg)`;


    document
        .getElementById(
            "minuteHand"
        )
        .style.transform =
        `rotate(${minuteAngle}deg)`;


    document
        .getElementById(
            "secondHand"
        )
        .style.transform =
        `rotate(${secondAngle}deg)`;


    /*
       -----------------------------------------------
       デジタル表示
    */

    const hh =
        String(hours)
        .padStart(2,"0");


    const mm =
        String(minutes)
        .padStart(2,"0");


    const ss =
        String(seconds)
        .padStart(2,"0");


    document
        .getElementById(
            "currentTime"
        )
        .textContent =
        `${hh}:${mm}:${ss}`;


    /*
       -----------------------------------------------
       診療状態
    */

    const currentMinutes =
        hours * 60
        +
        minutes;


    let status =
        "診療時間外";


    if(
        currentMinutes >= 9 * 60
        &&
        currentMinutes < 12 * 60
    ){

        status =
            "外来診療中";

    }


    else if(
        currentMinutes >=
            13 * 60 + 30
        &&
        currentMinutes <
            17 * 60
    ){

        status =
            "訪問診療";

    }


    else if(
        currentMinutes >=
            17 * 60 + 30
        &&
        currentMinutes <
            19 * 60 + 30
    ){

        status =
            "外来診療中";

    }


    document
        .getElementById(
            "currentStatus"
        )
        .textContent =
        status;

}


/* =========================================================
   初期化
========================================================= */

createBands();

updateHands();


/* =========================================================
   時計を動かす
========================================================= */

function animate(){

    updateHands();

    requestAnimationFrame(
        animate
    );

}


animate();

</script>


</body>

</html>
