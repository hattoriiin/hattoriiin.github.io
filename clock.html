<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>診療時間｜服部医院</title>

<style>

/* =================================
   全体
================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(220,240,230,.7),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #f8fbf8,
            #edf5f0
        );

    font-family:
        "Noto Sans JP",
        sans-serif;

    color:#40504a;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px 15px;
}


/* =================================
   ページ
================================= */

.clock-page{

    width:min(92vw,650px);

    text-align:center;

}


/* =================================
   タイトル
================================= */

.title{

    font-size:1.15rem;

    letter-spacing:.18em;

    margin-bottom:28px;

}

.subtitle{

    font-size:.78rem;

    letter-spacing:.12em;

    color:#81908a;

    margin-top:-18px;

    margin-bottom:25px;

}


/* =================================
   時計本体
================================= */

.clock{

    position:relative;

    width:min(86vw,520px);

    aspect-ratio:1;

    margin:auto;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,.98) 0%,
            rgba(250,253,251,.96) 65%,
            rgba(235,243,238,.96) 100%
        );

    box-shadow:

        0 20px 60px
        rgba(70,100,85,.12),

        inset 0 0 0 1px
        rgba(120,150,135,.12);

}


/* =================================
   診療時間の円周
================================= */

/*
   12時間表示

   9:00  = 270°
   12:00 = 0°

   13:30 = 45°
   17:00 = 150°

   17:30 = 165°
   19:30 = 225°
*/

.time-ring{

    position:absolute;

    inset:7%;

    border-radius:50%;

    background:

        conic-gradient(

            from -90deg,

            transparent 0deg 135deg,

            /* 外来 9:00〜12:00 */

            #9bc8b0
            135deg 180deg,

            transparent
            180deg 202.5deg,

            /* 訪問診療 13:30〜17:00 */

            #b7d6c4
            202.5deg 255deg,

            transparent
            255deg 262.5deg,

            /* 外来 17:30〜19:30 */

            #9bc8b0
            262.5deg 292.5deg,

            transparent
            292.5deg 360deg

        );

    -webkit-mask:

        radial-gradient(
            farthest-side,
            transparent calc(100% - 18px),
            #000 calc(100% - 17px)
        );

    mask:

        radial-gradient(
            farthest-side,
            transparent calc(100% - 18px),
            #000 calc(100% - 17px)
        );

}


/* =================================
   文字盤
================================= */

.dial{

    position:absolute;

    inset:13%;

    border-radius:50%;

}


/* =================================
   数字
================================= */

.number{

    position:absolute;

    font-size:.82rem;

    color:#65746e;

    transform:
        translate(-50%,-50%);

}


/*
   12時間時計
*/

.n12{
    left:50%;
    top:4%;
}

.n1{
    left:71%;
    top:10%;
}

.n2{
    left:88%;
    top:25%;
}

.n3{
    left:96%;
    top:50%;
}

.n4{
    left:88%;
    top:75%;
}

.n5{
    left:71%;
    top:90%;
}

.n6{
    left:50%;
    top:96%;
}

.n7{
    left:29%;
    top:90%;
}

.n8{
    left:12%;
    top:75%;
}

.n9{
    left:4%;
    top:50%;
}

.n10{
    left:12%;
    top:25%;
}

.n11{
    left:29%;
    top:10%;
}


/* =================================
   目盛り
================================= */

.ticks{

    position:absolute;

    inset:8%;

    border-radius:50%;

}

.tick{

    position:absolute;

    left:50%;
    top:50%;

    width:2px;
    height:8px;

    background:#a3ada8;

    transform-origin:
        50% calc(min(38vw,195px));

}


/* =================================
   時計の針
================================= */

.hand{

    position:absolute;

    left:50%;
    top:50%;

    transform-origin:
        50% 100%;

    border-radius:10px;

    z-index:10;

}


/* 時針 */

.hour{

    width:7px;

    height:25%;

    margin-left:-3.5px;

    margin-top:-25%;

    background:#53645d;

}


/* 分針 */

.minute{

    width:4px;

    height:34%;

    margin-left:-2px;

    margin-top:-34%;

    background:#53645d;

}


/* 秒針 */

.second{

    width:2px;

    height:39%;

    margin-left:-1px;

    margin-top:-39%;

    background:#87b69d;

}


/* =================================
   中央
================================= */

.center{

    position:absolute;

    left:50%;
    top:50%;

    width:13px;
    height:13px;

    transform:
        translate(-50%,-50%);

    background:#53645d;

    border-radius:50%;

    z-index:20;

    box-shadow:
        0 0 0 4px
        rgba(255,255,255,.85);

}


/* =================================
   診療時間ラベル
================================= */

.label{

    position:absolute;

    z-index:5;

    font-size:.72rem;

    letter-spacing:.05em;

    color:#62736b;

    background:
        rgba(255,255,255,.84);

    padding:5px 9px;

    border-radius:20px;

    box-shadow:
        0 3px 12px
        rgba(70,100,85,.08);

    white-space:nowrap;

}


/* 午前外来 */

.outpatient1{

    left:11%;

    top:29%;

}


/* 訪問 */

.visit{

    right:5%;

    top:23%;

}


/* 午後外来 */

.outpatient2{

    right:8%;

    bottom:27%;

}


/* =================================
   現在時刻
================================= */

.status{

    margin-top:30px;

    min-height:70px;

}


.current-time{

    font-size:1.65rem;

    letter-spacing:.08em;

    color:#465750;

}


.current-status{

    margin-top:7px;

    font-size:.82rem;

    letter-spacing:.12em;

    color:#789086;

}


/* =================================
   凡例
================================= */

.legend{

    display:flex;

    justify-content:center;

    gap:20px;

    margin-top:22px;

    font-size:.72rem;

    color:#718078;

}


.legend-item{

    display:flex;

    align-items:center;

    gap:6px;

}


.dot{

    width:9px;
    height:9px;

    border-radius:50%;

}


.outpatient-dot{

    background:#9bc8b0;

}


.visit-dot{

    background:#b7d6c4;

}


/* =================================
   スマートフォン
================================= */

@media(max-width:600px){

    .clock{

        width:88vw;

    }


    .time-ring{

        -webkit-mask:

            radial-gradient(
                farthest-side,
                transparent calc(100% - 14px),
                #000 calc(100% - 13px)
            );

        mask:

            radial-gradient(
                farthest-side,
                transparent calc(100% - 14px),
                #000 calc(100% - 13px)
            );

    }


    .label{

        font-size:.62rem;

        padding:4px 7px;

    }


    .outpatient1{

        left:3%;

        top:27%;

    }


    .visit{

        right:1%;

        top:22%;

    }


    .outpatient2{

        right:2%;

        bottom:26%;

    }


    .current-time{

        font-size:1.45rem;

    }

}

</style>

</head>


<body>


<div class="clock-page">


    <div class="title">

        診療時間

    </div>


    <div class="subtitle">

        服部医院

    </div>


    <div class="clock">


        <!-- 診療時間の円周 -->

        <div class="time-ring"></div>


        <!-- 目盛り -->

        <div
            class="ticks"
            id="ticks">
        </div>


        <!-- 数字 -->

        <div class="number n12">12</div>
        <div class="number n1">1</div>
        <div class="number n2">2</div>
        <div class="number n3">3</div>
        <div class="number n4">4</div>
        <div class="number n5">5</div>
        <div class="number n6">6</div>
        <div class="number n7">7</div>
        <div class="number n8">8</div>
        <div class="number n9">9</div>
        <div class="number n10">10</div>
        <div class="number n11">11</div>


        <!-- 診療時間 -->

        <div class="label outpatient1">

            外来　9:00〜12:00

        </div>


        <div class="label visit">

            訪問診療　13:30〜17:00

        </div>


        <div class="label outpatient2">

            外来　17:30〜19:30

        </div>


        <!-- 時計の針 -->

        <div
            class="hand hour"
            id="hourHand">
        </div>


        <div
            class="hand minute"
            id="minuteHand">
        </div>


        <div
            class="hand second"
            id="secondHand">
        </div>


        <div class="center"></div>


    </div>


    <!-- 現在時刻 -->

    <div class="status">


        <div
            class="current-time"
            id="currentTime">

            --:--:--

        </div>


        <div
            class="current-status"
            id="currentStatus">

            --

        </div>


    </div>


    <!-- 凡例 -->

    <div class="legend">


        <div class="legend-item">

            <span class="dot outpatient-dot"></span>

            外来診療

        </div>


        <div class="legend-item">

            <span class="dot visit-dot"></span>

            訪問診療

        </div>


    </div>


</div>



<script>


/* =================================
   12個の目盛りを生成
================================= */

const ticks =
    document.getElementById("ticks");


for(let i = 0; i < 12; i++){

    const tick =
        document.createElement("div");

    tick.className = "tick";

    tick.style.transform =
        `rotate(${i * 30}deg)`;

    ticks.appendChild(tick);

}



/* =================================
   時計
================================= */

function updateClock(){


    const now =
        new Date();


    const hours =
        now.getHours();


    const minutes =
        now.getMinutes();


    const seconds =
        now.getSeconds();


    const milliseconds =
        now.getMilliseconds();



    /*
       ⭐ 12時間時計

       12時 = 0°
       3時  = 90°
       6時  = 180°
       9時  = 270°
    */


    const hourAngle =

        ((hours % 12) * 30)

        +

        (minutes * 0.5)

        +

        (seconds / 120);



    const minuteAngle =

        (minutes * 6)

        +

        (seconds * 0.1);



    const secondAngle =

        (seconds * 6)

        +

        (milliseconds * 0.006);



    document
        .getElementById("hourHand")
        .style.transform =
        `rotate(${hourAngle}deg)`;


    document
        .getElementById("minuteHand")
        .style.transform =
        `rotate(${minuteAngle}deg)`;


    document
        .getElementById("secondHand")
        .style.transform =
        `rotate(${secondAngle}deg)`;



    /*
       デジタル時刻
    */


    const hh =
        String(hours)
        .padStart(2,"0");


    const mm =
        String(minutes)
        .padStart(2,"0");


    const ss =
        String(seconds)
        .padStart(2,"0");


    document
        .getElementById("currentTime")
        .textContent =

        `${hh}:${mm}:${ss}`;



    /*
       現在の診療状態
    */


    const time =
        hours * 60 + minutes;


    let status;



    if(

        time >= 9 * 60

        &&

        time < 12 * 60

    ){

        status =
            "外来診療中";

    }


    else if(

        time >= 13 * 60 + 30

        &&

        time < 17 * 60

    ){

        status =
            "訪問診療";

    }


    else if(

        time >= 17 * 60 + 30

        &&

        time < 19 * 60 + 30

    ){

        status =
            "外来診療中";

    }


    else{

        status =
            "診療時間外";

    }



    document
        .getElementById("currentStatus")
        .textContent =
        status;


}



/* =================================
   滑らかに更新
================================= */

function animate(){

    updateClock();

    requestAnimationFrame(animate);

}


animate();


</script>


</body>

</html>
