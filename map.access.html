<!-- HTML -->
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

/*
 * なぜこの指定にするか：
 * Google Mapsをiframeいっぱいに表示し、
 * 外側から地図を拡大・移動する処理を入れず、
 * Google Maps本来のタッチ操作を確認するためです。
 */

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.map-inner {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.map-inner iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;

    /*
     * touch-actionは指定しません。
     * 親側からタッチ操作を制限しないことで、
     * Google Maps側のジェスチャーをそのまま利用するためです。
     */
}

</style>

</head>

<body>

<div class="map-wrap">

    <div class="map-inner">

        <iframe
            src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=14&output=embed"
            title="服部医院周辺アクセスマップ"
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

    </div>

</div>

</body>

</html>
