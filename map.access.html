<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

/*
    Googleマップを画面いっぱいに表示する。
    外側に余白や黒帯が出ないようにする。
*/

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


.map-inner {
    position: absolute;

    top: -35%;
    left: 0;

    width: 100%;
    height: 100%;

    transform: scale(1.2);
    transform-origin: center center;
}


.map-inner iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

</style>

</head>

<body>

<div class="map-wrap">

    <div class="map-inner">

        <!--
            index.html と同じ中心・同じ縮尺。

            服部医院：
            35.1212, 136.9220 付近

            中心：
            35.1208, 136.9200

            z=15

            これにより、
            服部医院を右寄りに置きながら、
            名鉄堀田駅・地下鉄堀田駅・みふれ・
            堀田周辺の道路を確認できる範囲にする。
        -->
        <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d6526.993105457574!2d136.9190587!3d35.1192802!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60037b007130df29%3A0x58e7775ebd404235!2z5Yy755mC5rOV5Lq66Kqg5b2w5LyaIOacjemDqOWMu-mZog!5e0!3m2!1sja!2sjp!4v1789868073950!5m2!1sja!2sjp" width="600" height="400" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </div>

</div>

</body>

</html>
