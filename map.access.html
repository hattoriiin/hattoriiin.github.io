<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/*
    Google Maps本体

    iframe自体は画面いっぱいの大きさを維持する。
*/
.map-inner {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

.map-inner iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    pointer-events: auto;

    /*
        Google Mapsの表示範囲だけを切り抜く。

        上：20%
        左：10%
        右：10%
        下：10%

        → 中央の80% × 70%を表示
    */
    clip-path: inset(20% 10% 10% 10%);
}

</style>

</head>

<body>

<div class="map-wrap">

    <div class="map-inner">

        <iframe
            src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=14&output=embed"
            title="服部医院周辺アクセスマップ"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

    </div>

</div>

</body>

</html>
