<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.map-inner {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.map-inner iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

</style>

</head>

<body>

<div class="map-wrap">

    <div class="map-inner">

        <iframe
            src="https://www.google.com/maps?q=35.1205,136.9210&z=15&output=embed"
            title="服部医院周辺アクセスマップ"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

    </div>

</div>

</body>

</html>
