<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/*
    表示する四角い窓
*/
.map-window {
    position: absolute;

    top: 20%;
    left: 10%;

    width: 80%;
    height: 70%;

    overflow: hidden;

    /*
        Google Maps のタッチ操作を
        この領域で受ける
    */
    touch-action: none;
}

/*
    地図本体
*/
.map-inner {
    position: absolute;

    top: -21.5%;
    left: -12.5%;

    width: 125%;
    height: 143%;

    transform: none;
}

.map-inner iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;

    /*
        iframeへの操作を許可
    */
    pointer-events: auto;
}

</style>

</head>

<body>

<div class="map-wrap">

    <div class="map-window">

        <div class="map-inner">

            <iframe
                src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=14&output=embed"
                title="服部医院周辺アクセスマップ"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

        </div>

    </div>

</div>

</body>

</html>
