<!-- HTML -->
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

/*
 * なぜこの指定にするか：
 * Google Mapsをiframeいっぱいに表示し、
 * 外側のCSSで地図を拡大・移動してタッチ操作を邪魔しないためです。
 */

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.map-inner {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.map-inner iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;

    /*
     * touch-actionは指定しません。
     * 親側でタッチ操作を制限すると、
     * Google Maps側の二本指ジェスチャーに干渉する可能性があるためです。
     */
}

</style>

</head>

<body>

<div class="map-wrap">

    <div class="map-inner">

        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d576.89649152389!2d136.92182768363716!3d35.12120684574428!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m3!1m2!1s0x60037b007130df29%3A0x58e7775ebd404235!2z5Yy755mC5rOV5Lq66Kqg5b2w5LyaIOacjemDqOWMu-mZog!5e0!3m2!1sja!2sjp"
            title="服部医院周辺アクセスマップ"
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

    </div>

</div>

</body>

</html>
