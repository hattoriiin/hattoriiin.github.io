<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

/*
    画面全体を保持する土台
*/
.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/*
    実際に見せる「表示窓」

    map-wrap 自体は縮めない。
    そのため、これまでの地図表示・操作領域を壊さない。
*/
.map-window {
    position: absolute;

    top: 20%;
    left: 10%;

    width: 80%;
    height: 70%;

    overflow: hidden;
}

/*
    Googleマップ本体

    表示窓より少し大きくしている。
    これにより、表示窓の中には
    地図だけが切り取られて見える。
*/
.map-inner {
    position: absolute;

    top: -21.5%;
    left: -12.5%;

    width: 125%;
    height: 143%;

    transform: none;
}

.map-inner iframe {
    display: block;

    width: 100%;
    height: 100%;

    border: 0;
}

</style>

</head>

<body>

<div class="map-wrap">

    <div class="map-window">

        <div class="map-inner">

            <iframe
                src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=14&output=embed"
                title="服部医院周辺アクセスマップ"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

        </div>

    </div>

</div>

</body>

</html>
