<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: white;
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
}

/*
    Google Maps

    iframeそのものを中央の表示窓にする。

    ここでは
    clip-path
    mask
    overflow:hidden
    を使わない。

    周囲の白い部分は box-shadow で作る。
*/
.map-wrap iframe {
    display: block;

    width: 86%;
    height: 77%;

    border: 0;

    /*
        iframeの外側を白く覆う。

        box-shadowは見た目だけを広げ、
        iframe自身のサイズは変えない。
    */
    box-shadow:
        0 0 0 100vmax white;

    position: relative;
    z-index: 1;
}

</style>

</head>

<body>

<div class="map-wrap">

    <iframe
        src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=14&output=embed"
        title="服部医院周辺アクセスマップ"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

</div>

</body>

</html>
