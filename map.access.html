<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.map-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

.map-inner iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

</style>

</head>

<body>

<div class="map-wrap">

    <div class="map-inner">

        <iframe
            src="https://www.google.com/maps/embed/v1/place?key=YOUR_API_KEY&q=%E5%8C%BB%E7%99%82%E6%B3%95%E4%BA%BA%E8%AA%A0%E5%BD%B0%E4%BC%9A%E6%9C%8D%E9%83%A8%E5%8C%BB%E9%99%A2&center=35.121303,136.922672&zoom=16&maptype=roadmap&language=ja&region=JP"
            title="服部医院周辺アクセスマップ"
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>

    </div>

</div>

</body>

</html>
