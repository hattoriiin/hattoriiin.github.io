<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ</title>

<style>

/*
    Googleマップを画面いっぱいに表示する。
    外側に余白や黒帯が出ないようにする。
*/

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


.map-inner {
    position: absolute;

    top: 0%;
    left: 0;

    width: 100%;
    height: 100%;

    transform: scale(1.2);
    transform-origin: center center;
}


.map-inner iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
}

</style>

</head>

<body>

<div class="map-wrap">

    <div class="map-inner">

        <!--
            index.html と同じ中心・同じ縮尺。

            服部医院：
            35.1212, 136.9220 付近

            中心：
            35.1208, 136.9200

            z=15

            これにより、
            服部医院を右寄りに置きながら、
            名鉄堀田駅・地下鉄堀田駅・みふれ・
            堀田周辺の道路を確認できる範囲にする。
        -->
        <iframe
    src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=15&output=embed"
    title="服部医院周辺アクセスマップ"
    allowfullscreen=""
    loading="lazy"
    referrerpolicy="strict-origin-when-cross-origin">
</iframe>

    </div>

</div>

</body>

</html>
