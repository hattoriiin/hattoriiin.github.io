<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜地図テスト</title>

<link
    rel="stylesheet"
    href="../style.css"
>

<style>

/* =========================================================
   基本
   ========================================================= */

html {
    box-sizing: border-box;
    scroll-behavior: auto;
}

*,
*::before,
*::after {
    box-sizing: inherit;
}

body {
    margin: 0;
    padding: 0 16px 40px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

section {
    width: 100%;
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
}

img,
iframe {
    max-width: 100%;
}


/* =========================================================
   固定電話ボタン
   ========================================================= */

.fixed-call {
    position: fixed;
    right: 16px;
    bottom: 16px;

    z-index: 2147483647;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 12px 18px;

    border-radius: 999px;

    text-decoration: none;

    background: #31556e;
    color: #fff;

    font-size: 1rem;
    font-weight: 500;

    box-shadow: 0 4px 14px rgba(0,0,0,.18);
}


/* =========================================================
   時計モーダル
   ========================================================= */

.clock-modal {
    position: fixed;

    inset: 0;

    z-index: 999999;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(30,40,45,.10);
}

.clock-modal.is-open {
    display: flex;
}

.clock-modal-content {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background: rgba(235,247,250,.85);
}


/* =========================================================
   診療時間表＋担当医表
   ========================================================= */

/*
 * schedule-overlay-container 自体を
 * 担当医表を重ねるための基準位置（アンカー）にする。
 *
 * 下の診療時間表を基準にしているので、
 * 担当医表を transform 等で目分量移動させない。
 */

.schedule-overlay-container {
    position: relative;

    width: 100%;

    margin: 0;
    padding: 0;
}


/* ---------------------------------------------------------
   下側：通常の診療時間表
   --------------------------------------------------------- */

.schedule-overlay-container
table.table-schedule-base {

    position: relative;

    display: table !important;

    width: 100% !important;

    margin: 0 !important;

    z-index: 1;

    table-layout: fixed !important;
}


/* ---------------------------------------------------------
   上側：担当医表
   --------------------------------------------------------- */

.schedule-overlay-container
table.table-overlay {

    position: absolute !important;

    /*
     * schedule-overlay-container をアンカーとして
     * 四辺すべてを一致させる。
     */
    top: 0 !important;
    right: 0 !important;
    bottom: auto !important;
    left: 0 !important;

    width: 100% !important;

    margin: 0 !important;

    display: table !important;

    table-layout: fixed !important;

    z-index: 2;

    visibility: hidden;

    pointer-events: none;

    background: transparent !important;

    transform: none !important;
}

.schedule-overlay-container.is-active
table.table-overlay {

    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   診療時間表・担当医表 共通
   ========================================================= */

.schedule th,
.schedule td {

    border-bottom: 1px solid #ddd;

    font-size: .85rem;

    line-height: 1.4;

    vertical-align: middle;

    box-sizing: border-box !important;
}


/* ---------------------------------------------------------
   左端：診療科目・時間等
   --------------------------------------------------------- */

table.schedule th:first-child,
table.schedule td:first-child {

    width: 34% !important;

    text-align: left !important;

    white-space: normal;

    padding: 8px 6px !important;
}


/* ---------------------------------------------------------
   曜日欄
   --------------------------------------------------------- */

table.schedule th:not(:first-child),
table.schedule td:not(:first-child) {

    width: 11% !important;

    text-align: center !important;

    padding: 8px 0 !important;
}


/* ---------------------------------------------------------
   行の高さ
   --------------------------------------------------------- */

.schedule tr:first-child {
    height: 42px !important;
}

.schedule tr:not(:first-child) {
    height: 72px !important;
}


/* ---------------------------------------------------------
   ヘッダー
   --------------------------------------------------------- */

.schedule tr:first-child th {

    background-color: #31556e !important;

    color: #fff !important;

    font-weight: 500;

    text-align: center;
}


/* =========================================================
   担当医表を表示した時の透過
   ========================================================= */

/*
 * 下の診療時間表を完全に消さず、
 * 上の担当医表を透かして重ねる。
 */

.schedule-overlay-container.is-active
table.table-overlay th,
.schedule-overlay-container.is-active
table.table-overlay td {

    background-color: rgba(255,255,255,.88) !important;

    color: inherit !important;
}


/* 担当医表の見出し */

.schedule-overlay-container.is-active
table.table-overlay tr:first-child th {

    background-color: rgba(49,85,110,.94) !important;

    color: #fff !important;
}


/* =========================================================
   医師名
   ========================================================= */

.doctor-name {
    display: block;

    font-size: .82rem;

    line-height: 1.35;

    white-space: normal;
}


/* =========================================================
   担当医ボタン
   ========================================================= */

.doctors-note {
    margin: 12px 0 0;

    text-align: center;
}

#toggle-doctors-btn {

    appearance: none;

    border: 0;

    background: transparent;

    color: #31556e;

    font: inherit;

    text-decoration: underline;

    cursor: pointer;

    padding: 4px 8px;
}

#toggle-doctors-btn.active {
    opacity: .65;
}


/* =========================================================
   地図
   ========================================================= */

/*
 * ここは地図テスト用。
 *
 * iframeそのものに overflow / transform / touch-action を
 * 追加して二本指操作を壊さない。
 */

.map-wrap {

    position: relative;

    width: 100%;

    height: 100%;

    overflow: hidden;
}


/* 地図表示枠 */

.map-frame {

    position: relative;

    width: 100%;

    overflow: hidden;
}


/*
 * Google Maps iframe
 *
 * 2本指操作を妨げる指定をここでは行わない。
 */

.map-frame iframe {

    display: block;

    width: 100%;

    border: 0;
}


/* =========================================================
   服部医院周辺アクセスマップ
   ========================================================= */

.access-map-frame {

    position: relative;

    width: 100%;

    overflow: hidden;
}

.access-map-frame iframe {

    display: block;

    width: 100%;

    min-height: 420px;

    border: 0;
}


/* =========================================================
   スマートフォン
   ========================================================= */

@media (max-width: 600px) {

    body {
        padding-left: 12px;
        padding-right: 12px;
    }

    .schedule-overlay-container {
        width: 100%;
    }

    .schedule th,
    .schedule td {
        font-size: .82rem;
    }

    table.schedule th:first-child,
    table.schedule td:first-child {
        width: 34% !important;
    }

    table.schedule th:not(:first-child),
    table.schedule td:not(:first-child) {
        width: 11% !important;
    }

    .schedule tr:first-child {
        height: 42px !important;
    }

    .schedule tr:not(:first-child) {
        height: 72px !important;
    }

    .access-map-frame iframe {
        min-height: 360px;
    }

}


/* =========================================================
   横スクロール防止
   ========================================================= */

html,
body {
    overflow-x: hidden;
}

</style>

</head>


<body>


<!-- =======================================================
     固定電話
     ======================================================= -->

<a
    class="fixed-call"
    href="tel:052-881-0876"
>
    ☎ 電話する
</a>


<!-- =======================================================
     服部医院
     ======================================================= -->

<header>

</header>


<main>


<!-- =======================================================

<!-- =======================================================
     診療時間

<section>

    <div

        <!-- 下側：通常の診療時間表 -->

        <table

                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                    <th>土</th>

                </tr>

            </thead>


            <tbody>

                <tr>

                    <td>

                    </td>

                    <td>○</td>
                    <td>○</td>
                    <td>○</td>
                    <td>○</td>
                    <td>○</td>
                    <td>○</td>

                </tr>


                <tr>

                    <td>
                        午後
                    </td>

                    <td>○</td>
                    <td>○</td>
                    <td>○</td>
                    <td>○</td>

<!-- =======================================================

<section>

    <div class="map-frame">

        <iframe

            title="服部医院周辺アクセスマップ"

<!-- =======================================================

     ======================================================= -->

<section>

    <h2>地図テスト②</h2>

        <iframe
            src="map.access2.html"

</section>


<!-- =======================================================
     地図テスト③
     ======================================================= -->

<section>

    <h2>地図テスト③</h2>

    <div class="access-map-frame">

        <iframe
            src="map.access3.html"
            title="服部医院周辺アクセスマップ テスト3"

</main>


<!-- =======================================================
     時計モーダル
     ======================================================= -->

<div
    class="clock-modal"
    id="clock-modal"
>

    <div class="clock-modal-content">

        <iframe
            src="clock.claude.html"
            title="診療時間時計"
            style="
                display:block;
                width:100%;
                height:100%;
                border:0;
            "
        ></iframe>

    </div>

</div>


<script>

/* =========================================================
   医院画像のスクロール演出
   ========================================================= */

(function () {

    const image = document.querySelector(
        'img[src*="incyougazou"]'
    );

    if (!image) {
        return;
    }

    let ticking = false;

    function updateImage() {

        const rect = image.getBoundingClientRect();

        const windowHeight = window.innerHeight;

        const center =
            windowHeight / 2;

        const imageCenter =
            rect.top + rect.height / 2;

        const distance =
            imageCenter - center;

        const movement =
            Math.max(
                -10,
                Math.min(
                    10,
                    -distance * 0.02
                )
            );

        image.style.transform =
            `translateY(${movement}px)`;

        ticking = false;
    }


    function requestUpdate() {

        if (!ticking) {

            window.requestAnimationFrame(
                updateImage
            );

            ticking = true;
        }
    }


    window.addEventListener(
        "scroll",
        requestUpdate,
        { passive: true }
    );

    window.addEventListener(
        "resize",
        requestUpdate
    );

    updateImage();

})();


/* =========================================================
   担当医表の読み込み
   ========================================================= */

async function loadDoctors() {

    const container =
        document.getElementById(
            "schedule-container"
        );

    if (!container) {
        return;
    }


    try {

        const [
            doctorsHtmlResponse,
            doctorsJsonResponse
        ] = await Promise.all([

            fetch("doctors.html"),

            fetch("doctors.json")

        ]);


        if (
            !doctorsHtmlResponse.ok ||
            !doctorsJsonResponse.ok
        ) {

            throw new Error(
                "担当医表の読み込みに失敗しました。"
            );
        }


        const doctorsHtml =
            await doctorsHtmlResponse.text();


        const doctorsJson =
            await doctorsJsonResponse.json();


        /* -------------------------------------------------
           doctors.html から table だけ取得
           ------------------------------------------------- */

        const parser =
            new DOMParser();

        const doc =
            parser.parseFromString(
                doctorsHtml,
                "text/html"
            );


        const sourceTable =
            doc.querySelector("table");


        if (!sourceTable) {

            throw new Error(
                "doctors.html に table がありません。"
            );
        }


        /* -------------------------------------------------
           担当医表を複製
           ------------------------------------------------- */

        const overlayTable =
            sourceTable.cloneNode(true);


        overlayTable.id =
            "doctors-overlay-table";


        overlayTable.classList.add(
            "schedule",
            "table-overlay"
        );


        /* -------------------------------------------------
           担当医名を JSON から反映
           ------------------------------------------------- */

        const doctorCells =
            overlayTable.querySelectorAll(
                "[data-doctor]"
            );


        doctorCells.forEach(function (cell) {

            const key =
                cell.getAttribute(
                    "data-doctor"
                );

            if (
                key &&
                doctorsJson[key]
            ) {

                cell.textContent =
                    doctorsJson[key];

            }

        });


        /* -------------------------------------------------
           JSONの形式が現在の doctors.json と異なる場合に
           既存の doctor-name 要素にも対応
           ------------------------------------------------- */

        const doctorNames =
            overlayTable.querySelectorAll(
                ".doctor-name"
            );


        doctorNames.forEach(function (element) {

            const key =
                element.getAttribute(
                    "data-doctor"
                );

            if (
                key &&
                doctorsJson[key]
            ) {

                element.textContent =
                    doctorsJson[key];

            }

        });


        /* -------------------------------------------------
           下の診療時間表と同じアンカー内へ追加
           ------------------------------------------------- */

        container.appendChild(
            overlayTable
        );


        setupToggleEvents();


    } catch (error) {

        console.error(
            "担当医表読み込みエラー:",
            error
        );

    }

}


/* =========================================================
   担当医表の表示・非表示
   ========================================================= */

function setupToggleEvents() {

    const btn =
        document.getElementById(
            "toggle-doctors-btn"
        );

    const container =
        document.getElementById(
            "schedule-container"
        );


    if (!btn || !container) {
        return;
    }


    function showOverlay(event) {

        if (event) {
            event.preventDefault();
        }

        container.classList.add(
            "is-active"
        );

        btn.classList.add(
            "active"
        );

    }


    function hideOverlay() {

        container.classList.remove(
            "is-active"
        );

        btn.classList.remove(
            "active"
        );

    }


    /*
     * マウス
     */

    btn.addEventListener(
        "mousedown",
        showOverlay
    );

    btn.addEventListener(
        "mouseup",
        hideOverlay
    );

    btn.addEventListener(
        "mouseleave",
        hideOverlay
    );


    /*
     * タッチ
     */

    btn.addEventListener(
        "touchstart",
        showOverlay,
        { passive: false }
    );

    btn.addEventListener(
        "touchend",
        hideOverlay
    );

    btn.addEventListener(
        "touchcancel",
        hideOverlay
    );

}


/* =========================================================
   担当医表開始
   ========================================================= */

loadDoctors();


/* =========================================================
   時計モーダル
   ========================================================= */

(function () {

    const modal =
        document.getElementById(
            "clock-modal"
        );

    if (!modal) {
        return;
    }


    /*
     * 現在のテストページでは
     * 時計モーダルを開くための専用ボタンがないため、
     * ここでは既存の時計ファイルを変更しない。
     */

})();

</script>
