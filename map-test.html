<style>

/* ==================================================
   診療時間表・担当医表
   通常表の大きさをそのまま基準にする
================================================== */

.schedule-overlay-container {
    position: relative;
}


/*
 * 通常の診療時間表
 * → 通常のHTMLの流れの中に置いたまま
 */
.schedule-overlay-container table.table-schedule-base {
    position: relative;
    z-index: 1;
}


/*
 * 担当医表
 * → 通常表と同じ場所に重ねる
 *
 * width / height / font-size / padding は指定しない。
 * ここでサイズを再設計すると、元の診療時間表との
 * 「サイズ感」が変わるため。
 */
.schedule-overlay-container table.table-overlay {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 2;

    visibility: hidden;
    pointer-events: none;

    margin: 0 !important;
}


/*
 * 長押し中だけ担当医表を表示
 */
.schedule-overlay-container.is-active table.table-overlay {
    visibility: visible;
    pointer-events: auto;
}


/*
 * 担当医表は透かして表示する。
 *
 * 下の通常表の記号が少し見える状態は意図したもの。
 * ただし文字や罫線そのもののサイズは変更しない。
 */
.schedule-overlay-container.is-active table.table-overlay th,
.schedule-overlay-container.is-active table.table-overlay td {
    background-color: rgba(255,255,255,.88) !important;
    color: inherit !important;
}


/*
 * 担当医表の先頭行だけ、通常表と同じ見出し色。
 */
.schedule-overlay-container.is-active
table.table-overlay tr:first-child th {
    background-color: rgba(49,85,110,.94) !important;
    color: #fff !important;
}

</style>


<script>

/* ==================================================
   担当医表
   doctors.html + doctors.json
================================================== */

Promise.all([
    fetch("doctors.html").then(res => res.text()),
    fetch("doctors.json").then(res => res.json())
])

.then(([htmlText, doctors]) => {

    const container =
        document.getElementById("schedule-container");

    if (!container) {
        return;
    }


    /*
     * doctors.htmlからtableだけ取得。
     */
    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            htmlText,
            "text/html"
        );

    const overlayTable =
        doc.querySelector("table");

    if (!overlayTable) {
        return;
    }


    /*
     * 通常の診療時間表と区別する。
     */
    overlayTable.id =
        "doctors-overlay-table";

    overlayTable.classList.add(
        "schedule",
        "table-overlay"
    );


    /*
     * 同じ親要素の中へ追加。
     *
     * これにより、top:0 / left:0 の基準点が
     * 診療時間表を入れている
     * schedule-overlay-container になる。
     */
    container.appendChild(
        overlayTable
    );


    /*
     * 医師名を作る。
     *
     * 9/10の処理をそのまま使用。
     */
    function createDoctorName(name) {

        if (
            !name ||
            !String(name).trim()
        ) {
            return `
                <span class="doctor-empty">―</span>
            `;
        }


        let cleanName =
            String(name)
                .replace(/先生$/, "")
                .trim();


        let className =
            "doctor-name";


        if (cleanName.length >= 6) {

            className +=
                " very-long";

        }
        else if (cleanName.length >= 4) {

            className +=
                " long";

        }


        const chars =
            [...cleanName]
                .map(
                    char =>
                        `<span class="doctor-char">${char}</span>`
                )
                .join("");


        return `
            <span class="${className}">
                ${chars}
            </span>
        `;
    }


    /*
     * 外来の時間帯。
     */
    overlayTable
        .querySelectorAll("td[data-time]")
        .forEach(cell => {

            const day =
                cell.dataset.day;

            const time =
                cell.dataset.time;


            cell.innerHTML =
                createDoctorName(
                    doctors?.[day]?.[time] || ""
                );
        });


    /*
     * 訪問診療。
     */
    overlayTable
        .querySelectorAll("td[data-visit]")
        .forEach(cell => {

            const day =
                cell.dataset.day;


            cell.innerHTML =
                createDoctorName(
                    doctors?.[day]?.["訪問"] || ""
                );
        });


    /*
     * 担当医はこちらの長押し操作を設定。
     */
    setupToggleEvents();

})


.catch(err => {

    console.error(
        "担当医表データ読み込みエラー:",
        err
    );

});


/* ==================================================
   担当医表の表示・非表示
================================================== */

function setupToggleEvents() {

    const btn =
        document.getElementById(
            "toggle-doctors-btn"
        );

    const container =
        document.getElementById(
            "schedule-container"
        );


    if (!btn || !container) {
        return;
    }


    /*
     * 表示。
     */
    function showOverlay(e) {

        if (e) {
            e.preventDefault();
        }


        container.classList.add(
            "is-active"
        );

        btn.classList.add(
            "active"
        );
    }


    /*
     * 非表示。
     */
    function hideOverlay() {

        container.classList.remove(
            "is-active"
        );

        btn.classList.remove(
            "active"
        );
    }


    /*
     * マウス。
     */
    btn.addEventListener(
        "mousedown",
        showOverlay
    );

    btn.addEventListener(
        "mouseup",
        hideOverlay
    );

    btn.addEventListener(
        "mouseleave",
        hideOverlay
    );


    /*
     * iPhone / タッチ操作。
     */
    btn.addEventListener(
        "touchstart",
        showOverlay,
        {
            passive: false
        }
    );

    btn.addEventListener(
        "touchend",
        hideOverlay
    );

    btn.addEventListener(
        "touchcancel",
        hideOverlay
    );
}

</script>
