<style>

/* ==================================================
   時計
================================================== */

.clock-trigger-wrap {
    text-align: center;
    margin: 20px 0;
}

.clock-btn {
    background-color: #f8f9fa;
    border: 1px solid #ccc;
    color: #333;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

.clock-btn.active {
    background-color: #e2e6ea;
    border-color: #adb5bd;
}

.clock-modal {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background: rgba(30, 40, 45, 0.10);

    display: none;
    justify-content: center;
    align-items: center;

    z-index: 2147483647;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
}

.clock-modal.is-active {
    display: flex;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.clock-modal-content {
    width: 100vw;
    height: 100vh;

    max-width: none;
    max-height: none;

    background: rgba(235, 247, 250, 0.85);

    border-radius: 0;
    box-shadow: none;

    position: relative;
    overflow: hidden;

    margin: 0;

    transform: scale(1);
}

.clock-modal-content iframe {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 100vw;
    height: 100vh;

    border: none;
    background: transparent;

    transform: translate(-50%, -50%);
}

</style>

</head>

<!-- ==================================================
     JavaScript
================================================== -->

<script>


/* ==================================================
   院内写真の横スクロール
================================================== */

const camera =
    document.querySelector('.clinic-camera');

const image =
    document.querySelector('.clinic-image');


if (camera && image) {

    window.addEventListener('scroll', function() {

        const rect =
            camera.getBoundingClientRect();

        const viewHeight =
            window.innerHeight;

        if (
            rect.top <= viewHeight &&
            rect.bottom >= 0
        ) {

            const progress =
                (viewHeight - rect.top) /
                (viewHeight + rect.height);

            const clamped =
                Math.max(
                    0,
                    Math.min(1, progress)
                );

            const translateX =
                -50 +
                (clamped - 0.5) * 30;

            const scale =
                0.85 +
                clamped * 0.15;

            image.style.transform =
                `translate3d(${translateX}%, -50%, 0) scale(${scale})`;

        }

    });

}


/* ==================================================
   担当医表
   本番 index.html と同じ動的生成
================================================== */

Promise.all([

    fetch("doctors.html")
        .then(res => res.text()),

    fetch("doctors.json")
        .then(res => res.json())

])

.then(([htmlText, doctors]) => {

    const container =
        document.getElementById(
            "schedule-container"
        );

    if (!container) return;


    const parser =
        new DOMParser();


    const doc =
        parser.parseFromString(
            htmlText,
            "text/html"
        );


    const overlayTable =
        doc.querySelector("table");


    if (!overlayTable) return;


    overlayTable.id =
        "doctors-overlay-table";


    overlayTable.classList.add(
        "schedule",
        "table-overlay"
    );


    container.appendChild(
        overlayTable
    );


    function createDoctorName(name) {

        if (
            !name ||
            !String(name).trim()
        ) {

            return `
                <span class="doctor-empty">
                    ―
                </span>
            `;

        }


        let cleanName =
            String(name)
                .replace(/先生$/, "")
                .trim();


        let className =
            "doctor-name";


        if (cleanName.length >= 6) {

            className +=
                " very-long";

        }

        else if (cleanName.length >= 4) {

            className +=
                " long";

        }


        const chars =
            [...cleanName]
                .map(
                    char =>
                        `<span class="doctor-char">${char}</span>`
                )
                .join("");


        return `
            <span class="${className}">
                ${chars}
            </span>
        `;

    }


    overlayTable
        .querySelectorAll(
            "td[data-time]"
        )
        .forEach(cell => {

            const day =
                cell.dataset.day;

            const time =
                cell.dataset.time;


            cell.innerHTML =
                createDoctorName(
                    doctors?.[day]?.[time] || ""
                );

        });


    overlayTable
        .querySelectorAll(
            "td[data-visit]"
        )
        .forEach(cell => {

            const day =
                cell.dataset.day;


            cell.innerHTML =
                createDoctorName(
                    doctors?.[day]?.["訪問"] || ""
                );

        });


    setupToggleEvents();

})

.catch(err => {

    console.error(
        "担当医表データ読み込みエラー:",
        err
    );

});


/* ==================================================
   担当医表の表示・非表示
================================================== */

function setupToggleEvents() {

    const btn =
        document.getElementById(
            "toggle-doctors-btn"
        );


    const container =
        document.getElementById(
            "schedule-container"
        );


    if (
        !btn ||
        !container
    ) {
        return;
    }


    function showOverlay(e) {

        if (e) {
            e.preventDefault();
        }


        container.classList.add(
            "is-active"
        );


        btn.classList.add(
            "active"
        );

    }


    function hideOverlay(e) {

        container.classList.remove(
            "is-active"
        );


        btn.classList.remove(
            "active"
        );

    }


    /* PC */

    btn.addEventListener(
        "mousedown",
        showOverlay
    );


    btn.addEventListener(
        "mouseup",
        hideOverlay
    );


    btn.addEventListener(
        "mouseleave",
        hideOverlay
    );


    /* iPhone */

    btn.addEventListener(
        "touchstart",
        showOverlay
    );


    btn.addEventListener(
        "touchend",
        hideOverlay
    );


    btn.addEventListener(
        "touchcancel",
        hideOverlay
    );

}


/* ==================================================
   時計
================================================== */

const clockBtn =
    document.getElementById(
        'clockBtn'
    );


const clockModal =
    document.getElementById(
        'clockModal'
    );


const clockFrame =
    clockModal
        ? clockModal.querySelector(
            'iframe'
        )
        : null;


if (
    clockBtn &&
    clockModal
) {


    function adjustClock() {

        if (!clockFrame) return;


        try {

            const doc =
                clockFrame.contentDocument;


            if (!doc) return;


            const title =
                doc.querySelector(
                    '.clock-title'
                );


            if (title) {

                title.style.display =
                    'none';

            }


            const timeRing =
                doc.querySelector(
                    '.time-ring'
                );


            if (timeRing) {

                timeRing.style.opacity =
                    '0.85';

            }


            doc.documentElement.style.background =
                'transparent';


            doc.body.style.background =
                'transparent';


            doc.body.style.margin =
                '0';

        }

        catch (error) {

            console.log(
                '時計表示の調整に失敗しました:',
                error
            );

        }

    }


    function showClock(e) {

        if (e) {
            e.preventDefault();
        }


        clockModal.classList.add(
            'is-active'
        );


        clockBtn.classList.add(
            'active'
        );


        adjustClock();

    }


    function hideClock(e) {

        if (e) {
            e.preventDefault();
        }


        clockModal.classList.remove(
            'is-active'
        );


        clockBtn.classList.remove(
            'active'
        );

    }


    if (clockFrame) {

        clockFrame.addEventListener(
            'load',
            adjustClock
        );

    }


    clockBtn.addEventListener(
        'touchstart',
        function(e) {

            showClock(e);

        },
        {
            passive: false
        }
    );


    clockBtn.addEventListener(
        'touchend',
        hideClock
    );


    clockBtn.addEventListener(
        'touchcancel',
        hideClock
    );


    clockBtn.addEventListener(
        'mousedown',
        showClock
    );


    window.addEventListener(
        'mouseup',
        hideClock
    );


    clockBtn.addEventListener(
        'mouseleave',
        hideClock
    );


    clockModal.addEventListener(
        'click',
        function(e) {

            if (
                e.target === clockModal
            ) {

                hideClock();

            }

        }
    );

}


</script>
