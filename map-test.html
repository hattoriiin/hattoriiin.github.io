<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>地図テスト</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* ==================================================
   地図
================================================== */

.location-grid {
    display: grid;
    grid-template-columns: 40% 60%;
    gap: 1.5rem;
    align-items: start;
}

.location-map {
    min-width: 0;
}

.access-map-frame {
    position: relative;
    width: 100%;
    height: 420px;
    border-radius: 12px;
}

.access-map-frame iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    border-radius: 12px;

    /*
       地図操作をiframe自身に渡す
    */
    touch-action: auto;
    -webkit-user-select: none;
    user-select: none;
}

.location-map iframe {
    display: block;
}

.map-link {
    margin-top: .6rem;
    text-align: center;
    font-size: .8rem;
}


/* ==================================================
   固定電話
================================================== */

.fixed-call {
    position: fixed;
    z-index: 2147483647;
}


/* ==================================================
   院内写真
================================================== */

.clinic-view {
    width: 100%;
}

.clinic-camera {
    position: relative;
    width: 100%;
}

.clinic-image {
    display: block;
    width: 100%;
}


/* ==================================================
   スマートフォン
================================================== */

@media (max-width: 600px) {

    .location-grid {
        grid-template-columns: 55% 45%;
        gap: .7rem;
    }

    .access-map-frame {
        height: 180px;
    }

}

</style>

</head>


<body>


<main>


<!-- ==================================================
     固定電話
================================================== -->

<a
    href="tel:052-881-0876"
    class="fixed-call"
>
    ☎ 電話する　052-881-0876
</a>


<!-- ==================================================

================================================== -->

                >
