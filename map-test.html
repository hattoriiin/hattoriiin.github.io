<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>服部医院｜マップテスト</title>

<style>

/* =========================================================
   基本
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;

    color: #222;
    background: #fff;
    line-height: 1.8;
}

main {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
    padding-bottom: 130px;
}

section {
    margin-bottom: 2rem;
}

h2 {
    margin: 0 0 1rem;
    padding-bottom: .5rem;

    border-bottom: 2px solid #ddd;

    font-size: 1.8rem;
    font-weight: 700;
}


/* =========================================================
   診療時間表＋担当医表
========================================================= */

.schedule-overlay-container {

    position: relative;

    width: 100%;

    margin-top: 1.2rem;
}


/* ---------------------------------------------------------
   通常の診療時間表

   ★重要
   担当医表を表示しても、この表は display:none にしない。
   レイアウト上の高さを維持する。
--------------------------------------------------------- */

table.schedule {

    width: 100% !important;

    table-layout: fixed !important;

    border-collapse: collapse !important;
    border-spacing: 0 !important;

    margin: 0 !important;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 4px 14px rgba(40, 80, 80, .08);

    background: #fff;
}


/* 左端 */

table.schedule th:first-child,
table.schedule td:first-child {

    width: 34% !important;

    text-align: left !important;

    white-space: normal;

    padding: 8px 6px !important;
}


/* 曜日など */

table.schedule th:not(:first-child),
table.schedule td:not(:first-child) {

    width: 11% !important;

    text-align: center !important;

    padding: 8px 0 !important;
}


/* 見出し */

table.schedule tr:first-child th {

    background-color: #31556e !important;

    color: #fff !important;

    font-weight: 500;

    text-align: center;
}


.schedule th,
.schedule td {

    border-bottom: 1px solid #ddd;

    font-size: .85rem;

    line-height: 1.4;

    vertical-align: middle;

    box-sizing: border-box !important;
}


.schedule tr:first-child {

    height: 42px !important;
}


.schedule tr:not(:first-child) {

    height: 72px !important;
}


/* =========================================================
   担当医表
========================================================= */

/*
   通常時は完全に見えない。

   position:absolute にすることで、
   担当医表を表示しても通常のページレイアウトの
   高さを変えない。
*/

.schedule-overlay-container table.table-overlay {

    display: none !important;

    position: absolute;

    z-index: 20;

    top: 0;
    left: 0;

    width: 100% !important;

    margin: 0 !important;
}


/*
   ボタンを押している間だけ表示
*/

.schedule-overlay-container.is-active table.table-overlay {

    display: table !important;
}


/*
   担当医表の見た目
*/

.schedule-overlay-container.is-active
table.table-overlay th,
.schedule-overlay-container.is-active
table.table-overlay td {

    background-color: #fff !important;

    color: inherit !important;
}


/* 先頭行 */

.schedule-overlay-container.is-active
table.table-overlay tr:first-child th {

    background-color: #31556e !important;

    color: #fff !important;
}


/* =========================================================
   担当医表ボタン
========================================================= */

.doctors-button {

    display: block;

    width: 100%;

    margin-top: .8rem;

    padding: .7rem 1rem;

    border: 1px solid #31556e;

    border-radius: 10px;

    background: #fff;

    color: #31556e;

    font-size: .95rem;

    text-align: center;

    cursor: pointer;

    user-select: none;

    -webkit-user-select: none;

    -webkit-touch-callout: none;
}


.doctors-button:active {

    background: #eef5f7;
}


/* =========================================================
   所在地・アクセス
========================================================= */

.location-grid {

    display: grid;

    grid-template-columns: 40% 60%;

    gap: 1.5rem;

    align-items: start;
}


/* 地図 */

.access-map-frame {

    width: 100%;

    height: 420px;

    overflow: hidden;

    border-radius: 12px;
}


.access-map-frame iframe {

    display: block;

    width: 100%;

    height: 100%;

    border: 0;
}


/* Google Maps外部リンク */

.map-link {

    margin-top: .6rem;

    text-align: center;

    font-size: .8rem;
}


/* =========================================================
   テスト用説明
========================================================= */

.test-note {

    margin-bottom: 1.2rem;

    padding: .8rem 1rem;

    border-radius: 10px;

    background: #f4f8f9;

    font-size: .85rem;

    line-height: 1.6;
}


/* =========================================================
   スマートフォン
========================================================= */

@media (max-width: 600px) {

    main {

        padding: 1rem;

        padding-bottom: 100px;
    }


    h2 {

        font-size: 1.45rem;
    }


    .location-grid {

        grid-template-columns: 55% 45%;

        gap: .7rem;
    }


    .access-map-frame {

        height: 180px;
    }


    .schedule th,
    .schedule td {

        font-size: .78rem;
    }


    .schedule tr:not(:first-child) {

        height: 68px !important;
    }

}

</style>

</head>


<body>


<main>


<!-- =====================================================
     テスト説明
====================================================== -->

<div class="test-note">

<strong>マップ・担当医表テスト</strong><br>

担当医表はボタンを押している間だけ、
通常の診療時間表の上に重なって表示します。
通常の表そのものはレイアウト上残しています。

</div>


<!-- =====================================================
     診療時間
====================================================== -->

<section>

<h2>診療時間</h2>


<div
    id="schedule-container"
    class="schedule-overlay-container">


    <!-- =================================================
         通常の診療時間表
    ================================================== -->

    <table class="schedule table-schedule-base">

        <tr>

            <th>診療時間</th>

            <th>月</th>
            <th>火</th>
            <th>水</th>
            <th>木</th>
            <th>金</th>
            <th>土</th>

        </tr>


        <tr>

            <td>午前<br>9:00〜12:00</td>

            <td>○</td>
            <td>○</td>
            <td>○</td>
            <td>○</td>
            <td>○</td>
            <td>○</td>

        </tr>


        <tr>

            <td>訪問診療<br>13:30〜16:30</td>

            <td>○</td>
            <td>○</td>
            <td>○</td>
            <td>○</td>
            <td>○</td>
            <td>—</td>

        </tr>


        <tr>

            <td>午後<br>16:30〜19:00</td>

            <td>○</td>
            <td>○</td>
            <td>○</td>
            <td>○</td>
            <td>○</td>
            <td>—</td>

        </tr>

    </table>


    <!-- =================================================
         担当医表

         JSで doctors.html から取得した表をここへ入れる
    ================================================== -->


    <!-- ボタン -->

    <button
        type="button"
        id="doctors-button"
        class="doctors-button">

        担当医表はこちら

    </button>


</div>

</section>



<!-- =====================================================
     所在地・アクセス
====================================================== -->

<section>

<h2>所在地・アクセス</h2>


<div class="location-grid">


    <!-- =================================================
         左：所在地
    ================================================== -->

    <div>

        <p>
            〒467-0825<br>
            愛知県名古屋市瑞穂区柳ヶ枝町1-34 1階
        </p>

        <p>
            TEL：052-881-0876
        </p>

        <p>
            市バス「名鉄堀田」徒歩約1分<br>
            名鉄堀田駅 徒歩約4分
        </p>

        <p>
            駐車場7台完備
        </p>

    </div>


    <!-- =================================================
         右：Google Maps
    ================================================== -->

    <div class="location-map">


        <div class="access-map-frame">

            <iframe
                src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=14&output=embed"
                title="服部医院周辺アクセスマップ"
                allowfullscreen
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin">
            </iframe>

        </div>


        <div class="map-link">

            <a
                href="https://maps.app.goo.gl/5tnKR7ZdNdbxBCZw6?g_st=ic"
                target="_blank"
                rel="noopener">

                Googleマップで見る

            </a>

        </div>


    </div>

</div>

</section>


</main>


<script>

/* =========================================================
   担当医表を doctors.html から読み込む
========================================================= */

async function loadDoctorsTable() {

    const container =
        document.getElementById("schedule-container");

    if (!container) {
        return;
    }


    try {

        const response =
            await fetch("doctors.html", {
                cache: "no-store"
            });


        if (!response.ok) {

            throw new Error(
                "doctors.html の読み込みに失敗しました"
            );
        }


        const html =
            await response.text();


        const parser =
            new DOMParser();


        const doc =
            parser.parseFromString(
                html,
                "text/html"
            );


        const sourceTable =
            doc.querySelector(
                "table.schedule"
            );


        if (!sourceTable) {

            throw new Error(
                "doctors.html 内に担当医表が見つかりません"
            );
        }


        /*
         * 元の表をコピー
         */

        const doctorTable =
            sourceTable.cloneNode(true);


        doctorTable.classList.add(
            "table-overlay"
        );


        /*
         * doctors.json から担当医名を取得
         */

        const jsonResponse =
            await fetch("doctors.json", {
                cache: "no-store"
            });


        if (!jsonResponse.ok) {

            throw new Error(
                "doctors.json の読み込みに失敗しました"
            );
        }


        const doctors =
            await jsonResponse.json();


        /*
         * 午前・訪問・午後を埋める
         */

        doctorTable
            .querySelectorAll("[data-day]")
            .forEach(cell => {

                const day =
                    cell.dataset.day;

                const time =
                    cell.dataset.time ||
                    cell.dataset.visit;

                if (
                    doctors[day] &&
                    doctors[day][time] !== undefined
                ) {

                    cell.textContent =
                        doctors[day][time];

                }

            });


        /*
         * 既存の担当医表があれば削除
         */

        const oldTable =
            container.querySelector(
                "table.table-overlay"
            );

        if (oldTable) {

            oldTable.remove();

        }


        /*
         * 通常表の直後に追加
         *
         * CSSで position:absolute にするため、
         * 通常表のレイアウト高さには影響しない。
         */

        container.insertBefore(
            doctorTable,
            document.getElementById(
                "doctors-button"
            )
        );


    } catch (error) {

        console.error(error);

    }

}


/* =========================================================
   担当医表ボタン
========================================================= */

function setupDoctorsButton() {

    const button =
        document.getElementById(
            "doctors-button"
        );

    const container =
        document.getElementById(
            "schedule-container"
        );


    if (!button || !container) {

        return;

    }


    /*
     * マウス・タッチ・ポインタを使って
     * 「押している間だけ表示」
     */

    button.addEventListener(
        "pointerdown",
        function(event) {

            event.preventDefault();

            container.classList.add(
                "is-active"
            );

        }
    );


    button.addEventListener(
        "pointerup",
        function() {

            container.classList.remove(
                "is-active"
            );

        }
    );


    button.addEventListener(
        "pointercancel",
        function() {

            container.classList.remove(
                "is-active"
            );

        }
    );


    button.addEventListener(
        "pointerleave",
        function() {

            container.classList.remove(
                "is-active"
            );

        }
    );

}


/* =========================================================
   初期化
========================================================= */

loadDoctorsTable();

setupDoctorsButton();

</script>


</body>

</html>
