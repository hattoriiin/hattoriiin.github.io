<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>地図テスト</title>

<link rel="stylesheet" href="style.css">

<style>

/* =========================================================
   地図テストページ全体
   ========================================================= */

body {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 16px 40px;
    box-sizing: border-box;
}

section {
    max-width: 1100px;
    margin-left: auto;
    margin-right: auto;
}


/* =========================================================
   固定電話ボタン
   ========================================================= */

.fixed-call {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 2147483647;

    display: inline-block;

    padding: 12px 18px;

    border-radius: 999px;

    text-decoration: none;

    background: #31556e;
    color: #fff;
}


/* =========================================================
   診療時間
   ※ 表そのもののサイズは style.css に任せる
   ========================================================= */

.schedule-overlay-container {
    position: relative;
}


/*
   担当医表は通常時には見せない。
   表自体の width / font-size / line-height / padding 等は
   ここでは指定しない。
*/

.schedule-overlay-container table.table-overlay {
    display: none !important;
}


/*
   長押し中だけ担当医表を表示する。
*/

.schedule-overlay-container.is-active table.table-schedule-base {
    display: none !important;
}

.schedule-overlay-container.is-active table.table-overlay {
    display: table !important;
}


/* =========================================================
   担当医表の文字
   ========================================================= */

.doctor-name {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.1;
    margin: 0 auto;
}


/* =========================================================
   地図
   ※ iframe の構造・サイズ・操作方法には手を加えない
   ========================================================= */

.map-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


/* =========================================================
   時計モーダル
   ========================================================= */

.clock-modal {
    display: none;

    position: fixed;
    inset: 0;

    z-index: 2147483646;

    background: rgba(30, 40, 45, .10);

    align-items: center;
    justify-content: center;
}

.clock-modal.is-open {
    display: flex;
}

.clock-modal-content {
    position: relative;

    width: min(92vw, 600px);

    background: rgba(235, 247, 250, .85);

    border-radius: 16px;

    overflow: hidden;
}

.clock-modal-content iframe {
    display: block;

    width: 100%;
    border: 0;
}

.clock-modal-close {
    position: absolute;

    top: 8px;
    right: 10px;

    z-index: 2;

    border: 0;
    background: transparent;

    font-size: 24px;

    cursor: pointer;
}


/* =========================================================
   画面上には出さない補助見出し
   ========================================================= */

.sr-only {
    position: absolute !important;

    width: 1px !important;
    height: 1px !important;

    padding: 0 !important;
    margin: -1px !important;

    overflow: hidden !important;

    clip: rect(0, 0, 0, 0) !important;

    white-space: nowrap !important;

    border: 0 !important;
}

</style>

</head>


<body>


<!-- =======================================================
     固定電話
     ======================================================= -->

<a
    href="tel:052-881-0876"
    class="fixed-call"
>
    ☎ 電話する　052-881-0876
</a>


<!-- =======================================================
     診療時間
     ======================================================= -->

<section id="schedule">

<h2>診療時間</h2>


<div
    class="schedule-overlay-container"
    id="schedule-container"
>


<!-- =====================================================
     通常の診療時間表
     ===================================================== -->

<table class="schedule table-schedule-base">

<tr>
    <th>診療時間</th>
    <th>月</th>
    <th>火</th>
    <th>水</th>
    <th>木</th>
    <th>金</th>
    <th>土</th>
</tr>

<tr>
    <th>午前<br>9:00〜12:00</th>

    <td>○</td>
    <td>○</td>
    <td>○</td>
    <td>○</td>
    <td>○</td>
    <td>○</td>
</tr>

<tr>
    <th>午後<br>16:30〜19:00</th>

    <td>○</td>
    <td>○</td>
    <td>○</td>
    <td>○</td>
    <td>○</td>
    <td>―</td>
</tr>

<tr>
    <th>訪問診療</th>

    <td>○</td>
    <td>○</td>
    <td>○</td>
    <td>○</td>
    <td>○</td>
    <td>―</td>
</tr>

</table>

</div>


<p class="doctors-note">

<button
    type="button"
    id="toggle-doctors-btn"
>
    担当医はこちら
</button>

</p>

</section>



<!-- =======================================================
     地図テスト①
     ======================================================= -->

<section>

<h2>地図テスト①</h2>

<div
    class="map-wrap"
    style="height:500px;"
>

<iframe
    src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=14&output=embed"
    width="100%"
    height="100%"
    style="border:0;"
    loading="lazy"
    allowfullscreen
>
</iframe>

</div>

<p>
<a
    href="https://maps.app.goo.gl/5tnKR7ZdNdbxBCZw6?g_st=ic"
    target="_blank"
    rel="noopener"
>
    Googleマップで開く
</a>
</p>

</section>



<!-- =======================================================
     地図テスト②
     ======================================================= -->

<section>

<h2>地図テスト②</h2>

<div
    class="map-wrap"
    style="height:500px;"
>

<iframe
    src="map.access2.html"
    width="100%"
    height="100%"
    style="border:0;"
    loading="lazy"
>
</iframe>

</div>

</section>



<!-- =======================================================
     地図テスト③
     ======================================================= -->

<section>

<h2>地図テスト③</h2>

<div
    class="map-wrap"
    style="height:500px;"
>

<iframe
    src="map.access3.html"
    width="100%"
    height="100%"
    style="border:0;"
    loading="lazy"
>
</iframe>

</div>

</section>



<!-- =======================================================
     時計モーダル
     ======================================================= -->

<div
    class="clock-modal"
    id="clock-modal"
>

<div class="clock-modal-content">

<button
    type="button"
    class="clock-modal-close"
    id="clock-modal-close"
>
    ×
</button>

<iframe
    src="https://hattoriiin.github.io/clock.claude.html"
    title="診療時間時計"
>
</iframe>

</div>

</div>



<script>

/* =========================================================
   写真など既存ページ側の処理がある場合に備えた領域
   ========================================================= */


/* =========================================================
   担当医表
   9/10時点の方式に戻す
   ========================================================= */

Promise.all([
    fetch("doctors.html").then(res => res.text()),
    fetch("doctors.json").then(res => res.json())
])

.then(([htmlText, doctors]) => {

    const container =
        document.getElementById("schedule-container");

    if (!container) return;


    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            htmlText,
            "text/html"
        );


    const overlayTable =
        doc.querySelector("table");

    if (!overlayTable) return;


    overlayTable.id =
        "doctors-overlay-table";


    overlayTable.classList.add(
        "schedule",
        "table-overlay"
    );


    container.appendChild(
        overlayTable
    );


    function createDoctorName(name) {

        if (
            !name ||
            !String(name).trim()
        ) {
            return '<span class="doctor-empty">―</span>';
        }


        let cleanName =
            String(name)
                .replace(/先生$/, "")
                .trim();


        let className =
            "doctor-name";


        if (cleanName.length >= 6) {

            className += " very-long";

        } else if (cleanName.length >= 4) {

            className += " long";

        }


        const chars =
            [...cleanName]
                .map(
                    char =>
                        `<span class="doctor-char">${char}</span>`
                )
                .join("");


        return `
            <span class="${className}">
                ${chars}
            </span>
        `;
    }


    overlayTable
        .querySelectorAll("td[data-time]")
        .forEach(cell => {

            const day =
                cell.dataset.day;

            const time =
                cell.dataset.time;


            cell.innerHTML =
                createDoctorName(
                    doctors?.[day]?.[time] || ""
                );

        });


    overlayTable
        .querySelectorAll("td[data-visit]")
        .forEach(cell => {

            const day =
                cell.dataset.day;


            cell.innerHTML =
                createDoctorName(
                    doctors?.[day]?.["訪問"] || ""
                );

        });


    setupToggleEvents();

})

.catch(err => {

    console.error(
        "担当医表データ読み込みエラー:",
        err
    );

});



/* =========================================================
   担当医表の長押し表示
   ========================================================= */

function setupToggleEvents() {

    const btn =
        document.getElementById(
            "toggle-doctors-btn"
        );


    const container =
        document.getElementById(
            "schedule-container"
        );


    if (!btn || !container) return;


    function showOverlay(e) {

        if (e) {
            e.preventDefault();
        }


        container.classList.add(
            "is-active"
        );


        btn.classList.add(
            "active"
        );

    }


    function hideOverlay() {

        container.classList.remove(
            "is-active"
        );


        btn.classList.remove(
            "active"
        );

    }


    btn.addEventListener(
        "mousedown",
        showOverlay
    );


    btn.addEventListener(
        "mouseup",
        hideOverlay
    );


    btn.addEventListener(
        "mouseleave",
        hideOverlay
    );


    btn.addEventListener(
        "touchstart",
        showOverlay,
        { passive: false }
    );


    btn.addEventListener(
        "touchend",
        hideOverlay
    );


    btn.addEventListener(
        "touchcancel",
        hideOverlay
    );

}



/* =========================================================
   時計
   ========================================================= */

const clockModal =
    document.getElementById(
        "clock-modal"
    );


const clockClose =
    document.getElementById(
        "clock-modal-close"
    );


const clockButton =
    document.getElementById(
        "clock-button"
    );


if (clockButton) {

    function openClock() {

        clockModal.classList.add(
            "is-open"
        );

    }


    clockButton.addEventListener(
        "mousedown",
        openClock
    );


    clockButton.addEventListener(
        "touchstart",
        openClock,
        { passive: true }
    );

}


if (clockClose) {

    clockClose.addEventListener(
        "click",
        () => {

            clockModal.classList.remove(
                "is-open"
            );

        }
    );

}


if (clockModal) {

    clockModal.addEventListener(
        "click",
        e => {

            if (
                e.target === clockModal
            ) {

                clockModal.classList.remove(
                    "is-open"
                );

            }

        }
    );

}

</script>

</body>

</html>
