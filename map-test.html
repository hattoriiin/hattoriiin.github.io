<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>地図テスト</title>

<link
    rel="stylesheet"
    href="style.css"
>

</head>

<body>

<!-- 固定電話ボタン -->
<a
    href="tel:052-881-0876"
    class="fixed-call"
>
    ☎ 電話する　052-881-0876
</a>


<!-- 院内写真 -->
<section class="clinic-view">

    <div class="clinic-camera">

        <img
            src="images/gairai.uketuke.jpg"
            alt="服部医院 院内"
            class="clinic-image"
        >

    </div>

</section>


<!-- 地図テスト -->
<div class="location-grid">

    <div class="location-map">


        <!--
            ⭐ 地図1
            本番 index.html と同じ
            Google Maps 直接埋め込み
        -->
        <div class="access-map-frame">

            <iframe
                src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=14&output=embed"
                title="直接Googleマップ"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>

        </div>


        <!-- 地図2 -->
        <div class="access-map-frame">

            <iframe
                src="map.access2.html"
                title="地図2"
            ></iframe>

        </div>


        <!-- 地図3 -->
        <div class="access-map-frame">

            <iframe
                src="map.access3.html"
                title="地図3"
            ></iframe>

        </div>


    </div>

</div>


<!--
    本番 index.html の院内写真スクロール処理
    今回の検証用
-->
<script>

const camera =
    document.querySelector('.clinic-camera');

const image =
    document.querySelector('.clinic-image');


window.addEventListener('scroll', function() {

    if (!camera || !image) return;


    const rect =
        camera.getBoundingClientRect();

    const viewHeight =
        window.innerHeight;


    if (
        rect.top <= viewHeight &&
        rect.bottom >= 0
    ) {

        const progress =
            (viewHeight - rect.top) /
            (viewHeight + rect.height);


        const clamped =
            Math.max(
                0,
                Math.min(1, progress)
            );


        const translateX =
            -50 +
            (clamped - 0.5) * 30;


        const scale =
            0.85 +
            clamped * 0.15;


        image.style.transform =
            `translate3d(${translateX}%, -50%, 0) scale(${scale})`;

    }

});

</script>


</body>

</html>
