<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>地図テスト</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

/* ==================================================
   本番と同じ診療時間時計
================================================== */

.clock-trigger-wrap {
    text-align: center;
    margin: 20px 0;
}

.clock-btn {
    background-color: #f8f9fa;
    border: 1px solid #ccc;
    color: #333;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}

.clock-btn.active {
    background-color: #e2e6ea;
    border-color: #adb5bd;
}


.clock-modal {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;

    background: rgba(30, 40, 45, 0.10);

    display: none;
    justify-content: center;
    align-items: center;

    z-index: 2147483647;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;

    transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
}

.clock-modal.is-active {
    display: flex;
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}


.clock-modal-content {
    width: 100vw;
    height: 100vh;

    max-width: none;
    max-height: none;

    background: rgba(235, 247, 250, 0.85);

    border-radius: 0;

    box-shadow: none;

    position: relative;
    overflow: hidden;

    margin: 0;

    transform: scale(1);
}


.clock-modal-content iframe {
    position: absolute;

    top: 50%;
    left: 50%;

    width: 100vw;
    height: 100vh;

    border: none;
    background: transparent;

    transform: translate(-50%, -50%);
}

</style>

</head>


<body>


<!-- ==================================================
     固定電話
================================================== -->

<a
    href="tel:052-881-0876"
    class="fixed-call"
>
    ☎ 電話する　052-881-0876
</a>


<!-- ==================================================
     院内写真
================================================== -->

<section class="clinic-view">

    <div class="clinic-camera">

        <img
            src="images/gairai.uketuke.jpg"
            alt="服部医院 院内"
            class="clinic-image"
        >

    </div>

</section>


<!-- ==================================================
     時計ボタン
================================================== -->

<div class="clock-trigger-wrap">

    <button
        type="button"
        id="clockBtn"
        class="clock-btn"
    >
        診療時間時計（長押し）
    </button>

</div>


<!-- ==================================================
     地図
================================================== -->

<div class="location-grid">

    <div class="location-map">


        <!-- 地図1：本番と同じ直接Google Maps -->

        <div class="access-map-frame">

            <iframe
                src="https://www.google.com/maps?q=医療法人+誠彰会+服部医院&z=14&output=embed"
                title="直接Googleマップ"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
            ></iframe>

        </div>


        <!-- 地図2 -->

        <div class="access-map-frame">

            <iframe
                src="map.access2.html"
                title="地図2"
            ></iframe>

        </div>


        <!-- 地図3 -->

        <div class="access-map-frame">

            <iframe
                src="map.access3.html"
                title="地図3"
            ></iframe>

        </div>


    </div>

</div>


<!-- ==================================================
     時計モーダル
================================================== -->

<div
    id="clockModal"
    class="clock-modal"
>

    <div class="clock-modal-content">

        <iframe
            src="https://hattoriiin.github.io/clock.claude.html"
            title="診療時間時計"
        ></iframe>

    </div>

</div>


<!-- ==================================================
     JavaScript
================================================== -->

<script>


/* ==================================================
   院内写真の横スクロール
================================================== */

const camera =
    document.querySelector('.clinic-camera');

const image =
    document.querySelector('.clinic-image');


if (camera && image) {

    window.addEventListener('scroll', function() {

        const rect =
            camera.getBoundingClientRect();

        const viewHeight =
            window.innerHeight;

        if (
            rect.top <= viewHeight &&
            rect.bottom >= 0
        ) {

            const progress =
                (viewHeight - rect.top) /
                (viewHeight + rect.height);

            const clamped =
                Math.max(
                    0,
                    Math.min(1, progress)
                );

            const translateX =
                -50 +
                (clamped - 0.5) * 30;

            const scale =
                0.85 +
                clamped * 0.15;

            image.style.transform =
                `translate3d(${translateX}%, -50%, 0) scale(${scale})`;

        }

    });

}


/* ==================================================
   時計
================================================== */

const clockBtn =
    document.getElementById('clockBtn');

const clockModal =
    document.getElementById('clockModal');

const clockFrame =
    clockModal
        ? clockModal.querySelector('iframe')
        : null;


if (clockBtn && clockModal) {


    function adjustClock() {

        if (!clockFrame) return;

        try {

            const doc =
                clockFrame.contentDocument;

            if (!doc) return;


            /* 「外来診療・受付時間」を非表示 */

            const title =
                doc.querySelector('.clock-title');

            if (title) {
                title.style.display = 'none';
            }


            /* 時計本体 */

            const timeRing =
                doc.querySelector('.time-ring');

            if (timeRing) {
                timeRing.style.opacity = '0.85';
            }


            /* iframe内背景 */

            doc.documentElement.style.background =
                'transparent';

            doc.body.style.background =
                'transparent';

            doc.body.style.margin =
                '0';

        }

        catch (error) {

            console.log(
                '時計表示の調整に失敗しました:',
                error
            );

        }

    }


    function showClock(e) {

        if (e) e.preventDefault();

        clockModal.classList.add('is-active');

        clockBtn.classList.add('active');

        adjustClock();

    }


    function hideClock(e) {

        if (e) e.preventDefault();

        clockModal.classList.remove('is-active');

        clockBtn.classList.remove('active');

    }


    if (clockFrame) {

        clockFrame.addEventListener(
            'load',
            adjustClock
        );

    }


    /* iPhone */

    clockBtn.addEventListener(
        'touchstart',
        function(e) {
            showClock(e);
        },
        { passive: false }
    );


    clockBtn.addEventListener(
        'touchend',
        hideClock
    );


    clockBtn.addEventListener(
        'touchcancel',
        hideClock
    );


    /* PC */

    clockBtn.addEventListener(
        'mousedown',
        showClock
    );


    window.addEventListener(
        'mouseup',
        hideClock
    );


    clockBtn.addEventListener(
        'mouseleave',
        hideClock
    );


    /* 時計の外側をタップしたら閉じる */

    clockModal.addEventListener(
        'click',
        function(e) {

            if (e.target === clockModal) {
                hideClock();
            }

        }
    );

}


</script>


</body>

</html>
