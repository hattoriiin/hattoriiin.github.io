<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>地図テスト</title>

<!-- 本番サイトのCSSを読み込む -->
<link rel="stylesheet" href="style.css">

<style>

html {
    scroll-behavior: auto !important;
}

.location-section {
    width: 100%;
}

.location-grid {
    display: grid;
    grid-template-columns: 55% 45%;
    gap: .7rem;
    align-items: start;
}

.location-map {
    width: 100%;
}

.access-map-frame {
    width: 100%;
    height: 180px;
    border-radius: 12px;
}

.access-map-frame iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

.location-info {
    width: 100%;
}

</style>

</head>

<body>

<section class="location-section">

    <h2>所在地・アクセス・テスト</h2>

    <div class="location-grid">

        <div class="location-map">

            <div class="access-map-frame">

                <iframe
                    src="map.access3.html"
                    title="服部医院周辺アクセスマップ"
                ></iframe>

            </div>

        </div>

        <div class="location-info">

            <h3>所在地</h3>

            <p>
                〒467-0825<br>
                愛知県名古屋市瑞穂区<br>
                柳ヶ枝町1-34 1階
            </p>

        </div>

    </div>

</section>

</body>

</html>
