<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜担当医表</title>

<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:#fff;

    color:#222;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    line-height:1.8;

}


/* ==================================================
   本体

   index.html の main と同じ
================================================== */

main{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:1.5rem;

    background:#fff;

}


/* ==================================================
   見出し

   index.html の h2 の雰囲気に合わせる
================================================== */

h1{

    margin:0 0 1.2rem;

    padding-bottom:.5rem;

    border-bottom:2px solid #ddd;

    font-size:1.35rem;

    font-weight:400;

    color:#222;

}


/* ==================================================
   担当医表

   index.html .schedule と同じ構造
================================================== */

.schedule{

    width:100%;

    table-layout:fixed;

    border-collapse:separate;

    border-spacing:0;

    margin-top:1.2rem;

    overflow:hidden;

    border-radius:10px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);

}


/* ==================================================
   セル共通

   index.html と同じ
================================================== */

.schedule th,
.schedule td{

    border-bottom:1px solid #ddd;

    padding:.25rem .35rem;

    text-align:center;

    vertical-align:middle;

    font-size:1.0rem;

    line-height:1.15;

}


/* ==================================================
   曜日部分

   index.html と同じ
================================================== */

.schedule tr:first-child th{

    background:#31556e;

    color:#fff;

    font-weight:400;

}


/* ==================================================
   左側「診療内容」

   index.html と同じ淡い色
================================================== */

.schedule tr:not(:first-child) th{

    background:#f2f7f9;

    font-weight:400;

    white-space:nowrap;

    line-height:1.35;

    padding-top:.55rem;

    padding-bottom:.55rem;

    letter-spacing:.05em;

}


/* ==================================================
   医師名側
================================================== */

.schedule td{

    background:#fff;

    height:86px;

    overflow:hidden;

}


/* ==================================================
   左端の幅

   index.html と同じ
================================================== */

.schedule th:first-child{

    width:120px;

}


/* ==================================================
   診療名
================================================== */

.schedule-label{

    display:block;

    font-size:1rem;

    line-height:1.35;

}


/* ==================================================
   時間
================================================== */

.schedule-time{

    display:block;

    margin-top:4px;

    font-size:.78rem;

    letter-spacing:0;

    white-space:nowrap;

}


/* ==================================================
   医師名

   縦組み・中央揃え
================================================== */

.doctor-name{

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    width:100%;

    height:100%;

    margin:auto;

    line-height:1.05;

    font-size:1rem;

    font-weight:400;

    white-space:nowrap;

}


/* ==================================================
   1文字
================================================== */

.doctor-char{

    display:block;

}


/* ==================================================
   長い名前

   枠を広げず文字だけ縮小
================================================== */

.doctor-name.long{

    font-size:.78rem;

}


/* ==================================================
   非常に長い名前
================================================== */

.doctor-name.very-long{

    font-size:.62rem;

}


/* ==================================================
   空欄
================================================== */

.doctor-empty{

    color:#777;

    font-size:.9rem;

}


/* ==================================================
   最後の線を消す

   index.html と同じ
================================================== */

.schedule tr:last-child th,
.schedule tr:last-child td{

    border-bottom:none;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media (max-width:600px){

    main{

        padding:1.5rem;

    }


    h1{

        font-size:1.2rem;

    }


    .schedule th,
    .schedule td{

        font-size:.82rem;

        padding:.25rem .15rem;

    }


    .schedule th:first-child{

        width:88px;

    }


    .schedule tr:not(:first-child) th{

        padding-top:.5rem;

        padding-bottom:.5rem;

    }


    .schedule-label{

        font-size:.82rem;

    }


    .schedule-time{

        font-size:.65rem;

    }


    .schedule td{

        height:78px;

    }


    .doctor-name{

        font-size:.84rem;

    }


    .doctor-name.long{

        font-size:.68rem;

    }


    .doctor-name.very-long{

        font-size:.56rem;

    }

}


/* ==================================================
   スマートフォン横
================================================== */

@media (max-width:900px) and (orientation:landscape){

    main{

        padding:1rem;

    }


    .schedule th,
    .schedule td{

        font-size:.82rem;

    }


    .schedule th:first-child{

        width:100px;

    }


    .schedule-label{

        font-size:.82rem;

    }


    .schedule-time{

        font-size:.67rem;

    }


    .schedule td{

        height:68px;

    }


    .doctor-name{

        font-size:.82rem;

    }


    .doctor-name.long{

        font-size:.66rem;

    }


    .doctor-name.very-long{

        font-size:.54rem;

    }

}

</style>

</head>


<body>


<main>


<h1>
担当医表
</h1>


<table class="schedule">


<!-- ==================================================
     曜日
================================================== -->

<tr>

<th></th>

<th>月</th>
<th>火</th>
<th>水</th>
<th>木</th>
<th>金</th>
<th>土</th>

</tr>


<!-- ==================================================
     午前診
================================================== -->

<tr>

<th>

<span class="schedule-label">
🏥　午前診
</span>

<span class="schedule-time">
9:00〜12:00
</span>

</th>


<td
    data-day="月"
    data-time="午前"
></td>


<td
    data-day="火"
    data-time="午前"
></td>


<td
    data-day="水"
    data-time="午前"
></td>


<td
    data-day="木"
    data-time="午前"
></td>


<td
    data-day="金"
    data-time="午前"
></td>


<td
    data-day="土"
    data-time="午前"
></td>

</tr>


<!-- ==================================================
     訪問診療
================================================== -->

<tr>

<th>

<span class="schedule-label">
🏠　訪問診療
</span>

<span class="schedule-time">
13:30〜16:30
</span>

</th>


<td data-visit="true"></td>

<td data-visit="true"></td>

<td data-visit="true"></td>

<td data-visit="true"></td>

<td data-visit="true"></td>

<td data-visit="true"></td>

</tr>


<!-- ==================================================
     午後診
================================================== -->

<tr>

<th>

<span class="schedule-label">
🏥　午後診
</span>

<span class="schedule-time">
17:30〜19:30
</span>

</th>


<td
    data-day="月"
    data-time="午後"
></td>


<td
    data-day="火"
    data-time="午後"
></td>


<td
    data-day="水"
    data-time="午後"
></td>


<td
    data-day="木"
    data-time="午後"
></td>


<td
    data-day="金"
    data-time="午後"
></td>


<td
    data-day="土"
    data-time="午後"
></td>

</tr>


</table>


</main>


<script>

/* ==================================================
   doctors.json 読み込み
================================================== */

fetch("doctors.json")

.then(response => {

    if(!response.ok){

        throw new Error(
            "doctors.json を読み込めませんでした"
        );

    }

    return response.json();

})


.then(doctors => {


    /* ==================================================
       敬称を削除

       doctors.json は
       「院長」「村田先生」などでOK
    ================================================== */

    function cleanName(name){

        return String(name || "")
            .replace(/先生$/,"")
            .trim();

    }


    /* ==================================================
       医師名を縦組みにする
    ================================================== */

    function createDoctorName(name){

        const clean =
            cleanName(name);


        /* ----------------------------------------------
           空欄
        ---------------------------------------------- */

        if(!clean){

            return `
                <span class="doctor-empty">
                    ―
                </span>
            `;

        }


        /* ----------------------------------------------
           名前の長さで文字サイズを調整

           1〜3文字：通常
           4〜5文字：小さく
           6文字以上：さらに小さく
        ---------------------------------------------- */

        let className =
            "doctor-name";


        if(clean.length >= 6){

            className +=
                " very-long";

        }

        else if(clean.length >= 4){

            className +=
                " long";

        }


        /* ----------------------------------------------
           1文字ずつ縦に配置
        ---------------------------------------------- */

        const chars =
            [...clean]
            .map(char => {

                return `
                    <span class="doctor-char">
                        ${char}
                    </span>
                `;

            })
            .join("");


        return `
            <span class="${className}">
                ${chars}
            </span>
        `;

    }


    /* ==================================================
       午前診・午後診
    ================================================== */

    document
        .querySelectorAll(
            ".schedule td[data-day]"
        )
        .forEach(cell => {


            const day =
                cell.dataset.day;

            const time =
                cell.dataset.time;


            const name =
                doctors?.[day]?.[time] || "";


            cell.innerHTML =
                createDoctorName(name);

        });


    /* ==================================================
       訪問診療

       現在は全曜日「院長」

       将来 doctors.json を

       "訪問診療": "○○先生"

       に変更すれば自動反映
    ================================================== */

    const visitName =
        doctors?.["訪問診療"] || "";


    document
        .querySelectorAll(
            ".schedule td[data-visit]"
        )
        .forEach(cell => {

            cell.innerHTML =
                createDoctorName(visitName);

        });

})


.catch(error => {

    console.error(error);

});

</script>


</body>

</html>
