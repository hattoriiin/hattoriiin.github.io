<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜担当医表</title>


<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    font-family:sans-serif;

    line-height:1.8;

    color:#222;

    background:#fff;

}


/* ==================================================
   本体

   index.html と同じ
================================================== */

main{

    max-width:900px;

    margin:auto;

    padding:1.5rem;

    background:#fff;

}


/* ==================================================
   見出し
================================================== */

h1{

    margin:0;

    padding-bottom:.5rem;

    border-bottom:2px solid #ddd;

    font-size:1.35rem;

    font-weight:400;

}


/* ==================================================
   担当医表

   index.html の .schedule を基準
================================================== */

.schedule{

    width:100%;

    table-layout:fixed;

    border-collapse:separate;

    border-spacing:0;

    margin-top:1.2rem;

    overflow:hidden;

    border-radius:10px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);

}


/* ==================================================
   セル

   index.html と同じ
================================================== */

.schedule th,
.schedule td{

    border-bottom:1px solid #ddd;

    padding:.25rem .35rem;

    text-align:center;

    font-size:1.0rem;

    line-height:1.15;

}


/* ==================================================
   曜日

   index.html と同じ
================================================== */

.schedule tr:first-child th{

    background:#31556e;

    color:#fff;

    font-weight:400;

}


/* ==================================================
   左側

   index.html と同じ
================================================== */

.schedule tr:not(:first-child) th{

    background:#f2f7f9;

    font-weight:400;

    white-space:nowrap;

}


/* ==================================================
   最後の線
================================================== */

.schedule tr:last-child th,
.schedule tr:last-child td{

    border-bottom:none;

}


/* ==================================================
   左端

   index.html と同じ120px
================================================== */

.schedule th:first-child{

    width:120px;

}


/* ==================================================
   左側の文字
================================================== */

.schedule th span{

    display:inline-block;

    margin-top:4px;

}


/* ==================================================
   左側の行間

   index.html と同じ
================================================== */

.schedule tr:not(:first-child) th{

    line-height:1.35;

    padding-top:.55rem;

    padding-bottom:.55rem;

    letter-spacing:.05em;

}


/* ==================================================
   担当医名

   セル幅は変更しない
================================================== */

.doctor-name{

    display:inline-flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    font-size:1.0rem;

    font-weight:400;

    line-height:1.15;

    white-space:nowrap;

}


/* ==================================================
   1文字
================================================== */

.doctor-char{

    display:block;

}


/* ==================================================
   担当医なし
================================================== */

.doctor-empty{

    display:inline-block;

    font-size:1.0rem;

    color:#777;

}


/* ==================================================
   長い氏名

   表の幅は変えず、
   氏名だけ縮小
================================================== */

.doctor-name.long{

    font-size:.85rem;

}


.doctor-name.very-long{

    font-size:.72rem;

}


/* ==================================================
   スマートフォン

   表そのもののフォント・幅は変更しない
================================================== */

@media (max-width:600px){

    main{

        padding:1.5rem;

    }

}


/* ==================================================
   横向き

   表そのものは変更しない
================================================== */

@media (max-width:900px) and (orientation:landscape){

    main{

        padding:1.5rem;

    }

}

</style>

</head>


<body>


<main>


<h1>
担当医表
</h1>


<table class="schedule">


<!-- ==================================================
     曜日
================================================== -->

<tr>

<th></th>

<th>月</th>

<th>火</th>

<th>水</th>

<th>木</th>

<th>金</th>

<th>土</th>

</tr>


<!-- ==================================================
     午前診
================================================== -->

<tr>

<th>

🏥　午前診<br>

<span>
9:00〜12:00
</span>

</th>


<td
    data-day="月"
    data-time="午前"
></td>

<td
    data-day="火"
    data-time="午前"
></td>

<td
    data-day="水"
    data-time="午前"
></td>

<td
    data-day="木"
    data-time="午前"
></td>

<td
    data-day="金"
    data-time="午前"
></td>

<td
    data-day="土"
    data-time="午前"
></td>

</tr>


<!-- ==================================================
     訪問診療

     月〜木：あり
     金・土：なし

     ただし行そのものは残す
================================================== -->

<tr>

<th>

🏠　訪問診療<br>

<span>
13:30〜16:30
</span>

</th>


<td
    data-day="月"
    data-visit
></td>

<td
    data-day="火"
    data-visit
></td>

<td
    data-day="水"
    data-visit
></td>

<td
    data-day="木"
    data-visit
></td>

<td
    data-day="金"
    data-visit
></td>

<td
    data-day="土"
    data-visit
></td>

</tr>


<!-- ==================================================
     午後診
================================================== -->

<tr>

<th>

🏥　午後診<br>

<span>
17:30〜19:30
</span>

</th>


<td
    data-day="月"
    data-time="午後"
></td>

<td
    data-day="火"
    data-time="午後"
></td>

<td
    data-day="水"
    data-time="午後"
></td>

<td
    data-day="木"
    data-time="午後"
></td>

<td
    data-day="金"
    data-time="午後"
></td>

<td
    data-day="土"
    data-time="午後"
></td>

</tr>


</table>


</main>


<script>

/* ==================================================
   doctors.json 読み込み
================================================== */

fetch("doctors.json")

.then(response => {

    if(!response.ok){

        throw new Error(
            "doctors.json を読み込めませんでした"
        );

    }

    return response.json();

})


.then(doctors => {


    /* ==================================================
       医師名を表示する関数
    ================================================== */

    function createDoctorName(name){

        /* ----------------------------------------------
           空欄
        ---------------------------------------------- */

        if(
            !name ||
            !String(name).trim()
        ){

            return `
                <span class="doctor-empty">
                    ―
                </span>
            `;

        }


        /* ----------------------------------------------
           「先生」を削除

           例：

           村田先生
           ↓
           村田

           糠谷先生
           ↓
           糠谷
        ---------------------------------------------- */

        let cleanName =
            String(name)
            .replace(/先生$/,"")
            .trim();


        /* ----------------------------------------------
           長い名前だけ縮小

           表の幅は変更しない
        ---------------------------------------------- */

        let className =
            "doctor-name";


        if(cleanName.length >= 6){

            className +=
                " very-long";

        }

        else if(cleanName.length >= 4){

            className +=
                " long";

        }


        /* ----------------------------------------------
           1文字ずつ縦書き

           院長
           ↓

           院
           長
        ---------------------------------------------- */

        const chars =
            [...cleanName]
            .map(char => {

                return `
                    <span class="doctor-char">
                        ${char}
                    </span>
                `;

            })
            .join("");


        return `
            <span class="${className}">
                ${chars}
            </span>
        `;

    }


    /* ==================================================
       午前・午後
    ================================================== */

    document
        .querySelectorAll(
            ".schedule td[data-time]"
        )
        .forEach(cell => {


            const day =
                cell.dataset.day;


            const time =
                cell.dataset.time;


            const name =
                doctors?.[day]?.[time] || "";


            cell.innerHTML =
                createDoctorName(name);

        });


    /* ==================================================
       訪問診療

       ★ 曜日ごとに読む

       月 → doctors["月"]["訪問"]
       火 → doctors["火"]["訪問"]

       金・土で "" なら ―
    ================================================== */

    document
        .querySelectorAll(
            ".schedule td[data-visit]"
        )
        .forEach(cell => {


            const day =
                cell.dataset.day;


            const visitDoctor =
                doctors?.[day]?.["訪問"] || "";


            cell.innerHTML =
                createDoctorName(
                    visitDoctor
                );

        });

})


.catch(error => {

    console.error(error);

});

</script>


</body>

</html>
