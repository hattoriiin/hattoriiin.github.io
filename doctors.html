<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜担当医表</title>

<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    background:#fff;

    color:#222;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

    line-height:1.8;

}


/* ==================================================
   本体
================================================== */

main{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:1.5rem;

    background:#fff;

}


/* ==================================================
   タイトル
================================================== */

h1{

    margin:0 0 1.2rem;

    padding:.5rem 0;

    text-align:center;

    border-top:1px solid rgba(49,85,110,.45);

    border-bottom:1px solid rgba(49,85,110,.45);

    color:#31556e;

    font-size:1.15rem;

    font-weight:400;

    letter-spacing:.16em;

}


/* ==================================================
   担当医表

   元の診療時間表と同じ6曜日固定
================================================== */

.doctor-table{

    width:100%;

    table-layout:fixed;

    border-collapse:separate;

    border-spacing:0;

    margin-top:1.2rem;

    overflow:hidden;

    border-radius:10px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.08);

}


/* ==================================================
   セル共通
================================================== */

.doctor-table th,
.doctor-table td{

    border-bottom:1px solid #ddd;

    padding:.25rem .15rem;

    text-align:center;

    vertical-align:middle;

    font-size:1rem;

    line-height:1.15;

}


/* ==================================================
   曜日
================================================== */

.doctor-table thead th{

    background:#31556e;

    color:#fff;

    font-weight:400;

    height:42px;

}


/* ==================================================
   左側：診療内容

   ★ 幅を固定
================================================== */

.doctor-table .time-label{

    width:120px;

    background:#f2f7f9;

    color:#222;

    font-weight:400;

    white-space:nowrap;

    line-height:1.35;

    padding-top:.55rem;

    padding-bottom:.55rem;

}


/* ==================================================
   左側タイトル
================================================== */

.time-title{

    display:block;

    font-size:1rem;

    letter-spacing:.03em;

}


/* ==================================================
   時間
================================================== */

.time-range{

    display:block;

    margin-top:4px;

    font-size:.82rem;

    white-space:nowrap;

}


/* ==================================================
   医師名セル
================================================== */

.doctor-table td{

    background:#fff;

    height:92px;

    overflow:hidden;

}


/* ==================================================
   医師名

   縦方向・中央揃え
================================================== */

.doctor-name{

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    width:100%;

    height:100%;

    margin:auto;

    line-height:1.05;

    font-size:1rem;

    font-weight:400;

    white-space:nowrap;

}


/* ==================================================
   医師名の1文字
================================================== */

.doctor-char{

    display:block;

}


/* ==================================================
   長い名前
================================================== */

.doctor-name.long{

    font-size:.78rem;

}


/* ==================================================
   非常に長い名前
================================================== */

.doctor-name.very-long{

    font-size:.62rem;

}


/* ==================================================
   空欄
================================================== */

.doctor-empty{

    color:#777;

    font-size:.9rem;

}


/* ==================================================
   最終行の線
================================================== */

.doctor-table tbody tr:last-child th,
.doctor-table tbody tr:last-child td{

    border-bottom:none;

}


/* ==================================================
   スマートフォン縦
================================================== */

@media (max-width:600px){

    main{

        padding:1.5rem;

    }


    h1{

        font-size:1.05rem;

    }


    .doctor-table thead th{

        height:38px;

        font-size:.82rem;

    }


    .doctor-table .time-label{

        width:88px;

        font-size:.82rem;

    }


    .time-title{

        font-size:.82rem;

    }


    .time-range{

        font-size:.67rem;

    }


    .doctor-table td{

        height:82px;

    }


    .doctor-name{

        font-size:.84rem;

    }


    .doctor-name.long{

        font-size:.68rem;

    }


    .doctor-name.very-long{

        font-size:.56rem;

    }

}


/* ==================================================
   スマートフォン横
================================================== */

@media (max-width:900px) and (orientation:landscape){

    main{

        padding:1rem;

    }


    .doctor-table thead th{

        height:36px;

        font-size:.82rem;

    }


    .doctor-table .time-label{

        width:100px;

    }


    .time-title{

        font-size:.82rem;

    }


    .time-range{

        font-size:.68rem;

    }


    .doctor-table td{

        height:70px;

    }


    .doctor-name{

        font-size:.82rem;

    }


    .doctor-name.long{

        font-size:.66rem;

    }


    .doctor-name.very-long{

        font-size:.54rem;

    }

}

</style>

</head>


<body>


<main>


<h1>担当医表</h1>


<table class="doctor-table">


<thead>

<tr>

<th class="time-label"></th>

<th>月</th>

<th>火</th>

<th>水</th>

<th>木</th>

<th>金</th>

<th>土</th>

</tr>

</thead>


<tbody>


<!-- ==================================================
     午前診
================================================== -->

<tr>

<th class="time-label">

<span class="time-title">
🏥　午前診
</span>

<span class="time-range">
9:00〜12:00
</span>

</th>


<td
    data-day="月"
    data-time="午前"
></td>

<td
    data-day="火"
    data-time="午前"
></td>

<td
    data-day="水"
    data-time="午前"
></td>

<td
    data-day="木"
    data-time="午前"
></td>

<td
    data-day="金"
    data-time="午前"
></td>

<td
    data-day="土"
    data-time="午前"
></td>

</tr>


<!-- ==================================================
     訪問診療
================================================== -->

<tr>

<th class="time-label">

<span class="time-title">
🏠　訪問診療
</span>

<span class="time-range">
13:30〜16:30
</span>

</th>


<td data-visit="true"></td>

<td data-visit="true"></td>

<td data-visit="true"></td>

<td data-visit="true"></td>

<td data-visit="true"></td>

<td data-visit="true"></td>

</tr>


<!-- ==================================================
     午後診
================================================== -->

<tr>

<th class="time-label">

<span class="time-title">
🏥　午後診
</span>

<span class="time-range">
17:30〜19:30
</span>

</th>


<td
    data-day="月"
    data-time="午後"
></td>

<td
    data-day="火"
    data-time="午後"
></td>

<td
    data-day="水"
    data-time="午後"
></td>

<td
    data-day="木"
    data-time="午後"
></td>

<td
    data-day="金"
    data-time="午後"
></td>

<td
    data-day="土"
    data-time="午後"
></td>

</tr>


</tbody>

</table>


</main>


<script>

/* ==================================================
   doctors.json
================================================== */

fetch("doctors.json")

.then(response => {

    if(!response.ok){

        throw new Error(
            "doctors.json を読み込めませんでした"
        );

    }

    return response.json();

})


.then(doctors => {


    /* ==================================================
       敬称を除去
    ================================================== */

    function cleanName(name){

        return String(name || "")
            .replace(/先生$/,"")
            .trim();

    }


    /* ==================================================
       医師名を縦組みにする
    ================================================== */

    function createDoctorName(name){

        const clean =
            cleanName(name);


        /* 空欄 */

        if(!clean){

            return `
                <span class="doctor-empty">
                    ―
                </span>
            `;

        }


        /* ----------------------------------------------
           文字数による縮小
        ---------------------------------------------- */

        let className =
            "doctor-name";


        if(clean.length >= 6){

            className +=
                " very-long";

        }

        else if(clean.length >= 4){

            className +=
                " long";

        }


        /* ----------------------------------------------
           1文字ずつ縦に並べる
        ---------------------------------------------- */

        const chars =
            [...clean]
            .map(char => {

                return `
                    <span class="doctor-char">
                        ${char}
                    </span>
                `;

            })
            .join("");


        return `
            <span class="${className}">
                ${chars}
            </span>
        `;

    }


    /* ==================================================
       午前・午後
    ================================================== */

    document
        .querySelectorAll(
            ".doctor-table td[data-day]"
        )
        .forEach(cell => {


            const day =
                cell.dataset.day;

            const time =
                cell.dataset.time;


            const name =
                doctors?.[day]?.[time] || "";


            cell.innerHTML =
                createDoctorName(name);

        });


    /* ==================================================
       訪問診療

       ★ 現在は全曜日「院長」
       ★ 将来変更した場合も doctors.json から反映
    ================================================== */

    const visitName =
        doctors?.["訪問診療"] || "";


    document
        .querySelectorAll(
            ".doctor-table td[data-visit]"
        )
        .forEach(cell => {

            cell.innerHTML =
                createDoctorName(visitName);

        });

})


.catch(error => {

    console.error(error);

});

</script>


</body>

</html>
