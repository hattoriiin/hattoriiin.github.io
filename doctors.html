<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜担当医表</title>

<style>

/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height:1.8;
    color:#222;
    background:#fff;
}

/* ==================================================
   本文
================================================== */

main{
    max-width:900px;
    margin:auto;
    padding:1.5rem;
    background:#fff;
}

/* ==================================================
   見出し
================================================== */

h1{
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.5;
    margin: 0 0 1rem 0;
    padding-bottom: .5rem;
    border-bottom: 2px solid #ddd;
}

/* ==================================================
   診療時間表（全体構造＆列幅固定）
================================================== */

.schedule{
    width:100%;
    table-layout:fixed;
    border-collapse:separate;
    border-spacing:0;
    margin-top:1.2rem;
    overflow:hidden;
    border-radius:10px;
    box-shadow:
        0 2px 8px rgba(0,0,0,.08);
}

/* 左端（時間帯列）の幅固定 */
.schedule th:first-child,
.schedule td:first-child{
    width:120px;
}

/* 月〜土の6列を均等配置 */
.schedule th:not(:first-child),
.schedule td:not(:first-child){
    width:calc((100% - 120px) / 6);
}

/* ==================================================
   th / td（基本セル設定）
================================================== */

.schedule th,
.schedule td{
    border-bottom:1px solid #ddd;
    padding:.25rem .35rem;
    text-align:center;
    font-size:1.0rem;
    line-height:1.15;
}

/* ==================================================
   曜日
================================================== */

.schedule tr:first-child th{
    background:#31556e;
    color:#fff;
    font-weight:400;
}

/* ==================================================
   左側の診療内容
================================================== */

.schedule tr:not(:first-child) th{
    background:#f2f7f9;
    font-weight:400;
    white-space:nowrap;
    line-height:1.35;
    padding-top:.55rem;
    padding-bottom:.55rem;
    letter-spacing:.05em;
}

/* ==================================================
   最後の線
================================================== */

.schedule tr:last-child th,
.schedule tr:last-child td{
    border-bottom:none;
}

/* ==================================================
   左端の span
================================================== */

.schedule th span{
    display:inline-block;
    margin-top:4px;
}

/* ==================================================
   担当医名
================================================== */

.doctor-name{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
    font-size:1.0rem;
    font-weight:400;
    line-height:1.0;
}

.doctor-char{
    display:block;
}

.doctor-empty{
    display:inline-block;
    font-size:1.0rem;
    line-height:1.15;
    color:#777;
}

.doctor-name.long{
    font-size:.85rem;
}

.doctor-name.very-long{
    font-size:.72rem;
}

/* ==================================================
   レスポンシブ
================================================== */

@media (max-width:600px){
    main{
        padding:1.5rem;
    }
}

@media (max-width:900px) and (orientation:landscape){
    main{
        padding:1.5rem;
    }
}

</style>

</head>


<body>


<main>


<!-- ==================================================
     タイトル
================================================== -->

<h1>
担当医表
</h1>


<!-- ==================================================
     診療時間・担当医表
================================================== -->

<table class="schedule">


<!-- ==================================================
     曜日
================================================== -->

<tr>

<th></th>

<th>月</th>

<th>火</th>

<th>水</th>

<th>木</th>

<th>金</th>

<th>土</th>

</tr>


<!-- ==================================================
     午前診
================================================== -->

<tr>

<th>

🏥　午前診<br>

<span>
9:00〜12:00
</span>

</th>


<td
    data-day="月"
    data-time="午前"
></td>

<td
    data-day="火"
    data-time="午前"
></td>

<td
    data-day="水"
    data-time="午前"
></td>

<td
    data-day="木"
    data-time="午前"
></td>

<td
    data-day="金"
    data-time="午前"
></td>

<td
    data-day="土"
    data-time="午前"
></td>

</tr>


<!-- ==================================================
     訪問診療
================================================== -->

<tr>

<th>

🏠　<a href="houmon.html">訪問診療</a><br>

<span>
13:30〜16:30
</span>

</th>


<td
    data-day="月"
    data-visit
></td>

<td
    data-day="火"
    data-visit
></td>

<td
    data-day="水"
    data-visit
></td>

<td
    data-day="木"
    data-visit
></td>

<td
    data-day="金"
    data-visit
></td>

<td
    data-day="土"
    data-visit
></td>

</tr>


<!-- ==================================================
     午後診
================================================== -->

<tr>

<th>

🏥　午後診<br>

<span>
17:30〜19:30
</span>

</th>


<td
    data-day="月"
    data-time="午後"
></td>

<td
    data-day="火"
    data-time="午後"
></td>

<td
    data-day="水"
    data-time="午後"
></td>

<td
    data-day="木"
    data-time="午後"
></td>

<td
    data-day="金"
    data-time="午後"
></td>

<td
    data-day="土"
    data-time="午後"
></td>

</tr>


</table>


</main>


<script>

fetch("doctors.json")

.then(response => {

    if(!response.ok){
        throw new Error("doctors.json を読み込めませんでした");
    }

    return response.json();

})

.then(doctors => {

    function createDoctorName(name){

        if(!name || !String(name).trim()){
            return `<span class="doctor-empty">―</span>`;
        }

        let cleanName = String(name).replace(/先生$/,"").trim();
        let className = "doctor-name";

        if(cleanName.length >= 6){
            className += " very-long";
        } else if(cleanName.length >= 4){
            className += " long";
        }

        const chars = [...cleanName].map(char => {
            return `<span class="doctor-char">${char}</span>`;
        }).join("");

        return `<span class="${className}">${chars}</span>`;
    }

    document.querySelectorAll(".schedule td[data-time]").forEach(cell => {
        const day = cell.dataset.day;
        const time = cell.dataset.time;
        const name = doctors?.[day]?.[time] || "";
        cell.innerHTML = createDoctorName(name);
    });

    document.querySelectorAll(".schedule td[data-visit]").forEach(cell => {
        const day = cell.dataset.day;
        const visitDoctor = doctors?.[day]?.["訪問"] || "";
        cell.innerHTML = createDoctorName(visitDoctor);
    });

})

.catch(error => {
    console.error(error);
});

</script>


</body>

</html>
