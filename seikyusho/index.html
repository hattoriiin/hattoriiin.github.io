<h1>請求書（表題シート）入力</h1>
<div class="form">
  <div class="row"><label>氏名</label><input type="text" id="inName" placeholder="例：山田　花子"></div>
  <div class="grid2">
    <div class="row"><label>発行日（タップでカレンダー）</label><input type="date" id="inDate1"></div>
    <div class="row"><label>お支払い期限（タップでカレンダー）</label><input type="date" id="inDate2"></div>
  </div>
  <div class="grid4">
    <div class="row"><label>期間・開始月</label><select id="inMs"></select></div>
    <div class="row"><label>期間・終了月</label><select id="inMe"></select></div>
    <div class="row"><label>請求月</label><select id="inMb"></select></div>
    <div class="row"><label>訪問診療の月</label><select id="inMv"></select></div>
  </div>
  <div class="grid2">
    <div class="row"><label>訪問診療　金額（円）</label><input type="number" id="inA1" inputmode="numeric" placeholder="例：6000"></div>
    <div class="row"><label>居宅療養管理指導料　金額（円）</label><input type="number" id="inA2" inputmode="numeric" placeholder="例：2598"></div>
  </div>
  <div class="row">
    <label>その他明細（☆）　0枚でも、数枚でも</label>
    <div id="others"></div>
    <button type="button" id="addOther">＋ その他明細を追加</button>
  </div>
  <div class="row auto">その他の件数：<span id="outCnt">0</span> 件　／　その他合計：<span id="outSum">0</span> 円　／　合計請求額：<span id="outTot">0</span> 円</div>
  <button class="printbtn" id="pdfBtn" type="button">PDFを作る</button>
  <p class="note" id="pdfStatus"></p>
  <p><a id="pdfOpen" href="#" style="display:none;font-size:18px;font-weight:700;">PDFを開く（保存・印刷はここから）</a></p>
  <img id="sheetImg" alt="請求書の画像" style="display:none;width:100%;border:1px solid #ccc;">
  <p class="note" id="imgNote" style="display:none;">上の画像はPDFと同じ内容です。PDFが開けないときは、この画像を長押しして保存しても使えます。</p>
  <button class="printbtn" style="background:#666" onclick="window.print()">印刷する（A5横）</button>
  <p class="note screen">印刷のときは、用紙を「A5・横」にしてください。下のプレビューが、そのまま印刷される面です。<br>PDFにしたいときは、印刷画面でプレビューを2本指で広げて（ピンチアウト）、共有ボタンから「ファイルに保存」を選んでください。シートだけがA5横のPDFになります。</p>

<script>
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ja-JP');
function fillMonths(sel) {
  for (let m = 1; m <= 12; m++) {
    const o = document.createElement('option'); o.value = m; o.textContent = m + '月'; sel.appendChild(o);
  }
}
['inMs','inMe','inMb','inMv'].forEach(id => fillMonths($(id)));

function addOtherRow(nameVal, amtVal) {
  const wrap = document.createElement('div'); wrap.className = 'other-row';
  wrap.innerHTML = '<input type="text" class="oName" placeholder="内容（例：予防接種代金明細）">' +
                   '<input type="number" class="oAmt" inputmode="numeric" placeholder="金額">' +
                   '<button type="button" class="oDel">消す</button>';
  if (nameVal) wrap.querySelector('.oName').value = nameVal;
  if (amtVal) wrap.querySelector('.oAmt').value = amtVal;
  wrap.querySelector('.oDel').onclick = () => { wrap.remove(); update(); };
  wrap.querySelectorAll('input').forEach(i => i.addEventListener('input', update));
  $('others').appendChild(wrap);
}
$('addOther').onclick = () => { addOtherRow(); };

function reiwaParts(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  return { y: d.getFullYear() - 2018, m: d.getMonth() + 1, d: d.getDate() };
}
const STATE = {};
function setFld(id, text, show) {
  const el = $(id); el.textContent = text; el.style.display = show ? 'flex' : 'none';
  STATE[id] = { t: String(text), s: !!show };
}
function update() {
  const p1 = reiwaParts($('inDate1').value), p2 = reiwaParts($('inDate2').value);
  setFld('d1y', p1 ? p1.y : '', !!p1); setFld('d1m', p1 ? p1.m : '', !!p1); setFld('d1d', p1 ? p1.d : '', !!p1);
  setFld('d2y', p2 ? p2.y : '', !!p2); setFld('d2m', p2 ? p2.m : '', !!p2); setFld('d2d', p2 ? p2.d : '', !!p2);
  setFld('nm', $('inName').value, $('inName').value.trim() !== '');
  setFld('ms', $('inMs').value, true);
  const me = $('inMe'); setFld('me', me.value, true);
  $('me').style.fontSize = (me.value >= 10) ? '1.640cqw' : '2.050cqw';
  setFld('mb', $('inMb').value, true);
  setFld('mv', $('inMv').value, true);
  const a1 = parseInt($('inA1').value) || 0, a2 = parseInt($('inA2').value) || 0;
  let cnt = 0, sum = 0;
  document.querySelectorAll('.other-row').forEach(r => {
    const nm = r.querySelector('.oName').value.trim(), am = parseInt(r.querySelector('.oAmt').value);
    if (nm !== '' || !isNaN(am)) { cnt++; if (!isNaN(am)) sum += am; }
  });
  const tot = a1 + a2 + sum;
  $('outCnt').textContent = cnt; $('outSum').textContent = fmt(sum); $('outTot').textContent = fmt(tot);
  setFld('star', cnt, true);
  setFld('a1', fmt(a1), $('inA1').value !== ''); setFld('a2', fmt(a2), $('inA2').value !== '');
  setFld('a3', fmt(sum), true); setFld('a4', fmt(tot), tot > 0 || $('inA1').value !== '' || $('inA2').value !== '');
  setFld('tot', fmt(tot), tot > 0);
}
document.querySelectorAll('input,select').forEach(el => el.addEventListener('input', update));

function buildPdfBlob(jpegBytes) {
  const Wpt = 595.28, Hpt = 419.53;
  const enc = new TextEncoder();
  const parts = []; let len = 0;
  const push = b => { parts.push(b); len += b.length; };
  const pushS = str => push(enc.encode(str));
  const offsets = [];
  pushS('%PDF-1.4' + NL);
  offsets[1] = len; pushS('1 0 obj' + NL + '<< /Type /Catalog /Pages 2 0 R >>' + NL + 'endobj' + NL);
  offsets[2] = len; pushS('2 0 obj' + NL + '<< /Type /Pages /Kids [3 0 R] /Count 1 >>' + NL + 'endobj' + NL);
  offsets[3] = len; pushS('3 0 obj' + NL + '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + Wpt + ' ' + Hpt + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>' + NL + 'endobj' + NL);
  offsets[4] = len; pushS('4 0 obj' + NL + '<< /Type /XObject /Subtype /Image /Width 1756 /Height 1246 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jpegBytes.length + ' >>' + NL + 'stream' + NL);
  push(jpegBytes); pushS(NL + 'endstream' + NL + 'endobj' + NL);
  const content = 'q ' + Wpt + ' 0 0 ' + Hpt + ' 0 0 cm /Im0 Do Q';
  offsets[5] = len; pushS('5 0 obj' + NL + '<< /Length ' + content.length + ' >>' + NL + 'stream' + NL + content + NL + 'endstream' + NL + 'endobj' + NL);
  const xref = len;
  let x = 'xref' + NL + '0 6' + NL + '0000000000 65535 f ' + NL;
  for (let i = 1; i <= 5; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n ' + NL;
  pushS(x + 'trailer' + NL + '<< /Size 6 /Root 1 0 R >>' + NL + 'startxref' + NL + xref + NL + '%%EOF');
  return new Blob(parts, { type: 'application/pdf' });
}
$('pdfBtn').onclick = () => {
  const status = $('pdfStatus');
  try {
    status.textContent = '作成中…';
    const sheet = $('sheet');
    let u = getComputedStyle(sheet).backgroundImage.trim();
    u = u.substring(u.indexOf('(') + 1, u.lastIndexOf(')')).trim();
    if (u.charAt(0) === '"' || u.charAt(0) === "'") u = u.substring(1, u.length - 1);
    if (!u) { status.textContent = '背景画像が見つかりませんでした'; return; }
    const img = new Image();
    img.onerror = () => { status.textContent = '背景画像の読み込みに失敗しました'; };
    img.onload = () => {
      try {
        const K = 1756 / 2926.5;
        const cv = document.createElement('canvas'); cv.width = 1756; cv.height = 1246;
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(img, 0, 0, cv.width, cv.height);
        cx.fillStyle = '#000'; cx.textBaseline = 'middle';
        FIELDS.forEach(f => {
          const id = f[0], x0 = f[1], y0 = f[2], x1 = f[3], y1 = f[4], size = f[5], al = f[6];
          const st = STATE[id]; if (!st || !st.s || st.t === '') return;
          cx.fillStyle = '#fff'; cx.fillRect(x0 * K, y0 * K, (x1 - x0) * K, (y1 - y0) * K);
          cx.fillStyle = '#000';
          let sz = size; if (id === 'me' && st.t.length >= 2) sz = 48;
          cx.font = ((id === 'star') ? '400 ' : '700 ') + (sz * K) + 'px "Hiragino Sans","Noto Sans JP",sans-serif';
          const cy = (y0 + y1) / 2 * K;
          if (al === 'c') { cx.textAlign = 'center'; cx.fillText(st.t, (x0 + x1) / 2 * K, cy + sz * K * 0.04); }
          else if (al === 'l') { cx.textAlign = 'left'; cx.fillText(st.t, (x0 + 9) * K, cy + sz * K * 0.04); }
          else { cx.textAlign = 'right'; cx.fillText(st.t, (x1 - 9) * K, cy + sz * K * 0.04); }
        });
        const simg = $('sheetImg');
        simg.src = cv.toDataURL('image/jpeg', 0.92);
        simg.style.display = 'block'; $('imgNote').style.display = 'block';
        cv.toBlob(b => {
          if (!b) { status.textContent = '画像の作成に失敗しました'; return; }
          b.arrayBuffer().then(buf => {
            try {
              const blob = buildPdfBlob(new Uint8Array(buf));
              const url = URL.createObjectURL(blob);
              const link = $('pdfOpen');
              link.href = url; link.style.display = 'block';
              status.textContent = 'PDFができました。下の「PDFを開く」をタップしてください。';
            } catch (e) { status.textContent = 'PDF化でエラー: ' + e.message; }
          }).catch(e => { status.textContent = '読み込みエラー: ' + e.message; });
        }, 'image/jpeg', 0.92);
      } catch (e) { status.textContent = '作成エラー: ' + e.message; }
    };
    img.src = u;
  } catch (e) { status.textContent = 'エラー: ' + e.message; }
};

// 初期値: 発行日=今日、期限=30日後、月=先月
(function init() {
  const now = new Date();
  const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  $('inDate1').value = iso(now);
  const due = new Date(now); due.setDate(due.getDate() + 30); $('inDate2').value = iso(due);
  const last = new Date(now.getFullYear(), now.getMonth() - 1, 1).getMonth() + 1;
  ['inMs','inMe','inMb','inMv'].forEach(id => $(id).value = last);
  addOtherRow();
  update();
})();
</script>
