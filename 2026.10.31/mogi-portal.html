<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#eef0f4" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0b111b" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="data:," />
<title>模擬診察ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#eef0f4; --card:#ffffff; --tint:#e3e7ee; --ink:#0d1829; --ink2:#4a566a;
  --line:#cfd5df; --accent:#2237d1; --accent-ink:#ffffff; --focus:#0a58ff;
  --body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Yu Gothic UI",Meiryo,system-ui,sans-serif;
  --display:"Zen Kaku Gothic New","BIZ UDPGothic","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0b111b; --card:#141c2a; --tint:#1c2638; --ink:#eef2f8; --ink2:#a3b0c4;
    --line:#2b374c; --accent:#8da0ff; --accent-ink:#0b111b; --focus:#8fb8ff; }
}
*{box-sizing:border-box}
html{font-size:20px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.7;
  line-break:strict;word-break:auto-phrase;text-wrap:pretty}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}

/* ---- 上部バー ---- */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
  height:56px;padding:0 6px 0 4px;background:var(--paper);border-bottom:1px solid var(--line)}
.top a,.top button{display:inline-flex;align-items:center;min-height:48px;padding:0 12px;border:0;background:none;
  text-decoration:none;font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap}
.top .back{gap:4px}
.top .back b{font-size:1.4rem;line-height:1;font-weight:400;margin-top:-2px}
.top .portal{color:var(--ink2);font-weight:400}
.top .back[hidden]{display:block;visibility:hidden}

main:focus,main:focus-visible{outline:none}
main{max-width:640px;margin:0 auto;padding:0 18px 56px;outline:none}
main.has-dock{padding-bottom:128px}

/* ---- ブースの流れ（床の動線図） ---- */
.rail{position:relative;display:grid;grid-template-columns:repeat(5,1fr);margin:0}
.rail .track{position:absolute;left:10%;right:10%;top:9px;border-top:2px dashed var(--ink2);opacity:.7}
.rail .st{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.rail .st i{display:block;width:18px;height:18px;border:2.5px solid var(--ink);background:var(--paper)}
.rail .st span{font-size:.62rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.rail .pt{position:absolute;z-index:1;top:2px;left:10%;width:14px;height:14px;margin-left:-7px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent);
  animation:walk 3.4s cubic-bezier(.6,0,.25,1) .5s forwards}
@keyframes walk{to{left:90%}}
.rail.small .st span{font-size:.58rem}
@media (min-width:480px){ .rail .st span{font-size:.72rem} }
.mini{display:inline-flex;gap:3px}
.mini i{width:9px;height:9px;border:1.5px solid var(--ink2);opacity:.55}
.mini i.on{background:var(--accent);border-color:var(--accent);opacity:1}

/* ---- トップ ---- */
.hero{padding:30px 0 34px}
.event{margin:0 0 6px;font-size:.78rem;color:var(--ink2);line-height:1.6}
.event span{white-space:nowrap}
h1{margin:0 0 14px;font-family:var(--display);font-weight:900;font-size:3.5rem;line-height:1.05;letter-spacing:-.03em}
.lede{margin:0 0 34px;font-size:.95rem;color:var(--ink2)}
h2.sec{margin:0 0 4px;font-size:.85rem;font-weight:700;color:var(--ink2)}
.cases{list-style:none;margin:0 0 34px;padding:0;border-top:2px solid var(--ink)}
.case{display:flex;align-items:center;gap:16px;padding:18px 4px;border-bottom:1px solid var(--line);
  text-decoration:none;color:inherit}
.case:active{background:var(--tint)}
.no{flex:none;display:grid;place-items:center;width:54px;height:54px;background:var(--ink);color:var(--paper);
  font-family:var(--display);font-weight:900;font-size:1.75rem;line-height:1}
.case .tx{flex:1;min-width:0}
.case b{display:block;font-size:1.12rem;line-height:1.4;text-wrap:balance}
.case small{display:block;margin-top:3px;font-size:.82rem;color:var(--ink2);line-height:1.5}
.case .go,.row .go{flex:none;font-size:1.6rem;color:var(--ink2);line-height:1}
.row{display:flex;align-items:center;gap:14px;padding:16px 4px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);
  text-decoration:none;font-weight:700;width:100%;background:none;text-align:left;cursor:pointer;border-left:0;border-right:0}
.row:active{background:var(--tint)}
.row .rt{flex:1}
.row small{display:block;font-weight:400;font-size:.8rem;color:var(--ink2)}
.foot{margin:26px 0 0;font-size:.8rem;color:var(--ink2);line-height:1.7}

/* ---- 症例ページ ---- */
.chead{display:flex;align-items:center;gap:16px;padding:26px 0 18px}
.chead .no{width:64px;height:64px;font-size:2.1rem}
.chead h2{margin:0;font-family:var(--display);font-weight:900;font-size:1.55rem;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.sheet{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--ink);padding:16px 18px;margin:0 0 30px}
.sheet p{margin:0;font-size:1rem}
.sheet .lab{font-size:.78rem;color:var(--ink2);margin-bottom:2px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.role{display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-height:104px;padding:14px 14px 12px;
  background:var(--card);border:1.5px solid var(--line);border-radius:6px;text-align:left;cursor:pointer}
.role:active{border-color:var(--accent);background:var(--tint)}
.role b{display:block;font-size:1.02rem;line-height:1.35;text-wrap:balance}
.role small{display:block;margin-top:2px;font-size:.74rem;color:var(--ink2);line-height:1.4}
.role .mini{align-self:flex-start}
.role.wide{grid-column:1/-1;min-height:0;background:transparent;border-style:dashed;color:var(--ink2)}
.sublinks{margin-top:26px}

/* ---- ステップ ---- */
.who{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 12px;font-size:.85rem;color:var(--ink2)}
.who b{color:var(--ink);font-size:.95rem}
.seg{display:flex;gap:4px;margin:0 0 22px}
.seg i{flex:1;height:6px;background:var(--line)}
.seg i.done{background:var(--ink)}
.seg i.cur{background:var(--accent)}
.when{display:inline-block;padding:2px 14px;border-radius:99px;background:var(--ink);color:var(--paper);font-weight:700;font-size:.85rem}
.cnt{font-size:.85rem;color:var(--ink2)}
h3.stitle{margin:12px 0 18px;font-family:var(--display);font-weight:900;font-size:1.75rem;line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
ul.lines{list-style:none;margin:0;padding:0}
ul.lines li{position:relative;padding:14px 0 14px 24px;border-bottom:1px solid var(--line);font-size:1.12rem;line-height:1.65}
ul.lines li::before{content:"";position:absolute;left:2px;top:1.35em;width:8px;height:8px;background:var(--ink)}
ul.lines li.say{margin:10px 0;padding:16px 18px;border:0;background:var(--card);border-left:5px solid var(--accent);
  font-weight:700;font-size:1.3rem;line-height:1.6}
ul.lines li.say::before{display:none}
.tail h4{margin:26px 0 6px;font-size:.85rem;color:var(--ink2);font-weight:700}
.tail p{margin:0;font-size:1.05rem}
.quote{margin:8px 0 0;padding:16px 18px;background:var(--card);border-left:5px solid var(--accent);font-weight:700;font-size:1.2rem;line-height:1.7}
.big-end{margin:8px 0 6px;font-family:var(--display);font-weight:900;font-size:2rem;line-height:1.35}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{position:relative;padding:16px 0 16px 46px;border-bottom:1px solid var(--line);font-size:1.1rem}
.checklist li::before{content:"";position:absolute;left:2px;top:1.25em;width:22px;height:22px;border:2.5px solid var(--ink);background:var(--card)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.dock .in{display:flex;gap:10px;max-width:640px;margin:0 auto}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:64px;padding:0 18px;border-radius:10px;
  border:2px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:1.05rem;cursor:pointer;
  text-decoration:none;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{flex:1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:1.2rem}
.btn.back{flex:0 0 34%;white-space:nowrap}
.btn.block{width:100%;margin-top:12px}

/* ---- ルール ---- */
.page-title{margin:0;padding:26px 0 18px;font-family:var(--display);font-weight:900;font-size:2rem;line-height:1.2}
.rule{display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:2px solid var(--ink)}
.rule .n{flex:none;width:34px;font-family:var(--display);font-weight:900;font-size:2rem;line-height:1.1;color:var(--accent)}
.rule h3{margin:0 0 6px;font-size:1.25rem;line-height:1.4}
.rule p{margin:6px 0;font-size:1.02rem}
.rule .rail{margin:14px 0 18px}

/* ---- スタッフ用まとめ ---- */
.gate{background:var(--card);border:2px solid var(--ink);padding:20px;margin:10px 0 18px}
.gate h3{margin:0 0 6px;font-size:1.2rem}
.gate p{margin:0}
.sum h3{margin:30px 0 8px;font-size:.9rem;color:var(--ink2)}
.sum p{margin:0;font-size:1.02rem}
.route{list-style:none;margin:0;padding:0}
.route li{position:relative;display:grid;grid-template-columns:5.2em 1fr;gap:2px 12px;padding:10px 0 12px 22px;border-left:2px solid var(--ink);margin-left:6px}
.route li::before{content:"";position:absolute;left:-7px;top:1em;width:12px;height:12px;background:var(--ink)}
.route .k{font-weight:700;font-size:.9rem}
.route .v{font-size:.98rem}
.route .r{grid-column:2;font-weight:700;color:var(--accent);font-size:.98rem}
.rl{list-style:none;margin:0;padding:0}
.rl li{padding:12px 0;border-bottom:1px solid var(--line)}
.rl b{font-size:1rem}
.rl em{font-style:normal;margin-left:8px;padding:0 8px;border:1.5px solid var(--ink);border-radius:99px;font-size:.72rem;font-weight:700}
.rl em.main{background:var(--ink);color:var(--paper)}
.rl span{display:block;font-size:.95rem;color:var(--ink2);margin-top:2px}
.warn{padding:14px 16px;border:2px solid var(--ink);background:var(--card)}


/* ---- 台本モード（全員共通の一本の台本） ---- */
.chips{position:sticky;top:56px;z-index:4;display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:10px 18px;background:var(--paper);
  border-bottom:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
.chips.two .chip{flex:1;min-height:48px;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sc-lead{margin:16px 0 4px;font-size:.82rem;color:var(--ink2)}
.scene{margin:34px 0 8px;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-weight:700;scroll-margin-top:130px}
.scene .tm{padding:1px 10px;border-radius:99px;background:var(--ink);color:var(--paper);font-size:.78rem}
.scene span.pl{font-size:.95rem}
.scene .ow{flex-basis:100%;font-size:.78rem;font-weight:400;color:var(--ink2)}
.ln{position:relative;margin:0;padding:12px 0 12px 14px;border-left:4px solid transparent;scroll-margin-top:130px;scroll-margin-bottom:170px;
  transition:opacity .5s ease}
.ln .who{display:inline-block;font-size:.72rem;font-weight:700;color:var(--ink2);margin-bottom:3px;padding:0 8px;border:1.5px solid currentColor;border-radius:4px;line-height:1.5}
.ln .tx{display:block;font-size:1rem;line-height:1.65;color:var(--ink2)}
.ln.act .tx{font-size:.92rem}
.ln.act .tx::before{content:"〔";} .ln.act .tx::after{content:"〕";}
.ln .vo{display:inline-block;margin-left:8px;padding:0 8px;border:1.5px solid currentColor;border-radius:99px;font-size:.68rem;font-weight:700;vertical-align:middle}
.ln.me{border-left-color:var(--accent)}
.ln.me .who{color:var(--ink);border-color:var(--ink);background:var(--card)}
.ln.me .tx{color:var(--ink);font-weight:700;font-size:1.3rem;line-height:1.6}
.ln.me.act .tx{font-size:1.1rem}
.ln.r1{opacity:.62} .ln.r2{opacity:.42} .ln.r3{opacity:.3}
.ln.me.r1{opacity:.85} .ln.me.r2{opacity:.62} .ln.me.r3{opacity:.5}
.ln.new{animation:rise .45s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.chrono{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px 0 2px;padding:8px 10px;border:1.5px dashed currentColor;border-radius:4px;
  background:var(--card);color:var(--ink2);font-weight:700;font-size:.85rem;line-height:1.4;text-align:center}
.chrono .pen{flex:none;font-size:1.05rem}
.chrono b{font-weight:900}
.m-staff .ln .chrono{color:var(--ink)}
.ln.ghost{opacity:.34;pointer-events:none;border-left-color:transparent;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.15) 85%,transparent 100%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.15) 85%,transparent 100%)}
.ln.ghost.me{opacity:.42}
.scene.ghost{opacity:.3}
span.start{display:block;padding:12px 14px;background:var(--card);border:1.5px solid var(--ink);border-radius:6px;font-weight:400}
.start .st-h{display:block;font-size:.8rem;color:var(--ink2);margin-bottom:8px}
.start .st-h b{color:var(--ink);font-size:.9rem}
.start .st-a{display:block;font-size:.85rem;color:var(--ink2);padding:3px 0;border-bottom:1px solid var(--line)}
.start .st-q{display:block;margin:10px 0 8px;font-size:1.15rem;font-weight:700;line-height:1.5;color:var(--ink)}
.start .st-o{display:flex;flex-direction:column;gap:8px}
.start button{min-height:52px;padding:0 14px;border:2px solid var(--ink);border-radius:8px;background:var(--paper);color:var(--ink);font-size:1.02rem;font-weight:700;cursor:pointer;text-align:left}
.start button:active{background:var(--tint)}
.start .st-res{display:flex;align-items:center;gap:10px;margin:12px 0 8px;font-size:.95rem;font-weight:700;color:var(--ink)}
.start .st-re{min-height:44px;font-size:.85rem;font-weight:400;text-align:center}
.tg{display:inline-block;padding:2px 16px;border-radius:99px;border:2px solid var(--ink);font-size:1.05rem;font-weight:900}
.tg-g{background:#1e7a34;color:#fff;border-color:#1e7a34}
.tg-y{background:#f2c500;color:#1b1500;border-color:#f2c500}
.tg-r{background:#c1272d;color:#fff;border-color:#c1272d}
.tg-k{background:#111;color:#fff;border-color:#888}
.ln.ghost .start{opacity:.9}

.ln.cur{background:var(--tint);border-left-color:var(--accent)}
.ln.past{opacity:.5} .ln.past.me{opacity:.72}
.here{margin-left:8px;padding:0 9px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.68rem;font-weight:700;vertical-align:middle}
.lnk{border:0;background:none;text-decoration:underline;color:var(--ink2);font-size:.82rem;cursor:pointer;padding:6px 2px}
details.old{margin:0 0 4px}
details.old summary{padding:14px 0;font-size:.85rem;color:var(--ink2);cursor:pointer}
.pbar{display:flex;gap:10px;margin:14px 0}
.pbar .btn{min-height:56px}
.paper{background:#fff;color:#000;border:1px solid var(--line);padding:22px 20px;margin-bottom:20px;font-size:.95rem;line-height:1.7}
.p-sub{margin:0;font-size:.8rem;color:#555}
.p-t{margin:2px 0 14px;font-family:var(--display);font-weight:900;font-size:1.5rem;line-height:1.35}
.p-t span{display:block;margin-top:2px;font-size:.95rem;font-weight:700;color:#333}
.p-box{border:1.5px solid #000;padding:10px 14px;margin:0 0 10px}
.p-box b{display:block;margin-bottom:2px}
.p-note{margin:0 0 6px;font-size:.82rem;color:#444}
.p-scene{margin:20px 0 4px;padding-bottom:3px;border-bottom:2px solid #000;font-weight:700;break-after:avoid}
.p-scene .tm{display:inline-block;margin-right:8px;padding:0 9px;border-radius:99px;background:#000;color:#fff;font-size:.8rem}
.p-scene .ow{float:right;font-size:.78rem;font-weight:400;color:#444}
.p-line{margin:0;padding:6px 0 6px 10px;border-left:4px solid transparent;color:#7a7a7a;break-inside:avoid}
.p-line.mine{color:#000;font-weight:700;border-left-color:#000}
.p-who{display:inline-block;margin-right:8px;padding:0 6px;border:1px solid currentColor;border-radius:3px;font-size:.72rem;font-weight:700;line-height:1.5}
.p-vo{margin-left:8px;padding:0 6px;border:1px solid currentColor;border-radius:99px;font-size:.68rem;font-style:normal}
.p-chrono{margin:6px 0 8px 14px;padding:5px 10px;border:1.5px dashed #888;color:#777;font-size:.85rem;text-align:center;break-inside:avoid}
.p-chrono.mine{border-color:#000;color:#000;font-weight:700}
.p-end{margin:22px 0 0;text-align:center;font-weight:700}
@media print{
  @page{size:A4;margin:12mm}
  html{font-size:12pt}
  body{background:#fff}
  .top,.dock,.noprint{display:none!important}
  main,main.has-dock{max-width:none;padding:0}
  .paper{border:0;padding:0;font-size:10pt;line-height:1.45}
  .p-t{margin:0 0 8px;font-size:15pt}
  .p-box{padding:6px 10px;margin:0 0 6px}
  .p-scene{margin:11px 0 2px}
  .p-line{padding:2.5px 0 2.5px 8px}
  .p-chrono{margin:3px 0 4px 12px;padding:3px 8px}
  .p-end{margin:8px 0 0}
  .paper *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.sc-end{margin:30px 0 0;padding:18px;background:var(--card);border-left:5px solid var(--accent);font-weight:700}
.hint{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:640px;margin:0 auto 10px;font-size:.82rem;color:var(--ink2);min-height:1.5em}
.hint b{color:var(--accent)}
.hint>span:last-child{flex:none;white-space:nowrap}
.hint>span:first-child{min-width:0}
.hint button{white-space:nowrap;border:0;background:none;text-decoration:underline;font-size:.82rem;color:var(--ink2);cursor:pointer;padding:6px 0 6px 12px}
.dock.scr .in{margin-top:0}

.fs{position:fixed;left:0;right:0;bottom:0;z-index:8;display:none;max-height:82vh;overflow:auto;background:#f8fafc;color:#1e293b;border-top:4px solid #0056b3;box-shadow:0 -8px 24px rgba(0,0,0,.3);padding:12px 14px calc(16px + env(safe-area-inset-bottom));font-family:"BIZ UDPGothic","Hiragino Sans",sans-serif}
.fs.on{display:block}
.fs .in{max-width:640px;margin:0 auto}
.fs .fh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:1.05rem;color:#0056b3}
.fs .fh button{min-height:44px;padding:0 16px;border:1.5px solid #64748b;border-radius:8px;background:#fff;color:#1e293b;font-size:.95rem;cursor:pointer}
.fs .fc{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px}
.fs .fc h3{margin:0 0 6px;font-size:1.1rem;line-height:1.45;color:#1e293b}
.fs .fc p{margin:0 0 10px;font-size:.9rem}
.fs .hist{margin:0 0 8px;padding:6px 10px;border-radius:8px;background:#eef2f7;font-size:.82rem}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function getCase(n){for(var i=0;i<CASES.length;i++) if(CASES[i].n===n) return CASES[i]; return null;}

document.addEventListener("touchend",function(e){var n=Date.now();if(n-_lt<280){e.preventDefault();}_lt=n;},{passive:false});

function go(path,replace){
  /* 履歴の記録に失敗しても（プレビュー等）画面は必ず切り替える */
  try{ if(replace) history.replaceState({p:path},"","#"+path); else history.pushState({p:path},"","#"+path); }
  catch(e){ try{ if(replace) history.replaceState({p:path},""); else history.pushState({p:path},""); }catch(e2){} }
  route(path);
}
function swap(h){ go(h,true); }
document.addEventListener("click",function(e){
  var a=e.target.closest&&e.target.closest('a[href^="#/"]');
  if(a){ e.preventDefault(); go(a.getAttribute("href").slice(1)); }
});

function rail(big){
  return '<div class="rail'+(big?'':' small')+'" role="img" aria-label="ブースの流れ：'+BOOTHS.join('、')+'"><div class="track"></div>'
    +(big?'<div class="pt"></div>':'')
    +BOOTHS.map(function(b){return '<div class="st"><i></i><span>'+b+'</span></div>';}).join("")+'</div>';
}
function mini(ids){
  if(!ids.length) return "";
  return '<span class="mini" aria-hidden="true">'+BOOTHS.map(function(b,i){return '<i'+(ids.indexOf(i)>-1?' class="on"':'')+'></i>';}).join("")+'</span>';
}
function setTop(to,label){
  backTo=to;
  if(to===null){ backBtn.hidden=true; } else { backBtn.hidden=false; backLbl.textContent=label; }
}
function setDock(html){
  dock.classList.remove("scr");
  if(html){ dockin.innerHTML=html; dock.hidden=false; app.classList.add("has-dock"); }
  else { dock.hidden=true; dockin.innerHTML=""; app.classList.remove("has-dock"); }
}
backBtn.addEventListener("click",function(){ if(backTo!==null) go(backTo); });

/* ---- 役割ステップ ---- */
function buildSteps(c,roleId){
  var steps=c.roles[roleId].steps.slice();
  if(roleId==="patient") steps.push(["終了","待機",["__PATIENT_END__"]]);
  else steps.push(["4〜5分","終了確認・申し送り",["__FINAL__"]]);
  return steps;
}
function finalHtml(c){
  return '<div class="tail"><h4>終了条件</h4><p>'+esc(c.end)+'</p>'
   +'<h4>申し送りの一文例（読み上げ）</h4><div class="quote">「'+esc(c.handover)+'」</div>'
   +(c.finalSimple?'':'<h4>クロノロ（要点）</h4><p>'+esc(c.chrono)+'</p>')+'</div>';
}
function linesHtml(c,lines){
  if(lines.length===1 && lines[0]==="__CHECKS__"){
    return '<ul class="checklist">'+c.checks.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul>';
  }
  var tail="", body=[];
  lines.forEach(function(x){
    if(x==="__FINAL__") tail=finalHtml(c);
    else if(x==="__PATIENT_END__") tail='<div class="tail"><p class="big-end">おつかれさまでした。</p><p>スタッフの指示があるまで、その場で待ってください。</p></div>';
    else body.push(x);
  });
  var h="";
  if(body.length){
    h='<ul class="lines">'+body.map(function(x){
      return '<li'+(x.charAt(0)==="「"?' class="say"':'')+'>'+esc(x)+'</li>';
    }).join("")+'</ul>';
  }
  return h+tail;
}
function stepsPage(c,roleId,idx){
  var role=getRole(roleId);
  if(!role||!c.roles[roleId]){ swap("/c/"+c.n); return; }
  var steps=buildSteps(c,roleId), total=steps.length;
  if(!(idx>=0)) idx=0; if(idx>total-1) idx=total-1;
  var st=steps[idx];
  setTop("/c/"+c.n,"症例"+c.n);
  var seg=""; for(var i=0;i<total;i++) seg+='<i class="'+(i<idx?'done':i===idx?'cur':'')+'"></i>';
  var h='<div class="who"><span><b>'+esc(role.label)+'</b></span>'+mini(ROLE_BOOTH[roleId])+'</div>'
   +'<div class="seg" role="progressbar" aria-valuemin="1" aria-valuemax="'+total+'" aria-valuenow="'+(idx+1)+'">'+seg+'</div>'
   +'<div style="display:flex;align-items:center;justify-content:space-between"><span class="when">'+esc(st[0])+'</span><span class="cnt">'+(idx+1)+' / '+total+'</span></div>'
   +'<h3 class="stitle">'+esc(st[1])+'</h3>'+linesHtml(c,st[2]);
  app.innerHTML=h;
  var base="/c/"+c.n+"/r/"+roleId+"/";
  var d="";
  if(idx<total-1){
    d=(idx>0?'<button class="btn back" type="button" id="d-back">‹ もどる</button>':'<button class="btn back" type="button" id="d-role">担当を変える</button>')
     +'<button class="btn primary" type="button" id="d-next">次へ ›</button>';
  }else{
    d='<button class="btn back" type="button" id="d-back">‹ もどる</button><a class="btn primary" href="#/">症例一覧へ</a>';
  }
  setDock(d);
  var nx=document.getElementById("d-next"); if(nx) nx.addEventListener("click",function(){ swap(base+(idx+1)); });
  var bk=document.getElementById("d-back"); if(bk) bk.addEventListener("click",function(){ swap(base+(idx-1)); });
  var rl=document.getElementById("d-role"); if(rl) rl.addEventListener("click",function(){ go("/c/"+c.n); });
}

/* ---- スタッフ用まとめ ---- */
function summary(c,open){
  setTop("/c/"+c.n,"症例"+c.n); setDock(null);
  var h='<div class="chead"><span class="kcno" aria-hidden="true">'+KC[c.n-1]+'</span><h2>'+esc(c.short)+'</h2></div>';
  if(!open){
    h+='<div class="gate"><h3>開く前に確認</h3><p>判定の答えが含まれます。司会者用です。</p></div>'
     +'<button class="btn primary block" type="button" id="sum-open" style="width:100%">開く</button>'
     +'<a class="btn block" href="#/c/'+c.n+'">戻る</a>';
    app.innerHTML=h;
    document.getElementById("sum-open").addEventListener("click",function(){ swap("/c/"+c.n+"/sum/open"); });
    return;
  }
  h+='<div class="sum"><h3>ねらい</h3><p>'+esc(c.aim)+'</p>'
   +'<h3>患者設定</h3><p>'+esc(c.setting)+'</p>'
   +(c.items?'<h3>必要物</h3><p>'+esc(c.items)+'</p>':'')
   +'<h3>STARTの正解ルート</h3><ol class="route">'
   +c.start.map(function(r){return '<li><span class="k">'+esc(r[0])+'</span><span class="v">'+esc(r[1])+'</span><span class="r">'+esc(r[2])+'</span></li>';}).join("")
   +'</ol><h3>役割別の動き</h3><ul class="rl">'
   +c.roleTable.map(function(r){return '<li><b>'+esc(r[0])+'</b>'+(r[1]!=="―"?'<em'+(r[1]==="主"?' class="main"':'')+'>'+esc(r[1])+'</em>':'')+'<span>'+esc(r[2])+'</span></li>';}).join("")
   +'</ul><h3>特に確認すること</h3><div class="warn">'+esc(c.special)+'</div>'
   +'<h3>クロノロ（要点）</h3><p>'+esc(c.chrono)+'</p>'
   +'<h3>終了条件</h3><p>'+esc(c.end)+'</p>'
   +'<h3>申し送りの一文例</h3><div class="quote">「'+esc(c.handover)+'」</div>'
   +'<h3>観察チェック（3項目）</h3><ul class="checklist">'+c.checks.map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>'
   +'<a class="btn block" href="#/c/'+c.n+'">症例に戻る</a>';
  app.innerHTML=h;
}

/* ---- START法（一次トリアージ）の判断カード ---- */
var START={
  q1:{q:"歩けますか？",o:[["歩ける","tag:緑"],["歩けない","q2"]]},
  q2:{q:"呼吸はありますか？",o:[["ある","q3"],["ない","q2b"]]},
  q2b:{q:"気道確保で、呼吸は出ましたか？",o:[["出た","tag:赤"],["出ない","tag:黒"]]},
  q3:{q:"呼吸数は？",o:[["10〜29回/分","q4"],["30回以上／10回未満","tag:赤"]]},
  q4:{q:"橈骨動脈を触れますか？",o:[["触れる","q5"],["触れない","tag:赤"]]},
  q5:{q:"簡単な指示に従えますか？",o:[["従える","tag:黄"],["従えない","tag:赤"]]}
};
var TAGCLS={"緑":"g","黄":"y","赤":"r","黒":"k"};
function startNew(){ return {node:"q1",trail:[],tag:""}; }
function startHtml(S){
  var h='<span class="start"><span class="st-h"><b>START法</b>　自分で判断します</span>';
  S.trail.forEach(function(x){ h+='<span class="st-a">'+esc(x[0])+'　→　<b>'+esc(x[1])+'</b></span>'; });
  if(S.tag){
    h+='<span class="st-res">あなたの判定　<span class="tg tg-'+TAGCLS[S.tag]+'">'+esc(S.tag)+'タグ</span></span>'
     +'<button class="st-re" type="button" data-st="reset">やり直す</button>';
  }else{
    var nd=START[S.node];
    h+='<span class="st-q">'+esc(nd.q)+'</span><span class="st-o">'
     +nd.o.map(function(o,i){return '<button type="button" data-st="'+i+'">'+esc(o[0])+'</button>';}).join("")+'</span>';
  }
  return h+'</span>';
}

function scriptLines(c){
  var out=[];
  SCRIPTS[c.n].forEach(function(s,si){ s.lines.forEach(function(l,li){
    out.push({who:l[0],kind:l[1],text:l[2].replace("__HANDOVER__","「"+c.handover+"」"),chrono:l[3]||"",scene:li===0?s:null,sc:s});
  }); });
  return out;
}

function sceneOwners(s){
  var seen=[]; s.lines.forEach(function(l){ if(l[0]!=="patient"&&seen.indexOf(l[0])<0) seen.push(l[0]); });

function sceneHead(s,ghost){

}
function kindOf(l){ return (l.kind==="start"&&SC.mode!=="staff")?"act":l.kind; }
function lineBlock(l,cls,id,ghost,here){
  var s=l.scene?sceneHead(l.scene,ghost):"";
  var body=(l.kind==="start"&&SC.mode==="staff")?'<span class="tx">'+startHtml(SC.start)+'</span>'
    :'<span class="tx">'+esc(l.kind==="start"?"STARTで判断する。":((SC.mode==="patient"&&/^申し送りを読み上げる。/.test(l.text))?"申し送りを読み上げる。":l.text))+'</span>';
  var chr=l.chrono; if(l.kind==="start"&&SC.start.tag) chr=l.chrono+"："+SC.start.tag;
  s+='<p class="'+cls+'"'+(id?' id="'+id+'"':' aria-hidden="true"')+'><span class="who">'+esc(WHO[l.who])+'</span>'+(l.kind==="loud"?'<span class="vo">声に出す</span>':'')+(here?'<span class="here">いまここ</span>':'')+body

function printPage(c,mode){
  if(!SCRIPTS[c.n]){ swap("/c/"+c.n); return; }
  mode=(mode==="patient")?"patient":"staff";
  setTop("/c/"+c.n,"症例"+c.n); setDock(null);
  var title=mode==="patient"?"患者役の台本":"スタッフ用カルテ";
  var h='<div class="noprint pbar"><a class="btn primary" id="do-pdf" target="_blank" rel="noopener" href="pdf/case'+c.n+'_'+mode+'.pdf">PDFを開く</a><a class="btn" href="#/c/'+c.n+'/print/'+(mode==="patient"?"staff":"patient")+'">'+(mode==="patient"?"スタッフ用カルテを見る":"患者役の台本を見る")+'</a></div>'
   +'<article class="paper m-'+mode+'"><p class="p-sub">令和8年度 瑞穂区医師会 救護所訓練　模擬診察</p><h1 class="p-t">症例'+c.n+'　'+esc(c.short)+'<span>'+title+'</span></h1>';
  if(mode==="patient"){
    h+='<div class="p-box"><b>あなたは この人です</b>'+c.roles.patient.steps[0][2].map(function(x){return '<div>'+esc(x)+'</div>';}).join("")+'</div>'
     +'<p class="p-note">黒・太字があなたのセリフです。グレーはスタッフのセリフとト書き（相手の合図）です。判定（タグの色）は言いません。</p>';
  }else{
    h+='<div class="p-box"><b>患者</b><div>'+esc(c.patientSummary)+'</div><div>受付時刻　＿＿時＿＿分</div></div>'
     +'<p class="p-note">黒字がスタッフ側の指示とセリフです。グレーは患者のセリフ（タイミングの参考）です。判定欄は空欄です。当日、その場で判断して手書きします。</p>';
  }
  SCRIPTS[c.n].forEach(function(s){
    h+='<div class="p-scene"><span class="tm">'+esc(s.t)+'</span>'+esc(s.place)+'<span class="ow">担当：'+esc(sceneOwners(s))+'</span></div>';
    s.lines.forEach(function(l){
      var mine=(mode==="patient")?l[0]==="patient":l[0]!=="patient";

      var inner;
      if(l[1]==="start"){
        inner=(mode==="staff")
          ? '<span class="p-tx">STARTで判断する（歩行 → 呼吸 → 呼吸数 → 橈骨動脈 → 指示に従えるか）<br><b>タグ判定（当日、手書きで1つを○で囲む）：　緑　・　黄　・　赤　・　黒</b></span>'
          : '<span class="p-tx">〔STARTで判断する。〕</span>';
      }else inner='<span class="p-tx">'+(l[1]==="act"?'〔'+esc(txt)+'〕':esc(txt))+'</span>';
      h+='<p class="p-line'+(mine?' mine':'')+'"><span class="p-who">'+esc(WHO[l[0]])+'</span>'+(l[1]==="loud"?'<i class="p-vo">声に出す</i>':'')+inner+'</p>';
      if(l[3]) h+='<p class="p-chrono'+(mode==="staff"?' mine':'')+'">✎✎　クロノロ　時刻　＿＿時＿＿分　「'+esc(l[3])+(l[3]==="タグの色"?'：＿＿':'')+'」　✎✎</p>'
        +((l[3]==="タグの色"&&mode==="staff")?'<p class="p-line mine"><span class="p-tx">タグ判定（当日、手書きで1つを○で囲む）：　緑　・　黄　・　赤　・　黒</span></p>':'');
    });
  });
  h+='<p class="p-end">―　症例'+c.n+'　終了　―</p></article>';
  app.innerHTML=h;

}


/* ---- ルーティング（戻るボタンが効く） ---- */
function route(path){
  cur=path||"/";
  var p=cur.replace(/^\//,"").split("/").filter(Boolean);
  window.scrollTo(0,0);
  var fl=document.getElementById("flo"); if(fl) fl.classList.remove("on");
  var fz=document.getElementById("fs"); if(fz) fz.classList.remove("on");
  if(p[0]==="rules") rules();
  else if(p[0]==="c"){
    var c=getCase(parseInt(p[1],10));
    if(!c){ home(); }
    else if(p[2]==="r") stepsPage(c,p[3],parseInt(p[4],10));
    else if(p[2]==="sum") summary(c,p[3]==="open");
    else if(p[2]==="script") scriptPage(c,p[3]);
    else if(p[2]==="print") printPage(c,p[3]);
    else casePage(c);
  } else home();
  try{ app.focus({preventScroll:true}); }catch(e){}
}
window.addEventListener("popstate",function(e){ route(e.state&&e.state.p?e.state.p:readHash()); });
window.addEventListener("hashchange",function(){ var h=readHash(); if(h!==cur) route(h); });
route(readHash());
