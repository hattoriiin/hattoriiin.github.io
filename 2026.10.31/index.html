<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026.10.31 瑞穂区救護所訓練 ポータル</title>
    <style>
        :root {
            --primary: #0056b3;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-sub: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 16px;
            background-color: var(--bg);
            color: var(--text);
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 20px 0 10px;
        }
        .header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin: 0 0 8px 0;
        }
        .header p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin: 0;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .card h2 {
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 12px;
            color: var(--primary);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
        }
        .btn-primary {
            display: block;
            background-color: var(--primary);
            color: #ffffff;
            text-align: center;
            padding: 16px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
            box-shadow: 0 4px 6px rgba(0, 86, 179, 0.2);
        }
        .btn-secondary {
            display: block;
            background-color: #64748b;
            color: #ffffff;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        ul {
            padding-left: 20px;
            margin: 0;
        }
        li {
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .badge {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚨 瑞穂区救護所訓練 ポータル</h1>
        <p>実施想定：2026年10月31日（午前）</p>
    </div>

    <!-- メインナビボタン -->
    <div class="card">
        <h2>📱 現場用トリアージナビ</h2>
        <p style="font-size: 0.85rem; margin-bottom: 14px;">スマホでタップしながらSTART法による一次判定を進められます。</p>
        <a href="https://docs.google.com/document/d/1_bHbLAvpel7vHb-a2WViVnU-zhsKqegZICge8a1JnMc/edit" class="btn-primary" target="_blank">
            👉 一次トリアージ判定ナビを開く
        </a>
    </div>

    <!-- 訓練概要 -->
    <div class="card">
        <h2>📋 訓練概要・連携ガイド</h2>
        <span class="badge">想定シナリオ</span>
        <p style="font-size: 0.85rem; margin-top: 0;">南海トラフ地震発生翌日・午前（瑞穂区内救護所開設）</p>

        <span class="badge">3師会の役割</span>
        <ul>
            <li><strong>医師会：</strong> 全体調整・一次トリアージ・赤（重症）処置</li>
            <li><strong>歯科医師会：</strong> 顔面・口腔外傷処置、口腔ケアニーズ集約</li>
            <li><strong>薬剤師会：</strong> 慢性疾患薬の代替薬管理・服薬指導</li>
        </ul>
    </div>

    <!-- ホームページへ戻る -->
    <div class="card">
        <h2>🔗 リンク</h2>
        <a href="../index.html" class="btn-secondary">🏠 服部医院 トップページへ戻る</a>
    </div>
</div>

</body>
</html>
