<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訪問診療｜服部医院</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #222;
      background-color: #fff;
      line-height: 1.8;
      overflow-x: hidden;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 16px 0 16px;
    }

    .nav-back a {
      color: #31556e;
      text-decoration: none;
      font-size: 14px;
      margin-right: 15px;
    }

    h1 {
      color: #20384d;
      font-size: 24px;
      border-bottom: 3px solid #31556e;
      padding-bottom: 8px;
    }

    .content-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .content-box h2 {
      color: #31556e;
      font-size: 18px;
      margin-top: 0;
    }

    /* === 傾きで動く立体アニメーションエリア === */
    .parallax-wrapper {
      position: relative;
      width: 100%;
      height: 300px;
      margin-top: 30px;
      overflow: hidden;
      background: linear-gradient(to bottom, rgba(238,245,252,0), rgba(238,245,252,0.8));
    }

    .parallax-layer {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background-position: center bottom;
      background-repeat: no-repeat;
      background-size: contain;
      will-change: transform;
      transition: transform 0.1s ease-out;
    }

    /* アップロードいただいた画像ファイル名を反映 */
    .layer-clouds { background-image: url('cloud.move.PNG'); z-index: 1; }
    .layer-street { background-image: url('Lineart.street.PNG'); z-index: 2; }
    .layer-bird   { background-image: url('images/colorfulbird.PNG'); z-index: 3; }

    /* iPhone用：傾きセンサー許可ボタン */
    .sensor-btn {
      position: absolute;
      bottom: 10px;
      right: 10px;
      z-index: 10;
      padding: 6px 12px;
      background: rgba(49, 85, 110, 0.85);
      color: #fff;
      border: none;
      border-radius: 15px;
      font-size: 11px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="container">
    <nav class="nav-back">
      <a href="index.html">← 服部医院トップへ戻る</a>
      <a href="index.html#schedule">← 診療時間へ戻る</a>
    </nav>

    <h1>訪問診療</h1>
    <p>服部医院では、お一人で通院が困難な患者様のご自宅へ医師が定期的に訪問し、安心の医療をお届けします。</p>

    <section class="content-box">
      <h2>訪問診療の対象となる方</h2>
      <ul>
        <li>お一人での通院が困難な方（高齢・身体障害など）</li>
        <li>ご自宅での継続的な医療処置や経過観察が必要な方</li>
        <li>住み慣れたご自宅での療養をご希望の方</li>
      </ul>
    </section>
  </div>

  <!-- 立体パララックス・ビジュアルエリア -->
  <div class="parallax-wrapper" id="parallaxArea">
    <div class="parallax-layer layer-clouds" id="lClouds"></div>
    <div class="parallax-layer layer-street" id="lStreet"></div>
    <div class="parallax-layer layer-bird"   id="lBird"></div>
    <button class="sensor-btn" id="sensorBtn">3D効果を有効化</button>
  </div>

  <script>
    const lClouds = document.getElementById('lClouds');
    const lStreet = document.getElementById('lStreet');
    const lBird   = document.getElementById('lBird');
    const btn     = document.getElementById('sensorBtn');

    // 移動スピードの調整（手前ほど大きく動く）
    const S_CLOUDS = 8;   // 雲（奥）
    const S_STREET = 20;  // 街並み（中）
    const S_BIRD   = 40;  // 鳥（手前）

    function applyMove(x, y) {
      lClouds.style.transform = `translate3d(${x * S_CLOUDS}px, ${y * S_CLOUDS}px, 0)`;
      lStreet.style.transform = `translate3d(${x * S_STREET}px, ${y * S_STREET}px, 0)`;
      lBird.style.transform   = `translate3d(${x * S_BIRD}px, ${y * S_BIRD}px, 0)`;
    }

    // スマホの傾き検知
    function handleMotion(event) {
      const x = Math.min(Math.max((event.gamma || 0) / 30, -1), 1);
      const y = Math.min(Math.max(((event.beta || 0) - 45) / 30, -1), 1);
      applyMove(x, y);
    }

    // iOS 13+ Safariのセンサー許可対応
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      btn.style.display = 'block';
      btn.addEventListener('click', () => {
        DeviceOrientationEvent.requestPermission().then(res => {
          if (res === 'granted') {
            window.addEventListener('deviceorientation', handleMotion);
            btn.style.display = 'none';
          }
        });
      });
    } else if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', handleMotion);
    }
  </script>

</body>
</html>
