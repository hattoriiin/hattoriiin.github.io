<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お知らせ｜服部医院</title>

<style>

body{
    margin:0;
    font-family:
        "Noto Sans JP",
        sans-serif;

    line-height:1.8;
    color:#222;
    background:#fff;

    opacity:0;
    animation:newsFadeIn .7s ease-out forwards;
}

@keyframes newsFadeIn{

    from{
        opacity:0;
        transform:translateY(6px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

header{

    padding:1.5rem 1rem;

    text-align:center;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #20384d 0%,
            #31556e 35%,
            #4d7d98 70%,
            #78b8c4 100%
        );

}

header h1{

    margin:0;

    font-size:1.5rem;
    font-weight:400;

    letter-spacing:.15em;

}

main{

    max-width:900px;
    margin:auto;
    padding:1.5rem;

}

.news-item{
    position:relative;

    margin:1rem 0;
    padding:1.1rem 1.2rem;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,240,.72),
            rgba(255,250,205,.42)
        );

    border:1px solid
        rgba(210,200,120,.18);

    border-radius:14px;

    box-shadow:
        0 4px 14px
        rgba(80,90,70,.07);

}

.news-date{

    display:block;

    margin-bottom:.25rem;

    font-size:.8rem;

    color:#8b7a2a;

}

.news-title{

    margin:0;

    font-size:1.05rem;
    font-weight:500;

}

.news-body{

    margin:.5rem 0 0;

    font-size:.92rem;

}

.back{

    margin-top:2rem;

    text-align:center;

}

.back a{

    color:#4d7d98;

    text-decoration:none;

}

</style>

</head>

<body>

<header>

<h1>お知らせ</h1>

</header>

<main>

<div id="news-container"></div>

<div class="back">

<a href="index.html#news">
← 服部医院トップページのお知らせへ戻る
</a>

</div>

</main>

<script>

fetch('news.json')
    .then(response => response.json())
    .then(news => {

        const container =
            document.getElementById('news-container');

        if (!container) return;

        news.forEach(item => {

            const article =
                document.createElement('div');

            article.className = 'news-item';

            article.innerHTML = `
                <span class="news-date">
                    ${item.date}
                </span>

                <h2 class="news-title">
                    ${item.title}
                </h2>

                <p class="news-body">
                    ${item.body || '詳細は準備中です。'}
                </p>
            `;

            container.appendChild(article);

        });

    });

</script>

</body>

</html>
