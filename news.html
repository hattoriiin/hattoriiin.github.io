<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お知らせ｜服部医院</title>

<style>

body{
    margin:0;
    font-family:
        "Noto Sans JP",
        sans-serif;

    line-height:1.8;
    color:#222;
    background:#fff;

    opacity:0;
    animation:newsFadeIn .7s ease-out forwards;
}

@keyframes newsFadeIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

header{

    padding:1.45rem 0;

    background:#fff;

}

.news-header{

    width:calc(100% - 4rem);

    margin:auto;

    padding:1.45rem 1rem;

    box-sizing:border-box;

    text-align:center;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #20384d 0%,
            #31556e 35%,
            #4d7d98 70%,
            #78b8c4 100%
        );

    border-radius:0;

}

header h1{

    margin:0rem;

    font-size:1.4rem;

    font-weight:400;

    letter-spacing:.20em;

    text-align:center;

}
main{
    max-width:900px;
    margin:auto;
    padding:1.5rem;
    padding-bottom:6rem;
}

.news-item{

    position:relative;

    margin:3rem 2rem;

    padding:1.1rem 1.2rem;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,245,.62),
            rgba(255,252,220,.28)
        );

    border:1px solid
        rgba(210,200,120,.14);

    border-radius:14px;

    box-shadow:
        0 6px 18px
        rgba(80,90,70,.06);

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}

.news-item::before{

    content:"";

    position:absolute;

    inset:-10px;

    border:2px solid transparent;

    border-image:
        linear-gradient(
            135deg,
            #20384d 0%,
            #31556e 35%,
            #4d7d98 70%,
            #78b8c4 100%
        ) 1;

    pointer-events:none;
}

.news-item:hover{

    transform:translateY(-2px);

    box-shadow:
        0 9px 22px
        rgba(80,90,70,.08);
}

.news-item:active{

    transform:translateY(0);

    box-shadow:
        0 4px 12px
        rgba(80,90,70,.05);
}

.news-date{

    display:block;

    margin-bottom:.35rem;

    font-size:.75rem;

    color:#8a875f;

    letter-spacing:.06em;

}
.news-title{

    margin:0;

    font-size:1.15rem;

    font-weight:500;

    color:#31556e;

    letter-spacing:.04em;

}

.news-body{

    margin:.5rem 0 0;

    font-size:.92rem;

}

.back{
    position:fixed;

    left:16px;
    right:16px;
    bottom:16px;

    z-index:1000;

    text-align:center;
}

.back a{

    display:inline-block;

    padding:.45rem 1.2rem;

    color:#4d7d98;

    text-decoration:none;

    border:1px solid
        rgba(77,125,152,.18);

    border-radius:20px;

    background:
        rgba(255,255,255,.55);

    transition:
        background .3s ease,
        transform .3s ease;
}

.back a:hover{

    background:
        rgba(245,250,250,.8);

    transform:translateY(-1px);
}

/* ---------- お知らせの鳥 ---------- */

.news-bird-space{
    position:relative;
    width:calc(100% - 7rem);
    max-width:836px;
    height:70px;
    margin:0 auto;
    overflow:hidden;
    background:#fff;
}


/* ---------- 鳥本体 ---------- */

.bird{
    --bird-size:80px;

    position:absolute;
    top:10px;

    left:calc(100% + var(--bird-size));

    width:var(--bird-size);

    z-index:4;
    pointer-events:none;
    opacity:0;
}


/* ---------- 共通の飛行 ---------- */

.bird1,
.bird2{
    animation:
        newsBirdMove 25s linear infinite;
}

@keyframes newsBirdMove{

    0%{
        left:calc(100% + var(--bird-size));
    }

    100%{
        left:calc(-1 * var(--bird-size));
    }

}


/* ---------- 1羽目 ---------- */

.bird1{
    animation:
        newsBirdMove 25s linear infinite,
        fadebird1 25s linear infinite;
}

@keyframes fadebird1{

    0%{
        opacity:0;
    }

    /* 右端から入って少し進んでから出現 */
    24%{
        opacity:0;
    }

    29%{
        opacity:.10;
    }

    34%{
        opacity:.22;
    }

    39%{
        opacity:.32;
    }

    /* 少しだけ最大表示を維持 */
    45%{
        opacity:.32;
    }

    /* 左端に近づいてから消え始める */
    51%{
        opacity:.26;
    }

    56%{
        opacity:.16;
    }

    61%{
        opacity:.06;
    }

    66%{
        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* ---------- 2羽目 ---------- */

.bird2{
    animation:
        newsBirdMove 25s linear infinite,
        fadebird2 25s linear infinite;
}

@keyframes fadebird2{

    0%{
        opacity:0;
    }

    49%{
        opacity:0;
    }

    54%{
        opacity:.06;
    }

    59%{
        opacity:.16;
    }

    64%{
        opacity:.28;
    }

    69%{
        opacity:.32;
    }

    75%{
        opacity:.32;
    }

    81%{
        opacity:.24;
    }

    86%{
        opacity:.14;
    }

    91%{
        opacity:.05;
    }

    96%{
        opacity:0;
    }

    100%{
        opacity:0;
    }
}


/* ---------- スマートフォン ---------- */

@media (max-width:600px){

    .news-bird-space{
        width:calc(100% - 7rem);
        height:48px;
    }

    .bird{
        --bird-size:52px;
        top:8px;
    }

}
</style>

</head>

<body>

<header>

    <div class="news-header">

        <h1>お知らせ</h1>

    </div>

</header>

<div class="news-bird-space">

    <img
        src="images/colorfulbird.PNG"
        class="bird bird1"
        alt=""
    >

    <img
        src="images/colorfulbirdWhite.png.PNG"
        class="bird bird2"
        alt=""
    >

</div>
    
<main>
    
<div id="news-container"></div>

</main>

<div class="back">

<a href="index.html#news">
← 服部医院トップページのお知らせへ戻る
</a>

</div>

<script>

fetch('news.json')
    .then(response => response.json())
    .then(news => {

        const container =
            document.getElementById('news-container');

        if (!container) return;

        news.forEach(item => {

 const frame =
    document.createElement('div');

frame.className = 'news-frame';

const article =
    document.createElement('div');

article.className = 'news-item';

article.innerHTML = `
    <span class="news-date">
        ${item.date}
    </span>

    <h2 class="news-title">
        ${item.title}
    </h2>

    <p class="news-body">
        ${item.body || '詳細は準備中です。'}
    </p>
`;

frame.appendChild(article);

container.appendChild(frame);

        });

    });
    
</script>

</body>

</html>
