<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap');
* { box-sizing: border-box; }
body { font-family: "Noto Sans JP", sans-serif; background: #eef3f3; color: #22303a; margin: 0; padding: 16px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
h1.app-title { font-family: "M PLUS Rounded 1c", sans-serif; font-size: 20px; font-weight: 500; color: #20384d; letter-spacing: .1em; margin: 4px 0 12px 0; }
.card { background: #fff; border: 1px solid rgba(110,170,160,.25); border-radius: 14px; padding: 18px; max-width: 860px; margin: 0 auto 14px auto; box-shadow: 0 2px 10px rgba(32,56,77,.06); }
label { font-size: 13px; font-weight: 700; color: #31556e; display: block; margin: 12px 0 4px 0; }
input[type="text"], input[type="date"], input[type="time"], input[type="password"], select, textarea { font-size: 16px; padding: 10px; border: 1px solid #b9cdd6; border-radius: 8px; width: 100%; background-color: #e9f5f9; color: #22303a; }
textarea { line-height: 1.7; resize: vertical; }
.btn { display: inline-block; background: #31556e; color: #fff; border: none; font-size: 16px; font-weight: 700; padding: 12px 22px; border-radius: 12px; cursor: pointer; margin: 6px 6px 6px 0; }
.btn.sub { background: #eef4f6; color: #31556e; border: 1px solid #b9cdd6; }
.menu-btn { display: block; width: 100%; text-align: left; background: linear-gradient(135deg, rgba(245,250,250,.95), rgba(235,247,244,.92)); border: 1px solid rgba(110,170,160,.25); border-left: 6px solid #78b8c4; border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 700; color: #20384d; margin: 0 0 10px 0; cursor: pointer; }
.note { font-size: 13px; color: #5b7a8c; line-height: 1.7; }
.err { color: #b03a3a; font-size: 14px; min-height: 1.4em; }
.f-group { font-family: "M PLUS Rounded 1c", sans-serif; font-size: 15px; font-weight: 700; color: #20384d; border-left: 6px solid #78b8c4; padding-left: 10px; margin: 16px 0 2px 0; }
.f-group:first-child { margin-top: 0; }
.f-row { display: flex; gap: 10px; flex-wrap: wrap; }
.f-row > div { flex: 1; min-width: 130px; }
.check-line { display: block; font-size: 15.5px; margin: 10px 0; }
.check-line input { width: 18px; height: 18px; vertical-align: -3px; margin-right: 8px; }
/* ===== 紙の様式（印刷イメージ） ===== */
.sheet { background: #fff; border: 2.5px solid #222; padding: 26px 28px; max-width: 860px; margin: 0 auto; color: #111; }
.sheet h2.form-title { text-align: center; font-size: 30px; letter-spacing: .45em; margin: 4px 0 2px 0; font-weight: 500; text-indent: .45em; }
.sheet .form-sub { text-align: right; font-size: 12.5px; margin: 0 0 8px 0; }
.form-grid { display: flex; gap: 14px; }
.form-main { flex: 1; }
.form-stamps { width: 178px; display: flex; flex-direction: column; gap: 12px; }
.sec { display: flex; align-items: stretch; gap: 8px; margin-bottom: 10px; }
.sec-no { font-size: 15px; padding-top: 10px; width: 18px; text-align: center; }
.sec-box { flex: 1; border: 1.8px solid #222; padding: 10px 12px; font-size: 15.5px; min-height: 46px; }
.period-lab { width: 52px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
table.stamp-t { border-collapse: collapse; width: 100%; }
table.stamp-t th, table.stamp-t td { border: 1.6px solid #222; padding: 5px 6px; font-size: 13.5px; text-align: center; font-weight: 500; height: 34px; }
.stamp-circle { display: block; width: 52px; height: 52px; border: 1.6px solid #222; border-radius: 50%; margin: 4px auto; }
.iv { display: flex; gap: 18px; }
.iv-left { width: 33%; font-size: 15.5px; }
.iv-left .r { display: block; margin: 9px 0; }
.iv-right { flex: 1; }
.lined-wrap { position: relative; }
.lined-wrap .lines i { display: block; height: 28px; border-bottom: 1px solid #8a8a8a; }
.lined-text { position: absolute; top: 0; left: 0; right: 0; line-height: 28px; font-size: 15.5px; white-space: pre-wrap; padding: 0 2px; }
@media screen {
  .sheet { width: 880px; margin: 0; transform-origin: top left; }
  .sheet.a5l { width: 920px; }
}

.lrow { display: flex; gap: 10px; margin-bottom: 8px; }
.lmain { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.lmain .sec-box { margin-bottom: 0; }
.lrow .stamp-t { width: 178px; flex: none; align-self: flex-start; }
.form-title.ls { font-size: 30px; letter-spacing: .22em; }
.sec-box.tall { min-height: 62px; }
.lrow .stamp-t { height: 100%; }
.sec-box.ivbox { gap: 10px; padding: 12px 16px; }
.sec-box.ivbox .sec-no { align-self: flex-start; margin-top: 4px; }
.detail-box { margin-left: 8px; }
.sec-box.tall { flex: 1; display: flex; align-items: center; }
.sec-box.period { display: flex; align-items: center; gap: 16px; }
.period-lines p { margin: 4px 0; }
.sec-box.ivbox { display: flex; align-items: center; gap: 6px; }
.brace { font-size: 82px; line-height: 1; font-weight: 300; }
.detail-box { border: 1.6px solid #111; padding: 8px 12px; flex: 1; position: relative; }
.detail-box .lined-text { text-indent: 2.8em; }
.detail-box .lined-text { text-indent: 2.6em; }
.note-line { font-size: 12.5px; }
.u { display: inline-block; min-width: 2.4em; border-bottom: 1px solid #111; text-align: center; }
.a5l { max-width: 920px; }
.sec-box.ivbox .iv-left { flex: 0 0 30%; }
.brace { flex: none; }
.detail-box { flex: 1 1 auto; min-width: 0; }
.sheet-prev { overflow: hidden; max-width: 920px; margin: 0 auto; position: relative; }
.tcolon { color: #a3a3a3; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.pl-lab { display: inline-block; width: 5.6em; }
.val.slot { display: inline-block; width: 9em; }
.sec-no { display: inline-block; width: 1.8em; flex: 0 0 1.8em; text-align: center; }
.lmain .sec-box { display: flex; align-items: center; }
.detail-first { display: flex; height: 28px; }
.detail-first .dlab { line-height: 28px; font-size: 15.5px; padding-right: .4em; }
.detail-first .seg { flex: 1; border-bottom: 1px solid #8a8a8a; }
#print-root { display: none; }
.lmain .sec-box .val { margin-left: .5em; }
.sheet .clinic-name { text-align: right; font-size: 14px; letter-spacing: .35em; margin-top: 10px; }
.mk { font-size: 17px; }
/* 出勤簿 */
.sheet h2.att-title { text-align: center; font-size: 24px; letter-spacing: .3em; font-weight: 500; margin: 2px 0 10px 0; }
.name-row { display: flex; gap: 24px; margin: 0 0 8px 0; font-size: 15px; }
.name-row .cell { border-bottom: 1.6px solid #222; padding: 2px 10px; min-width: 180px; min-height: 24px; }
table.shukkin { border-collapse: collapse; width: 100%; }
table.shukkin th, table.shukkin td { border: 1.3px solid #222; padding: 3px 4px; font-size: 13.5px; text-align: center; height: 27px; }
table.shukkin th { background: #d9ecd9; font-weight: 500; }
table.shukkin td.sun { color: #c0392b; }
table.shukkin td.sat { color: #20548c; }
.controls { max-width: 860px; margin: 0 auto 12px auto; }
@media print {
  body { background: #fff; padding: 0; }
  .no-print { display: none !important; }
  .card { box-shadow: none; border: none; padding: 0; }
  .sheet { border-width: 2px; max-width: none; padding: 2mm 4mm; margin: 0; page-break-inside: avoid; }
  .sheet h2.form-title { font-size: 19px; letter-spacing: .35em; margin: 0 0 1px 0; }
  .sheet .form-sub { margin-bottom: 2px; font-size: 11.5px; }
  .lrow { margin-bottom: 5px; }
  .lmain { gap: 5px; }
  .sec-box { padding: 4px 10px; font-size: 14px; min-height: 34px; }
  .stamp-circle { width: 30px; height: 30px; }
  table.stamp-t th, table.stamp-t td { height: 24px; padding: 3px 6px; font-size: 12.5px; }
  .brace { font-size: 64px; }
  .iv-left .r { margin: 6px 0; }
  .lined-wrap .lines i { height: 22px; }
  .lined-text { line-height: 24px; }
  .detail-lab { line-height: 24px; top: 4px; }
  .detail-box { padding: 4px 12px; }
  .form-stamps { width: 160px; }
  .sheet { min-width: 0; }
  .sheet-prev { overflow: visible; max-width: none; height: auto !important; margin: 0; page-break-inside: avoid; }
  .sheet { transform: none !important; width: auto; }
  .sheet .clinic-name { margin-top: 3px; font-size: 12.5px; }
  .sheet h2.att-title { font-size: 19px; margin-bottom: 6px; }
  .name-row { margin-bottom: 4px; font-size: 13.5px; }
  .name-row .cell { min-width: 150px; min-height: 20px; }
  table.shukkin th, table.shukkin td { padding: 1px 2px; font-size: 11.5px; height: 19px; }
  .sheet.a5l { padding: 1.5mm 3mm 1mm; line-height: 1.35; }
  .sheet.a5l .form-title { font-size: 21px; line-height: 1.15; }
  .sheet.a5l .form-sub { margin-bottom: 3px; }
  .sheet.a5l .lrow { margin-bottom: 2px; }
  .sheet.a5l .lmain { gap: 2px; }
  .sheet.a5l .sec-box { padding: 2px 10px; min-height: 28px; }
  .sheet.a5l table.stamp-t th, .sheet.a5l table.stamp-t td { padding: 1px 6px; height: 22px; }
  .sheet.a5l .iv-left .r { margin: 3px 0; }
  .sheet.a5l .lined-wrap .lines i { height: 18px; }
  .sheet.a5l .lined-text { line-height: 18px; }
  .sheet.a5l .detail-first { height: 18px; }
  .sheet.a5l .detail-first .dlab { line-height: 18px; }
  body.use-print-root #app { display: none !important; }
  body.use-print-root #print-root { display: block !important; }
  .sheet.a5l .detail-box { padding: 2px 12px; }
  .sheet.a5l .clinic-name { margin-top: 1px; }
  @page { size: A4; margin: 8mm; }

<div class="card" id="gate-head">
  <h1 class="app-title">職員専用ページ</h1>
  <p class="note">このページは服部医院の職員専用です。出勤簿・残業届・休暇届の入力と印刷ができます。一度開くと、この端末では次回から入力なしで表示されます。</p>

      <label for="lock-input">パスワード</label>
      <input id="lock-input" type="password" inputmode="numeric" autocomplete="off" style="max-width:280px;">

    </form>
    <div id="lock-msg" class="err" role="status"></div>

</div>

<script>
var WD = ['日','月','火','水','木','金','土'];
function fitSheets(){
  document.querySelectorAll('.sheet-prev').forEach(function(prev){
    var sh = prev.querySelector('.sheet');
    if(!sh || !prev.clientWidth || !sh.offsetParent) return;
    sh.style.transform = '';
    var w = sh.offsetWidth, h = sh.offsetHeight;
    if(!w) return;
    var s = Math.min(1, prev.clientWidth / w);
    sh.style.transform = 'scale(' + s + ')';
    prev.style.height = Math.ceil(h * s) + 'px';
  });
}
window.addEventListener('resize', fitSheets);
function showView(id){
  currentView = id;
  document.getElementById('menuCard').style.display = 'none';
  document.querySelectorAll('.view').forEach(function(v){ v.style.display = 'none'; });
  document.getElementById(id).style.display = 'block';
  window.scrollTo(0,0);
}
function backMenu(){
  document.querySelectorAll('.view').forEach(function(v){ v.style.display = 'none'; });
  document.getElementById('menuCard').style.display = 'block';
  window.scrollTo(0,0);
}
function fmtDate(val){
  if(!val) return '';
  var p = val.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]);
  return (+p[0]) + ' 年 ' + (+p[1]) + ' 月 ' + (+p[2]) + ' 日　' + WD[d.getDay()] + '曜日';
}
function $(id){ return document.getElementById(id); }
function setText(id, v){ var el = $(id); if(el) el.textContent = v || ''; }
function timePair(f, t){
  var a = $(f).value, b = $(t).value;
  return (a || b) ? ((a || '　:　') + ' 〜 ' + (b || '　:　')) : '';
}
function syncZ(){
  setText('o-z-kisai', fmtDate($('z-kisai').value));
  setText('o-z-job', $('z-shoku').value);
  setText('o-z-name', $('z-name').value);
  setText('o-z-date', fmtDate($('z-day').value));
  setText('o-z-start', $('z-from').value);
  setText('o-z-end', $('z-to').value);
  ['r1','r2','r3','r4'].forEach(function(r){ setText('o-z-' + r, $('z-' + r).checked ? '☑' : '□'); });
  setText('o-z-detail', $('z-detail').value);
}
function syncK(){
  setText('o-k-date', $('k-yukyu').checked ? '☑' : '□');
  setText('o-k-kisai', fmtDate($('k-kisai').value));
  setText('o-k-job', $('k-shoku').value);
  setText('o-k-name', $('k-name').value);
  setText('o-k-sdate', fmtDate($('k-day').value));
  setText('o-k-start', $('k-from').value);
  setText('o-k-end', $('k-to').value);
  ['r1','r2','r3'].forEach(function(r){ setText('o-k-' + r, $('k-' + r).checked ? '☑' : '□'); });
  setText('o-k-detail', $('k-detail').value);
}
var currentView = 'v-shukkin';
function printForm(size){
  try {
    var sec = document.getElementById(currentView);
    var sheet = sec ? sec.querySelector('.sheet') : null;
    var root = document.getElementById('print-root');
    if (sheet && root) {
      var clone = sheet.cloneNode(true);
      clone.removeAttribute('style');
      root.innerHTML = '';
      root.appendChild(clone);
      document.body.classList.add('use-print-root');
    }
  } catch (e) {}
  var s = document.getElementById('page-rule');
  if(!s){ s = document.createElement('style'); s.id = 'page-rule'; document.head.appendChild(s); }
  s.textContent = '@page { size: ' + (size === 'A5L' ? 'A5 landscape' : size + ' portrait') + '; margin: ' + (size === 'A4' ? '8mm' : '3mm') + '; }';
  window.print();
}
function reiwa(y){ return '令和' + (y - 2018) + '年'; }
function buildShukkin(){
  var y = parseInt($('sk-year').value, 10);
  var mo = parseInt($('sk-month').value, 10);
  if(!y || !mo) return;
  $('sk-title').textContent = reiwa(y) + ' ' + mo + '月度　出勤簿';
  setText('sk-name-out', $('sk-name').value);
  setText('sk-dept-out', $('sk-dept').value);
  var days = new Date(y, mo, 0).getDate();
  var tb = $('sk-body'); tb.innerHTML = '';
  for(var d=1; d<=days; d++){
    var dt = new Date(y, mo-1, d); var w = dt.getDay();
    var tr = document.createElement('tr');
    var cls = w === 0 ? 'sun' : (w === 6 ? 'sat' : '');
    tr.innerHTML = '<td>' + d + '</td><td class="' + cls + '">' + WD[w] + '</td><td><span class="tcolon">:</span></td><td><span class="tcolon">:</span></td><td><span class="tcolon">:</span></td><td><span class="tcolon">:</span></td><td></td><td></td>';
    tb.appendChild(tr);
  }
}
function initApp(){
  var monthSel = $('sk-month');
  if(monthSel.options.length === 0){
    for(var m=1; m<=12; m++){ var o = document.createElement('option'); o.value = m; o.textContent = m + '月'; monthSel.appendChild(o); }
    monthSel.value = '12';
  }
  ['sk-year','sk-month','sk-name','sk-dept'].forEach(function(id){ $(id).addEventListener('input', buildShukkin); $(id).addEventListener('change', buildShukkin); });
  $('z-form').addEventListener('input', syncZ);
  $('z-form').addEventListener('change', syncZ);
  $('k-form').addEventListener('input', syncK);
  $('k-form').addEventListener('change', syncK);
  buildShukkin(); syncZ(); syncK();
}
</script>

    var STORE = "hattori-staff-key";
    var container = document.getElementById("unlocked");
    var box = document.getElementById("lock-box");
    var form = document.getElementById("lock-form");
    var input = document.getElementById("lock-input");
    var msg = document.getElementById("lock-msg");
    var ok = !!(window.crypto && window.crypto.subtle);
    function fromB64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
    function toB64(buf) { var a = new Uint8Array(buf), s = ""; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
    function decryptWith(key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(P.iv) }, key, fromB64(P.ct)).then(function (pt) { return new TextDecoder().decode(pt); }); }
    function show(html) { container.innerHTML = html; box.style.display = "none"; document.getElementById("gate-head").style.display = "none"; initApp(); }
    function remember(key) { return crypto.subtle.exportKey("raw", key).then(function (raw) { try { localStorage.setItem(STORE, toB64(raw)); } catch (e) {} }).catch(function () {}); }
    function unlock(pw) {
        var enc = new TextEncoder();
        var norm = pw.normalize("NFKC").trim().toLowerCase();
        return crypto.subtle.importKey("raw", enc.encode(norm), "PBKDF2", false, ["deriveKey"])
            .then(function (base) { return crypto.subtle.deriveKey({ name: "PBKDF2", salt: fromB64(P.salt), iterations: P.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]); })

    }

    var saved = null;
    try { saved = localStorage.getItem(STORE); } catch (e) {}
    if (saved) {
        crypto.subtle.importKey("raw", fromB64(saved), "AES-GCM", false, ["decrypt"]).then(decryptWith).then(show).catch(function () { try { localStorage.removeItem(STORE); } catch (e) {} });
    }
    form.addEventListener("submit", function (ev) {
        ev.preventDefault();
        if (!input.value) return;
        msg.textContent = "確認しています…";
        unlock(input.value).catch(function () { msg.textContent = "パスワードが違います。"; });
