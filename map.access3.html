<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>服部医院｜周辺アクセスマップ テスト3</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
>

<style>

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

#map {
    width: 100%;
    height: 100%;
}

</style>

</head>

<body>

<div id="map"></div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin="">
</script>

<script>

/* ==================================================
   地図
================================================== */

const map =
    L.map("map").setView(
        [35.1180, 136.9220],
        16
    );


/* ==================================================
   OpenStreetMap
================================================== */

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }
).addTo(map);


/* ==================================================
   服部医院
================================================== */

L.marker(
    [35.1212371, 136.9219966]
).addTo(map)
.bindPopup(
    "医療法人 誠彰会 服部医院"
);

</script>

</body>

</html>
