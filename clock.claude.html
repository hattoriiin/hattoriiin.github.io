<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="服部医院の外来診療時間および受付時間。午前診9:00〜12:00（受付8:45〜11:30）、訪問診療13:30〜16:30、午後診17:30〜19:30（受付17:15〜19:00）。"
>

<title>服部医院｜外来診療・受付時間</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap');


/* ==================================================
   基本
================================================== */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    margin:0;

    min-height:100vh;

    background:
        radial-gradient(
            ellipse at 50% 32%,
            #ffffff 0%,
            #f2f5f9 45%,
            #e4eaf0 100%
        );

    color:#31556e;

    font-family:
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

}


/* ==================================================
   アクセシビリティ
================================================== */

.sr-only{

    position:absolute;

    width:1px;

    height:1px;

    padding:0;

    margin:-1px;

    overflow:hidden;

    clip:rect(0,0,0,0);

    white-space:nowrap;

    border:0;

}


/* ==================================================
   メイン
================================================== */

.page-main{

    width:100%;

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:1rem;

}


/* ==================================================
   時計エリア
================================================== */

.clock-area{

    width:100%;

    max-width:520px;

}


/* ==================================================
   見出し
================================================== */

.clock-title{

    width:72%;

    margin:
        0 auto
        1rem;

    padding:.45rem 0;

    text-align:center;

    border-top:
        1px solid
        rgba(49,85,110,.35);

    border-bottom:
        1px solid
        rgba(49,85,110,.35);

    font-size:1.05rem;

    font-weight:400;

    letter-spacing:.14em;

}


/* ==================================================
   時計本体
================================================== */

.time-ring{

    position:relative;

    width:min(
        100%,
        440px
    );

    min-width:min(280px,100%);

    aspect-ratio:1 / 1;

    margin:0 auto;

    /*
     * 盤面がページから少し浮いているような
     * 軽い立体感を出す。
     */

    filter:

        drop-shadow(
            0 10px 22px
            rgba(49,85,110,.14)
        )

        drop-shadow(
            0 2px 5px
            rgba(49,85,110,.08)
        );

}


.time-ring svg{

    display:block;

    width:100%;

    height:100%;

    overflow:visible;

}


/* ==================================================
   時計盤（生地）
================================================== */

.clock-disc{

    fill:
        url(#washiDiscGradient);

}


/*
 * 生地のわずかな陰影のムラを表す、
 * ごく薄いテクスチャ。
 */

.clock-disc-weave{

    mix-blend-mode:multiply;

    opacity:.55;

    pointer-events:none;

}


.clock-disc-texture{

    pointer-events:none;

    mix-blend-mode:multiply;

    opacity:.45;

}


/* ==================================================
   外周目盛り
================================================== */

.outer-tick{

    stroke:#31556e;

    stroke-linecap:round;

    opacity:.22;

    vector-effect:non-scaling-stroke;

}


.outer-tick.five{

    opacity:.38;

    stroke-width:1.2;

}


.outer-tick.quarter{

    opacity:.5;

    stroke-width:1.4;

}


.outer-tick.half{

    opacity:.7;

    stroke-width:1.8;

    stroke:#1d394e;

}


.outer-dot{

    fill:#31556e;

    opacity:.28;

}


/* ==================================================
   診療時間帯
================================================== */

.time-band{

    /*
     * 帯の輪郭はごく細いインク色の線のみ。
     */

    stroke:
        rgba(49,85,110,.22);

    stroke-width:.5;

    vector-effect:non-scaling-stroke;

    /*
     * インデックスHTMLの外来・訪問診療バッジと
     * 同じ発想で、艶のある立体感を出す。
     */

    filter:
        drop-shadow(
            0 1px 2px
            rgba(20,40,56,.28)
        );

}


.band-base.blue{

    fill:
        url(#blueGlassGradient);

}


.band-base.green{

    fill:
        url(#greenGlassGradient);

}


.band-inner{

    fill:#eef0e8;

    /*
     * 下地の織り目が透けて見えるよう、
     * 白は控えめにする。
     */

    opacity:.18;

}


/* ==================================================
   帯を囲む反対色の層
================================================== */

/*
 * 中心〜外側リングまでを貫く、切れ目のない
 * 1枚のレイヤーとして扱う。
 *
 * 「青帯の陣地には緑を、緑帯の陣地には青を」
 * というルールを、パーツを分けずに
 * ひとつながりのぼかしで表現する。
 */

.color-surround{

    stroke:none;

    filter:url(#ringBlur);

    pointer-events:none;

    opacity:.32;

}


.color-surround.green{

    fill:#70ad47;

}


.color-surround.blue{

    fill:#3d8bdc;

}

.band-texture{

    pointer-events:none;

    mix-blend-mode:multiply;

    opacity:.4;

}


/* ==================================================
   受付時間
================================================== */

/*
 * 受付時間は、墨で描いた細い線のように
 * シンプルなインク色でまとめる。
 */

.reception-arc{

    fill:none;

    stroke:#1d394e;

    stroke-width:2.6px;

    stroke-linecap:round;

    opacity:.95;

    vector-effect:non-scaling-stroke;

}


.reception-glow{

    fill:none;

    stroke:#31556e;

    stroke-width:3.2px;

    stroke-linecap:round;

    opacity:.12;

    filter:url(#softGlowFilter);

}


.reception-dot{

    fill:#1d394e;

    opacity:1;

    filter:url(#softGlowFilter);

}


.reception-boundary{

    stroke:#31556e;

    stroke-width:1px;

    stroke-linecap:round;

    opacity:.4;

    vector-effect:non-scaling-stroke;

}


.reception-boundary.strong{

    stroke-width:1.2px;

    opacity:.6;

}


/* ==================================================
   時計数字
================================================== */

.clock-face{

    pointer-events:none;

}


.clock-face .num{

    font-family:

        "Bodoni 72",

        "Didot",

        "Bodoni MT",

        "Times New Roman",

        serif;

    font-size:27px;

    font-weight:500;

    text-anchor:middle;

    dominant-baseline:middle;

    fill:
        url(#numGlossyGradient);

    filter:
        drop-shadow(
            0 1px 1.5px
            rgba(20,40,56,.35)
        );

}


.clock-face .num.num-balloon{

    font-weight:700;

    fill:
        url(#numBalloonGradient);

    stroke:rgba(37,65,90,.55);

    stroke-width:.7px;

    paint-order:stroke fill;

    filter:
        drop-shadow(
            0 3.5px 3px
            rgba(15,30,45,.5)
        )
        drop-shadow(
            0 5px 6px
            rgba(15,30,45,.3)
        )
        drop-shadow(
            0 -.5px .5px
            rgba(255,255,255,.65)
        );

}


/* ==================================================
   時計の針
================================================== */

.clock-hand{

    stroke:#31556e;

    stroke-linecap:round;

    vector-effect:non-scaling-stroke;

    filter:
        drop-shadow(
            0 1px 1px
            rgba(49,85,110,.28)
        );

}


.clock-hand.hour{

    stroke-width:5;

}


.clock-hand.minute{

    stroke-width:3;

}


.clock-hand.second{

    stroke:#31556e;

    stroke-width:1;

    opacity:.18;

    filter:none;

}


/* ==================================================
   中央
================================================== */

.clock-center{

    fill:#31556e;

    opacity:.9;

    stroke:
        rgba(255,255,255,.5);

    stroke-width:1;

}


.clock-dot{

    fill:#eef0e8;

    opacity:.8;

}


/* ==================================================
   帯アイコン
================================================== */

.band-icon{

    pointer-events:none;

    filter:
        drop-shadow(
            0 1px 1.5px
            rgba(0,0,0,.25)
        );

}


.band-icon circle{

    stroke:
        rgba(255,255,255,.5);

    stroke-width:.6;

}


.band-icon path{

    stroke:#ffffff;

    stroke-width:1.3;

    stroke-linecap:round;

    stroke-linejoin:round;

    fill:none;

}


/* ==================================================
   短針の串ドット
================================================== */

.hour-hand-dot{

    stroke:rgba(20,20,20,.85);

    stroke-width:1.2;

    transition:
        fill .3s ease,
        opacity .3s ease;

}


.hour-hand-house{

    opacity:0;

    transition:opacity .3s ease;

}


.hour-hand-house circle{

    stroke:rgba(20,20,20,.85);

    stroke-width:1.2;

}


/* ==================================================
   長針の受付ダイヤ
================================================== */

.minute-hand-diamond{

    fill:#fdf9f0;

    stroke:#31556e;

    stroke-width:.8;

    filter:
        drop-shadow(
            0 1px 1.5px
            rgba(20,40,56,.4)
        );

    transition:opacity .3s ease;

}


.minute-hand-diamond.diamond-inner{

    stroke-width:.6;

}


/* ==================================================
   レスポンシブ
================================================== */

@media(max-width:600px) and (orientation:portrait){

    .page-main{

        padding:.7rem;

    }


    .clock-title{

        width:72%;

        margin-bottom:.7rem;

        font-size:.98rem;

    }


    .time-ring{

        width:min(
            94vw,
            440px
        );

        min-width:min(280px,100%);

    }


    .clock-face .num{

        font-size:25px;

    }

}


@media(max-width:380px){

    .page-main{

        padding:.5rem;

    }


    .clock-title{

        font-size:.92rem;

    }


    .time-ring{

        min-width:min(260px,100%);

    }


    .clock-face .num{

        font-size:23px;

    }

}


/* ==================================================
   動きを抑える設定
================================================== */

/* ==================================================
   横向き(ランドスケープ)：縦の高さに合わせて縮小
================================================== */

@media(orientation:landscape) and (max-height:520px){

    .page-main{

        padding:.4rem;

    }

    .clock-title{

        font-size:.85rem;

        margin-bottom:.4rem;

        padding:.3rem 0;

    }

    .time-ring{

        width:min(78vh,400px);

        min-width:min(180px,100%);

    }

}


@media(prefers-reduced-motion:reduce){

    .clock-hand{

        transition:none;

    }

}

</style>

</head>


<body>


<main class="page-main">


<section
    class="clock-area"
    aria-labelledby="clockHeading"
>


<h1
    id="clockHeading"
    class="clock-title"
>
    外来診療・受付時間
</h1>


<div class="sr-only">

    <p>服部医院の外来診療および受付時間です。</p>

    <ul>

        <li>
            午前診：9:00〜12:00（受付 8:45〜11:30）
        </li>

        <li>
            訪問診療：13:30〜16:30
        </li>

        <li>
            午後診：17:30〜19:30（受付 17:15〜19:00）
        </li>

    </ul>

</div>


<div class="time-ring">


<svg
    viewBox="0 0 400 400"
    aria-hidden="true"
    focusable="false"
>


<defs>


<!-- ==================================================
     生地の盤面グラデーション
================================================== -->

<radialGradient
    id="washiDiscGradient"
    cx="40%"
    cy="32%"
    r="85%"
>

    <stop offset="0%" stop-color="#fbfcf8"/>
    <stop offset="45%" stop-color="#eef1e7"/>
    <stop offset="75%" stop-color="#e2e6d8"/>
    <stop offset="100%" stop-color="#d5dac9"/>

</radialGradient>


<!-- ==================================================
     実際の平織りパターン(縦横の糸が交互に上下)
================================================== -->

<clipPath id="discImageClip">
    <circle cx="200" cy="200" r="180"/>
</clipPath>


<!-- ==================================================
     生地の陰影テクスチャ
================================================== -->

<filter
    id="washiTexture"
    x="-5%"
    y="-5%"
    width="110%"
    height="110%"
>

    <feTurbulence
        type="fractalNoise"
        baseFrequency="0.006 0.03"
        numOctaves="4"
        seed="6"
        result="fold"
    />

    <feDiffuseLighting
        in="fold"
        surfaceScale="1.8"
        diffuseConstant=".7"
        lighting-color="#ffffff"
        result="foldLight"
    >

        <feDistantLight
            azimuth="230"
            elevation="55"
        />

    </feDiffuseLighting>


    <feComposite
        in="foldLight"
        in2="SourceAlpha"
        operator="in"
    />

</filter>


<!-- ==================================================
     青（外来診療帯・艶あり）
================================================== -->

<linearGradient
    id="blueGlassGradient"
    x1="15%"
    y1="10%"
    x2="85%"
    y2="90%"
>

    <stop offset="0%" stop-color="#9ccdff" stop-opacity=".42"/>
    <stop offset="45%" stop-color="#3d8bdc" stop-opacity=".42"/>
    <stop offset="100%" stop-color="#155a92" stop-opacity=".42"/>

</linearGradient>


<!-- ==================================================
     緑（訪問診療帯・艶あり）
================================================== -->

<linearGradient
    id="greenGlassGradient"
    x1="15%"
    y1="10%"
    x2="85%"
    y2="90%"
>

    <stop offset="0%" stop-color="#c2eb9a" stop-opacity=".42"/>
    <stop offset="45%" stop-color="#70ad47" stop-opacity=".42"/>
    <stop offset="100%" stop-color="#4a7c2c" stop-opacity=".42"/>

</linearGradient>


<!-- ==================================================
     帯アイコン(外来=青丸・訪問=緑の家)
================================================== -->

<radialGradient
    id="bandIconBlueGradient"
    cx="35%"
    cy="30%"
    r="75%"
>

    <stop offset="0%" stop-color="#8fc7ff"/>
    <stop offset="45%" stop-color="#3d8bdc"/>
    <stop offset="100%" stop-color="#1769aa"/>

</radialGradient>


<radialGradient
    id="bandIconGreenGradient"
    cx="35%"
    cy="30%"
    r="75%"
>

    <stop offset="0%" stop-color="#b7e88a"/>
    <stop offset="45%" stop-color="#70ad47"/>
    <stop offset="100%" stop-color="#4f8a2f"/>

</radialGradient>


<!-- ==================================================
     短針ドット(帯の外にいる時のグレー玉)
================================================== -->

<radialGradient
    id="hourDotGrayGradient"
    cx="35%"
    cy="30%"
    r="75%"
>

    <stop offset="0%" stop-color="#f2f2f0"/>
    <stop offset="45%" stop-color="#aaaaa4"/>
    <stop offset="100%" stop-color="#6e6e68"/>

</radialGradient>


<!-- ==================================================
     短針ドット(診療帯にいる時の青・緑の玉)
================================================== -->

<radialGradient
    id="hourDotBlueGradient"
    cx="35%"
    cy="30%"
    r="75%"
>

    <stop offset="0%" stop-color="#8fc7ff"/>
    <stop offset="45%" stop-color="#3d8bdc"/>
    <stop offset="100%" stop-color="#1769aa"/>

</radialGradient>


<radialGradient
    id="hourDotGreenGradient"
    cx="35%"
    cy="30%"
    r="75%"
>

    <stop offset="0%" stop-color="#b7e88a"/>
    <stop offset="45%" stop-color="#70ad47"/>
    <stop offset="100%" stop-color="#4f8a2f"/>

</radialGradient>


<!-- ==================================================
     数字（艶あり）
================================================== -->

<linearGradient
    id="numGlossyGradient"
    x1="0%"
    y1="0%"
    x2="0%"
    y2="100%"
>

    <stop offset="0%" stop-color="#5c7d95"/>
    <stop offset="42%" stop-color="#2a4a61"/>
    <stop offset="100%" stop-color="#0f2739"/>

</linearGradient>


<!-- ==================================================
     数字（バルーン、9〜19用）
================================================== -->

<linearGradient
    id="numBalloonGradient"
    x1="0%"
    y1="0%"
    x2="0%"
    y2="100%"
>

    <stop offset="0%" stop-color="#d8e8f5"/>
    <stop offset="14%" stop-color="#b9d2e6"/>
    <stop offset="32%" stop-color="#6f97b8"/>
    <stop offset="62%" stop-color="#25415a"/>
    <stop offset="100%" stop-color="#08151f"/>

</linearGradient>


<!-- ==================================================
     受付用グロー（にじみ）
================================================== -->

<filter
    id="softGlowFilter"
    x="-20%"
    y="-20%"
    width="140%"
    height="140%"
>

    <feGaussianBlur
        stdDeviation="1.8"
    />

</filter>


<!-- ==================================================
     外側リング(24時間対応)の境界をぼかす
================================================== -->

<filter
    id="ringBlur"
    x="-100%"
    y="-100%"
    width="300%"
    height="300%"
>

    <feGaussianBlur
        stdDeviation="44"
    />

</filter>


</defs>


<!-- ==================================================
     時計盤（生地）
================================================== -->

<circle
    class="clock-disc"
    cx="200"
    cy="200"
    r="180"
/>

<image
    class="clock-disc-weave"
    x="20"
    y="20"
    width="360"
    height="360"
    clip-path="url(#discImageClip)"

/>

<script>

document.addEventListener(
    'DOMContentLoaded',
    function(){

        /* ==================================================
           基本設定
        ================================================== */

        const SVG_CENTER = 200;

        const OUTER_RADIUS = 180;

        const INNER_RADIUS = 100;

        const CORNER_RADIUS = 4;

        const WHITE_RADIAL_INSET = 3;

        const WHITE_ANGLE_INSET = 0.5;

        const SPIRAL_MIN_RADIUS = 108;

        const SPIRAL_MAX_RADIUS = 172;


        /* ==================================================
           外周目盛り
        ================================================== */

        const OUT_TICK_OUTER = 180;

        const OUT_TICK_INNER = 177;

        const OUT_TICK_INNER_FIVE = 175;

        const OUT_TICK_INNER_QUARTER = 174;

        const OUT_TICK_INNER_HALF = 173;

        const OUT_DOT_RADIUS = 178.5;


        /*
         * 受付時間は診療帯の外側にわずかに離して配置する。
         *
         * 180pxの診療帯に対して182pxとすることで、
         * 診療帯そのものを隠さず、別の情報として読めるようにする。
         */

        const RECEPTION_RADIUS = 182;


        /*
         * 診療開始・終了境界線。
         *
         * 受付線と診療帯の関係を視覚的に示すため、
         * 受付線から診療帯外周まで短く接続する。
         */

        const RECEPTION_BOUNDARY_OUTER = 183;

        const RECEPTION_BOUNDARY_INNER = 176;


        /* ==================================================
           診療時間
        ================================================== */

        /*
         * ここは実際の24時間表記で統一する。
         *
         * timeToClockAngle()側で12時間時計へ変換するため、
         * 13:30や17:30をそのまま書ける。
         */

        const BANDS = [

            {
                startH:9,
                startM:0,
                endH:12,
                endM:0
            },

            {
                startH:13,
                startM:30,
                endH:16,
                endM:30
            },

            {
                startH:17,
                startM:30,
                endH:19,
                endM:30
            }

        ];


        /* ==================================================
           DOM取得
        ================================================== */

        const morningBand =
            document.getElementById(
                'morningBand'
            );

        const morningWhite =
            document.getElementById(
                'morningWhite'
            );

        const visitBand =
            document.getElementById(
                'visitBand'
            );

        const visitWhite =
            document.getElementById(
                'visitWhite'
            );

        const eveningBand =
            document.getElementById(
                'eveningBand'
            );

        const eveningWhite =
            document.getElementById(
                'eveningWhite'
            );


        const morningReceptionArc =
            document.getElementById(
                'morningReceptionArc'
            );

        const morningReceptionGlow =
            document.getElementById(
                'morningReceptionGlow'
            );

        const morningReceptionStart =
            document.getElementById(
                'morningReceptionStart'
            );

        const morningReceptionEnd =
            document.getElementById(
                'morningReceptionEnd'
            );


        const eveningReceptionArc =
            document.getElementById(
                'eveningReceptionArc'
            );

        const eveningReceptionGlow =
            document.getElementById(
                'eveningReceptionGlow'
            );

        const eveningReceptionStart =
            document.getElementById(
                'eveningReceptionStart'
            );

        const eveningReceptionEnd =
            document.getElementById(
                'eveningReceptionEnd'
            );


        const morningOpenBoundary =
            document.getElementById(
                'morningOpenBoundary'
            );

        const morningCloseBoundary =
            document.getElementById(
                'morningCloseBoundary'
            );

        const eveningOpenBoundary =
            document.getElementById(
                'eveningOpenBoundary'
            );

        const eveningCloseBoundary =
            document.getElementById(
                'eveningCloseBoundary'
            );


        const clock12 =
            document.getElementById(
                'clock12'
            );

        const clock24 =
            document.getElementById(
                'clock24'
            );

        const outerClockTicks =
            document.getElementById(
                'outerClockTicks'
            );


        const hourHand =
            document.querySelector(
                '.clock-hand.hour'
            );

        const minuteHand =
            document.querySelector(
                '.clock-hand.minute'
            );

        const secondHand =
            document.querySelector(
                '.clock-hand.second'
            );

        const hourHandDot =
            document.getElementById(
                'hourHandDot'
            );

        const hourHandHouseIcon =
            document.getElementById(
                'hourHandHouseIcon'
            );

        const hourHandDiamondInner =
            document.getElementById(
                'hourHandDiamondInner'
            );

        const hourHandDiamondOuter =
            document.getElementById(
                'hourHandDiamondOuter'
            );


        /*
         * 必須要素が不足している場合、
         * そのまま処理を続けると画面の一部だけが壊れるため、
         * 初期化を停止する。
         */

        if(

            !morningBand ||
            !morningWhite ||
            !visitBand ||
            !visitWhite ||
            !eveningBand ||
            !eveningWhite ||

            !morningReceptionArc ||
            !morningReceptionGlow ||
            !morningReceptionStart ||
            !morningReceptionEnd ||

            !eveningReceptionArc ||
            !eveningReceptionGlow ||
            !eveningReceptionStart ||
            !eveningReceptionEnd ||

            !morningOpenBoundary ||
            !morningCloseBoundary ||
            !eveningOpenBoundary ||
            !eveningCloseBoundary ||

            !clock12 ||
            !clock24 ||
            !outerClockTicks ||

            !hourHand ||
            !minuteHand ||
            !secondHand

        ){

            console.error(
                '時計の初期化に必要な要素が見つかりません。'
            );

            return;

        }


        /* ==================================================
           時刻 → 時計角度
        ================================================== */

        /**
         * 24時間表記の時刻を12時間時計の角度へ変換する。
         *
         * 12時を0°として時計回りに増加する。
         *
         * @param {number} hour 0〜23の時
         * @param {number} minute 0〜59の分
         * @returns {number} 時計角度
         * @throws {TypeError} 数値でない場合
         * @throws {RangeError} 時刻範囲が不正な場合
         */

        function timeToClockAngle(
            hour,
            minute
        ){

            if(
                !Number.isFinite(hour) ||
                !Number.isFinite(minute)
            ){

                throw new TypeError(
                    '時刻は数値で指定してください。'
                );

            }


            if(
                !Number.isInteger(hour) ||
                hour < 0 ||
                hour > 23
            ){

                throw new RangeError(
                    '時は0〜23で指定してください。'
                );

            }


            if(
                !Number.isInteger(minute) ||
                minute < 0 ||
                minute > 59
            ){

                throw new RangeError(
                    '分は0〜59で指定してください。'
                );

            }


            return (
                (
                    (hour % 12) * 30
                ) +
                minute * .5
            ) % 360;

        }


        /* ==================================================
           時計角度 → SVG角度
        ================================================== */

        function clockToSvgAngle(
            clockAngle
        ){

            return clockAngle - 90;

        }


        /* ==================================================
           極座標 → SVG座標
        ================================================== */

        function polarToPoint(
            radius,
            svgAngle
        ){

            if(
                !Number.isFinite(radius) ||
                !Number.isFinite(svgAngle)
            ){

                throw new TypeError(
                    '半径と角度は数値で指定してください。'
                );

            }


            const radians =
                svgAngle *
                Math.PI /
                180;


            return {

                x:
                    SVG_CENTER +
                    radius *
                    Math.cos(radians),

                y:
                    SVG_CENTER +
                    radius *
                    Math.sin(radians)

            };

        }


        /* ==================================================
           時計座標
        ================================================== */

        function clockPoint(
            radius,
            clockAngle
        ){

            return polarToPoint(
                radius,
                clockToSvgAngle(
                    clockAngle
                )
            );

        }


        /* ==================================================
           角度範囲判定
        ================================================== */

        function isAngleInBands(
            angle
        ){

            for(
                const band of BANDS
            ){

                const start =
                    timeToClockAngle(
                        band.startH,
                        band.startM
                    );

                const end =
                    timeToClockAngle(
                        band.endH,
                        band.endM
                    );


                if(
                    start < end
                ){

                    if(
                        angle >= start &&
                        angle <= end
                    ){

                        return true;

                    }

                }

                else{

                    if(
                        angle >= start ||
                        angle <= end
                    ){

                        return true;

                    }

                }

            }


            return false;

        }


        /* ==================================================
           現在時刻がどの診療帯にいるか（実時刻ベース）
        ================================================== */

        /**
         * 実際の時刻(0〜23時)から、
         * 今どの診療帯にいるかを判定する。
         *
         * 12時間ダイヤルの角度ではなく、
         * 実際の24時間の時刻で判定することで、
         * 存在しない時間帯（21時など）と
         * 取り違えないようにする。
         *
         * @param {number} hour 0〜23の時
         * @param {number} minute 0〜59の分
         * @returns {('blue'|'green'|null)} 帯の色、該当なしはnull
         */

        function getCurrentBandColor(
            hour,
            minute
        ){

            const minutesNow =
                hour * 60 +
                minute;


            const ranges = [

                {
                    start: 9 * 60,
                    end: 12 * 60,
                    color: 'blue'
                },

                {
                    start: 13 * 60 + 30,
                    end: 16 * 60 + 30,
                    color: 'green'
                },

                {
                    start: 17 * 60 + 30,
                    end: 19 * 60 + 30,
                    color: 'blue'
                }

            ];


            for(
                const range of ranges
            ){

                if(
                    minutesNow >= range.start &&
                    minutesNow <= range.end
                ){

                    return range.color;

                }

            }


            return null;

        }


        /* ==================================================
           現在時刻が受付時間かどうか（実時刻ベース）
        ================================================== */

        /**
         * @param {number} hour 0〜23の時
         * @param {number} minute 0〜59の分
         * @returns {boolean} 受付時間内であればtrue
         */

        function isReceptionTime(
            hour,
            minute
        ){

            const minutesNow =
                hour * 60 +
                minute;


            const ranges = [

                {
                    start: 8 * 60 + 45,
                    end: 11 * 60 + 30
                },

                {
                    start: 17 * 60 + 15,
                    end: 19 * 60
                }

            ];


            return ranges.some(
                range =>
                    minutesNow >= range.start &&
                    minutesNow <= range.end
            );

        }


        /* ==================================================
           受付円弧
        ================================================== */

        /**
         * 指定した受付時間を円弧として生成する。
         *
         * @param {number} startHour 開始時
         * @param {number} startMinute 開始分
         * @param {number} endHour 終了時
         * @param {number} endMinute 終了分
         * @param {number} radius 円弧半径
         * @returns {string} SVG path
         * @throws {RangeError} 時間範囲が不正な場合
         */

        function createArcPath(
            startHour,
            startMinute,
            endHour,
            endMinute,
            radius
        ){

            const start =
                timeToClockAngle(
                    startHour,
                    startMinute
                );

            const end =
                timeToClockAngle(
                    endHour,
                    endMinute
                );


            let sweep =
                end - start;


            if(
                sweep < 0
            ){

                sweep += 360;

            }


            if(
                sweep <= 0 ||
                sweep > 360
            ){

                throw new RangeError(
                    '受付時間の範囲が不正です。'
                );

            }


            const startPt =
                clockPoint(
                    radius,
                    start
                );

            const endPt =
                clockPoint(
                    radius,
                    end
                );


            const largeArcFlag =
                sweep > 180
                    ? 1
                    : 0;


            return [

                `M ${startPt.x} ${startPt.y}`,

                `A ${radius} ${radius} 0 ${largeArcFlag} 1 ${endPt.x} ${endPt.y}`

            ].join(' ');

        }


        /* ==================================================
           受付端点
        ================================================== */

        function setReceptionEndpoints(
            startElem,
            endElem,
            startHour,
            startMinute,
            endHour,
            endMinute,
            radius
        ){

            const startPt =
                clockPoint(
                    radius,
                    timeToClockAngle(
                        startHour,
                        startMinute
                    )
                );


            const endPt =
                clockPoint(
                    radius,
                    timeToClockAngle(
                        endHour,
                        endMinute
                    )
                );


            startElem.setAttribute(
                'cx',
                startPt.x
            );

            startElem.setAttribute(
                'cy',
                startPt.y
            );


            endElem.setAttribute(
                'cx',
                endPt.x
            );

            endElem.setAttribute(
                'cy',
                endPt.y
            );

        }


        /* ==================================================
           診療境界線
        ================================================== */

        /**
         * 診療開始・終了位置に短い放射線を置く。
         *
         * 受付線と診療帯の境界を視覚的につなげるための
         * 補助線であり、時刻そのものを示す目盛りではない。
         *
         * @param {SVGLineElement} element 対象line
         * @param {number} hour 時
         * @param {number} minute 分
         */

        function setBoundary(
            element,
            hour,
            minute
        ){

            const angle =
                timeToClockAngle(
                    hour,
                    minute
                );


            const outerPoint =
                clockPoint(
                    RECEPTION_BOUNDARY_OUTER,
                    angle
                );


            const innerPoint =
                clockPoint(
                    RECEPTION_BOUNDARY_INNER,
                    angle
                );


            element.setAttribute(
                'x1',
                outerPoint.x
            );

            element.setAttribute(
                'y1',
                outerPoint.y
            );

            element.setAttribute(
                'x2',
                innerPoint.x
            );

            element.setAttribute(
                'y2',
                innerPoint.y
            );

        }


        /* ==================================================
           診療帯生成
        ================================================== */

        function createBandPath(
            startHour,
            startMinute,
            endHour,
            endMinute,
            radialInset = 0,
            angleInset = 0
        ){

            const start =
                timeToClockAngle(
                    startHour,
                    startMinute
                );

            const end =
                timeToClockAngle(
                    endHour,
                    endMinute
                );


            let sweep =
                end - start;


            if(
                sweep < 0
            ){

                sweep += 360;

            }


            if(
                sweep <= 0 ||
                sweep > 360
            ){

                throw new RangeError(
                    '診療時間の範囲が不正です。'
                );

            }


            const outerRadius =
                OUTER_RADIUS -
                radialInset;

            const innerRadius =
                INNER_RADIUS +
                radialInset;


            if(
                innerRadius >= outerRadius
            ){

                throw new RangeError(
                    '診療帯の内外半径が逆転しています。'
                );

            }


            const localStart =
                start +
                angleInset;

            const localEnd =
                start +
                sweep -
                angleInset;


            const r =
                Math.min(
                    CORNER_RADIUS,
                    (
                        outerRadius -
                        innerRadius
                    ) / 2 - .5
                );


            if(
                r <= 0
            ){

                throw new RangeError(
                    '診療帯の幅が狭すぎます。'
                );

            }


            const midRadius =
                (
                    outerRadius +
                    innerRadius
                ) / 2;


            const angularCorrection =
                (
                    r /
                    midRadius
                ) *
                (
                    180 /
                    Math.PI
                );


            const adjustedStart =
                localStart +
                angularCorrection;

            const adjustedEnd =
                localEnd -
                angularCorrection;


            const outerFilletRadius =
                outerRadius -
                r;

            const innerFilletRadius =
                innerRadius +
                r;


            const outerDelta =
                Math.asin(
                    r /
                    outerFilletRadius
                ) *
                180 /
                Math.PI;


            const innerDelta =
                Math.asin(
                    r /
                    innerFilletRadius
                ) *
                180 /
                Math.PI;


            const outerStart =
                clockPoint(
                    outerRadius,
                    adjustedStart
                );

            const outerEnd =
                clockPoint(
                    outerRadius,
                    adjustedEnd
                );

            const innerEnd =
                clockPoint(
                    innerRadius,
                    adjustedEnd
                );

            const innerStart =
                clockPoint(
                    innerRadius,
                    adjustedStart
                );


            const outerStartTangent =
                clockPoint(
                    outerFilletRadius,
                    adjustedStart -
                    outerDelta
                );

            const innerStartTangent =
                clockPoint(
                    innerFilletRadius,
                    adjustedStart -
                    innerDelta
                );

            const outerEndTangent =
                clockPoint(
                    outerFilletRadius,
                    adjustedEnd +
                    outerDelta
                );

            const innerEndTangent =
                clockPoint(
                    innerFilletRadius,
                    adjustedEnd +
                    innerDelta
                );


            const largeArcFlag =
                (
                    adjustedEnd -
                    adjustedStart
                ) > 180
                    ? 1
                    : 0;


            return [

                `M ${outerStartTangent.x} ${outerStartTangent.y}`,

                `A ${r} ${r} 0 0 1 ${outerStart.x} ${outerStart.y}`,

                `A ${outerRadius} ${outerRadius} 0 ${largeArcFlag} 1 ${outerEnd.x} ${outerEnd.y}`,

                `A ${r} ${r} 0 0 1 ${outerEndTangent.x} ${outerEndTangent.y}`,

                `L ${innerEndTangent.x} ${innerEndTangent.y}`,

                `A ${r} ${r} 0 0 1 ${innerEnd.x} ${innerEnd.y}`,

                `A ${innerRadius} ${innerRadius} 0 ${largeArcFlag} 0 ${innerStart.x} ${innerStart.y}`,

                `A ${r} ${r} 0 0 1 ${innerStartTangent.x} ${innerStartTangent.y}`,

                'Z'

            ].join(' ');

        }


        /* ==================================================
           診療帯設定
        ================================================== */

        function setBand(
            element,
            startHour,
            startMinute,
            endHour,
            endMinute
        ){

            try{

                element.setAttribute(
                    'd',
                    createBandPath(
                        startHour,
                        startMinute,
                        endHour,
                        endMinute
                    )
                );

            }

            catch(error){

                console.error(
                    '診療帯の描画に失敗しました。',
                    error
                );

            }

        }


        function setWhiteBand(
            element,
            startHour,
            startMinute,
            endHour,
            endMinute
        ){

            try{

                element.setAttribute(
                    'd',
                    createBandPath(
                        startHour,
                        startMinute,
                        endHour,
                        endMinute,
                        WHITE_RADIAL_INSET,
                        WHITE_ANGLE_INSET
                    )
                );

            }

            catch(error){

                console.error(
                    '診療帯内部の描画に失敗しました。',
                    error
                );

            }

        }


        /* ==================================================
           外周目盛り
        ================================================== */

        function createOuterMinuteTicks(){

            const fragment =
                document.createDocumentFragment();


            for(
                let minute = 0;
                minute < 60;
                minute++
            ){

                const angle =
                    minute * 6;


                if(
                    !isAngleInBands(angle)
                ){

                    let innerRadius =
                        OUT_TICK_INNER;

                    let className =
                        'outer-tick';


                    if(
                        minute % 30 === 0 &&
                        minute !== 0
                    ){

                        innerRadius =
                            OUT_TICK_INNER_HALF;

                        className +=
                            ' half';

                    }

                    else if(
                        minute % 15 === 0
                    ){

                        innerRadius =
                            OUT_TICK_INNER_QUARTER;

                        className +=
                            ' quarter';

                    }

                    else if(
                        minute % 5 === 0
                    ){

                        innerRadius =
                            OUT_TICK_INNER_FIVE;

                        className +=
                            ' five';

                    }


                    const outerPoint =
                        clockPoint(
                            OUT_TICK_OUTER,
                            angle
                        );

                    const innerPoint =
                        clockPoint(
                            innerRadius,
                            angle
                        );


                    const line =
                        document.createElementNS(
                            'http://www.w3.org/2000/svg',
                            'line'
                        );


                    line.setAttribute(
                        'class',
                        className
                    );

                    line.setAttribute(
                        'x1',
                        outerPoint.x
                    );

                    line.setAttribute(
                        'y1',
                        outerPoint.y
                    );

                    line.setAttribute(
                        'x2',
                        innerPoint.x
                    );

                    line.setAttribute(
                        'y2',
                        innerPoint.y
                    );


                    fragment.appendChild(
                        line
                    );

                }


                /*
                 * 分目盛りの間に小さな点を置く。
                 *
                 * 診療帯上では表示しないことで、
                 * 帯の視認性を維持する。
                 */

                const halfAngle =
                    angle + 3;


                if(
                    !isAngleInBands(
                        halfAngle
                    )
                ){

                    const dotPoint =
                        clockPoint(
                            OUT_DOT_RADIUS,
                            halfAngle
                        );


                    const circle =
                        document.createElementNS(
                            'http://www.w3.org/2000/svg',
                            'circle'
                        );


                    circle.setAttribute(
                        'class',
                        'outer-dot'
                    );

                    circle.setAttribute(
                        'cx',
                        dotPoint.x
                    );

                    circle.setAttribute(
                        'cy',
                        dotPoint.y
                    );

                    circle.setAttribute(
                        'r',
                        '0.75'
                    );


                    fragment.appendChild(
                        circle
                    );

                }

            }


            outerClockTicks.appendChild(
                fragment
            );

        }


        /* ==================================================
           数字の大きさ（連続スケール）
        ================================================== */

        /*
         * 9〜19は常に基準サイズ(scale=1)。
         *
         * 0〜8は0(最小)から8にかけて徐々に大きくなり、
         * 9でちょうど基準サイズに繋がる。
         *
         * 20〜24は19(基準サイズ)から24にかけて
         * 徐々に小さくなる。
         *
         * px指定ではなくCSSのtransform:scale()の
         * 倍率として計算するため、
         * レスポンシブ側で基準フォントサイズが変わっても
         * バランスは崩れない。
         */

        const BIG_SCALE = 1;

        const SMALL_SCALE = 12 / 27;


        function scaleForNumber(n){

            if(
                n >= 9 &&
                n <= 19
            ){

                return BIG_SCALE;

            }


            if(n <= 8){

                const t =
                    n / 9;

                return (
                    SMALL_SCALE +
                    t *
                    (
                        BIG_SCALE -
                        SMALL_SCALE
                    )
                );

            }


            const t =
                (n - 19) / 5;

            return (
                BIG_SCALE -
                t *
                (
                    BIG_SCALE -
                    SMALL_SCALE
                )
            );

        }


        /* ==================================================
           時計数字（螺旋配置）
        ================================================== */

        /*
         * 0から24までの25個の数字を、
         * 12時方向を起点に2周する螺旋として配置する。
         *
         * 角度は通常の時計と同じ(n*30°)なので、
         * n=0・12・24はすべて12時方向(角度0)に重なり、
         * 半径だけが内側→中間→外側と変わることで、
         * 縦に3つ並んだように見える。
         *
         * それ以外の11方向には、
         * 該当する2つの数字(例:3時方向なら3と15)が
         * 半径違いで縦に2つ並ぶ。
         *
         * 診療時間帯(9〜19)にあたる数字だけを
         * 大きく表示し、時間帯の見分けやすさを保つ。
         */

        function createClockNumbers(){

            clock12.replaceChildren();

            clock24.replaceChildren();


            for(
                let n = 0;
                n <= 24;
                n++
            ){

                const angle =
                    (n * 30) % 360;

                const fraction =
                    n / 24;

                const radius =
                    SPIRAL_MIN_RADIUS +
                    fraction *
                    (
                        SPIRAL_MAX_RADIUS -
                        SPIRAL_MIN_RADIUS
                    );


                const point =
                    clockPoint(
                        radius,
                        angle
                    );


                const scale =
                    scaleForNumber(n);


                const text =
                    document.createElementNS(
                        'http://www.w3.org/2000/svg',
                        'text'
                    );


                const isBalloon =
                    (n >= 9 && n <= 12) ||
                    (n >= 14 && n <= 16) ||
                    n === 18 ||
                    n === 19;


                text.setAttribute(
                    'class',
                    'num' +
                    (
                        isBalloon
                            ? ' num-balloon'
                            : ''
                    )
                );

                text.setAttribute(
                    'x',
                    point.x
                );

                text.setAttribute(
                    'y',
                    point.y
                );

                text.setAttribute(
                    'transform',
                    `translate(${point.x} ${point.y}) scale(${scale}) translate(${-point.x} ${-point.y})`
                );

                text.style.opacity =
                    String(
                        .6 +
                        scale * .4
                    );

                text.textContent =
                    String(n);


                clock12.appendChild(
                    text
                );

            }

        }


        /* ==================================================
           診療時間設定
        ================================================== */

        /* ==================================================
           外側リング用の単純な扇形
        ================================================== */

        /**
         * 角丸の無い、単純な扇形(内径〜外径)のpathを生成する。
         *
         * 外側リングはぼかして使うため、
         * 帯のような角の処理は不要。
         *
         * @param {number} startHour 開始時
         * @param {number} startMinute 開始分
         * @param {number} endHour 終了時
         * @param {number} endMinute 終了分
         * @param {number} innerR 内径
         * @param {number} outerR 外径
         * @returns {string} SVG path
         */

        function createRingSectorPath(
            startHour,
            startMinute,
            endHour,
            endMinute,
            innerR,
            outerR
        ){

            const start =
                timeToClockAngle(
                    startHour,
                    startMinute
                );

            const end =
                timeToClockAngle(
                    endHour,
                    endMinute
                );


            let sweep =
                end - start;

            if(sweep < 0){

                sweep += 360;

            }


            const outerStart =
                clockPoint(outerR, start);

            const outerEnd =
                clockPoint(outerR, start + sweep);

            const innerEnd =
                clockPoint(innerR, start + sweep);

            const innerStart =
                clockPoint(innerR, start);


            const largeArc =
                sweep > 180
                    ? 1
                    : 0;


            return [

                `M ${outerStart.x} ${outerStart.y}`,

                `A ${outerR} ${outerR} 0 ${largeArc} 1 ${outerEnd.x} ${outerEnd.y}`,

                `L ${innerEnd.x} ${innerEnd.y}`,

                `A ${innerR} ${innerR} 0 ${largeArc} 0 ${innerStart.x} ${innerStart.y}`,

                'Z'

            ].join(' ');

        }


        /* ==================================================
           帯を囲む反対色の層
        ================================================== */

        /*
         * 中心から外側リングまでを1つのpathとして描く。
         *
         * パーツを分けず、ぼかしだけで自然に混ざり合う
         * 「1枚のレイヤー」として扱うことで、
         * 継ぎ目のない連続感を出す。
         */

        const SURROUND_INNER_RADIUS = 10;

        const SURROUND_OUTER_RADIUS = 195;


        const surroundGreen =
            document.getElementById(
                'surroundGreen'
            );

        const surroundBlue =
            document.getElementById(
                'surroundBlue'
            );


        if(surroundGreen){

            try{

                surroundGreen.setAttribute(
                    'd',
                    createRingSectorPath(
                        16,
                        45,
                        12,
                        20,
                        SURROUND_INNER_RADIUS,
                        SURROUND_OUTER_RADIUS
                    )
                );

            }

            catch(error){

                console.error(
                    '反対色の層(緑)の描画に失敗しました。',
                    error
                );

            }

        }


        if(surroundBlue){

            try{

                surroundBlue.setAttribute(
                    'd',
                    createRingSectorPath(
                        12,
                        35,
                        17,
                        10,
                        SURROUND_INNER_RADIUS,
                        SURROUND_OUTER_RADIUS
                    )
                );

            }

            catch(error){

                console.error(
                    '反対色の層(青)の描画に失敗しました。',
                    error
                );

            }

        }


        /* ==================================================
           帯アイコンの位置
        ================================================== */

        const ICON_RADIUS = 163;


        function placeIcon(
            id,
            hour,
            minute
        ){

            const el =
                document.getElementById(id);


            if(!el){

                return;

            }


            const point =
                clockPoint(
                    ICON_RADIUS,
                    timeToClockAngle(
                        hour,
                        minute
                    )
                );


            el.setAttribute(
                'transform',
                `translate(${point.x} ${point.y})`
            );

        }


        placeIcon('iconMorning', 9, 13);

        placeIcon('iconEvening', 17, 43);

        placeIcon('iconVisit', 13, 43);


        setBand(
            morningBand,
            9,
            0,
            12,
            0
        );

        setWhiteBand(
            morningWhite,
            9,
            0,
            12,
            0
        );

        {
            const texture =
                document.getElementById(
                    'morningBandTexture'
                );

            if(texture){

                texture.setAttribute(
                    'd',
                    morningBand.getAttribute('d')
                );

            }
        }


        setBand(
            visitBand,
            13,
            30,
            16,
            30
        );

        setWhiteBand(
            visitWhite,
            13,
            30,
            16,
            30
        );

        {
            const texture =
                document.getElementById(
                    'visitBandTexture'
                );

            if(texture){

                texture.setAttribute(
                    'd',
                    visitBand.getAttribute('d')
                );

            }
        }


        setBand(
            eveningBand,
            17,
            30,
            19,
            30
        );

        setWhiteBand(
            eveningWhite,
            17,
            30,
            19,
            30
        );

        {
            const texture =
                document.getElementById(
                    'eveningBandTexture'
                );

            if(texture){

                texture.setAttribute(
                    'd',
                    eveningBand.getAttribute('d')
                );

            }
        }


        /* ==================================================
           受付時間
        ================================================== */

        /*
         * 午前
         *
         * 診療：9:00〜12:00
         * 受付：8:45〜11:30
         */

        const morningReceptionPath =
            createArcPath(
                8,
                45,
                11,
                30,
                RECEPTION_RADIUS
            );


        morningReceptionArc.setAttribute(
            'd',
            morningReceptionPath
        );


        morningReceptionGlow.setAttribute(
            'd',
            morningReceptionPath
        );


        setReceptionEndpoints(
            morningReceptionStart,
            morningReceptionEnd,
            8,
            45,
            11,
            30,
            RECEPTION_RADIUS
        );


        /*
         * 午後
         *
         * 診療：17:30〜19:30
         * 受付：17:15〜19:00
         */

        const eveningReceptionPath =
            createArcPath(
                17,
                15,
                19,
                0,
                RECEPTION_RADIUS
            );


        eveningReceptionArc.setAttribute(
            'd',
            eveningReceptionPath
        );


        eveningReceptionGlow.setAttribute(
            'd',
            eveningReceptionPath
        );


        setReceptionEndpoints(
            eveningReceptionStart,
            eveningReceptionEnd,
            17,
            15,
            19,
            0,
            RECEPTION_RADIUS
        );


        /* ==================================================
           診療境界線
        ================================================== */

        /*
         * 午前：
         *
         * 9:00 ＝ 診療開始
         * 12:00 ＝ 診療終了
         *
         * 受付線との関係を示すため、
         * 外側から帯側へ短い境界線を入れる。
         */

        setBoundary(
            morningOpenBoundary,
            9,
            0
        );

        setBoundary(
            morningCloseBoundary,
            12,
            0
        );


        /*
         * 午後
         */

        setBoundary(
            eveningOpenBoundary,
            17,
            30
        );

        setBoundary(
            eveningCloseBoundary,
            19,
            30
        );


        /* ==================================================
           静的要素生成
        ================================================== */

        createOuterMinuteTicks();

        createClockNumbers();


        /* ==================================================
           日本時間
        ================================================== */

        /**
         * 現在の日本時間を取得する。
         *
         * 日本はUTC+9でDSTを採用していないため、
         * Date.now()へ9時間を加えて時計計算に使用する。
         *
         * @returns {number} 日本時間基準のミリ秒
         */

        function getJapanTimestamp(){

            return (
                Date.now() +
                9 * 60 * 60 * 1000
            );

        }


        /* ==================================================
           時計針
        ================================================== */

        /**
         * 現在時刻に合わせて時計針を滑らかに更新する。
         *
         * 秒未満まで計算することで、
         * 秒針・分針・時針を連続的に動かす。
         *
         * @param {number} timestamp 日本時間基準のミリ秒
         */

        function updateClock(
            timestamp
        ){

            const millisecondsInHour =
                60 *
                60 *
                1000;

            const millisecondsInMinute =
                60 *
                1000;


            const hour =
                Math.floor(
                    timestamp /
                    millisecondsInHour
                ) % 24;


            const minute =
                Math.floor(
                    (
                        timestamp %
                        millisecondsInHour
                    ) /
                    millisecondsInMinute
                );


            const secondFraction =
                (
                    timestamp %
                    millisecondsInMinute
                ) /
                millisecondsInMinute;


            const secondAngle =
                secondFraction *
                360;


            const minuteAngle =
                (
                    minute +
                    secondFraction
                ) *
                6;


            const hourAngle =
                (
                    (
                        hour % 12
                    ) +
                    (
                        minute +
                        secondFraction
                    ) / 60
                ) *
                30;


            hourHand.setAttribute(
                'transform',
                `rotate(${hourAngle} 200 200)`
            );


            minuteHand.setAttribute(
                'transform',
                `rotate(${minuteAngle} 200 200)`
            );


            secondHand.setAttribute(
                'transform',
                `rotate(${secondAngle} 200 200)`
            );


            /*
             * 短針の串ドット。
             *
             * 短針と同じ角度で回し、
             * 今いる診療帯の色を灯す。
             * 帯の外にいる時は白抜きにする。
             */

            if(hourHandDot){

                hourHandDot.setAttribute(
                    'transform',
                    `rotate(${hourAngle} 200 200)`
                );


                const bandColor =
                    getCurrentBandColor(
                        hour,
                        minute
                    );


                if(bandColor === 'blue'){

                    hourHandDot.setAttribute(
                        'fill',
                        'url(#hourDotBlueGradient)'
                    );

                    hourHandDot.style.opacity = '1';

                }

                else if(bandColor === 'green'){

                    /*
                     * 緑の帯にいる時は、丸ではなく
                     * 家アイコンに切り替える。
                     */

                    hourHandDot.style.opacity = '0';

                }

                else{

                    hourHandDot.setAttribute(
                        'fill',
                        'url(#hourDotGrayGradient)'
                    );

                    hourHandDot.style.opacity = '1';

                }


                if(hourHandHouseIcon){

                    hourHandHouseIcon.setAttribute(
                        'transform',
                        `rotate(${hourAngle} 200 200) translate(200 135)`
                    );

                    hourHandHouseIcon.style.opacity =
                        bandColor === 'green'
                            ? '1'
                            : '0';

                }

            }


            /*
             * 受付ダイヤ(内・外)。
             *
             * 短針と同じ角度で回す。
             * 受付時間は12時間ダイヤルの角度と
             * 直接対応しているため、
             * 長針ではなく短針に合わせることで、
             * 実際の受付ラインの位置と連動する。
             *
             * 受付時間の時だけ見えるようにする。
             */

            const inReception =
                isReceptionTime(
                    hour,
                    minute
                )
                    ? '1'
                    : '0';


            if(hourHandDiamondInner){

                hourHandDiamondInner.setAttribute(
                    'transform',
                    `rotate(${hourAngle} 200 200) rotate(45 200 153)`
                );

                hourHandDiamondInner.style.opacity =
                    inReception;

            }


            if(hourHandDiamondOuter){

                hourHandDiamondOuter.setAttribute(
                    'transform',
                    `rotate(${hourAngle} 200 200) rotate(45 200 18)`
                );

                hourHandDiamondOuter.style.opacity =
                    inReception;

            }

        }


        /* ==================================================
           アニメーション
        ================================================== */

        /**
         * requestAnimationFrameで時計を連続運針する。
         *
         * @returns {void}
         */

        function animateClock(){

            updateClock(
                getJapanTimestamp()
            );


            requestAnimationFrame(
                animateClock
            );

        }


        /* ==================================================
           初期表示
        ================================================== */

        updateClock(
            getJapanTimestamp()
        );


        requestAnimationFrame(
            animateClock
        );

    }

);

</script>
