<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="服部医院 リアルタイム時計">
    <title>服部医院｜時計</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&display=swap');

        /* ==================================================
           基本
        ================================================== */
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 32%,
                    #ffffff 0%,
                    #f2f5f9 45%,
                    #e4eaf0 100%);
            color: #31556e;
            font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* ==================================================
           メインレイアウト
        ================================================== */
        .page-main {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .clock-area {
            width: 100%;
            max-width: 520px;
        }

        /* ==================================================
           時計本体 ＆ マスク処理
        ================================================== */
        .time-ring {
            position: relative;
            width: min(100%, 440px);
            min-width: min(280px, 100%);
            aspect-ratio: 1 / 1;
            margin: 0 auto;

            filter: drop-shadow(0 10px 22px rgba(49, 85, 110, .14)) drop-shadow(0 2px 5px rgba(49, 85, 110, .08));
        }

        .time-ring svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* ==================================================
           時計盤・テクスチャ
        ================================================== */
        .clock-disc {
            fill: url(#washiDiscGradient);
        }

        .clock-disc-weave {
            mix-blend-mode: multiply;
            opacity: .55;
            pointer-events: none;
        }

        .clock-disc-texture {
            pointer-events: none;
            mix-blend-mode: multiply;
            opacity: .45;
        }

        /* ==================================================
           外周目盛り
        ================================================== */
        .outer-tick {
            stroke: #31556e;
            stroke-linecap: round;
            opacity: .22;
            vector-effect: non-scaling-stroke;
        }

        .outer-tick.five {
            opacity: .38;
            stroke-width: 1.2;
        }

        .outer-tick.quarter {
            opacity: .5;
            stroke-width: 1.4;
        }

        .outer-tick.half {
            opacity: .7;
            stroke-width: 1.8;
            stroke: #1d394e;
        }

        .outer-dot {
            fill: #31556e;
            opacity: .28;
        }

        /* ==================================================
           診療時間帯・グラデーション帯
        ================================================== */
        .time-band {
            stroke: rgba(49, 85, 110, .22);
            stroke-width: .5;
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 1px 2px rgba(20, 40, 56, .28));
        }

        .band-base.blue {
            fill: url(#blueGlassGradient);
        }

        .band-base.green {
            fill: url(#greenGlassGradient);
        }

        .band-inner {
            fill: #eef0e8;
            opacity: .18;
        }

        .color-surround {
            stroke: none;
            filter: url(#ringBlur);
            pointer-events: none;
            opacity: .32;
        }

        .color-surround.green {
            fill: #70ad47;
        }

        .color-surround.blue {
            fill: #3d8bdc;
        }

        .band-texture {
            pointer-events: none;
            mix-blend-mode: multiply;
            opacity: .4;
        }

        /* ==================================================
           受付時間・アーク
        ================================================== */
        .reception-arc {
            fill: none;
            stroke: #1d394e;
            stroke-width: 2.6px;
            stroke-linecap: round;
            opacity: .95;
            vector-effect: non-scaling-stroke;
        }

        .reception-glow {
            fill: none;
            stroke: #31556e;
            stroke-width: 3.2px;
            stroke-linecap: round;
            opacity: .12;
            filter: url(#softGlowFilter);
        }

        .reception-dot {
            fill: #1d394e;
            opacity: 1;
            filter: url(#softGlowFilter);
        }

        .reception-boundary {
            stroke: #31556e;
            stroke-width: 1px;
            stroke-linecap: round;
            opacity: .4;
            vector-effect: non-scaling-stroke;
        }

        .reception-boundary.strong {
            stroke-width: 1.2px;
            opacity: .6;
        }

        /* ==================================================
           時計文字（数字）
        ================================================== */
        .clock-face {
            pointer-events: none;
        }

        .clock-face .num {
            font-family: "Bodoni 72", "Didot", "Bodoni MT", "Times New Roman", serif;
            font-size: 27px;
            font-weight: 500;
            text-anchor: middle;
            dominant-baseline: middle;
            fill: url(#numGlossyGradient);
            filter: drop-shadow(0 1px 1.5px rgba(20, 40, 56, .35));
        }

        .clock-face .num.num-balloon {
            font-weight: 700;
            fill: url(#numBalloonGradient);
            stroke: rgba(37, 65, 90, .55);
            stroke-width: .7px;
            paint-order: stroke fill;
            filter: drop-shadow(0 3.5px 3px rgba(15, 30, 45, .5)) drop-shadow(0 5px 6px rgba(15, 30, 45, .3)) drop-shadow(0 -.5px .5px rgba(255, 255, 255, .65));
        }

        /* ==================================================
           時計の針・中央部
        ================================================== */
        .clock-hand {
            stroke: #31556e;
            stroke-linecap: round;
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 1px 1px rgba(49, 85, 110, .28));
        }

        .clock-hand.hour {
            stroke-width: 5;
        }

        .clock-hand.minute {
            stroke-width: 3;
        }

        .clock-hand.second {
            stroke: #31556e;
            stroke-width: 1;
            opacity: .18;
            filter: none;
        }

        .clock-center {
            fill: #31556e;
            opacity: .9;
            stroke: rgba(255, 255, 255, .5);
            stroke-width: 1;
        }

        .clock-dot {
            fill: #eef0e8;
            opacity: .8;
        }

        /* ==================================================
           レスポンシブ設定
        ================================================== */
        @media (max-width: 600px) and (orientation: portrait) {
            .page-main {
                padding: .7rem;
            }

            .time-ring {
                width: min(94vw, 440px);
                min-width: min(280px, 100%);
            }

            .clock-face .num {
                font-size: 25px;
            }
        }

        @media (max-width: 380px) {
            .page-main {
                padding: .5rem;
            }

            .time-ring {
                min-width: min(260px, 100%);
            }

            .clock-face .num {
                font-size: 23px;
            }
        }

        @media (orientation: landscape) and (max-height: 520px) {
            .page-main {
                padding: .4rem;
            }

            .time-ring {
                width: min(78vh, 400px);
                min-width: min(180px, 100%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .clock-hand {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="page-main">
        <section class="clock-area" aria-label="リアルタイム時計">
            <div class="time-ring">
                <svg viewBox="0 0 400 400" aria-hidden="true" focusable="false">
                    <defs>
                        <!-- 盤面グラデーション -->
                        <radialGradient id="washiDiscGradient" cx="40%" cy="32%" r="85%">
                            <stop offset="0%" stop-color="#fbfcf8" />
                            <stop offset="45%" stop-color="#eef1e7" />
                            <stop offset="75%" stop-color="#e2e6d8" />
                            <stop offset="100%" stop-color="#d5dac9" />
                        </radialGradient>

                        <!-- クリップパス -->
                        <clipPath id="discImageClip">
                            <circle cx="200" cy="200" r="180" />
                        </clipPath>

                        <!-- 質感テクスチャフィルタ -->
                        <filter id="washiTexture" x="-5%" y="-5%" width="110%" height="110%">
                            <feTurbulence type="fractalNoise" baseFrequency="0.006 0.03" numOctaves="4" seed="6"
                                result="fold" />
                            <feDiffuseLighting in="fold" surfaceScale="1.8" diffuseConstant=".7" lighting-color="#ffffff"
                                result="foldLight">
                                <feDistantLight azimuth="230" elevation="55" />
                            </feDiffuseLighting>
                            <feComposite in="foldLight" in2="SourceAlpha" operator="in" />
                        </filter>

                        <!-- 各種グラデーション定義 -->
                        <linearGradient id="blueGlassGradient" x1="15%" y1="10%" x2="85%" y2="90%">
                            <stop offset="0%" stop-color="#9ccdff" stop-opacity=".42" />
                            <stop offset="45%" stop-color="#3d8bdc" stop-opacity=".42" />
                            <stop offset="100%" stop-color="#155a92" stop-opacity=".42" />
                        </linearGradient>

                        <linearGradient id="greenGlassGradient" x1="15%" y1="10%" x2="85%" y2="90%">
                            <stop offset="0%" stop-color="#c2eb9a" stop-opacity=".42" />
                            <stop offset="45%" stop-color="#70ad47" stop-opacity=".42" />
                            <stop offset="100%" stop-color="#4a7c2c" stop-opacity=".42" />
                        </linearGradient>

                        <linearGradient id="numGlossyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#5c7d95" />
                            <stop offset="42%" stop-color="#2a4a61" />
                            <stop offset="100%" stop-color="#0f2739" />
                        </linearGradient>

                        <linearGradient id="numBalloonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#d8e8f5" />
                            <stop offset="14%" stop-color="#b9d2e6" />
                            <stop offset="32%" stop-color="#6f97b8" />
                            <stop offset="62%" stop-color="#25415a" />
                            <stop offset="100%" stop-color="#08151f" />
                        </linearGradient>

                        <!-- ぼかし・発光フィルター -->
                        <filter id="softGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
                            <feGaussianBlur stdDeviation="1.8" />
                        </filter>

                        <filter id="ringBlur" x="-100%" y="-100%" width="300%" height="300%">
                            <feGaussianBlur stdDeviation="44" />
                        </filter>
                    </defs>

                    <!-- 盤面基礎描画 -->
                    <circle class="clock-disc" cx="200" cy="200" r="180" />

                    <image class="clock-disc-weave" x="20" y="20" width="360" height="360"
                        clip-path="url(#discImageClip)" preserveAspectRatio="xMidYMid slice"
                        href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA4QAAAOECAAAAADcJaDnAAEAAElEQVR42pz9aZPkOLYlCB4SVFIJpdq++BKe+ebVyOuKfjEdPSky//9LicyHEYkp7/aqqM6RV/UyfDU1U9uUCiqhvMR8wMpNzaJcJCVDYSAIYsc9554b/VbwVIpSAADAPsSRiihMYe8Rb3gqRQmTpP/xzoOdpCiKABAAXuRJU4WZgsfi65sWAJCkBU8fffn9ojkgbBpvYwQ/wU01AeJAIcr63D62sgX5JKyzAjyVopwj0Sk7gAOYixKCowGAJHidziSmv9a3is9zwo9lJequP2amAr/+nvE8lZUQUudCWX/IZSVgE0qBE52l/gW/dZ+rPmf2XSk4z1NZJT/sczoP+zcCR3HSq6NNgxirN/sPVAkByVHMZ/tdWf/tdWf/tdWf/tdWf/tdWf/tdWf/tdWf/tdWf/tdWf/tdWf/tdWf" />
                </svg>
            </div>
        </section>
    </main>

</body>

</html>
