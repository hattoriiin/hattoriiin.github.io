<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>確認用</title>

<style>

/*
 * 確認用ページなので、外部CSSには依存しない。
 * これによりstyle.css側の影響を完全に切り離せる。
 */

html,
body{

    margin:0;
    padding:0;

    width:100%;
    min-height:100%;

    background:#fff;

}

/*
 * 鳥は画面上部を大きく横切る。
 * pointer-events:none にすることで、
 * 鳥が電話ボタンのタップを邪魔しない。
 */

.bird1{

    position:fixed;

    top:40px;

    left:100%;

    width:220px;

    height:auto;

    z-index:1000;

    pointer-events:none;

    animation:
        flybird 12s linear infinite;

}

/*
 * 右端から左端へ移動させる。
 */

@keyframes flybird{

    from{

        transform:translateX(0);

    }

    to{

        transform:translateX(
            calc(-100vw - 260px)
        );

    }

}

/*
 * 電話ボタン。
 * position:fixed にすることで、
 * ページをスクロールしても常に画面下部に表示する。
 */

.fixed-call{

    position:fixed;

    left:16px;
    right:16px;

    bottom:16px;

    z-index:2000;

    display:block;

    padding:14px;

    text-align:center;

    border-radius:14px;

    background:#31556e;

    color:#fff;

    text-decoration:none;

    font-size:1rem;

    font-weight:500;

    box-shadow:
        0 6px 20px rgba(0,0,0,.18);

    /*
     * iPhoneのホームインジケータ部分と
     * ボタンが重ならないようにする。
     */

    padding-bottom:
        calc(
            14px +
            env(safe-area-inset-bottom)
        );

}

/*
 * 想定されるエラー：
 *
 * 1. 鳥画像が表示されない
 *    → ../images/colorfulbird.PNG のパスを確認。
 *
 * 2. 電話ボタンが表示されない
 *    → HTML内に固定ボタンを直接記述しているため、
 *      style.cssには依存しない。
 *
 * 3. 鳥が電話ボタンを邪魔する
 *    → pointer-events:none で操作を透過させる。
 *
 * 4. 外部から悪意あるHTMLを挿入される
 *    → 外部入力を一切扱わない構成にしている。
 *
 */

</style>

</head>

<body>

<!-- 大きな鳥 -->

<img
    src="../images/colorfulbird.PNG"
    class="bird1"
    alt=""
>

<!-- 電話する -->

<a
    href="tel:052-881-0876"
    class="fixed-call"
>
    ☎ 電話する
</a>

</body>

</html>
